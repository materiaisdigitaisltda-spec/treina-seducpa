ade de terminais e armazenagem.","B":"é integrada a acessos terrestres ou fluviais, armazenagem e planejamento logístico.","C":"substitui automaticamente todos os demais modais.","D":"considera irrelevantes os gargalos de acesso.","E":"ocorre sem conexão com os corredores que levam as cargas ao porto."},"gabarito":"B","comentario":"Portos fazem parte de sistemas logísticos. Ganhos de capacidade dependem também de acessos, terminais, armazenagem e coordenação entre modais.","referencia":"ANTAQ; Ministério de Portos e Aeroportos."},{"id":"ATU055","disciplina":"Atualidades","assunto":"Terminais de transbordo","dificuldade":"Fácil","enunciado":"A função de um terminal de transbordo de cargas é, principalmente:","alternativas":{"A":"transferir cargas entre veículos ou modais para continuidade do transporte.","B":"realizar exclusivamente fiscalização tributária municipal.","C":"substituir o porto marítimo por transporte aéreo.","D":"eliminar qualquer necessidade de armazenagem temporária.","E":"produzir a mercadoria que será exportada."},"gabarito":"A","comentario":"Terminais de transbordo permitem a transferência entre modais, como de caminhões para barcaças, sendo essenciais em corredores multimodais.","referencia":"ANTAQ — terminais de uso privado e instalações portuárias."},{"id":"ATU056","disciplina":"Atualidades","assunto":"Logística e sazonalidade","dificuldade":"Difícil","enunciado":"Na Amazônia, a sazonalidade climática deve ser considerada no planejamento logístico porque:","alternativas":{"A":"eventos extremos afetam somente áreas urbanas.","B":"chuvas, níveis dos rios e condições das vias podem alterar tempos, custos e capacidade de transporte.","C":"níveis dos rios não apresentam variações sazonais.","D":"a logística pode ser planejada sem dados meteorológicos ou hidrológicos.","E":"o regime de chuvas é constante e não interfere em rodovias ou hidrovias."},"gabarito":"B","comentario":"Condições meteorológicas e hidrológicas influenciam navegabilidade, manutenção de vias e riscos operacionais, especialmente em territórios amazônicos.","referencia":"ANA; INMET; Ministério dos Transportes."},{"id":"ATU057","disciplina":"Atualidades","assunto":"Infraestrutura digital","dificuldade":"Intermediária","enunciado":"No desenvolvimento regional, a expansão de conectividade digital pode contribuir para:","alternativas":{"A":"eliminar automaticamente desigualdades sociais.","B":"tornar dispensável a alfabetização digital.","C":"garantir qualidade de conexão independentemente da infraestrutura disponível.","D":"ampliar acesso a educação, serviços públicos, comunicação e atividades econômicas, desde que acompanhada de inclusão e competências digitais.","E":"substituir toda infraestrutura de transporte físico."},"gabarito":"D","comentario":"Conectividade pode reduzir barreiras de acesso, mas seus benefícios dependem de qualidade do serviço, dispositivos, acessibilidade e competências de uso.","referencia":"IBGE — TIC e acesso à internet; UNESCO — inclusão digital."},{"id":"ATU058","disciplina":"Atualidades","assunto":"Integração regional","dificuldade":"Difícil","enunciado":"A integração regional do Pará não depende apenas de estradas e portos, pois também envolve:","alternativas":{"A":"apenas o transporte de commodities para exportação.","B":"somente a distância física entre municípios.","C":"a eliminação das particularidades territoriais locais.","D":"exclusivamente obras construídas pela União.","E":"fluxos de pessoas, serviços, informação, comércio e articulação entre centros urbanos e territórios."},"gabarito":"E","comentario":"Integração regional é multidimensional e inclui redes econômicas, urbanas, sociais e de infraestrutura física e digital.","referencia":"IBGE — REGIC; FAPESPA — estudos de desenvolvimento regional."},{"id":"ATU059","disciplina":"Atualidades","assunto":"Biodiversidade amazônica","dificuldade":"Fácil","enunciado":"A biodiversidade do Pará possui relevância ecológica e econômica porque:","alternativas":{"A":"não se relaciona com recursos hídricos ou clima.","B":"é incompatível com qualquer atividade econômica.","C":"sustenta serviços ecossistêmicos, recursos genéticos, alimentos, matérias-primas e modos de vida.","D":"está restrita a unidades de conservação urbanas.","E":"tem valor apenas para pesquisa acadêmica."},"gabarito":"C","comentario":"A biodiversidade sustenta processos ecológicos e recursos utilizados por diferentes populações e cadeias produtivas, devendo seu uso observar critérios de sustentabilidade.","referencia":"Convenção sobre Diversidade Biológica; Ministério do Meio Ambiente e Mudança do Clima."},{"id":"ATU060","disciplina":"Atualidades","assunto":"PRODES e DETER","dificuldade":"Intermediária","enunciado":"Os sistemas PRODES e DETER, operados pelo INPE, diferenciam-se porque:","alternativas":{"A":"nenhum dos dois utiliza sensoriamento remoto.","B":"o PRODES é um sistema de previsão meteorológica.","C":"ambos medem exclusivamente queimadas urbanas.","D":"o PRODES estima a taxa anual consolidada de desmatamento, enquanto o DETER produz alertas frequentes para apoiar fiscalização e controle.","E":"o DETER substituiu definitivamente o PRODES na série anual."},"gabarito":"D","comentario":"PRODES e DETER são complementares: um produz a taxa anual consolidada e o outro gera alertas em maior frequência para ação operacional.","referencia":"INPE — Sistemas PRODES e DETER."},{"id":"ATU061","disciplina":"Atualidades","assunto":"Desmatamento na Amazônia Legal","dificuldade":"Difícil","enunciado":"Segundo a taxa consolidada do PRODES para 2025, qual afirmação está correta?","alternativas":{"A":"O dado de 2025 corresponde a alertas do DETER, e não à taxa anual do PRODES.","B":"A taxa de 2025 foi superior à de 2024.","C":"O INPE estimou 5.731 km² de desmatamento na Amazônia Legal, redução de 12,07% em relação a 2024.","D":"O valor de 5.731 km² correspondeu exclusivamente ao Estado do Pará.","E":"O PRODES deixou de produzir taxa anual para a Amazônia Legal em 2025."},"gabarito":"C","comentario":"O INPE informou taxa consolidada de 5.731 km² para 2025, referente ao período de agosto de 2024 a julho de 2025, com redução de 12,07% em relação a 2024.","referencia":"INPE — Sistema do INPE aponta 5.731 km² de desmatamento na Amazônia em 2025, publicado em 18/08/2026."},{"id":"ATU062","disciplina":"Atualidades","assunto":"Alertas de desmatamento","dificuldade":"Difícil","enunciado":"No ciclo de agosto de 2025 a julho de 2026, os dados do DETER para a Amazônia indicaram que:","alternativas":{"A":"o DETER foi substituído pelo PRODES como sistema de alertas frequentes.","B":"o monitoramento ficou restrito ao Estado do Pará.","C":"o INPE suspendeu o monitoramento por satélite durante todo o ciclo.","D":"a área sob alertas foi de 2.874,38 km², com redução de 36% em relação ao período anterior e o menor valor da série para esse intervalo.","E":"houve aumento da área sob alertas em relação ao período anterior."},"gabarito":"D","comentario":"O INPE informou 2.874,38 km² de áreas sob alertas na Amazônia, redução de 36% em relação ao período anterior e o menor valor da série iniciada em 2016 para esse intervalo.","referencia":"INPE; Ministério do Meio Ambiente e Mudança do Clima — dados DETER divulgados em 07/08/2026."},{"id":"ATU063","disciplina":"Atualidades","assunto":"Mudanças climáticas","dificuldade":"Fácil","enunciado":"Para comunidades amazônicas, a mudança do clima pode ampliar riscos associados a:","alternativas":{"A":"redução automática de incêndios florestais.","B":"uniformização do clima em toda a Amazônia.","C":"estabilidade obrigatória do regime de chuvas.","D":"eliminação de eventos extremos.","E":"secas, cheias, ondas de calor e alterações nos regimes hidrológicos."},"gabarito":"E","comentario":"O aquecimento global aumenta riscos de extremos e pode afetar água, saúde, produção, mobilidade, infraestrutura e ecossistemas.","referencia":"IPCC — Relatórios de Avaliação; Plano Clima."},{"id":"ATU064","disciplina":"Atualidades","assunto":"Unidades de conservação","dificuldade":"Fácil","enunciado":"As unidades de conservação instituídas no Brasil integram um sistema que estabelece categorias com diferentes objetivos de proteção e uso. Esse sistema é o:","alternativas":{"A":"Sistema de Pagamentos Brasileiro — SPB.","B":"Sistema Nacional de Trânsito — SNT.","C":"Sistema Nacional de Unidades de Conservação da Natureza — SNUC.","D":"Sistema Nacional de Gerenciamento de Recursos Hídricos — SINGREH.","E":"Sistema Único de Saúde — SUS."},"gabarito":"C","comentario":"A Lei nº 9.985/2000 instituiu o SNUC, composto por categorias de proteção integral e de uso sustentável.","referencia":"Lei Federal nº 9.985/2000 — SNUC."},{"id":"ATU065","disciplina":"Atualidades","assunto":"Terras indígenas e unidades de conservação","dificuldade":"Difícil","enunciado":"Terras indígenas e unidades de conservação são instrumentos distintos porque:","alternativas":{"A":"possuem fundamentos, finalidades e regimes jurídicos próprios, embora possam contribuir para a proteção ambiental.","B":"ambas são criadas exclusivamente por empresas privadas.","C":"nenhuma admite presença humana em qualquer hipótese.","D":"todas pertencem aos municípios onde se localizam.","E":"são a mesma categoria jurídica de área protegida."},"gabarito":"A","comentario":"Terras indígenas decorrem de direitos originários reconhecidos constitucionalmente; unidades de conservação integram o SNUC. Os regimes jurídicos são distintos.","referencia":"Constituição Federal de 1988, art. 231; Lei Federal nº 9.985/2000."},{"id":"ATU066","disciplina":"Atualidades","assunto":"Restauração ecológica","dificuldade":"Intermediária","enunciado":"A restauração da vegetação nativa em áreas degradadas pode contribuir para:","alternativas":{"A":"aumentar necessariamente a fragmentação florestal.","B":"impedir o retorno de espécies nativas.","C":"recuperar funções ecológicas, conectividade de habitats e proteção do solo e da água.","D":"substituir biodiversidade por monoculturas como regra.","E":"eliminar a necessidade de monitoramento ambiental."},"gabarito":"C","comentario":"Restauração busca recuperar estrutura, processos e funções ecológicas e pode melhorar a conectividade da paisagem.","referencia":"Lei Federal nº 12.651/2012; Plano Nacional de Recuperação da Vegetação Nativa."},{"id":"ATU067","disciplina":"Atualidades","assunto":"Manejo integrado do fogo","dificuldade":"Difícil","enunciado":"A Política Nacional de Manejo Integrado do Fogo orienta que prevenção e resposta a incêndios sejam tratadas por meio de:","alternativas":{"A":"uso do fogo sem planejamento em qualquer época do ano.","B":"dispensa de monitoramento meteorológico.","C":"integração entre prevenção, monitoramento, conhecimento científico e tradicional, preparação e resposta.","D":"atuação somente depois que grandes incêndios já ocorreram.","E":"proibição de qualquer conhecimento tradicional sobre uso do fogo."},"gabarito":"C","comentario":"O manejo integrado do fogo articula prevenção, uso planejado quando cabível, conhecimentos diversos, brigadas, monitoramento e resposta a incêndios.","referencia":"Lei Federal nº 14.944/2024 — Política Nacional de Manejo Integrado do Fogo."},{"id":"ATU068","disciplina":"Atualidades","assunto":"Desenvolvimento sustentável","dificuldade":"Intermediária","enunciado":"O conceito de desenvolvimento sustentável aplicado ao Pará pressupõe:","alternativas":{"A":"tratar conservação e redução da pobreza como objetivos incompatíveis.","B":"priorizar crescimento econômico sem avaliar impactos.","C":"proibir qualquer uso de recursos naturais.","D":"articular desenvolvimento econômico, inclusão social e conservação ambiental, considerando também as gerações futuras.","E":"substituir planejamento público por decisões exclusivamente privadas."},"gabarito":"D","comentario":"Desenvolvimento sustentável busca compatibilizar dimensões econômica, social e ambiental sem comprometer as possibilidades das futuras gerações.","referencia":"ONU — Agenda 2030 e Objetivos de Desenvolvimento Sustentável."},{"id":"ATU069","disciplina":"Atualidades","assunto":"Florestas, carbono e água","dificuldade":"Difícil","enunciado":"A conservação da floresta amazônica é relevante para a agenda climática porque a floresta:","alternativas":{"A":"afeta o clima apenas dentro do município onde está localizada.","B":"armazena carbono e participa de processos hidrológicos e climáticos por meio, entre outros mecanismos, da evapotranspiração.","C":"não realiza trocas de carbono com a atmosfera.","D":"não possui relação com o ciclo da água.","E":"elimina totalmente emissões de outros setores da economia."},"gabarito":"B","comentario":"Florestas armazenam carbono e influenciam fluxos de água e energia. Sua conservação é importante, mas não substitui a redução de emissões em outros setores.","referencia":"IPCC; Ministério do Meio Ambiente e Mudança do Clima."},{"id":"ATU070","disciplina":"Atualidades","assunto":"Matas ciliares","dificuldade":"Fácil","enunciado":"A conservação de matas ciliares ao longo de rios contribui para:","alternativas":{"A":"eliminar a necessidade de saneamento básico.","B":"aumentar a exposição do solo às chuvas.","C":"substituir o planejamento de bacias hidrográficas.","D":"reduzir erosão e assoreamento e proteger habitats e qualidade da água.","E":"impedir toda dinâmica natural dos rios."},"gabarito":"D","comentario":"A vegetação ripária ajuda a estabilizar margens, filtrar sedimentos e proteger ecossistemas aquáticos, embora não substitua políticas de saneamento e gestão hídrica.","referencia":"Lei Federal nº 12.651/2012; Agência Nacional de Águas e Saneamento Básico."},{"id":"ATU071","disciplina":"Atualidades","assunto":"Garimpo ilegal e impactos","dificuldade":"Intermediária","enunciado":"Em áreas amazônicas, o garimpo ilegal pode provocar:","alternativas":{"A":"ausência de efeitos sobre povos e comunidades locais.","B":"aumento garantido da biodiversidade.","C":"eliminação de riscos à saúde humana.","D":"recuperação automática dos cursos d'água.","E":"desmatamento, assoreamento, contaminação e conflitos territoriais."},"gabarito":"E","comentario":"Garimpo ilegal pode remover vegetação, alterar sedimentos e cursos d'água, gerar contaminação e intensificar conflitos sociais e territoriais.","referencia":"IBAMA; Ministério do Meio Ambiente e Mudança do Clima; Ministério da Saúde."},{"id":"ATU072","disciplina":"Atualidades","assunto":"Saneamento e ambiente urbano","dificuldade":"Intermediária","enunciado":"A expansão do saneamento básico em cidades paraenses pode contribuir para:","alternativas":{"A":"substituir integralmente políticas de habitação.","B":"aumentar o lançamento de esgoto sem tratamento.","C":"eliminar a necessidade de abastecimento de água.","D":"reduzir contaminação ambiental e riscos à saúde associados à disposição inadequada de esgoto e resíduos.","E":"tornar desnecessária a drenagem urbana."},"gabarito":"D","comentario":"Saneamento adequado reduz exposição a patógenos e poluentes, com efeitos positivos sobre saúde e qualidade ambiental.","referencia":"Lei Federal nº 11.445/2007; Ministério da Saúde; SINISA."},{"id":"ATU073","disciplina":"Atualidades","assunto":"Plano Estadual Amazônia Agora","dificuldade":"Difícil","enunciado":"A norma paraense que instituiu formalmente o Plano Estadual Amazônia Agora — PEAA é a:","alternativas":{"A":"Lei Federal nº 12.651, de 25 de maio de 2012.","B":"Lei Federal nº 9.985, de 18 de julho de 2000.","C":"Decreto Estadual nº 5.148, de 30 de dezembro de 2025.","D":"Lei Estadual nº 10.750, de 31 de outubro de 2024.","E":"Lei nº 13.709, de 14 de agosto de 2018."},"gabarito":"D","comentario":"A Lei Estadual nº 10.750/2024 instituiu o PEAA. As demais normas listadas são reais, mas tratam de outros temas ou, no caso do Decreto nº 5.148/2025, de metas do próprio plano.","referencia":"SEMAS/PA — Lei Estadual nº 10.750/2024, norma compilada."},{"id":"ATU074","disciplina":"Atualidades","assunto":"Metas do Plano Amazônia Agora","dificuldade":"Difícil","enunciado":"O Decreto Estadual nº 5.148, de 30 de dezembro de 2025, trata principalmente:","alternativas":{"A":"das metas institucionais dos órgãos executores do Plano Estadual Amazônia Agora para 2025 a 2027.","B":"da criação do Censo Demográfico 2022.","C":"da criação do Sistema Nacional de Unidades de Conservação.","D":"da regulamentação nacional da LGPD.","E":"do tombamento federal do Ver-o-Peso."},"gabarito":"A","comentario":"O Decreto nº 5.148/2025 regulamenta a seção de metas do PEAA e estabelece metas institucionais para os órgãos executores no período de 2025 a 2027.","referencia":"SEMAS/PA — Decreto Estadual nº 5.148/2025."},{"id":"ATU075","disciplina":"Atualidades","assunto":"COP30","dificuldade":"Fácil","enunciado":"A COP30, conferência climática das Nações Unidas realizada em 2025, teve como cidade-sede:","alternativas":{"A":"Belém, no Pará.","B":"Brasília, no Distrito Federal.","C":"Rio de Janeiro, no Rio de Janeiro.","D":"Manaus, no Amazonas.","E":"São Paulo, em São Paulo."},"gabarito":"A","comentario":"A 30ª Conferência das Partes da Convenção do Clima foi realizada em Belém, colocando a Amazônia no centro do debate climático internacional.","referencia":"UNFCCC; Presidência da COP30 Brasil."},{"id":"ATU076","disciplina":"Atualidades","assunto":"COP30 — resultados","dificuldade":"Intermediária","enunciado":"Segundo a página oficial de resultados da COP30, realizada em Belém em 2025, qual afirmação está correta?","alternativas":{"A":"As decisões foram tomadas exclusivamente por representantes do Estado do Pará.","B":"A COP30 revogou o Acordo de Paris e criou um tratado climático inteiramente novo.","C":"A conferência terminou sem decisões formais adotadas pelas Partes.","D":"O Pacote Político de Belém substituiu a Convenção-Quadro das Nações Unidas sobre Mudança do Clima.","E":"Foram adotadas por consenso 56 decisões pelas 194 Partes da UNFCCC, das quais 24 integram o Pacote Político de Belém."},"gabarito":"E","comentario":"A Presidência da COP30 informou a adoção por consenso de 56 decisões pelas 194 Partes, com 24 delas reunidas no Pacote Político de Belém.","referencia":"Presidência da COP30 Brasil — Resultados da COP30, publicado em 01/07/2026."},{"id":"ATU077","disciplina":"Atualidades","assunto":"Acordo de Paris","dificuldade":"Intermediária","enunciado":"O Acordo de Paris estrutura a cooperação climática internacional principalmente em torno de:","alternativas":{"A":"proteção exclusiva de patrimônio cultural.","B":"substituição dos governos nacionais por uma autoridade climática global.","C":"regulação apenas da poluição marinha por plástico.","D":"proibição imediata de toda produção industrial mundial.","E":"mitigação, adaptação e meios de implementação, incluindo financiamento e tecnologia."},"gabarito":"E","comentario":"O Acordo de Paris organiza a resposta global à mudança do clima, combinando redução de emissões, adaptação e apoio para implementação.","referencia":"UNFCCC — Acordo de Paris."},{"id":"ATU078","disciplina":"Atualidades","assunto":"Transição justa","dificuldade":"Difícil","enunciado":"No debate climático, o conceito de transição justa busca:","alternativas":{"A":"concentrar os custos da transição nos grupos mais vulneráveis.","B":"reduzir emissões e transformar sistemas produtivos considerando trabalhadores, comunidades e desigualdades sociais.","C":"substituir direitos trabalhistas por metas ambientais.","D":"tratar a mudança do clima apenas como questão tecnológica.","E":"adiar indefinidamente toda política climática."},"gabarito":"B","comentario":"Transição justa procura articular descarbonização, trabalho decente, proteção social e atenção a grupos e territórios afetados pelas mudanças econômicas.","referencia":"UNFCCC; Organização Internacional do Trabalho — diretrizes sobre transição justa."},{"id":"ATU079","disciplina":"Atualidades","assunto":"Adaptação climática","dificuldade":"Intermediária","enunciado":"Uma política de adaptação climática para municípios sujeitos a cheias, secas ou calor extremo deve priorizar:","alternativas":{"A":"esperar o desastre ocorrer para iniciar qualquer ação.","B":"eliminar a defesa civil do planejamento climático.","C":"redução de vulnerabilidades, sistemas de alerta, infraestrutura resiliente e planejamento territorial.","D":"apenas contabilização de emissões históricas.","E":"usar a mesma solução em todos os municípios, sem diagnóstico local."},"gabarito":"C","comentario":"Adaptação busca reduzir exposição e vulnerabilidade aos impactos climáticos por meio de medidas ajustadas aos riscos de cada território.","referencia":"IPCC; Plano Clima — Adaptação."},{"id":"ATU080","disciplina":"Atualidades","assunto":"Justiça climática","dificuldade":"Intermediária","enunciado":"O conceito de justiça climática destaca que:","alternativas":{"A":"impactos e custos da mudança do clima são distribuídos de forma desigual e exigem atenção a grupos mais vulneráveis.","B":"todos os grupos sociais sofrem impactos idênticos.","C":"mudança climática não possui dimensão social.","D":"somente países ricos precisam adotar medidas de adaptação.","E":"desigualdades existentes não interferem na vulnerabilidade climática."},"gabarito":"A","comentario":"Condições de renda, território, acesso a serviços e modos de vida influenciam exposição e capacidade de resposta aos impactos do clima.","referencia":"IPCC; ONU — justiça climática."},{"id":"ATU081","disciplina":"Atualidades","assunto":"Povos indígenas e política climática","dificuldade":"Intermediária","enunciado":"A participação de povos indígenas e comunidades locais em políticas climáticas é relevante porque:","alternativas":{"A":"torna desnecessária a proteção territorial.","B":"dispensa conhecimento científico em qualquer decisão.","C":"transfere integralmente ao grupo as responsabilidades do Estado.","D":"substitui automaticamente todas as demais políticas ambientais.","E":"seus direitos, conhecimentos e experiências territoriais podem qualificar decisões e aumentar a legitimidade das medidas."},"gabarito":"E","comentario":"A governança climática contemporânea reconhece a importância da participação e dos conhecimentos locais e tradicionais, em diálogo com ciência e direitos.","referencia":"UNFCCC — participação de Povos Indígenas e comunidades locais; Convenção nº 169 da OIT."},{"id":"ATU082","disciplina":"Atualidades","assunto":"COP30 e legado urbano","dificuldade":"Difícil","enunciado":"A avaliação do legado urbano de um grande evento internacional como a COP30 deve considerar:","alternativas":{"A":"que eventos internacionais não alteram a dinâmica urbana.","B":"apenas o número de visitantes estrangeiros.","C":"investimentos e visibilidade, mas também mobilidade, infraestrutura, preços, serviços, uso posterior das obras e distribuição dos benefícios.","D":"que todo investimento beneficia todos os moradores de forma idêntica.","E":"somente a agenda diplomática, sem efeitos locais."},"gabarito":"C","comentario":"Grandes eventos produzem efeitos múltiplos. A avaliação de legado deve observar benefícios, custos, permanência das estruturas e impactos distributivos sobre a população.","referencia":"Presidência da COP30 Brasil; Governo do Pará; Prefeitura de Belém — documentos de preparação e legado."},{"id":"ATU083","disciplina":"Atualidades","assunto":"Adaptação em comunidades ribeirinhas","dificuldade":"Intermediária","enunciado":"Para comunidades ribeirinhas expostas a variações extremas de nível dos rios, uma política de adaptação adequada tende a combinar:","alternativas":{"A":"remoção permanente de todas as comunidades como regra geral.","B":"uso exclusivo de médias históricas, ignorando mudanças recentes.","C":"monitoramento hidrológico, alerta, planejamento de emergência, infraestrutura adaptada e participação comunitária.","D":"decisões sem consulta às comunidades afetadas.","E":"abandono de serviços públicos durante eventos extremos."},"gabarito":"C","comentario":"Adaptação envolve reduzir risco e vulnerabilidade por meio de informação, planejamento, infraestrutura e participação das populações expostas.","referencia":"ANA; Cemaden; IPCC."},{"id":"ATU084","disciplina":"Atualidades","assunto":"Infraestrutura e sustentabilidade","dificuldade":"Difícil","enunciado":"Em um projeto de expansão logística no Pará, a decisão pública mais compatível com desenvolvimento sustentável é:","alternativas":{"A":"presumir que crescimento econômico elimina automaticamente impactos sociais.","B":"dispensar consulta a populações potencialmente afetadas.","C":"considerar somente o retorno financeiro de curto prazo.","D":"escolher sempre a alternativa de maior capacidade de carga, independentemente dos impactos.","E":"avaliar benefícios econômicos juntamente com impactos ambientais, sociais, territoriais e alternativas de projeto."},"gabarito":"E","comentario":"Desenvolvimento sustentável exige análise integrada de benefícios, riscos e distribuição dos impactos, além do cumprimento das normas ambientais e de participação aplicáveis.","referencia":"Constituição Federal de 1988, art. 225; legislação ambiental; Agenda 2030."},{"id":"ATU085","disciplina":"Atualidades","assunto":"Agenda 2030 e PEAA","dificuldade":"Difícil","enunciado":"A Lei Estadual nº 10.750/2024 inclui entre as finalidades do Plano Estadual Amazônia Agora:","alternativas":{"A":"suspender as metas climáticas nacionais no território paraense.","B":"contribuir para o alcance dos Objetivos de Desenvolvimento Sustentável da Agenda 2030 em escala estadual.","C":"substituir todos os planos municipais de desenvolvimento por um plano único estadual.","D":"restringir suas ações exclusivamente à Região Metropolitana de Belém.","E":"eliminar políticas de redução de desmatamento em áreas produtivas."},"gabarito":"B","comentario":"A lei do PEAA cita expressamente o alcance dos ODS da Agenda 2030 em escala estadual e a contribuição do Pará para compromissos de desenvolvimento sustentável e clima.","referencia":"SEMAS/PA — Lei Estadual nº 10.750/2024, art. 2º."},{"id":"ATU086","disciplina":"Atualidades","assunto":"Indicadores sociais","dificuldade":"Intermediária","enunciado":"Para comparar condições de vida entre regiões do Pará, o uso de um único indicador, como renda média, é insuficiente porque:","alternativas":{"A":"renda não pode ser medida estatisticamente.","B":"educação e saúde não influenciam condições de vida.","C":"todos os indicadores sociais apresentam o mesmo valor.","D":"qualidade de vida envolve dimensões como educação, saúde, saneamento, trabalho, moradia e ambiente.","E":"indicadores territoriais não podem ser comparados."},"gabarito":"D","comentario":"Indicadores sociais são multidimensionais. A análise conjunta reduz o risco de conclusões simplificadas sobre bem-estar e desigualdade.","referencia":"IBGE — Síntese de Indicadores Sociais; FAPESPA — indicadores do Pará."},{"id":"ATU087","disciplina":"Atualidades","assunto":"Desigualdades territoriais","dificuldade":"Intermediária","enunciado":"Médias estaduais podem ocultar desigualdades porque:","alternativas":{"A":"municípios, territórios e grupos populacionais podem apresentar condições muito diferentes da média geral.","B":"diferenças territoriais desaparecem quando a população cresce.","C":"todas as políticas públicas produzem resultados idênticos em qualquer território.","D":"a média estadual sempre corresponde à situação de cada município.","E":"indicadores municipais são inválidos quando há indicador estadual."},"gabarito":"A","comentario":"Dados agregados podem esconder variações regionais e sociais. Desagregar indicadores ajuda a identificar diferenças relevantes para o planejamento.","referencia":"IBGE; FAPESPA — indicadores territoriais e sociais."},{"id":"ATU088","disciplina":"Atualidades","assunto":"Educação e territorialidade","dificuldade":"Difícil","enunciado":"Uma política educacional voltada a áreas rurais, ribeirinhas, indígenas e quilombolas do Pará deve:","alternativas":{"A":"adotar um único modelo logístico sem adaptações locais.","B":"considerar que distância e transporte não interferem no acesso escolar.","C":"considerar características territoriais, culturais e de acesso, preservando a garantia do direito à educação.","D":"eliminar conteúdos relacionados às comunidades.","E":"tratar diversidade cultural como incompatível com currículo."},"gabarito":"C","comentario":"O direito à educação é universal, mas sua implementação deve considerar modalidades, obstáculos territoriais e diversidade sociocultural.","referencia":"Constituição Federal de 1988; Lei nº 9.394/1996; diretrizes nacionais para educação indígena, quilombola e do campo."},{"id":"ATU089","disciplina":"Atualidades","assunto":"Saúde e regionalização","dificuldade":"Intermediária","enunciado":"Em regiões de baixa densidade populacional e grandes distâncias, um desafio para a política de saúde é:","alternativas":{"A":"concentrar todos os serviços exclusivamente na capital.","B":"eliminar referências entre municípios.","C":"garantir acesso oportuno articulando atenção local, transporte, regulação e redes regionalizadas.","D":"desconsiderar distâncias fluviais e rodoviárias.","E":"substituir atenção básica por atendimento exclusivamente hospitalar."},"gabarito":"C","comentario":"Grandes distâncias exigem redes regionalizadas, atenção primária, regulação e soluções de transporte e comunicação adequadas ao território.","referencia":"Lei nº 8.080/1990; SUS — regionalização e redes de atenção."},{"id":"ATU090","disciplina":"Atualidades","assunto":"Segurança pública e indicadores","dificuldade":"Difícil","enunciado":"Ao analisar indicadores de segurança pública, é importante considerar que:","alternativas":{"A":"séries históricas são desnecessárias para comparar tendências.","B":"violência e criminalidade são fenômenos multicausais, e os registros podem variar conforme cobertura, notificação e metodologia.","C":"um único indicador explica todos os tipos de violência.","D":"todo aumento de registros significa necessariamente aumento idêntico da ocorrência real.","E":"condições sociais e territoriais não possuem relação com prevenção."},"gabarito":"B","comentario":"Indicadores de segurança precisam ser contextualizados segundo o tipo de ocorrência, fonte, cobertura, metodologia e período analisado.","referencia":"Ministério da Justiça e Segurança Pública — Sinesp; metodologias de indicadores de segurança."},{"id":"ATU091","disciplina":"Atualidades","assunto":"Trabalho e inclusão","dificuldade":"Intermediária","enunciado":"Para avaliar inclusão no mercado de trabalho, é útil analisar conjuntamente:","alternativas":{"A":"apenas a população em idade escolar.","B":"apenas o PIB estadual.","C":"ocupação, desocupação, informalidade, rendimento e desigualdades entre grupos.","D":"somente o número total de habitantes.","E":"exclusivamente a quantidade de empresas abertas em um mês."},"gabarito":"C","comentario":"O mercado de trabalho possui várias dimensões. Taxas de ocupação, desemprego, informalidade e rendimento ajudam a avaliar acesso e qualidade do trabalho.","referencia":"IBGE — PNAD Contínua."},{"id":"ATU092","disciplina":"Atualidades","assunto":"Inclusão social","dificuldade":"Intermediária","enunciado":"Uma política de inclusão social tende a ser mais efetiva quando:","alternativas":{"A":"ignora barreiras territoriais e sociais.","B":"atua apenas por campanhas publicitárias.","C":"combina acesso a serviços, proteção social, oportunidades de trabalho e enfrentamento de discriminações.","D":"elimina critérios de monitoramento.","E":"substitui direitos universais por favores discricionários."},"gabarito":"C","comentario":"Inclusão social envolve remover barreiras e ampliar acesso a direitos, capacidades e oportunidades, combinando diferentes políticas públicas.","referencia":"Constituição Federal de 1988; ONU — Agenda 2030."},{"id":"ATU093","disciplina":"Atualidades","assunto":"Políticas públicas baseadas em evidências","dificuldade":"Intermediária","enunciado":"Uma política pública orientada por evidências deve:","alternativas":{"A":"ser mantida sem avaliação, independentemente dos resultados.","B":"usar apenas opiniões individuais como fonte de decisão.","C":"confundir quantidade de atividades executadas com impacto alcançado.","D":"definir o problema, estabelecer objetivos, utilizar dados confiáveis, monitorar a execução e avaliar resultados.","E":"evitar indicadores para não limitar escolhas."},"gabarito":"D","comentario":"Diagnóstico, metas, monitoramento e avaliação ajudam a verificar se a política está sendo implementada e se produz os resultados esperados.","referencia":"IPEA — avaliação de políticas públicas; órgãos de controle."},{"id":"ATU094","disciplina":"Atualidades","assunto":"Participação social","dificuldade":"Fácil","enunciado":"Conselhos, audiências e consultas públicas podem fortalecer a cidadania quando:","alternativas":{"A":"transferem automaticamente toda decisão estatal aos participantes.","B":"substituem eleições e instituições representativas.","C":"ampliam canais de participação e permitem a apresentação de informações, demandas e argumentos ao processo decisório.","D":"eliminam a necessidade de transparência e prestação de contas.","E":"garantem que toda proposta apresentada será obrigatoriamente aceita."},"gabarito":"C","comentario":"Mecanismos participativos complementam instituições representativas e podem melhorar informação e controle social, sem significar aceitação automática de todas as propostas.","referencia":"Constituição Federal de 1988; Lei nº 12.527/2011."},{"id":"ATU095","disciplina":"Atualidades","assunto":"Direitos humanos","dificuldade":"Fácil","enunciado":"A concepção contemporânea de direitos humanos é compatível com a ideia de que esses direitos:","alternativas":{"A":"são exclusivamente direitos civis, sem dimensão social.","B":"podem ser negados integralmente a grupos minoritários por ato administrativo.","C":"dependem da renda para serem reconhecidos.","D":"se aplicam apenas a nacionais do país onde a pessoa nasceu.","E":"são universais, interdependentes e devem ser protegidos sem discriminação."},"gabarito":"E","comentario":"Direitos humanos abrangem dimensões civis, políticas, econômicas, sociais e culturais e partem da dignidade e igualdade de todas as pessoas.","referencia":"ONU — Declaração Universal dos Direitos Humanos."},{"id":"ATU096","disciplina":"Atualidades","assunto":"Direito à educação","dificuldade":"Fácil","enunciado":"Segundo a Constituição Federal, a educação é:","alternativas":{"A":"atribuição exclusiva dos municípios.","B":"direito de todos e dever do Estado e da família, promovida com a colaboração da sociedade.","C":"serviço condicionado à contribuição previdenciária.","D":"benefício opcional destinado apenas a crianças.","E":"direito restrito à educação superior."},"gabarito":"B","comentario":"O art. 205 define a educação como direito de todos e dever do Estado e da família, promovida e incentivada com a colaboração da sociedade.","referencia":"Constituição Federal de 1988, art. 205."},{"id":"ATU097","disciplina":"Atualidades","assunto":"Igualdade racial e direitos quilombolas","dificuldade":"Intermediária","enunciado":"Políticas voltadas às comunidades quilombolas podem ser compreendidas, à luz dos direitos humanos, como medidas que buscam:","alternativas":{"A":"enfrentar desigualdades históricas e proteger direitos territoriais, culturais e sociais.","B":"substituir cidadania por segregação compulsória.","C":"impedir acesso a políticas universais.","D":"eliminar liberdade de autoidentificação.","E":"negar igualdade jurídica entre os cidadãos."},"gabarito":"A","comentario":"A proteção de direitos quilombolas combina igualdade, enfrentamento da discriminação, cultura, território e acesso a direitos universais.","referencia":"Constituição Federal de 1988 — ADCT, art. 68; Lei nº 12.288/2010 — Estatuto da Igualdade Racial."},{"id":"ATU098","disciplina":"Atualidades","assunto":"Direitos indígenas","dificuldade":"Intermediária","enunciado":"O reconhecimento constitucional dos direitos dos povos indígenas representa uma ruptura com políticas assimilacionistas porque:","alternativas":{"A":"obriga a substituição das línguas indígenas pelo português.","B":"elimina a proteção territorial constitucional.","C":"transforma todas as terras indígenas em propriedades privadas individuais.","D":"considera as culturas indígenas temporárias até a integração completa.","E":"reconhece a legitimidade de suas organizações sociais, línguas, costumes e tradições."},"gabarito":"E","comentario":"A Constituição de 1988 reconhece povos indígenas como sujeitos de direitos coletivos e protege sua diversidade sociocultural e territorial.","referencia":"Constituição Federal de 1988, art. 231."},{"id":"ATU099","disciplina":"Atualidades","assunto":"Avaliação de políticas educacionais","dificuldade":"Fácil","enunciado":"Uma política estadual estabelece como meta reduzir o abandono escolar. O indicador mais diretamente ligado ao resultado pretendido é:","alternativas":{"A":"a quantidade de páginas do plano de ação.","B":"a variação da taxa de abandono escolar no período e nos públicos atendidos.","C":"o total de servidores do órgão, sem relação com a medida.","D":"o número de reuniões da equipe, isoladamente.","E":"a população total do estado, sem recorte educacional."},"gabarito":"B","comentario":"Indicadores de resultado devem medir diretamente o fenômeno que a política pretende alterar. Reuniões e atividades são indicadores de processo, não do resultado final.","referencia":"INEP — indicadores educacionais; avaliação de políticas públicas."},{"id":"ATU100","disciplina":"Atualidades","assunto":"Dados desagregados","dificuldade":"Intermediária","enunciado":"A desagregação de indicadores por município, território, raça, sexo ou faixa etária pode ser útil porque:","alternativas":{"A":"impede comparações temporais em qualquer situação.","B":"faz com que todos os subgrupos apresentem o mesmo resultado.","C":"elimina a necessidade de proteger dados pessoais.","D":"torna os dados necessariamente menos precisos.","E":"revela desigualdades que podem desaparecer em médias agregadas."},"gabarito":"E","comentario":"Desagregar dados pode mostrar grupos ou territórios com situações diferentes da média, desde que se respeitem critérios de qualidade estatística e proteção de dados.","referencia":"IBGE — produção e disseminação de estatísticas; Lei nº 13.709/2018."},{"id":"ATU101","disciplina":"Atualidades","assunto":"Inclusão digital","dificuldade":"Intermediária","enunciado":"Em políticas educacionais, inclusão digital não se resume à entrega de equipamentos porque também envolve:","alternativas":{"A":"conectividade, acessibilidade, competências digitais, suporte e uso pedagógico significativo.","B":"somente compra de computadores.","C":"desconsideração de estudantes com deficiência.","D":"substituição integral do professor por plataformas.","E":"proibição do uso de recursos digitais fora de laboratórios."},"gabarito":"A","comentario":"Acesso material é apenas uma dimensão da inclusão digital. Qualidade de conexão, competências, acessibilidade e integração pedagógica também são essenciais.","referencia":"UNESCO — educação digital; Ministério da Educação."},{"id":"ATU102","disciplina":"Atualidades","assunto":"Qualidade de vida","dificuldade":"Intermediária","enunciado":"Uma leitura multidimensional da qualidade de vida no Pará deve considerar:","alternativas":{"A":"que a localização territorial nunca interfere no acesso a serviços.","B":"moradia, renda, saúde, educação, mobilidade, ambiente e acesso a serviços, entre outras dimensões.","C":"somente a quantidade de exportações.","D":"apenas a renda estadual total.","E":"exclusivamente o crescimento populacional."},"gabarito":"B","comentario":"Qualidade de vida é multidimensional e varia entre grupos e territórios. Por isso, a análise combina indicadores econômicos, sociais, ambientais e de acesso a serviços.","referencia":"IBGE — Síntese de Indicadores Sociais; FAPESPA."},{"id":"ATU103","disciplina":"Atualidades","assunto":"Intersetorialidade","dificuldade":"Difícil","enunciado":"Problemas como abandono escolar, violência, insegurança alimentar e vulnerabilidade social frequentemente exigem políticas intersetoriais porque:","alternativas":{"A":"uma única secretaria sempre possui todos os instrumentos necessários.","B":"a coordenação entre órgãos reduz necessariamente a efetividade.","C":"indicadores sociais não se relacionam entre si.","D":"suas causas e consequências atravessam diferentes áreas, como educação, saúde, assistência, trabalho e segurança.","E":"ações preventivas devem ser evitadas quando há políticas setoriais."},"gabarito":"D","comentario":"Problemas complexos raramente se limitam a uma única área de governo. A articulação entre setores pode evitar lacunas e sobreposições e melhorar a atenção às famílias e territórios.","referencia":"IPEA — políticas públicas e intersetorialidade; Constituição Federal de 1988."},{"id":"ATU104","disciplina":"Atualidades","assunto":"Transparência e cidadania","dificuldade":"Fácil","enunciado":"A Lei de Acesso à Informação contribui para a cidadania ao estabelecer mecanismos para:","alternativas":{"A":"sigilo como regra geral de todos os atos públicos.","B":"eliminação da transparência ativa dos órgãos públicos.","C":"proibição de pedidos feitos por cidadãos sem justificativa política.","D":"divulgação irrestrita de dados pessoais sensíveis.","E":"acesso a informações públicas, respeitadas as hipóteses legais de sigilo e proteção de dados."},"gabarito":"E","comentario":"A LAI adota a publicidade como regra e o sigilo como exceção, sem afastar proteções legais aplicáveis a dados pessoais e informações classificadas.","referencia":"Lei Federal nº 12.527/2011 — Lei de Acesso à Informação."},{"id":"ATU105","disciplina":"Atualidades","assunto":"Federalismo e políticas públicas","dificuldade":"Difícil","enunciado":"Em áreas como educação, saúde e meio ambiente, a cooperação entre União, Estado e municípios é relevante porque:","alternativas":{"A":"o Estado do Pará pode substituir a Constituição Federal por norma própria.","B":"os municípios não possuem autonomia administrativa.","C":"a cooperação federativa elimina as competências de cada ente.","D":"somente a União pode prestar serviços públicos em qualquer área.","E":"competências e responsabilidades públicas são distribuídas entre diferentes entes e muitas políticas dependem de coordenação federativa."},"gabarito":"E","comentario":"O federalismo brasileiro distribui competências entre entes autônomos e prevê cooperação em várias políticas. A coordenação é especialmente importante em serviços e problemas que ultrapassam limites municipais.","referencia":"Constituição Federal de 1988 — organização federativa e competências comuns e concorrentes."},{"id":"ATU106","disciplina":"Atualidades","assunto":"Inteligência artificial na educação","dificuldade":"Difícil","enunciado":"Uma escola utiliza IA generativa para apoiar a elaboração de atividades. A prática mais adequada é:","alternativas":{"A":"permitir que a IA substitua integralmente o julgamento docente.","B":"usar a ferramenta com supervisão humana, proteção de dados, avaliação crítica das respostas e finalidade pedagógica definida.","C":"considerar toda resposta gerada automaticamente correta.","D":"inserir dados pessoais sensíveis dos alunos sem necessidade.","E":"dispensar critérios de autoria e transparência no uso acadêmico."},"gabarito":"B","comentario":"Orientações internacionais recomendam abordagem centrada no ser humano, com atenção a privacidade, segurança, validação pedagógica, transparência e supervisão.","referencia":"UNESCO — Guidance for Generative AI in Education and Research."},{"id":"ATU107","disciplina":"Atualidades","assunto":"IA generativa e confiabilidade","dificuldade":"Fácil","enunciado":"Uma característica de sistemas de IA generativa que exige atenção é que eles:","alternativas":{"A":"consultam obrigatoriamente fontes oficiais em tempo real.","B":"garantem referências bibliográficas verdadeiras em toda resposta.","C":"possuem compreensão humana e intenção próprias em qualquer tarefa.","D":"são incapazes de reproduzir vieses presentes em dados.","E":"podem produzir respostas plausíveis, porém factualmente incorretas, exigindo verificação."},"gabarito":"E","comentario":"A fluência do texto não garante veracidade. Sistemas generativos podem produzir erros factuais e referências inexistentes.","referencia":"UNESCO — Guidance for Generative AI in Education and Research."},{"id":"ATU108","disciplina":"Atualidades","assunto":"IA e checagem de fatos","dificuldade":"Fácil","enunciado":"Quando uma ferramenta de IA fornece um dado recente sobre o Pará, a atitude mais segura é:","alternativas":{"A":"aceitar o dado se a resposta estiver bem escrita.","B":"conferir a informação em fontes confiáveis e atualizadas antes de utilizá-la.","C":"usar o dado sem verificar a data de referência.","D":"repetir a pergunta até receber a mesma resposta.","E":"presumir que a ferramenta possui acesso a todos os bancos oficiais."},"gabarito":"B","comentario":"Aparência de segurança e fluência não substituem evidência. Informações recentes devem ser confirmadas em fontes primárias ou institucionais.","referencia":"UNESCO — alfabetização em IA e educação midiática."},{"id":"ATU109","disciplina":"Atualidades","assunto":"Vieses algorítmicos","dificuldade":"Intermediária","enunciado":"Sistemas de IA podem reproduzir ou ampliar vieses quando:","alternativas":{"A":"a interface possui recursos de acessibilidade.","B":"o sistema realiza qualquer cálculo matemático.","C":"todo treinamento utiliza apenas dados públicos.","D":"o usuário revisa criticamente os resultados.","E":"dados, escolhas de modelagem ou contextos de uso refletem padrões discriminatórios ou pouco representativos."},"gabarito":"E","comentario":"Vieses podem surgir dos dados, das escolhas técnicas e da forma de uso. Avaliação de impacto, documentação e supervisão ajudam a reduzi-los.","referencia":"UNESCO — Recomendação sobre a Ética da Inteligência Artificial."},{"id":"ATU110","disciplina":"Atualidades","assunto":"IA e agência humana","dificuldade":"Intermediária","enunciado":"Uma abordagem de IA centrada no ser humano pressupõe que:","alternativas":{"A":"a explicação dos critérios utilizados é sempre desnecessária.","B":"o usuário não deve poder contestar resultados.","C":"toda decisão deve ser transferida ao sistema automatizado.","D":"decisões relevantes mantenham supervisão, responsabilidade e possibilidade de intervenção humana.","E":"a automação elimina responsabilidades institucionais."},"gabarito":"D","comentario":"A ética da IA enfatiza agência humana, responsabilidade, transparência e proteção de direitos, especialmente em decisões de maior impacto.","referencia":"UNESCO — Recomendação sobre a Ética da Inteligência Artificial."},{"id":"ATU111","disciplina":"Atualidades","assunto":"Desigualdade digital e IA","dificuldade":"Intermediária","enunciado":"A expansão do uso de IA na educação pode ampliar desigualdades quando:","alternativas":{"A":"competências digitais não interferem na qualidade de uso.","B":"acesso à internet, dispositivos e competências digitais é distribuído de forma desigual.","C":"conectividade é irrelevante para ferramentas digitais.","D":"todos os estudantes dispõem das mesmas condições de acesso.","E":"a tecnologia elimina sozinha barreiras sociais."},"gabarito":"B","comentario":"Diferenças de acesso e competência podem produzir benefícios desiguais, exigindo políticas de inclusão digital e acessibilidade.","referencia":"UNESCO — educação digital e IA."},{"id":"ATU112","disciplina":"Atualidades","assunto":"Autoria e uso de IA","dificuldade":"Difícil","enunciado":"Em atividades acadêmicas, regras de transparência sobre o uso de IA generativa são importantes porque:","alternativas":{"A":"permitem identificar o papel da ferramenta e preservar responsabilidade sobre o conteúdo final.","B":"garantem automaticamente que não exista plágio.","C":"transformam qualquer resposta de IA em produção científica validada.","D":"tornam desnecessária a verificação de fatos.","E":"eliminam a responsabilidade do autor humano."},"gabarito":"A","comentario":"Transparência ajuda a avaliar autoria, integridade acadêmica e responsabilidade, mas não substitui a verificação de conteúdo.","referencia":"UNESCO — Guidance for Generative AI in Education and Research."},{"id":"ATU113","disciplina":"Atualidades","assunto":"LGPD — conceito de dado pessoal","dificuldade":"Fácil","enunciado":"Segundo a LGPD, dado pessoal é:","alternativas":{"A":"somente o número do CPF.","B":"apenas informação publicada em documento físico.","C":"exclusivamente informação classificada como sigilosa pelo Estado.","D":"qualquer informação sobre pessoa jurídica, sem exceção.","E":"informação relacionada a pessoa natural identificada ou identificável."},"gabarito":"E","comentario":"A LGPD adota conceito amplo de dado pessoal, abrangendo informações que identifiquem ou possam identificar uma pessoa natural.","referencia":"Lei nº 13.709/2018 — LGPD, art. 5º, I."},{"id":"ATU114","disciplina":"Atualidades","assunto":"LGPD — dados sensíveis","dificuldade":"Fácil","enunciado":"Qual conjunto contém categorias de dados pessoais sensíveis previstas na LGPD?","alternativas":{"A":"nome, bairro, profissão e cor favorita.","B":"origem racial ou étnica, convicção religiosa, dados de saúde e dados biométricos vinculados a pessoa natural.","C":"temperatura ambiente, horário de aula e número da turma.","D":"CNPJ, razão social e endereço da escola.","E":"preço de produto, código de disciplina e sala de aula."},"gabarito":"B","comentario":"A LGPD prevê proteção especial para categorias como origem racial ou étnica, religião, opinião política, filiação sindical, saúde, vida sexual, dados genéticos e biométricos.","referencia":"Lei nº 13.709/2018 — LGPD, art. 5º, II."},{"id":"ATU115","disciplina":"Atualidades","assunto":"LGPD — finalidade","dificuldade":"Intermediária","enunciado":"Uma escola coleta telefone de responsáveis para comunicação escolar e deseja usá-lo depois em publicidade de terceiros sem relação com a finalidade informada. O princípio diretamente envolvido é o da:","alternativas":{"A":"anonimato obrigatório.","B":"publicidade irrestrita.","C":"finalidade.","D":"supremacia comercial.","E":"territorialidade municipal."},"gabarito":"C","comentario":"O princípio da finalidade exige propósitos legítimos, específicos e informados, vedando tratamento posterior incompatível com o objetivo original.","referencia":"Lei nº 13.709/2018 — LGPD, art. 6º, I."},{"id":"ATU116","disciplina":"Atualidades","assunto":"LGPD — necessidade","dificuldade":"Intermediária","enunciado":"Se uma plataforma educacional solicita histórico médico completo para liberar um material didático que não depende dessa informação, o princípio mais diretamente relacionado à coleta excessiva é o da:","alternativas":{"A":"necessidade.","B":"hierarquia.","C":"continuidade.","D":"publicidade.","E":"especialidade tributária."},"gabarito":"A","comentario":"O princípio da necessidade limita o tratamento ao mínimo necessário para atingir a finalidade, evitando dados excessivos ou irrelevantes.","referencia":"Lei nº 13.709/2018 — LGPD, art. 6º, III."},{"id":"ATU117","disciplina":"Atualidades","assunto":"LGPD — decisões automatizadas","dificuldade":"Intermediária","enunciado":"A LGPD assegura ao titular direito relacionado à revisão de decisões tomadas unicamente com base em tratamento automatizado quando elas:","alternativas":{"A":"afetarem seus interesses, inclusive em hipóteses de definição de perfis.","B":"forem resultado de cálculo sem uso de dados pessoais.","C":"envolverem apenas dados totalmente anônimos e sem reidentificação possível.","D":"não tiverem qualquer relação com o titular.","E":"forem produzidas em papel em vez de sistema digital."},"gabarito":"A","comentario":"O art. 20 disciplina direitos relativos a decisões unicamente automatizadas que afetem interesses do titular, incluindo informações sobre critérios e procedimentos utilizados.","referencia":"Lei nº 13.709/2018 — LGPD, art. 20."},{"id":"ATU118","disciplina":"Atualidades","assunto":"LGPD — segurança","dificuldade":"Fácil","enunciado":"Agentes de tratamento devem adotar medidas técnicas e administrativas para:","alternativas":{"A":"substituir políticas de segurança por termos genéricos.","B":"proteger dados pessoais contra acessos não autorizados e situações acidentais ou ilícitas.","C":"garantir divulgação pública de todos os bancos de dados.","D":"permitir compartilhamento irrestrito entre instituições.","E":"eliminar controles de acesso."},"gabarito":"B","comentario":"A LGPD exige medidas de segurança aptas a proteger dados contra acessos não autorizados, destruição, perda, alteração, comunicação ou tratamento inadequado ou ilícito.","referencia":"Lei nº 13.709/2018 — LGPD, art. 46."},{"id":"ATU119","disciplina":"Atualidades","assunto":"LGPD — crianças e adolescentes","dificuldade":"Intermediária","enunciado":"No tratamento de dados pessoais de crianças e adolescentes, a LGPD estabelece como referência central:","alternativas":{"A":"a coleta ilimitada de dados para usos futuros.","B":"a presunção de que dados de menores não são dados pessoais.","C":"a dispensa de transparência aos responsáveis.","D":"o melhor interesse da criança e do adolescente.","E":"a conveniência comercial do controlador."},"gabarito":"D","comentario":"O art. 14 estabelece o melhor interesse da criança e do adolescente como referência para o tratamento de seus dados pessoais.","referencia":"Lei nº 13.709/2018 — LGPD, art. 14."},{"id":"ATU120","disciplina":"Atualidades","assunto":"LGPD e poder público","dificuldade":"Difícil","enunciado":"Quando um órgão público trata dados para executar uma política pública, isso significa que:","alternativas":{"A":"medidas de segurança tornam-se facultativas.","B":"o órgão pode usar os dados para qualquer finalidade privada.","C":"os dados passam automaticamente a ser públicos.","D":"o tratamento continua sujeito aos princípios, deveres e bases legais aplicáveis da LGPD.","E":"a LGPD deixa de se aplicar ao órgão estatal."},"gabarito":"D","comentario":"A LGPD disciplina também o tratamento pelo poder público. A existência de base legal para uma finalidade pública não elimina princípios como necessidade, segurança e transparência.","referencia":"Lei nº 13.709/2018; ANPD — Guia Orientativo sobre Tratamento de Dados Pessoais pelo Poder Público."},{"id":"ATU121","disciplina":"Atualidades","assunto":"Desinformação e viralidade","dificuldade":"Fácil","enunciado":"O fato de uma informação ter sido amplamente compartilhada em redes sociais:","alternativas":{"A":"transforma opinião em fato verificável.","B":"garante sua autenticidade se houver milhares de compartilhamentos.","C":"não constitui, por si só, evidência de que ela seja verdadeira.","D":"prova que especialistas confirmaram a informação.","E":"substitui a necessidade de fonte primária."},"gabarito":"C","comentario":"Viralidade mede circulação, não veracidade. Conteúdos falsos, enganosos ou descontextualizados também podem alcançar grande audiência.","referencia":"UNESCO — Alfabetização Midiática e Informacional."},{"id":"ATU122","disciplina":"Atualidades","assunto":"Informação fora de contexto","dificuldade":"Intermediária","enunciado":"Uma fotografia verdadeira de uma enchente antiga é publicada como se retratasse um evento atual no Pará. O principal problema informacional é:","alternativas":{"A":"o uso de conteúdo verdadeiro em contexto temporal falso ou enganoso.","B":"o uso de uma fotografia em vez de texto.","C":"a baixa resolução da imagem.","D":"a ausência de hashtags na publicação.","E":"o fato de a imagem ter sido captada por um celular."},"gabarito":"A","comentario":"Desinformação pode resultar da reutilização de conteúdo autêntico fora de contexto, criando interpretação enganosa sobre tempo, lugar ou circunstância.","referencia":"UNESCO — Alfabetização Midiática e Informacional."},{"id":"ATU123","disciplina":"Atualidades","assunto":"Deepfakes","dificuldade":"Difícil","enunciado":"O avanço da IA generativa torna os deepfakes uma preocupação porque:","alternativas":{"A":"a existência de deepfakes torna impossível verificar qualquer conteúdo digital.","B":"áudios, imagens ou vídeos sintéticos podem simular pessoas e acontecimentos de maneira convincente.","C":"todo conteúdo produzido por IA é necessariamente criminoso.","D":"deepfakes só podem ser produzidos por órgãos governamentais.","E":"mídia sintética não circula em redes sociais."},"gabarito":"B","comentario":"Deepfakes podem simular voz e imagem com alto grau de realismo, aumentando a necessidade de verificar procedência, contexto e fontes.","referencia":"UNESCO — ética da IA e educação midiática."},{"id":"ATU124","disciplina":"Atualidades","assunto":"Checagem de fontes","dificuldade":"Intermediária","enunciado":"Para confirmar o conteúdo formal de uma lei estadual mencionada em uma postagem, a fonte mais adequada é:","alternativas":{"A":"o texto oficial da norma publicado no Diário Oficial ou no portal legislativo competente.","B":"uma corrente de aplicativo de mensagens.","C":"um vídeo de opinião que não exibe a norma.","D":"uma propaganda sem referência.","E":"um comentário anônimo em rede social."},"gabarito":"A","comentario":"Fontes primárias são as mais adequadas para verificar o teor formal de atos oficiais, embora a análise de impactos possa exigir outras fontes.","referencia":"Diário Oficial do Estado do Pará; Portal Legislativo do Estado."},{"id":"ATU125","disciplina":"Atualidades","assunto":"Responsabilidade ao compartilhar","dificuldade":"Intermediária","enunciado":"Antes de compartilhar uma notícia alarmante sobre uma emergência ambiental no Pará, uma conduta responsável é:","alternativas":{"A":"republicar imediatamente para aumentar o alcance.","B":"remover o nome da fonte para evitar questionamentos.","C":"considerar qualquer áudio encaminhado como comunicado oficial.","D":"confirmar a informação em canais oficiais ou fontes jornalísticas confiáveis e verificar a data e o contexto.","E":"acrescentar detalhes não confirmados para tornar a mensagem mais completa."},"gabarito":"D","comentario":"Em situações de emergência, informações incorretas podem gerar pânico ou atrapalhar respostas. Verificar fonte, data e contexto reduz esse risco.","referencia":"Defesa Civil; UNESCO — educação midiática e informacional."}],"pedagogicos":[{"id":"PED001","disciplina":"Conhecimentos Pedagógicos","assunto":"Pensadores da Educação — Paulo Freire","dificuldade":"Difícil","enunciado":"Em uma escola pública, a equipe pedagógica decide substituir aulas centradas na transmissão de respostas prontas por situações em que os estudantes partem de problemas de sua realidade, dialogam sobre eles, confrontam saberes e produzem novas compreensões. À luz de Paulo Freire, essa decisão expressa principalmente a ideia de","alternativas":{"A":"neutralidade do ato educativo, que deve evitar a problematização do contexto social.","B":"educação problematizadora e dialógica, na qual educador e educandos constroem conhecimento pela reflexão crítica sobre a realidade.","C":"instrução programada, com reforço imediato para respostas corretas.","D":"maturação espontânea, independente da mediação pedagógica.","E":"memorização de conteúdos universais como condição suficiente para a consciência crítica."},"gabarito":"B","comentario":"A alternativa B está correta. Na perspectiva freireana, a educação problematizadora se opõe à educação bancária e valoriza diálogo, leitura crítica do mundo e práxis, entendida como articulação entre reflexão e ação. As demais alternativas descrevem concepções incompatíveis com esse referencial.","referencia":"FREIRE, Paulo. Pedagogia do Oprimido; Pedagogia da Autonomia."},{"id":"PED002","disciplina":"Conhecimentos Pedagógicos","assunto":"Pensadores da Educação — John Dewey","dificuldade":"Intermediária","enunciado":"Uma professora organiza uma sequência didática em torno de um problema real da comunidade, no qual os estudantes investigam dados, formulam hipóteses, testam possibilidades e avaliam os resultados de suas ações. Essa prática se aproxima da concepção de John Dewey porque valoriza","alternativas":{"A":"a exposição verbal como método superior a qualquer experiência.","B":"a separação entre escola e vida cotidiana para preservar a objetividade do ensino.","C":"a repetição de exercícios até a automatização das respostas.","D":"a aprendizagem determinada exclusivamente por estruturas inatas.","E":"a experiência, a investigação e a resolução de problemas como elementos centrais do aprender."},"gabarito":"E","comentario":"A alternativa E está correta. Dewey entende a educação como reconstrução da experiência e atribui valor à investigação de problemas significativos. A escola deve articular aprendizagem, experiência e vida social, e não separar rigidamente o conhecimento escolar da realidade.","referencia":"DEWEY, John. Democracia e Educação; Experiência e Educação."},{"id":"PED003","disciplina":"Conhecimentos Pedagógicos","assunto":"Pensadores da Educação — Maria Montessori","dificuldade":"Fácil","enunciado":"Em uma sala inspirada na pedagogia montessoriana, é coerente que o professor","alternativas":{"A":"controle simultaneamente todas as ações dos estudantes e impeça escolhas individuais.","B":"priorize longas exposições orais, mantendo os materiais fora do alcance das crianças.","C":"organize um ambiente preparado, com materiais acessíveis e oportunidades de autonomia acompanhada.","D":"elimine atividades manipulativas para antecipar conteúdos abstratos.","E":"substitua a observação do estudante por avaliações padronizadas frequentes."},"gabarito":"C","comentario":"A alternativa C está correta. Montessori valoriza o ambiente preparado, materiais acessíveis, autonomia progressiva, atividade da criança e observação sistemática do professor. A proposta não se confunde com ausência de mediação nem com controle permanente das ações infantis.","referencia":"MONTESSORI, Maria. O Método da Pedagogia Científica; A Mente Absorvente."},{"id":"PED004","disciplina":"Conhecimentos Pedagógicos","assunto":"Pensadores da Educação — Célestin Freinet","dificuldade":"Fácil","enunciado":"Uma escola adota jornal da turma, texto livre, correspondência entre classes e projetos cooperativos. O conjunto dessas práticas se aproxima mais diretamente da proposta de","alternativas":{"A":"B. F. Skinner.","B":"Johann Herbart.","C":"Émile Durkheim.","D":"Jean Piaget.","E":"Célestin Freinet."},"gabarito":"E","comentario":"A alternativa E está correta. Freinet desenvolveu técnicas pedagógicas ligadas à expressão, à cooperação, ao trabalho e à comunicação autêntica, como texto livre, imprensa escolar e correspondência entre estudantes.","referencia":"FREINET, Célestin. As Técnicas Freinet da Escola Moderna."},{"id":"PED005","disciplina":"Conhecimentos Pedagógicos","assunto":"Pensadores da Educação — Dermeval Saviani","dificuldade":"Difícil","enunciado":"Uma rede de ensino pretende combater a falsa oposição entre transmissão de conhecimentos e formação crítica. Em uma perspectiva histórico-crítica associada a Dermeval Saviani, a ação pedagógica deve","alternativas":{"A":"dispensar os conhecimentos sistematizados, pois eles reproduzem necessariamente desigualdades.","B":"limitar-se aos interesses imediatos dos estudantes, evitando conteúdos produzidos historicamente.","C":"garantir a apropriação crítica do saber sistematizado como mediação para compreender e transformar a prática social.","D":"substituir o ensino por atividades espontâneas, sem objetivos previamente definidos.","E":"tratar o conhecimento escolar como neutro e independente das condições históricas."},"gabarito":"C","comentario":"A alternativa C está correta. A pedagogia histórico-crítica defende a socialização do conhecimento sistematizado e sua apropriação crítica pelos estudantes, entendendo o ensino como mediação no interior da prática social. As demais alternativas reduzem ou distorcem essa concepção.","referencia":"SAVIANI, Dermeval. Escola e Democracia; Pedagogia Histórico-Crítica."},{"id":"PED006","disciplina":"Conhecimentos Pedagógicos","assunto":"Teorias da aprendizagem — Behaviorismo","dificuldade":"Difícil","enunciado":"Um professor utiliza reforço positivo imediatamente após desempenhos desejados e organiza tarefas graduadas com objetivos observáveis. O fundamento teórico predominante nessa prática é o","alternativas":{"A":"construtivismo genético, centrado na equilibração.","B":"sociointeracionismo, centrado na mediação semiótica.","C":"humanismo rogeriano, centrado na congruência.","D":"behaviorismo, que analisa relações entre comportamento e contingências ambientais.","E":"cognitivismo de Ausubel, centrado em subsunçores."},"gabarito":"D","comentario":"A alternativa D está correta. O behaviorismo, especialmente em Skinner, analisa relações entre comportamento e contingências ambientais, incluindo consequências reforçadoras. As demais alternativas apresentam conceitos centrais de outras teorias da aprendizagem.","referencia":"SKINNER, B. F. Ciência e Comportamento Humano."},{"id":"PED007","disciplina":"Conhecimentos Pedagógicos","assunto":"Teorias da aprendizagem — Vygotsky","dificuldade":"Intermediária","enunciado":"Durante uma atividade, um estudante resolve parte de um problema sozinho, mas avança quando recebe perguntas orientadoras de um colega mais experiente. A situação exemplifica, em Vygotsky, sobretudo","alternativas":{"A":"o condicionamento operante.","B":"a zona de desenvolvimento proximal, na qual a mediação possibilita desempenhos ainda não realizados de forma independente.","C":"a aprendizagem por descoberta sem interação social.","D":"a maturação biológica como causa suficiente da aprendizagem.","E":"a assimilação sem acomodação."},"gabarito":"B","comentario":"A alternativa B está correta. A zona de desenvolvimento proximal refere-se à distância entre aquilo que o estudante realiza autonomamente e aquilo que consegue realizar com auxílio de outra pessoa mais experiente. Mediação social e linguagem são centrais nessa abordagem.","referencia":"VYGOTSKY, Lev S. A Formação Social da Mente."},{"id":"PED008","disciplina":"Conhecimentos Pedagógicos","assunto":"Teorias da aprendizagem — Aprendizagem significativa","dificuldade":"Difícil","enunciado":"Uma professora inicia um novo tema levantando o que os estudantes já sabem e utiliza um organizador prévio para relacionar conceitos novos a conhecimentos relevantes existentes. Segundo David Ausubel, a aprendizagem tenderá a ser significativa quando","alternativas":{"A":"o estudante memorizar literalmente o maior número possível de definições.","B":"o novo conteúdo puder relacionar-se de modo não arbitrário e substantivo a conhecimentos prévios relevantes do aprendiz.","C":"a descoberta autônoma substituir qualquer forma de exposição docente.","D":"o erro for eliminado por punição imediata.","E":"a aprendizagem ocorrer apenas depois do desenvolvimento completo das estruturas cognitivas."},"gabarito":"B","comentario":"A alternativa B está correta. Para Ausubel, a aprendizagem significativa ocorre quando novas informações se relacionam de modo não arbitrário e substantivo à estrutura cognitiva do estudante, que precisa dispor de conhecimentos prévios relevantes e estar disposto a estabelecer essas relações.","referencia":"AUSUBEL, David P. Aquisição e Retenção de Conhecimentos."},{"id":"PED009","disciplina":"Conhecimentos Pedagógicos","assunto":"Teorias da aprendizagem — Humanismo","dificuldade":"Intermediária","enunciado":"Em uma abordagem humanista inspirada em Carl Rogers, uma relação pedagógica favorecedora da aprendizagem tende a envolver","alternativas":{"A":"empatia, autenticidade e aceitação, com valorização da experiência do estudante.","B":"controle externo rígido e padronização das respostas.","C":"ênfase exclusiva em reforços materiais.","D":"negação das dimensões afetivas da aprendizagem.","E":"prioridade absoluta ao conteúdo, independentemente das necessidades do estudante."},"gabarito":"A","comentario":"A alternativa A está correta. Rogers destaca uma relação educativa marcada por empatia, congruência e consideração positiva, favorecendo autonomia e aprendizagem significativa para a pessoa. A perspectiva humanista reconhece a dimensão afetiva e experiencial do aprender.","referencia":"ROGERS, Carl. Liberdade para Aprender."},{"id":"PED010","disciplina":"Conhecimentos Pedagógicos","assunto":"Processo construtivista — papel do erro","dificuldade":"Intermediária","enunciado":"Em uma perspectiva construtivista, o erro do estudante, quando analisado pedagogicamente, deve ser compreendido principalmente como","alternativas":{"A":"prova de incapacidade fixa.","B":"indício das hipóteses e formas de raciocínio mobilizadas, podendo orientar intervenções que promovam reorganizações cognitivas.","C":"comportamento que deve ser imediatamente punido.","D":"falha sem valor diagnóstico, pois apenas a resposta final importa.","E":"evidência de que não houve qualquer aprendizagem anterior."},"gabarito":"B","comentario":"A alternativa B está correta. Em abordagens construtivistas, o erro pode revelar hipóteses, estratégias e níveis de compreensão do estudante. Sua análise ajuda o professor a planejar intervenções e desafios capazes de favorecer novas reorganizações cognitivas.","referencia":"PIAGET, Jean; estudos construtivistas aplicados à educação."},{"id":"PED011","disciplina":"Conhecimentos Pedagógicos","assunto":"Desenvolvimento da Educação — historicidade das práticas educativas","dificuldade":"Intermediária","enunciado":"Ao analisar historicamente a escolarização, uma equipe conclui que práticas pedagógicas não surgem isoladamente, pois se relacionam a concepções de sociedade, conhecimento e formação humana. Essa conclusão é adequada porque","alternativas":{"A":"as práticas escolares são universais e independem de condições históricas.","B":"a educação muda apenas quando a tecnologia muda.","C":"o desenvolvimento educacional pode ser explicado exclusivamente por características individuais dos docentes.","D":"as formas de educação são historicamente situadas e se transformam em interação com mudanças sociais, culturais, políticas e econômicas.","E":"a história da educação deve limitar-se à cronologia de leis."},"gabarito":"D","comentario":"A alternativa D está correta. A educação é uma prática social historicamente situada. Instituições, finalidades, currículos e métodos de ensino se transformam em relação com processos sociais, culturais, políticos e econômicos mais amplos.","referencia":"Edital nº 001/2026 SEPLAD/SEDUC-PA, Anexo V — Conhecimentos Pedagógicos; História da Educação."},{"id":"PED012","disciplina":"Conhecimentos Pedagógicos","assunto":"Desenvolvimento da Educação — organização da escola moderna","dificuldade":"Fácil","enunciado":"Entre características historicamente associadas à consolidação da escola moderna, destaca-se","alternativas":{"A":"a organização sistemática do ensino em tempos, espaços, currículos e grupos de estudantes.","B":"a eliminação de qualquer currículo comum.","C":"a inexistência de profissionais especializados em ensinar.","D":"a recusa de registros e avaliações escolares.","E":"a substituição da instituição escolar pela aprendizagem exclusivamente doméstica."},"gabarito":"A","comentario":"A alternativa A está correta. A escolarização moderna consolidou formas institucionais de organização do ensino, com currículos, tempos, espaços, turmas, profissionais e procedimentos relativamente sistematizados.","referencia":"História da Educação e organização escolar."},{"id":"PED013","disciplina":"Conhecimentos Pedagógicos","assunto":"Desenvolvimento da Educação — democratização do ensino","dificuldade":"Intermediária","enunciado":"A expansão do acesso à escola, por si só, não assegura democratização plena da educação. Em termos pedagógicos, uma política de democratização exige também","alternativas":{"A":"reduzir o currículo aos conteúdos mínimos para estudantes de grupos vulneráveis.","B":"separar estudantes segundo expectativas de desempenho.","C":"promover condições de permanência, participação e aprendizagem com qualidade e equidade.","D":"substituir o ensino por assistência social.","E":"eliminar critérios públicos de acompanhamento da aprendizagem."},"gabarito":"C","comentario":"A alternativa C está correta. Democratização educacional envolve não apenas acesso, mas também condições de permanência, participação, aprendizagem e enfrentamento de barreiras e desigualdades. Reduzir expectativas para determinados grupos tende a reproduzir exclusões.","referencia":"Função social da escola; democratização da educação."},{"id":"PED014","disciplina":"Conhecimentos Pedagógicos","assunto":"Organização do Trabalho Pedagógico Coletivo","dificuldade":"Fácil","enunciado":"Em uma escola, o horário coletivo é usado apenas para avisos administrativos. Para aproximá-lo de uma organização pedagógica coletiva, a gestão deveria priorizar","alternativas":{"A":"o preenchimento individual de formulários sem discussão.","B":"a divulgação de ordens já definidas pela direção.","C":"a substituição do planejamento docente por roteiros externos.","D":"o estudo de evidências de aprendizagem, o planejamento conjunto, a reflexão sobre práticas e a definição compartilhada de ações.","E":"a competição entre professores por resultados de turma."},"gabarito":"D","comentario":"A alternativa D está correta. O trabalho pedagógico coletivo requer espaços de estudo, análise de evidências, planejamento conjunto, reflexão e tomada de decisão compartilhada. Reuniões restritas a informes administrativos não cumprem plenamente essa função.","referencia":"Organização do Trabalho Pedagógico Coletivo."},{"id":"PED015","disciplina":"Conhecimentos Pedagógicos","assunto":"Organização do Trabalho Pedagógico Coletivo — corresponsabilidade","dificuldade":"Intermediária","enunciado":"Uma equipe identifica queda persistente na aprendizagem de leitura em várias turmas. Em vez de atribuir o problema a um único professor, decide analisar dados, observar práticas, planejar intervenções comuns e acompanhar resultados. Essa decisão expressa","alternativas":{"A":"centralização burocrática.","B":"individualização da responsabilidade pedagógica.","C":"corresponsabilidade e ação colaborativa sobre problemas de aprendizagem.","D":"neutralidade curricular.","E":"avaliação classificatória."},"gabarito":"C","comentario":"A alternativa C está correta. Problemas coletivos de aprendizagem requerem análise institucional e ação colaborativa. A corresponsabilidade não elimina responsabilidades profissionais individuais, mas impede explicações simplistas e favorece intervenções articuladas.","referencia":"Organização do Trabalho Pedagógico Coletivo; gestão pedagógica."},{"id":"PED016","disciplina":"Conhecimentos Pedagógicos","assunto":"Organização do Trabalho Pedagógico Coletivo — diálogo e decisão","dificuldade":"Fácil","enunciado":"No trabalho pedagógico coletivo, o consenso deve ser entendido como","alternativas":{"A":"obrigação de todos aceitarem a primeira proposta da direção.","B":"resultado possível de diálogo e negociação, sem eliminar o direito ao dissenso fundamentado.","C":"ausência de divergências entre profissionais.","D":"substituição de decisões pedagógicas por votação em qualquer situação.","E":"recusa de critérios técnicos para preservar a harmonia."},"gabarito":"B","comentario":"A alternativa B está correta. O trabalho coletivo democrático reconhece divergências e utiliza diálogo, argumentação e critérios pedagógicos para construir decisões. Consenso não significa silenciamento do dissenso.","referencia":"Organização do Trabalho Pedagógico Coletivo."},{"id":"PED017","disciplina":"Conhecimentos Pedagógicos","assunto":"Processo Construtivista de Escolarização — sujeito ativo","dificuldade":"Fácil","enunciado":"Em uma perspectiva construtivista, o estudante é concebido como","alternativas":{"A":"receptor passivo de informações.","B":"resultado exclusivo de reforços externos.","C":"sujeito que aprende apenas por imitação.","D":"indivíduo cujo desenvolvimento independe das experiências.","E":"sujeito ativo que constrói e reorganiza conhecimentos em interação com objetos, situações e outras pessoas."},"gabarito":"E","comentario":"A alternativa E está correta. O construtivismo compreende o aprendiz como sujeito ativo, que formula hipóteses, enfrenta problemas, coordena ações e reorganiza seus conhecimentos. Isso não elimina a intencionalidade nem a mediação docente.","referencia":"PIAGET, Jean; construtivismo aplicado à escolarização."},{"id":"PED018","disciplina":"Conhecimentos Pedagógicos","assunto":"Processo Construtivista de Escolarização — situações-problema","dificuldade":"Fácil","enunciado":"Uma atividade coerente com o construtivismo deve, prioritariamente,","alternativas":{"A":"fornecer a solução antes que o estudante examine o problema.","B":"evitar conflitos cognitivos para reduzir erros.","C":"usar somente tarefas idênticas para todos, independentemente das hipóteses dos estudantes.","D":"considerar correta qualquer resposta, dispensando critérios conceituais.","E":"propor desafios compatíveis com os conhecimentos dos estudantes, permitindo investigação, argumentação e revisão de hipóteses."},"gabarito":"E","comentario":"A alternativa E está correta. Situações-problema podem promover desequilíbrios produtivos e reorganização dos conhecimentos. Construtivismo não significa ausência de critérios, de ensino ou de intervenção docente.","referencia":"PIAGET, Jean; processo construtivista de escolarização."},{"id":"PED019","disciplina":"Conhecimentos Pedagógicos","assunto":"Processo Construtivista de Escolarização — mediação docente","dificuldade":"Intermediária","enunciado":"Um professor afirma: “Se a aprendizagem é construtiva, não devo explicar nada; basta deixar os alunos descobrirem sozinhos”. Essa afirmação é","alternativas":{"A":"inadequada, porque construtivismo não exclui intervenção docente; o professor organiza situações, oferece informações, questiona e media a construção do conhecimento.","B":"adequada, porque qualquer explicação impede a construção ativa.","C":"adequada, desde que o professor aplique uma prova ao final.","D":"inadequada apenas porque todo conteúdo deve ser memorizado antes de ser compreendido.","E":"adequada, pois interação social não interfere na aprendizagem."},"gabarito":"A","comentario":"A alternativa A está correta. Construtivismo não é sinônimo de espontaneísmo. O professor organiza experiências, problemas e interações, apresenta informações quando necessário e intervém intencionalmente para favorecer avanços conceituais.","referencia":"Construtivismo e mediação pedagógica."},{"id":"PED020","disciplina":"Conhecimentos Pedagógicos","assunto":"Processo Construtivista de Escolarização — conflito cognitivo","dificuldade":"Difícil","enunciado":"Em uma sequência de Matemática, diferentes estudantes usam estratégias distintas para resolver o mesmo problema. A professora solicita que comparem procedimentos, expliquem justificativas e revejam soluções. A principal contribuição construtivista dessa intervenção é","alternativas":{"A":"homogeneizar rapidamente todos os procedimentos.","B":"substituir o conhecimento matemático por opiniões pessoais.","C":"transformar estratégias dos estudantes em objeto de reflexão, favorecendo descentração e reorganização cognitiva.","D":"eliminar a necessidade de critérios para validar soluções.","E":"garantir que o professor não participe da construção do conhecimento."},"gabarito":"C","comentario":"A alternativa C está correta. O confronto argumentado entre estratégias pode favorecer tomada de consciência, descentração e reorganização de esquemas. A diversidade de procedimentos é explorada pedagogicamente sem relativizar a validade dos conceitos
