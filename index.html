86/2025, com redação dada pelo Decreto nº 12.773/2025, assegura o direito do público da educação especial à inclusão em classes e escolas comuns, com apoio necessário à participação, permanência e aprendizagem. O AEE não substitui a escolarização comum.","referencia":"Decreto nº 12.686/2025, art. 1º, § 3º, com redação dada pelo Decreto nº 12.773/2025."},{"id":"PED099","disciplina":"Conhecimentos Pedagógicos","assunto":"Atendimento Educacional Especializado — objetivos","dificuldade":"Fácil","enunciado":"Entre os objetivos do Atendimento Educacional Especializado, encontra-se","alternativas":{"A":"substituir a frequência à classe comum.","B":"realizar reforço escolar genérico para qualquer estudante com baixo rendimento.","C":"produzir diagnóstico clínico como condição de acesso ao serviço.","D":"desenvolver e organizar recursos pedagógicos e de acessibilidade que assegurem acesso, permanência, aprendizagem e participação do público da educação especial.","E":"repetir obrigatoriamente os mesmos conteúdos da classe comum."},"gabarito":"D","comentario":"A alternativa D está correta. O Decreto nº 12.686/2025 estabelece como objetivo do AEE desenvolver e organizar recursos pedagógicos e de acessibilidade que assegurem acesso, permanência, aprendizagem e participação. O AEE não é reforço genérico nem atendimento clínico.","referencia":"Decreto nº 12.686/2025, art. 6º, especialmente incisos I a IV."},{"id":"PED100","disciplina":"Conhecimentos Pedagógicos","assunto":"Atendimento Educacional Especializado — relação com a classe comum","dificuldade":"Fácil","enunciado":"Uma escola afirma que um estudante com deficiência pode frequentar apenas o AEE, pois esse serviço “já dá conta da aprendizagem”. A afirmação é","alternativas":{"A":"correta quando o AEE ocorre cinco vezes por semana.","B":"incorreta, porque a matrícula no AEE não pode substituir a matrícula e a frequência na classe comum.","C":"correta se a família concordar.","D":"correta em qualquer etapa da educação básica.","E":"incorreta apenas para estudantes com altas habilidades."},"gabarito":"B","comentario":"A alternativa B está correta. A norma vigente é expressa ao determinar que a matrícula no AEE não pode substituir matrícula e frequência na classe comum. O AEE integra a política de apoio à escolarização inclusiva.","referencia":"Decreto nº 12.686/2025, art. 8º."},{"id":"PED101","disciplina":"Conhecimentos Pedagógicos","assunto":"Atendimento Educacional Especializado — caráter complementar e suplementar","dificuldade":"Difícil","enunciado":"Na política nacional vigente de educação especial inclusiva, o Atendimento Educacional Especializado é definido como atividade pedagógica","alternativas":{"A":"destinada a qualquer estudante com nota abaixo da média, independentemente de outras condições.","B":"exclusiva de estudantes com deficiência física.","C":"restrita ao ensino fundamental.","D":"condicionada à apresentação de laudo médico.","E":"complementar à escolarização de pessoas com deficiência e transtorno do espectro autista e suplementar à escolarização de pessoas com altas habilidades ou superdotação."},"gabarito":"E","comentario":"A alternativa E está correta e reproduz o núcleo do art. 5º do Decreto nº 12.686/2025. Além disso, a garantia do AEE não pode ser condicionada à exigência de diagnóstico, laudo ou documento emitido por profissional de saúde.","referencia":"Decreto nº 12.686/2025, arts. 5º e 11, § 7º, texto consolidado."},{"id":"PED102","disciplina":"Conhecimentos Pedagógicos","assunto":"Atendimento Educacional Especializado — articulação com sala comum","dificuldade":"Intermediária","enunciado":"A professora do AEE identifica que um estudante utiliza comunicação aumentativa e alternativa com bom resultado. A ação mais adequada é","alternativas":{"A":"restringir o recurso à sala de AEE para preservar a especialização do atendimento.","B":"substituir todas as atividades da sala comum por tarefas do AEE.","C":"usar o recurso apenas em avaliações.","D":"aguardar autorização clínica para qualquer uso pedagógico.","E":"articular-se com os professores da classe comum para que o recurso apoie participação e aprendizagem nos diferentes contextos escolares."},"gabarito":"E","comentario":"A alternativa E está correta. O AEE deve articular recursos e estratégias com o cotidiano da classe comum e das demais atividades escolares. Recursos de acessibilidade não devem ficar confinados ao espaço do atendimento especializado.","referencia":"Decreto nº 12.686/2025, arts. 6º e 12, texto consolidado pelo Decreto nº 12.773/2025."},{"id":"PED103","disciplina":"Conhecimentos Pedagógicos","assunto":"Desenho Universal para a Aprendizagem — DUA","dificuldade":"Intermediária","enunciado":"Em uma sequência didática, a professora oferece texto, áudio e representação visual do mesmo conteúdo; permite diferentes formas de demonstrar aprendizagem e utiliza estratégias variadas de engajamento. Essa organização se aproxima do DUA porque","alternativas":{"A":"planeja desde o início múltiplos meios de representação, ação e expressão e engajamento para reduzir barreiras à aprendizagem.","B":"cria um currículo completamente diferente para cada estudante.","C":"elimina objetivos comuns de aprendizagem.","D":"substitui adaptações individualizadas em todos os casos.","E":"dispensa avaliação da aprendizagem."},"gabarito":"A","comentario":"A alternativa A está correta. O DUA busca antecipar a variabilidade dos aprendizes e reduzir barreiras por meio de múltiplos meios de engajamento, representação e ação e expressão. Isso não elimina objetivos comuns nem a necessidade de apoios individualizados quando forem necessários.","referencia":"CAST. Universal Design for Learning Guidelines, versão 3.0; Edital nº 001/2026 SEPLAD/SEDUC-PA, Anexo V."},{"id":"PED104","disciplina":"Conhecimentos Pedagógicos","assunto":"Adaptações e flexibilização curricular","dificuldade":"Intermediária","enunciado":"Uma adaptação curricular é pedagogicamente adequada quando","alternativas":{"A":"reduz automaticamente o nível de exigência sempre que há deficiência.","B":"ajusta meios, recursos, tempos ou formas de participação de acordo com barreiras e necessidades, preservando tanto quanto possível os objetivos essenciais.","C":"retira o estudante permanentemente das atividades da turma.","D":"substitui qualquer avaliação por presença.","E":"é feita sem observar o desempenho real do estudante."},"gabarito":"B","comentario":"A alternativa B está correta. Adaptações e flexibilizações devem responder a barreiras e necessidades concretas e ampliar o acesso ao currículo. Elas não se confundem com empobrecimento curricular automático nem com exclusão das experiências comuns.","referencia":"Lei nº 13.146/2015, art. 28; Decreto nº 12.686/2025 — adaptações razoáveis."},{"id":"PED105","disciplina":"Conhecimentos Pedagógicos","assunto":"Recursos de acessibilidade","dificuldade":"Fácil","enunciado":"Em uma aula, um estudante cego recebe com antecedência material digital compatível com leitor de tela e descrições textuais das informações visuais essenciais. A medida é exemplo de","alternativas":{"A":"acessibilidade pedagógica e comunicacional voltada a garantir acesso ao currículo.","B":"avaliação somativa diferenciada.","C":"segregação instrucional.","D":"substituição do currículo comum.","E":"redução de objetivos cognitivos."},"gabarito":"A","comentario":"A alternativa A está correta. Tornar materiais compatíveis com tecnologias de acesso e descrever informações visuais relevantes remove barreiras e amplia participação, sem exigir redução dos objetivos cognitivos da atividade.","referencia":"Lei nº 13.146/2015, arts. 27 e 28; acessibilidade educacional."},{"id":"PED106","disciplina":"Conhecimentos Pedagógicos","assunto":"Tecnologia assistiva","dificuldade":"Intermediária","enunciado":"Assinale a situação que melhor exemplifica tecnologia assistiva em contexto escolar.","alternativas":{"A":"Uso de projetor multimídia para exibir um vídeo a toda a turma.","B":"Uso de aplicativo de mensagens pela coordenação para avisos gerais.","C":"Uso de planilha eletrônica pelo professor para calcular médias.","D":"Uso de plataforma de exercícios por todos os estudantes.","E":"Uso de dispositivo de comunicação aumentativa e alternativa por estudante que necessita desse recurso para se expressar e participar das atividades."},"gabarito":"E","comentario":"A alternativa E está correta. A Lei Brasileira de Inclusão define tecnologia assistiva como produtos, equipamentos, dispositivos, recursos, metodologias, estratégias, práticas e serviços destinados a promover funcionalidade, autonomia e participação da pessoa com deficiência ou mobilidade reduzida. Nem toda tecnologia educacional é tecnologia assistiva.","referencia":"Lei nº 13.146/2015, art. 3º, inciso III."},{"id":"PED107","disciplina":"Conhecimentos Pedagógicos","assunto":"DUA e adaptações individualizadas","dificuldade":"Difícil","enunciado":"Uma escola afirma que, por adotar DUA, não precisa mais oferecer adaptações individualizadas. Essa conclusão é","alternativas":{"A":"correta, porque o DUA elimina toda variabilidade individual.","B":"correta apenas no ensino médio.","C":"incorreta, porque o planejamento universal reduz muitas barreiras, mas alguns estudantes ainda podem necessitar de apoios, adaptações razoáveis ou recursos individualizados.","D":"correta se houver tecnologia digital.","E":"incorreta somente quando há deficiência física."},"gabarito":"C","comentario":"A alternativa C está correta. O DUA procura tornar o planejamento mais acessível desde o início, mas não elimina a necessidade de adaptações razoáveis, tecnologia assistiva ou outros apoios individualizados quando forem necessários para assegurar participação e aprendizagem.","referencia":"CAST. Universal Design for Learning Guidelines; Lei nº 13.146/2015, arts. 3º e 28."},{"id":"PED108","disciplina":"Conhecimentos Pedagógicos","assunto":"Estratégias inclusivas — deficiência visual","dificuldade":"Intermediária","enunciado":"Em uma atividade de análise de gráficos, há um estudante cego. A melhor estratégia é","alternativas":{"A":"dispensá-lo da atividade.","B":"fornecer apenas uma explicação oral genérica.","C":"trocar o conteúdo por tarefa mais simples.","D":"oferecer representação acessível, como descrição estruturada, dados em formato compatível e, quando pertinente, recursos táteis, mantendo o objetivo conceitual.","E":"avaliar somente participação."},"gabarito":"D","comentario":"A alternativa D está correta. A estratégia deve remover a barreira de acesso à representação gráfica sem reduzir o objetivo cognitivo. Descrição estruturada, dados acessíveis e recursos táteis podem permitir análise equivalente por vias adequadas.","referencia":"Educação Inclusiva — recursos de acessibilidade para estudantes com deficiência visual."},{"id":"PED109","disciplina":"Conhecimentos Pedagógicos","assunto":"Estratégias inclusivas — transtorno do espectro autista","dificuldade":"Fácil","enunciado":"Um estudante com transtorno do espectro autista apresenta dificuldade diante de mudanças inesperadas na rotina escolar. Uma estratégia pedagógica adequada é","alternativas":{"A":"evitar qualquer mudança durante todo o ano.","B":"antecipar alterações quando possível, utilizar pistas visuais ou explicações claras e ensinar gradualmente estratégias de adaptação.","C":"retirar o estudante de todas as atividades coletivas.","D":"usar punição para reduzir reações à mudança.","E":"ignorar a necessidade de previsibilidade."},"gabarito":"B","comentario":"A alternativa B está correta. Antecipação, clareza e suportes visuais podem reduzir barreiras relacionadas à previsibilidade, enquanto o estudante desenvolve recursos para lidar com mudanças. A intervenção deve ser individualizada e não implicar isolamento.","referencia":"Educação Inclusiva — estratégias pedagógicas para estudantes com transtorno do espectro autista."},{"id":"PED110","disciplina":"Conhecimentos Pedagógicos","assunto":"Estratégias inclusivas — transtornos funcionais específicos","dificuldade":"Intermediária","enunciado":"Um estudante com transtorno específico da aprendizagem com prejuízo persistente na leitura apresenta dificuldades para avançar no componente. A intervenção escolar mais adequada é","alternativas":{"A":"oferecer ensino explícito e sistemático das habilidades envolvidas, acompanhar o progresso e disponibilizar apoios de acesso quando necessários.","B":"aguardar que a dificuldade desapareça espontaneamente.","C":"reduzir permanentemente todas as expectativas curriculares.","D":"substituir leitura por atividades exclusivamente orais.","E":"atribuir a dificuldade à falta de esforço."},"gabarito":"A","comentario":"A alternativa A está correta. Dificuldades específicas de aprendizagem requerem intervenção pedagógica sistemática, acompanhamento e apoios de acesso ao currículo. Não justificam culpabilização, espera passiva nem redução automática de todas as expectativas.","referencia":"Edital nº 001/2026 SEPLAD/SEDUC-PA, Anexo V — transtornos funcionais específicos; literatura educacional sobre transtornos específicos da aprendizagem."},{"id":"PED111","disciplina":"Conhecimentos Pedagógicos","assunto":"Estratégias inclusivas — altas habilidades ou superdotação","dificuldade":"Fácil","enunciado":"Para um estudante com altas habilidades que já domina conteúdos previstos para determinada unidade, a resposta pedagógica mais adequada é","alternativas":{"A":"mantê-lo repetindo exercícios idênticos para ocupar o tempo.","B":"usá-lo permanentemente como monitor dos colegas.","C":"oferecer enriquecimento, aprofundamento e desafios compatíveis com seu nível de desenvolvimento, considerando interesses e necessidades.","D":"retirá-lo de todas as atividades coletivas.","E":"presumir que não precisa de acompanhamento pedagógico."},"gabarito":"C","comentario":"A alternativa C está correta. Estudantes com altas habilidades ou superdotação integram o público da educação especial e podem necessitar de enriquecimento e suplementação de sua escolarização. Alto desempenho em determinados domínios não elimina necessidades educacionais.","referencia":"Decreto nº 12.686/2025, arts. 1º e 5º; educação de estudantes com altas habilidades ou superdotação."},{"id":"PED112","disciplina":"Conhecimentos Pedagógicos","assunto":"Estratégias inclusivas — diferenciação sem segregação","dificuldade":"Intermediária","enunciado":"Em uma turma heterogênea, o professor organiza diferentes níveis de apoio e complexidade dentro de uma mesma situação-problema, permitindo que todos trabalhem o mesmo conceito central. Essa estratégia","alternativas":{"A":"viola a equidade por não oferecer tarefas idênticas.","B":"é segregadora porque reconhece diferenças.","C":"impede avaliação comparável.","D":"só é válida para estudantes com laudo.","E":"constitui diferenciação pedagógica inclusiva, pois ajusta caminhos e apoios sem necessariamente separar os estudantes do objetivo comum."},"gabarito":"E","comentario":"A alternativa E está correta. Equidade não exige uniformidade de meios. A diferenciação pode ampliar o acesso a objetivos comuns por meio de apoios, recursos e desafios variados, evitando tanto homogeneização quanto segregação desnecessária.","referencia":"Educação Inclusiva; diferenciação pedagógica."},{"id":"PED113","disciplina":"Conhecimentos Pedagógicos","assunto":"Avaliação inclusiva","dificuldade":"Fácil","enunciado":"Uma estudante com deficiência motora compreende o conteúdo, mas tem grande dificuldade para registrar respostas manuscritas no tempo padrão. Se a habilidade avaliada não é a escrita manual, a medida mais adequada é","alternativas":{"A":"permitir forma alternativa de resposta ou tecnologia assistiva que preserve o construto avaliado.","B":"reduzir a nota máxima da estudante.","C":"dispensá-la de qualquer avaliação.","D":"avaliar apenas comportamento.","E":"manter obrigatoriamente a escrita manual para garantir igualdade."},"gabarito":"A","comentario":"A alternativa A está correta. A avaliação inclusiva procura medir a aprendizagem pretendida sem que uma barreira irrelevante distorça o resultado. Uma acomodação adequada modifica o meio de resposta sem alterar indevidamente o que está sendo avaliado.","referencia":"Lei nº 13.146/2015, art. 28; avaliação inclusiva."},{"id":"PED114","disciplina":"Conhecimentos Pedagógicos","assunto":"Legislação vigente — educação especial inclusiva","dificuldade":"Intermediária","enunciado":"Segundo a política nacional vigente de educação especial inclusiva, é diretriz","alternativas":{"A":"ofertar educação especial apenas em instituições segregadas.","B":"limitar o AEE ao ensino fundamental.","C":"condicionar acesso ao currículo comum a laudo médico.","D":"dispensar adaptações razoáveis quando houver AEE.","E":"assegurar acesso, participação, permanência e aprendizagem em classes comuns, oferta de AEE e adaptações razoáveis nos diferentes níveis, etapas e modalidades."},"gabarito":"E","comentario":"A alternativa E está correta. O Decreto nº 12.686/2025, consolidado após as alterações do Decreto nº 12.773/2025, prevê sistema educacional inclusivo, participação em classes comuns, AEE e adaptações razoáveis. A oferta do AEE não é condicionada a laudo de saúde.","referencia":"Decreto nº 12.686/2025, arts. 3º, 5º e 11, § 7º, com alterações do Decreto nº 12.773/2025."},{"id":"PED115","disciplina":"Conhecimentos Pedagógicos","assunto":"Legislação vigente — Lei Brasileira de Inclusão","dificuldade":"Intermediária","enunciado":"A Lei Brasileira de Inclusão estabelece, no campo educacional, que o poder público deve","alternativas":{"A":"garantir sistema inclusivo apenas na educação básica.","B":"assegurar sistema educacional inclusivo em todos os níveis e condições de acesso, permanência, participação e aprendizagem, com serviços e recursos de acessibilidade.","C":"substituir o ensino comum por serviços especializados.","D":"restringir adaptações razoáveis a instituições privadas.","E":"condicionar recursos de acessibilidade ao desempenho escolar."},"gabarito":"B","comentario":"A alternativa B está correta. Os arts. 27 e 28 da Lei nº 13.146/2015 asseguram sistema educacional inclusivo em todos os níveis e determinam medidas voltadas ao acesso, permanência, participação e aprendizagem, incluindo recursos de acessibilidade e serviços necessários à inclusão.","referencia":"Lei nº 13.146/2015, arts. 27 e 28."},{"id":"PED116","disciplina":"Conhecimentos Pedagógicos","assunto":"Avaliação diagnóstica","dificuldade":"Fácil","enunciado":"No início de uma unidade, o professor aplica uma tarefa para identificar conhecimentos prévios e dificuldades, sem atribuir nota. A função predominante dessa avaliação é","alternativas":{"A":"certificadora.","B":"classificatória.","C":"somativa.","D":"diagnóstica, pois produz informações para orientar o planejamento das intervenções.","E":"punitiva."},"gabarito":"D","comentario":"A alternativa D está correta. A avaliação diagnóstica investiga o ponto de partida dos estudantes e subsidia decisões sobre retomadas, objetivos, agrupamentos e apoios pedagógicos.","referencia":"Avaliação da aprendizagem — avaliação diagnóstica."},{"id":"PED117","disciplina":"Conhecimentos Pedagógicos","assunto":"Avaliação mediadora e formativa","dificuldade":"Intermediária","enunciado":"Uma professora recolhe respostas rápidas durante a aula, identifica um erro conceitual recorrente, conversa com os estudantes sobre seus raciocínios e modifica a atividade seguinte. Em uma perspectiva de avaliação mediadora, essa prática é adequada porque","alternativas":{"A":"a avaliação acompanha o processo, interpreta as manifestações dos estudantes e subsidia intervenções que favorecem novas aprendizagens.","B":"a avaliação deve apenas registrar resultados para classificação.","C":"o diálogo com o estudante compromete a objetividade e deve ser evitado.","D":"o erro precisa ser convertido imediatamente em nota.","E":"a avaliação mediadora ocorre somente ao fim de um período letivo."},"gabarito":" const REQUIRED_FIELDS = Object.freeze(['id','disciplina','assunto','dificuldade','enunciado','alternativas','gabarito','comentario','referencia']);

function normalizeText(value = '') {
  return String(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function expectedIds(prefix, count) {
  return Array.from({length: count}, (_, i) => `${prefix}${String(i + 1).padStart(3, '0')}`);
}

function validateQuestion(q, descriptor, index, seenIds) {
  const issues = [];
  const id = q && typeof q === 'object' ? q.id : null;
  if (!q || typeof q !== 'object' || Array.isArray(q)) return [{ id: id || `(posição ${index})`, type: 'registro não é objeto' }];
  for (const field of REQUIRED_FIELDS) if (!(field in q)) issues.push({ id: id || `(posição ${index})`, type: `campo ausente: ${field}` });
  if (typeof q.id !== 'string' || !q.id.trim()) issues.push({ id: id || `(posição ${index})`, type: 'id vazio/inválido' });
  else {
    if (!new RegExp(`^${descriptor.prefix}\\d{3}$`).test(q.id)) issues.push({ id: q.id, type: `id fora do padrão ${descriptor.prefix}001–${descriptor.prefix}125` });
    if (seenIds.has(q.id)) issues.push({ id: q.id, type: 'id duplicado' });
  }
  if (String(q.disciplina || '').trim() !== descriptor.disciplina) issues.push({ id: id || `(posição ${index})`, type: `disciplina incompatível com o banco: ${q.disciplina || 'vazia'}` });
  if (!VALID_DIFFICULTIES.has(q.dificuldade)) issues.push({ id: id || `(posição ${index})`, type: 'dificuldade inválida' });
  const altObject = q.alternativas && typeof q.alternativas === 'object' && !Array.isArray(q.alternativas) ? q.alternativas : null;
  const altKeys = altObject ? Object.keys(altObject).sort() : [];
  if (altKeys.length !== 5 || altKeys.join('') !== 'ABCDE') issues.push({ id: id || `(posição ${index})`, type: 'alternativas devem conter exatamente A, B, C, D e E' });
  if (altObject) for (const letter of ALT_LETTERS) if (!String(altObject[letter] || '').trim()) issues.push({ id: id || `(posição ${index})`, type: `alternativa ${letter} vazia` });
  if (!ALT_SET.has(q.gabarito)) issues.push({ id: id || `(posição ${index})`, type: 'gabarito inválido' });
  else if (!altObject || !(q.gabarito in altObject)) issues.push({ id: id || `(posição ${index})`, type: 'alternativa indicada pelo gabarito não existe' });
  for (const field of ['disciplina','assunto','enunciado','comentario','referencia']) if (!String(q[field] || '').trim()) issues.push({ id: id || `(posição ${index})`, type: `${field} vazio` });
  return issues;
}

function loadQuestionBank() {
  const questions = [];
  const seenIds = new Set();
  const report = [];
  const globalIssues = [];
  for (const descriptor of BANK_DESCRIPTORS) {
    const source = EMBEDDED_BANKS[descriptor.key];
    const localIssues = [];
    if (!Array.isArray(source)) {
      localIssues.push({ id: '—', type: 'origem incorporada não é um array' });
      report.push({ ...descriptor, sourceCount: 0, valid: 0, invalid: 0, missingIds: expectedIds(descriptor.prefix, descriptor.expected), issues: localIssues, loaded: false });
      continue;
    }
    if (source.length !== descriptor.expected) localIssues.push({ id: '—', type: `quantidade de registros: ${source.length}; esperado: ${descriptor.expected}` });
    const idsInSource = source.map(q => q?.id).filter(id => typeof id === 'string');
    const idSet = new Set(idsInSource);
    const missingIds = expectedIds(descriptor.prefix, descriptor.expected).filter(id => !idSet.has(id));
    for (const missing of missingIds) localIssues.push({ id: missing, type: 'id ausente na sequência esperada' });

    let valid = 0;
    let invalid = 0;
    source.forEach((q, index) => {
      const issues = validateQuestion(q, descriptor, index, seenIds);
      if (issues.length) {
        invalid++;
        localIssues.push(...issues);
      } else {
        seenIds.add(q.id);
        questions.push(q);
        valid++;
      }
    });

    const result = { ...descriptor, sourceCount: source.length, valid, invalid, missingIds, issues: localIssues, loaded: true };
    report.push(result);
    globalIssues.push(...localIssues.map(issue => ({ ...issue, origin: descriptor.origin })));
  }

  if (questions.length !== 500) globalIssues.push({ id: '—', origin: 'conjunto total', type: `total válido ${questions.length}; esperado 500` });
  const uniqueCount = new Set(questions.map(q => q.id)).size;
  if (uniqueCount !== questions.length) globalIssues.push({ id: '—', origin: 'conjunto total', type: 'existem IDs duplicados entre os bancos' });

  if (globalIssues.length) {
    console.group('Validação do banco TREINA SEDUC-PA');
    for (const issue of globalIssues) console.error({ ID: issue.id, erro: issue.type, origem: issue.origin });
    console.groupEnd();
  } else {
    console.info('Validação do banco TREINA SEDUC-PA: 500/500 registros válidos; 125 POR, 125 RLM, 125 ATU e 125 PED.');
  }
  return { questions, report, issues: globalIssues, ok: globalIssues.length === 0 && questions.length === 500 };
}

function getBankMetadata(questions) {
  const map = new Map();
  for (const q of questions) {
    if (!map.has(q.disciplina)) map.set(q.disciplina, { disciplina: q.disciplina, count: 0, assuntos: new Set() });
    const row = map.get(q.disciplina);
    row.count++;
    row.assuntos.add(q.assunto);
  }
  return BANK_DESCRIPTORS.map(d => map.get(d.disciplina)).filter(Boolean).map(row => ({ ...row, assuntos: [...row.assuntos].sort((a,b) => a.localeCompare(b,'pt-BR')) }));
}

function getFilterOptions(questions, partial = {}) {
  let base = questions;
  if (partial.disciplina) base = base.filter(q => q.disciplina === partial.disciplina);
  const assuntos = [...new Set(base.map(q => q.assunto).filter(Boolean))].sort((a,b) => a.localeCompare(b,'pt-BR'));
  return { disciplinas: BANK_DESCRIPTORS.map(d => d.disciplina), assuntos };
}

function searchableQuestionText(q) {
  return normalizeText([q.id,q.disciplina,q.assunto,q.enunciado,q.comentario,q.referencia].join(' '));
}

/* ===== STORAGE ===== */
const STORES = Object.freeze({
  attempts: { keyPath: 'attemptId' },
  questionStats: { keyPath: 'questionId' },
  favorites: { keyPath: 'questionId' },
  trainingHistory: { keyPath: 'id' },
  examHistory: { keyPath: 'id' },
  activeSessions: { keyPath: 'type' }
});

const storageState = { mode: 'initializing', db: null, fallback: null, warning: '' };

function blankFallback() {
  return Object.fromEntries(Object.keys(STORES).map(name => [name, {}]));
}

function loadFallbackData() {
  try {
    const raw = localStorage.getItem(FALLBACK_STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    const base = blankFallback();
    if (parsed && typeof parsed === 'object') for (const name of Object.keys(STORES)) if (parsed[name] && typeof parsed[name] === 'object') base[name] = parsed[name];
    return base;
  } catch { return blankFallback(); }
}

function persistFallbackData() {
  if (storageState.mode === 'memory') return;
  try { localStorage.setItem(FALLBACK_STORAGE_KEY, JSON.stringify(storageState.fallback)); }
  catch {
    storageState.mode = 'memory';
    storageState.warning = 'O armazenamento persistente está indisponível. O progresso desta sessão pode ser perdido ao fechar a página.';
  }
}

async function initStorage() {
  if (storageState.mode !== 'initializing') return storageState.mode;
  if (typeof indexedDB === 'undefined') {
    storageState.mode = 'localStorage'; storageState.fallback = loadFallbackData();
    storageState.warning = 'IndexedDB indisponível. A plataforma está usando armazenamento local alternativo.';
    return storageState.mode;
  }
  try {
    storageState.db = await new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = () => {
        const db = request.result;
        for (const [name, cfg] of Object.entries(STORES)) if (!db.objectStoreNames.contains(name)) db.createObjectStore(name, cfg);
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('Falha ao abrir IndexedDB.'));
      request.onblocked = () => console.warn('IndexedDB bloqueado por outra aba.');
    });
    storageState.mode = 'indexedDB';
  } catch (error) {
    console.warn('IndexedDB indisponível; usando fallback.', error);
    storageState.mode = 'localStorage'; storageState.fallback = loadFallbackData();
    storageState.warning = 'IndexedDB indisponível. A plataforma está usando armazenamento local alternativo.';
  }
  return storageState.mode;
}

async function idbRequest(storeName, mode, action) {
  const db = storageState.db;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, mode);
    const store = tx.objectStore(storeName);
    let request;
    let result;
    try { request = action(store); }
    catch (error) { reject(error); return; }
    if (request && 'onsuccess' in request) {
      request.onsuccess = () => { result = request.result; };
      request.onerror = () => reject(request.error || tx.error);
    } else result = request;
    tx.oncomplete = () => resolve(result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

async function storeGet(storeName, key) {
  await initStorage();
  if (storageState.mode === 'indexedDB') return idbRequest(storeName, 'readonly', s => s.get(key));
  return storageState.fallback?.[storeName]?.[key] || null;
}
async function storeGetAll(storeName) {
  await initStorage();
  if (storageState.mode === 'indexedDB') return idbRequest(storeName, 'readonly', s => s.getAll());
  return Object.values(storageState.fallback?.[storeName] || {});
}
async function storePut(storeName, value) {
  await initStorage();
  if (storageState.mode === 'indexedDB') return idbRequest(storeName, 'readwrite', s => s.put(value));
  const key = value?.[STORES[storeName].keyPath];
  if (typeof key !== 'string' || !key) throw new Error(`Chave inválida para ${storeName}.`);
  storageState.fallback[storeName][key] = value; persistFallbackData(); return key;
}
async function storeDelete(storeName, key) {
  await initStorage();
  if (storageState.mode === 'indexedDB') return idbRequest(storeName, 'readwrite', s => s.delete(key));
  delete storageState.fallback[storeName][key]; persistFallbackData();
}
async function storeClear(storeName) {
  await initStorage();
  if (storageState.mode === 'indexedDB') return idbRequest(storeName, 'readwrite', s => s.clear());
  storageState.fallback[storeName] = {}; persistFallbackData();
}

function uid(prefix) { return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`; }

async function recordAttempt({ questionId, selected, correctAnswer, mode = 'training', sessionId = null, timestamp = new Date().toISOString(), attemptId = null }) {
  if (typeof questionId !== 'string' || !questionId.trim()) throw new Error('Questão inválida para registro da tentativa.');
  if (!ALT_SET.has(selected) || !ALT_SET.has(correctAnswer)) throw new Error('Alternativa inválida para registro da tentativa.');
  if (!['training','exam'].includes(mode)) throw new Error('Modo de tentativa inválido.');
  if (Number.isNaN(Date.parse(timestamp))) throw new Error('Data da tentativa inválida.');
  const stableAttemptId = attemptId || uid('attempt');
  const existing = await storeGet('attempts', stableAttemptId);
  if (existing) return existing;
  const correct = selected === correctAnswer;
  const attempt = { attemptId: stableAttemptId, questionId, selected, correctAnswer, correct, mode, sessionId, timestamp };
  await storePut('attempts', attempt);
  const prev = await storeGet('questionStats', questionId) || { questionId, attempts:0, correct:0, wrong:0, lastAttempt:null, lastSelected:null, lastCorrect:null, correctedAfterError:false, correctAfterError:0 };
  const hadWrong = Number(prev.wrong || 0) > 0;
  const next = {
    ...prev,
    attempts: Number(prev.attempts || 0) + 1,
    correct: Number(prev.correct || 0) + (correct ? 1 : 0),
    wrong: Number(prev.wrong || 0) + (correct ? 0 : 1),
    lastAttempt: timestamp,
    lastSelected: selected,
    lastCorrect: correct,
    correctedAfterError: Boolean(prev.correctedAfterError || (hadWrong && correct)),
    correctAfterError: Number(prev.correctAfterError || 0) + (hadWrong && correct ? 1 : 0)
  };
  await storePut('questionStats', next);
  return attempt;
}

async function getQuestionStatsMap() { const rows = await storeGetAll('questionStats'); return Object.fromEntries(rows.map(r => [r.questionId, r])); }
async function getAttempts() { return storeGetAll('attempts'); }
async function toggleFavorite(questionId) {
  const current = await storeGet('favorites', questionId);
  if (current) { await storeDelete('favorites', questionId); return false; }
  await storePut('favorites', { questionId, savedAt: new Date().toISOString() }); return true;
}

/* ===== TRAINING ENGINE ===== */
function shuffle(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [copy[i], copy[j]] = [copy[j], copy[i]]; }
  return copy;
}

function applyQuestionFilters(questions, filters, statsMap = {}, favorites = new Set()) {
  const query = normalizeText(filters.search || '').trim();
  return questions.filter(q => {
    if (filters.disciplina && q.disciplina !== filters.disciplina) return false;
    if (filters.assunto && q.assunto !== filters.assunto) return false;
    if (filters.dificuldade && q.dificuldade !== filters.dificuldade) return false;
    if (filters.onlyFavorites && !favorites.has(q.id)) return false;
    const stat = statsMap[q.id];
    const attempted = Number(stat?.attempts || 0) > 0;
    switch (filters.status) {
      case 'respondidas': if (!attempted) return false; break;
      case 'nao-respondidas': if (attempted) return false; break;
      case 'corretas': if (!attempted || stat.lastCorrect !== true) return false; break;
      case 'erradas': if (!attempted || Number(stat.wrong || 0) < 1) return false; break;
      default: break;
    }
    if (query && !searchableQuestionText(q).includes(query)) return false;
    return true;
  });
}

function createTrainingSession(eligibleQuestions, amount, filters = {}, mode = 'personalizado') {
  const n = Number(amount);
  if (!Number.isInteger(n) || n < 1) throw new Error('Informe uma quantidade válida de questões.');
  if (n > eligibleQuestions.length) throw new Error(`Existem apenas ${eligibleQuestions.length} questões disponíveis com estes filtros.`);
  return { type:'training', id:uid('training'), mode, filters, questionIds:shuffle(eligibleQuestions).slice(0,n).map(q=>q.id), index:0, selected:{}, confirmed:{}, cut:{}, startedAt:new Date().toISOString(), endedAt:null };
}

function aggregateSession(session, questionMap) {
  const byDisciplina = {};
  const byAssunto = {};
  let answered = 0, correct = 0, wrong = 0;
  for (const qid of session.questionIds) {
    const c = session.confirmed?.[qid];
    if (!c) continue;
    const q = questionMap.get(qid); if (!q) continue;
    answered++; c.correct ? correct++ : wrong++;
    byDisciplina[q.disciplina] ||= { total:0, correct:0, wrong:0 };
    byDisciplina[q.disciplina].total++; byDisciplina[q.disciplina].correct += c.correct ? 1 : 0; byDisciplina[q.disciplina].wrong += c.correct ? 0 : 1;
    const key = `${q.disciplina}|||${q.assunto}`;
    byAssunto[key] ||= { disciplina:q.disciplina, assunto:q.assunto, total:0, correct:0, wrong:0 };
    byAssunto[key].total++; byAssunto[key].correct += c.correct ? 1 : 0; byAssunto[key].wrong += c.correct ? 0 : 1;
  }
  const percent = answered ? Math.round((correct / answered) * 1000) / 10 : 0;
  return { answered, correct, wrong, percent, byDisciplina, byAssunto:Object.values(byAssunto) };
}

async function confirmTrainingAnswer(session, question, selected) {
  if (!ALT_SET.has(selected)) throw new Error('Selecione uma alternativa antes de confirmar.');
  if (session.confirmed[question.id]) return session.confirmed[question.id];
  const attempt = await recordAttempt({ attemptId:`training:${session.id}:${question.id}`, questionId:question.id, selected, correctAnswer:question.gabarito, mode:'training', sessionId:session.id });
  session.selected[question.id] = selected;
  session.confirmed[question.id] = { selected, correct:attempt.correct, confirmedAt:attempt.timestamp };
  await saveActiveSession('training', session);
  return session.confirmed[question.id];
}

async function finishTraining(session, questionMap) {
  if (session.endedAt || session._finishing) throw new Error('Este treino já está sendo finalizado.');
  session._finishing = true;
  try {
    const summary = aggregateSession(session, questionMap);
    const endedAt = new Date().toISOString();
    const durationSec = Math.max(0, Math.round((Date.parse(endedAt) - Date.parse(session.startedAt)) / 1000));
    const record = await saveTrainingHistory({ id:session.id, startedAt:session.startedAt, endedAt, mode:session.mode, filters:session.filters, quantity:session.questionIds.length, ...summary, durationSec, questionIds:[...session.questionIds] });
    session.endedAt = endedAt; await clearActiveSession('training'); return record;
  } finally { delete session._finishing; }
}

/* ===== EXAM ENGINE ===== */
function createExamSession(questions) {
  const selected = [];
  for (const rule of EXAM_DISTRIBUTION) {
    const pool = questions.filter(q => q.disciplina === rule.disciplina);
    if (pool.length < rule.count) throw new Error(`Banco insuficiente para ${rule.disciplina}: ${pool.length}/${rule.count}.`);
    selected.push(...shuffle(pool).slice(0, rule.count));
  }
  const now = Date.now();
  return { type:'exam', id:uid('exam'), questionIds:shuffle(selected).map(q=>q.id), index:0, answers:{}, cut:{}, startedAt:new Date(now).toISOString(), endsAt:new Date(now + EXAM_MINUTES*60*1000).toISOString(), finishedAt:null, autoFinished:false };
}
function examRemainingSeconds(session) { return Math.max(0, Math.ceil((Date.parse(session.endsAt) - Date.now()) / 1000)); }
function examBlankCount(session) { return session.questionIds.filter(id => !session.answers[id]).length; }
function setExamAnswer(session, questionId, letter) { if (ALT_SET.has(letter)) session.answers[questionId] = letter; }

async function finishExam(session, questionMap, { auto = false } = {}) {
  if (session.finishedAt || session._finishing) throw new Error('Este simulado já está sendo finalizado ou foi finalizado.');
  session._finishing = true;
  const endedAt = new Date().toISOString();
  try {
    let correct=0, wrong=0, blanks=0;
    const byDisciplina = {};
    const review = [];
    for (const qid of session.questionIds) {
      const q = questionMap.get(qid); if (!q) throw new Error(`Questão ${qid} do simulado não foi encontrada no banco.`);
      const selected = session.answers[qid] || null;
      byDisciplina[q.disciplina] ||= { total:0, correct:0, wrong:0, blanks:0 };
      const row = byDisciplina[q.disciplina]; row.total++;
      if (!selected) { blanks++; row.blanks++; }
      else {
        const isCorrect = selected === q.gabarito;
        if (isCorrect) { correct++; row.correct++; } else { wrong++; row.wrong++; }
        await recordAttempt({ attemptId:`exam:${session.id}:${q.id}`, questionId:q.id, selected, correctAnswer:q.gabarito, mode:'exam', sessionId:session.id, timestamp:endedAt });
      }
      review.push({ questionId:q.id, selected, correctAnswer:q.gabarito });
    }
    const percent = Math.round((correct / session.questionIds.length) * 1000) / 10;
    const durationSec = Math.max(0, Math.round((Date.parse(endedAt) - Date.parse(session.startedAt)) / 1000));
    const record = await saveExamHistory({ id:session.id, startedAt:session.startedAt, endedAt, questionIds:[...session.questionIds], answers:{...session.answers}, review, correct, wrong, blanks, percent, byDisciplina, durationSec, autoFinished:auto });
    session.finishedAt = endedAt; session.autoFinished = auto; await clearActiveSession('exam'); return record;
  } finally { delete session._finishing; }
}

/* ===== PERFORMANCE ===== */
function computePerformance(questions, attempts, statsMap, favoritesSet = new Set(), examHistory = []) {
  const qMap = new Map(questions.map(q => [q.id,q]));
  const validAttempts = attempts.filter(a => qMap.has(a.questionId));
  const totalAttempts = validAttempts.length;
  const correctAttempts = validAttempts.filter(a => a.correct).length;
  const wrongAttempts = totalAttempts - correctAttempts;
  const completedUnique = questions.filter(q => Number(statsMap[q.id]?.attempts || 0) > 0).length;
  const overallPercent = totalAttempts ? Math.round((correctAttempts/totalAttempts)*1000)/10 : 0;
  const byDisciplina = new Map();
  const byAssunto = new Map();
  for (const a of validAttempts) {
    const q = qMap.get(a.questionId);
    if (!byDisciplina.has(q.disciplina)) byDisciplina.set(q.disciplina,{disciplina:q.disciplina,attempts:0,correct:0,wrong:0});
    const d=byDisciplina.get(q.disciplina); d.attempts++; d.correct += a.correct?1:0; d.wrong += a.correct?0:1;
    const key=`${q.disciplina}|||${q.assunto}`;
    if (!byAssunto.has(key)) byAssunto.set(key,{disciplina:q.disciplina,assunto:q.assunto,attempts:0,correct:0,wrong:0});
    const s=byAssunto.get(key); s.attempts++; s.correct += a.correct?1:0; s.wrong += a.correct?0:1;
  }
  const finalize = r => ({...r, percent:r.attempts?Math.round((r.correct/r.attempts)*1000)/10:0});
  const disciplineRows = BANK_DESCRIPTORS.map(d => byDisciplina.get(d.disciplina)).filter(Boolean).map(finalize);
  const assuntoRows = [...byAssunto.values()].map(finalize);
  const reviewAssuntos = assuntoRows.filter(r=>r.attempts>0 && r.percent<70).sort((a,b)=>a.percent-b.percent||b.attempts-a.attempts);
  const todayKey = new Date().toLocaleDateString('pt-BR');
  const todayAnswered = validAttempts.filter(a => new Date(a.timestamp).toLocaleDateString('pt-BR') === todayKey).length;
  return {
    totalQuestions:questions.length, completedUnique, progressPercent:questions.length?Math.round((completedUnique/questions.length)*1000)/10:0,
    totalAttempts, correctAttempts, wrongAttempts, overallPercent,
    favorites:questions.filter(q=>favoritesSet.has(q.id)).length, exams:examHistory.length,
    wrongUnique:questions.filter(q=>Number(statsMap[q.id]?.wrong||0)>0).length,
    byDisciplina:disciplineRows, byAssunto:assuntoRows, reviewAssuntos, todayAnswered
  };
}

function validateBackupPayload(payload) {
  if (!payload || payload.app !== APP_NAME || payload.backupVersion !== APP_VERSION || !payload.database) throw new Error('Backup incompatível com esta versão da plataforma.');
  const db=payload.database;

  const keyPaths=Object.fromEntries(Object.entries(STORES).map(([name,cfg])=>[name,cfg.keyPath]));

    const rows=db.stores[storeName]; if(!Array.isArray(rows)) throw new Error(`Backup inválido: coleção ${storeName} ausente ou corrompida.`);
    const seen=new Set(); for(const row of rows){ if(!row||typeof row!=='object'||Array.isArray(row)) throw new Error(`Backup inválido: registro corrompido em ${storeName}.`); const key=row[keyPath]; if(typeof key!=='string'||!key.trim()) throw new Error(`Backup inválido: chave ausente em ${storeName}.`); if(seen.has(key)) throw new Error(`Backup inválido: chave duplicada em ${storeName}.`); seen.add(key); }
  }
  const isDate=v=>typeof v==='string'&&!Number.isNaN(Date.parse(v)); const isCount=v=>Number.isInteger(Number(v))&&Number(v)>=0; const isPct=v=>Number.isFinite(Number(v))&&Number(v)>=0&&Number(v)<=100;
  const known=id=>typeof id==='string' && state.qMap.has(id); const idsOk=ids=>Array.isArray(ids)&&ids.every(known)&&new Set(ids).size===ids.length;
  for(const a of db.stores.attempts){ if(!known(a.questionId)||!ALT_SET.has(a.selected)||!ALT_SET.has(a.correctAnswer)||typeof a.correct!=='boolean'||a.correct!==(a.selected===a.correctAnswer)||!['training','exam'].includes(a.mode)||!isDate(a.timestamp)) throw new Error('Backup inválido: histórico de tentativas corrompido.'); }
  for(const s of db.stores.questionStats){ if(!known(s.questionId)||!isCount(s.attempts)||!isCount(s.correct)||!isCount(s.wrong)||Number(s.correct)+Number(s.wrong)!==Number(s.attempts)) throw new Error('Backup inválido: estatísticas de questões corrompidas.'); if(s.lastSelected!=null&&!ALT_SET.has(s.lastSelected)) throw new Error('Backup inválido: última alternativa corrompida.'); }

  for(const r of db.stores.trainingHistory){ if(!isDate(r.startedAt)||!isDate(r.endedAt)||!idsOk(r.questionIds)||!isCount(r.quantity)||!isCount(r.answered)||!isCount(r.correct)||!isCount(r.wrong)||!isPct(r.percent)||Number(r.quantity)!==r.questionIds.length||Number(r.correct)+Number(r.wrong)!==Number(r.answered)) throw new Error('Backup inválido: histórico de treinos corrompido.'); }
  for(const r of db.stores.examHistory){ if(!isDate(r.startedAt)||!isDate(r.endedAt)||!idsOk(r.questionIds)||r.questionIds.length!==30||!validExamDistribution(r.questionIds,state.qMap)||!isCount(r.correct)||!isCount(r.wrong)||!isCount(r.blanks)||Number(r.correct)+Number(r.wrong)+Number(r.blanks)!==30||!isPct(r.percent)||!r.answers||typeof r.answers!=='object'||Array.isArray(r.answers)) throw new Error('Backup inválido: histórico de simulados corrompido.'); for(const [id,letter] of Object.entries(r.answers)) if(!r.questionIds.includes(id)||!ALT_SET.has(letter)) throw new Error('Backup inválido: respostas do simulado corrompidas.'); }

  sanitizeUiSettings(payload.uiSettings||{});
  return payload;
}

function isValidTrainingSession(session){
  if(!session||session.type!=='training'||session.endedAt||typeof session.id!=='string'||!Array.isArray(session.questionIds)||!session.questionIds.length)return false;
  const ids=new Set(session.questionIds); if(ids.size!==session.questionIds.length||session.questionIds.some(id=>!state.qMap.has(id)))return false;
  if(!Number.isInteger(session.index)||session.index<0||session.index>=session.questionIds.length||Number.isNaN(Date.parse(session.startedAt)))return false;
  if(!session.selected||!session.confirmed||!session.cut)return false;
  for(const [id,letter] of Object.entries(session.selected))if(!ids.has(id)||!ALT_SET.has(letter))return false;
  for(const [id,c] of Object.entries(session.confirmed)){const q=state.qMap.get(id);if(!ids.has(id)||!q||!c||!ALT_SET.has(c.selected)||typeof c.correct!=='boolean'||c.correct!==(c.selected===q.gabarito))return false;}
  for(const [id,letters] of Object.entries(session.cut))if(!ids.has(id)||!Array.isArray(letters)||letters.some(l=>!ALT_SET.has(l))||new Set(letters).size!==letters.length)return false;
  return true;
}
function isValidExamSession(session){
  if(!session||session.type!=='exam'||session.finishedAt||typeof session.id!=='string'||!Array.isArray(session.questionIds)||session.questionIds.length!==30)return false;
  const ids=new Set(session.questionIds);if(ids.size!==30||session.questionIds.some(id=>!state.qMap.has(id)))return false;
  if(!Number.isInteger(session.index)||session.index<0||session.index>=30||Number.isNaN(Date.parse(session.startedAt))||Number.isNaN(Date.parse(session.endsAt)))return false;
  if(!session.answers||typeof session.answers!=='object'||!session.cut||typeof session.cut!=='object')return false;
  for(const [id,letter] of Object.entries(session.answers))if(!ids.has(id)||!ALT_SET.has(letter))return false;
  for(const [id,letters] of Object.entries(session.cut))if(!ids.has(id)||!Array.isArray(letters)||letters.some(l=>!ALT_SET.has(l))||new Set(letters).size!==letters.length)return false;
  return validExamDistribution(session.questionIds,state.qMap);
}

function scheduleExamDeadline(session){ stopExamDeadline(); if(!session||session.finishedAt)return; const ms=Math.max(0,Date.parse(session.endsAt)-Date.now()); state.examDeadlineHandle=setTimeout(async()=>{ if(!state.activeExam||state.activeExam.id!==session.id||session.finishedAt||session._finishing)return; await autoFinishExam(session); },Math.min(ms+50,2147483000)); }

function renderSettings(){const data=el('section',{className:'card section'});data.append(el('h2',{text:'Backup do progresso'}),el('p',{className:'section-subtitle',text:'Exporte seus dados para restaurar neste ou em outro navegador.'}));const actions=el('div',{className:'hero-actions'});actions.append(button('Exportar backup','btn-primary',async()=>{try{await downloadBackup();toast('Backup exportado.','success');}catch(e){toast(e.message,'error');}}));const importLabel=el('label',{className:'btn btn-secondary',text:'Importar backup'});const input=el('input',{attrs:{type:'file',accept:'application/json,.json',style:'display:none'}});importLabel.append(input);input.addEventListener('change',async()=>{const file=input.files?.[0];if(!file)return;try{const payload=await parseBackupFile(file);if(await confirmModal({title:'Restaurar backup?',message:'Os dados atuais deste navegador serão substituídos pelos dados do arquivo.',confirmText:'Restaurar'})){await restoreBackup(payload);state.ui=getUiSettings();state.activeTraining=await getActiveSession('training');state.activeExam=await getActiveSession('exam');await refreshProgress();toast('Backup restaurado.','success');navigate('home');}}catch(e){toast(e.message,'error');}finally{input.value='';}});actions.append(importLabel);data.append(actions,el('div',{className:'storage-note',text:`Armazenamento em uso: ${storageState.mode==='indexedDB'?'IndexedDB':storageState.mode==='localStorage'?'armazenamento local alternativo':'memória temporária'}.`}));app.append(data);
