"enunciado":"Quatro relatórios — W, X, Y e Z — receberam prioridades distintas de 1 a 4, sendo 1 a mais alta. Sabe-se que X tem prioridade melhor que Y; W tem prioridade imediatamente pior que X; e Z tem prioridade melhor que X. Qual relatório tem prioridade 4?","alternativas":{"A":"W","B":"X","C":"Y","D":"Z","E":"Não é possível determinar"},"gabarito":"C","comentario":"Z deve vir antes de X, e W imediatamente depois de X. O bloco possível é Z, X, W nas prioridades 1, 2 e 3, pois não há espaço para colocar Z antes de X se X estiver em 1, nem para W imediatamente depois se X estiver em 4. Como X também deve ser melhor que Y, sobra a prioridade 4 para Y.","referencia":"Ordenação por prioridades com restrições simultâneas."},{"id":"RLM066","disciplina":"Raciocínio Lógico-Matemático","assunto":"Resolução de situações-problema","dificuldade":"Fácil","enunciado":"Uma escola recebeu 240 cadernos. Distribuiu 85 pela manhã e 67 à tarde. Quantos cadernos restaram?","alternativas":{"A":"88","B":"78","C":"98","D":"108","E":"118"},"gabarito":"A","comentario":"Total distribuído: 85+67=152. Restante: 240−152=88.","referencia":"Resolução de situações-problema com operações fundamentais."},{"id":"RLM067","disciplina":"Raciocínio Lógico-Matemático","assunto":"Resolução de situações-problema","dificuldade":"Fácil","enunciado":"Uma reunião começou às 14h35 e durou 1h50. Em que horário terminou?","alternativas":{"A":"16h05","B":"16h15","C":"16h25","D":"16h35","E":"17h25"},"gabarito":"C","comentario":"Somando 1 hora a 14h35, chega-se a 15h35. Somando mais 50 minutos, chega-se a 16h25.","referencia":"Resolução de situações-problema envolvendo tempo."},{"id":"RLM068","disciplina":"Raciocínio Lógico-Matemático","assunto":"Resolução de situações-problema","dificuldade":"Intermediária","enunciado":"Um almoxarifado tinha 500 resmas de papel. Na primeira semana, consumiu 18 resmas a mais que na segunda. Nas duas semanas juntas, foram consumidas 146 resmas. Quantas resmas foram consumidas na primeira semana?","alternativas":{"A":"64","B":"82","C":"73","D":"91","E":"100"},"gabarito":"B","comentario":"Se a segunda semana teve x resmas, a primeira teve x+18. Então x+(x+18)=146, ou 2x=128, daí x=64. A primeira semana consumiu 64+18=82 resmas.","referencia":"Situações-problema; relação entre quantidades."},{"id":"RLM069","disciplina":"Raciocínio Lógico-Matemático","assunto":"Resolução de situações-problema","dificuldade":"Intermediária","enunciado":"Uma equipe precisa conferir 360 fichas. Pela manhã confere 2/5 do total e, à tarde, confere 1/3 do total. Quantas fichas ainda faltam conferir?","alternativas":{"A":"72","B":"108","C":"120","D":"96","E":"144"},"gabarito":"D","comentario":"Pela manhã: (2/5)×360=144. À tarde: (1/3)×360=120. Total conferido=264. Faltam 360−264=96.","referencia":"Situações-problema com frações e operações fundamentais."},{"id":"RLM070","disciplina":"Raciocínio Lógico-Matemático","assunto":"Resolução de situações-problema","dificuldade":"Intermediária","enunciado":"Em uma formação, foram organizadas 9 mesas com 6 participantes em cada uma. Depois chegaram mais 11 pessoas, que também participaram. Quantas pessoas passaram a participar da formação?","alternativas":{"A":"65","B":"54","C":"60","D":"66","E":"71"},"gabarito":"A","comentario":"Inicialmente havia 9×6=54 participantes. Com a chegada de mais 11, o total passou a 54+11=65.","referencia":"Situações-problema com multiplicação e adição."},{"id":"RLM071","disciplina":"Raciocínio Lógico-Matemático","assunto":"Resolução de situações-problema","dificuldade":"Intermediária","enunciado":"Um arquivo digital possui 1.260 páginas. Uma servidora revisou 315 páginas no primeiro dia e, no segundo, revisou o dobro do primeiro dia. Quantas páginas permaneceram sem revisão após os dois dias?","alternativas":{"A":"210","B":"420","C":"525","D":"315","E":"630"},"gabarito":"D","comentario":"No segundo dia foram revisadas 2×315=630 páginas. Total revisado=315+630=945. Restaram 1.260−945=315 páginas.","referencia":"Situações-problema com operações fundamentais."},{"id":"RLM072","disciplina":"Raciocínio Lógico-Matemático","assunto":"Resolução de situações-problema","dificuldade":"Difícil","enunciado":"Um setor recebeu certa quantidade de formulários. No primeiro dia utilizou 1/4 do total. No segundo, utilizou 2/5 do que restou após o primeiro dia. Ao final dos dois dias sobraram 270 formulários. Quantos formulários havia inicialmente?","alternativas":{"A":"450","B":"500","C":"600","D":"540","E":"720"},"gabarito":"C","comentario":"Se o total é T, após o primeiro dia restam (3/4)T. No segundo dia usa-se 2/5 desse restante, portanto sobra 3/5 de (3/4)T, isto é, (9/20)T. Como (9/20)T=270, temos T=270×20/9=600.","referencia":"Situações-problema com frações sucessivas."},{"id":"RLM073","disciplina":"Raciocínio Lógico-Matemático","assunto":"Resolução de situações-problema","dificuldade":"Difícil","enunciado":"Uma escola dispõe de certa quantidade de canetas. Se forem distribuídas 8 canetas a cada um de 45 alunos, ainda sobrarão 30 canetas. Quantas canetas a escola possui?","alternativas":{"A":"360","B":"375","C":"400","D":"420","E":"390"},"gabarito":"E","comentario":"Para atender 45 alunos, são necessárias 45×8=360 canetas. Como ainda sobram 30, o total é 360+30=390 canetas.","referencia":"Resolução de situações-problema; operações fundamentais."},{"id":"RLM074","disciplina":"Raciocínio Lógico-Matemático","assunto":"Razão e proporção","dificuldade":"Fácil","enunciado":"Em uma equipe, a razão entre o número de servidores do turno da manhã e o do turno da tarde é 3:2. Se há 25 servidores ao todo, quantos trabalham pela manhã?","alternativas":{"A":"15","B":"10","C":"12","D":"18","E":"20"},"gabarito":"A","comentario":"A razão 3:2 totaliza 5 partes. Cada parte corresponde a 25÷5=5 servidores. Pela manhã são 3 partes: 3×5=15.","referencia":"Razão e proporção; divisão proporcional."},{"id":"RLM075","disciplina":"Raciocínio Lógico-Matemático","assunto":"Regra de três simples","dificuldade":"Fácil","enunciado":"Se 4 caixas iguais contêm, ao todo, 72 pastas, quantas pastas há em 7 caixas do mesmo tipo?","alternativas":{"A":"108","B":"120","C":"132","D":"144","E":"126"},"gabarito":"E","comentario":"A relação é diretamente proporcional. Cada caixa contém 72÷4=18 pastas. Em 7 caixas: 7×18=126.","referencia":"Regra de três simples direta."},{"id":"RLM076","disciplina":"Raciocínio Lógico-Matemático","assunto":"Razão e proporção","dificuldade":"Fácil","enunciado":"Uma mistura é preparada na razão de 2 partes de concentrado para 5 partes de água. Se forem usados 10 litros de água, quantos litros de concentrado são necessários para manter a razão?","alternativas":{"A":"2","B":"5","C":"4","D":"7","E":"8"},"gabarito":"C","comentario":"A razão concentrado:água é 2:5. Se 5 partes correspondem a 10 litros, cada parte vale 2 litros. Assim, 2 partes de concentrado correspondem a 4 litros.","referencia":"Razão e proporção."},{"id":"RLM077","disciplina":"Raciocínio Lógico-Matemático","assunto":"Regra de três simples","dificuldade":"Fácil","enunciado":"Uma impressora produz 150 páginas em 5 minutos, mantendo ritmo constante. Quantas páginas produzirá em 8 minutos?","alternativas":{"A":"200","B":"225","C":"250","D":"240","E":"300"},"gabarito":"D","comentario":"Em 1 minuto, a impressora produz 150÷5=30 páginas. Em 8 minutos: 30×8=240.","referencia":"Regra de três simples direta."},{"id":"RLM078","disciplina":"Raciocínio Lógico-Matemático","assunto":"Proporcionalidade direta","dificuldade":"Intermediária","enunciado":"Para organizar um material, 6 pastas comportam 210 documentos, com a mesma quantidade em cada pasta. Quantos documentos cabem em 10 pastas iguais, mantendo essa distribuição?","alternativas":{"A":"350","B":"300","C":"320","D":"360","E":"420"},"gabarito":"A","comentario":"Cada pasta comporta 210÷6=35 documentos. Em 10 pastas, 10×35=350.","referencia":"Proporção direta e regra de três simples."},{"id":"RLM079","disciplina":"Raciocínio Lógico-Matemático","assunto":"Proporcionalidade inversa","dificuldade":"Intermediária","enunciado":"Quatro servidores, trabalhando no mesmo ritmo e simultaneamente, concluem uma tarefa em 9 horas. Mantidas as mesmas condições, em quantas horas 6 servidores concluiriam a mesma tarefa?","alternativas":{"A":"4 horas","B":"6 horas","C":"5 horas","D":"7 horas","E":"13,5 horas"},"gabarito":"B","comentario":"Para uma mesma tarefa, número de servidores e tempo são inversamente proporcionais. O produto é constante: 4×9=36 servidor-horas. Com 6 servidores, tempo=36÷6=6 horas.","referencia":"Proporcionalidade inversa; regra de três simples."},{"id":"RLM080","disciplina":"Raciocínio Lógico-Matemático","assunto":"Razão e proporção","dificuldade":"Intermediária","enunciado":"A razão entre processos concluídos e processos pendentes em um setor é 7:3. Se há 120 processos no total, quantos estão pendentes?","alternativas":{"A":"30","B":"42","C":"36","D":"48","E":"84"},"gabarito":"C","comentario":"A razão totaliza 7+3=10 partes. Cada parte vale 120÷10=12. Os pendentes correspondem a 3 partes: 3×12=36.","referencia":"Razão e divisão proporcional."},{"id":"RLM081","disciplina":"Raciocínio Lógico-Matemático","assunto":"Regra de três simples","dificuldade":"Intermediária","enunciado":"Um veículo percorre 180 km com 15 litros de combustível, mantendo o mesmo consumo médio. Quantos litros serão necessários para percorrer 300 km?","alternativas":{"A":"20 litros","B":"22 litros","C":"27 litros","D":"25 litros","E":"30 litros"},"gabarito":"D","comentario":"A relação distância-consumo é direta. 180 km correspondem a 15 L; 300 km correspondem a x. Então x=300×15/180=25 L.","referencia":"Regra de três simples direta."},{"id":"RLM082","disciplina":"Raciocínio Lógico-Matemático","assunto":"Razão e proporção","dificuldade":"Intermediária","enunciado":"Em uma seleção interna, a razão entre aprovados e não aprovados foi 5:3. Se o número de aprovados superou o de não aprovados em 24 pessoas, quantas pessoas participaram da seleção?","alternativas":{"A":"72","B":"84","C":"96","D":"108","E":"120"},"gabarito":"C","comentario":"A diferença entre 5 partes e 3 partes é 2 partes, que correspondem a 24 pessoas. Cada parte vale 12. O total é 8 partes: 8×12=96.","referencia":"Razão e proporção; diferença entre partes."},{"id":"RLM083","disciplina":"Raciocínio Lógico-Matemático","assunto":"Regra de três simples","dificuldade":"Difícil","enunciado":"Uma equipe digitaliza 420 páginas em 3 horas e 30 minutos, mantendo ritmo constante. Nesse mesmo ritmo, quantas páginas digitalizará em 5 horas e 15 minutos?","alternativas":{"A":"560","B":"600","C":"650","D":"700","E":"630"},"gabarito":"E","comentario":"Converta os tempos para minutos: 3h30=210 min e 5h15=315 min. A relação é direta: x=420×315/210=420×1,5=630 páginas.","referencia":"Regra de três simples com conversão de tempo."},{"id":"RLM084","disciplina":"Raciocínio Lógico-Matemático","assunto":"Proporcionalidade inversa","dificuldade":"Difícil","enunciado":"Uma tarefa seria concluída por 8 pessoas, de mesmo rendimento, em 15 dias. Após a definição do planejamento, decidiu-se realizá-la com 12 pessoas, mantendo o mesmo rendimento individual e a mesma carga diária. Em quantos dias a tarefa será concluída?","alternativas":{"A":"8 dias","B":"10 dias","C":"9 dias","D":"12 dias","E":"22,5 dias"},"gabarito":"B","comentario":"Para a mesma tarefa, pessoas e dias são inversamente proporcionais. Assim, 8×15=12×d. Logo, d=120÷12=10 dias.","referencia":"Proporcionalidade inversa; regra de três simples."},{"id":"RLM085","disciplina":"Raciocínio Lógico-Matemático","assunto":"Razão e proporção","dificuldade":"Difícil","enunciado":"Dois setores, A e B, receberam recursos na razão 4:7. Depois, R$ 6.000 foram transferidos de B para A, e os valores dos dois setores ficaram iguais. Qual era o valor inicialmente destinado ao setor A?","alternativas":{"A":"R$ 12.000","B":"R$ 14.000","C":"R$ 16.000","D":"R$ 18.000","E":"R$ 28.000"},"gabarito":"C","comentario":"Se os valores iniciais eram 4k e 7k, após a transferência ficam 4k+6.000 e 7k−6.000. Igualando: 4k+6.000=7k−6.000, então 3k=12.000 e k=4.000. Logo, A recebeu inicialmente 4k=R$ 16.000.","referencia":"Razão e proporção; resolução de situação-problema."},{"id":"RLM086","disciplina":"Raciocínio Lógico-Matemático","assunto":"Porcentagem","dificuldade":"Fácil","enunciado":"Em um conjunto de 250 formulários, 20% apresentam pendências. Quantos formulários apresentam pendências?","alternativas":{"A":"40","B":"45","C":"60","D":"75","E":"50"},"gabarito":"E","comentario":"20% de 250 = 0,20×250 = 50.","referencia":"Porcentagem; cálculo de percentual de uma quantidade."},{"id":"RLM087","disciplina":"Raciocínio Lógico-Matemático","assunto":"Porcentagem","dificuldade":"Fácil","enunciado":"Um curso custa R$ 180,00 e recebeu desconto de 10%. Qual é o novo valor?","alternativas":{"A":"R$ 160,00","B":"R$ 168,00","C":"R$ 170,00","D":"R$ 162,00","E":"R$ 172,00"},"gabarito":"D","comentario":"O desconto é 10% de 180, isto é, R$ 18,00. Assim, o novo valor é 180−18=R$ 162,00.","referencia":"Porcentagem; desconto percentual."},{"id":"RLM088","disciplina":"Raciocínio Lógico-Matemático","assunto":"Porcentagem","dificuldade":"Fácil","enunciado":"Uma escola tinha 80 computadores em funcionamento e recebeu um acréscimo de 25% nessa quantidade. Com quantos computadores em funcionamento passou a contar?","alternativas":{"A":"90","B":"95","C":"105","D":"100","E":"120"},"gabarito":"D","comentario":"25% de 80 = 20. O novo total é 80+20=100.","referencia":"Porcentagem; acréscimo percentual."},{"id":"RLM089","disciplina":"Raciocínio Lógico-Matemático","assunto":"Porcentagem","dificuldade":"Fácil","enunciado":"Em uma avaliação, uma candidata acertou 36 de 45 questões. Qual foi seu percentual de acertos?","alternativas":{"A":"80%","B":"72%","C":"75%","D":"82%","E":"90%"},"gabarito":"A","comentario":"O percentual é 36÷45×100%. Como 36/45=0,8, o resultado é 80%.","referencia":"Porcentagem; razão percentual."},{"id":"RLM090","disciplina":"Raciocínio Lógico-Matemático","assunto":"Porcentagem","dificuldade":"Intermediária","enunciado":"Um indicador tinha valor 100. Em um período, aumentou 20% e, no período seguinte, diminuiu 20% sobre o novo valor. Qual passou a ser o valor do indicador?","alternativas":{"A":"80","B":"96","C":"100","D":"104","E":"120"},"gabarito":"B","comentario":"Após o aumento: 100×1,20=120. Depois da redução: 120×0,80=96. Percentuais sucessivos iguais, um de aumento e outro de redução, não se anulam porque incidem sobre bases diferentes.","referencia":"Porcentagens sucessivas."},{"id":"RLM091","disciplina":"Raciocínio Lógico-Matemático","assunto":"Porcentagem","dificuldade":"Intermediária","enunciado":"Após um aumento de 15%, determinada verba passou a ser de R$ 230.000,00. Qual era o valor antes do aumento?","alternativas":{"A":"R$ 195.500,00","B":"R$ 202.500,00","C":"R$ 200.000,00","D":"R$ 207.000,00","E":"R$ 215.000,00"},"gabarito":"C","comentario":"Se o valor inicial é V, então 1,15V=230.000. Logo, V=230.000÷1,15=200.000.","referencia":"Porcentagem; determinação do valor original."},{"id":"RLM092","disciplina":"Raciocínio Lógico-Matemático","assunto":"Porcentagem","dificuldade":"Intermediária","enunciado":"O número de participantes de uma formação passou de 320 para 368. Qual foi o percentual de aumento?","alternativas":{"A":"15%","B":"12%","C":"14%","D":"16%","E":"18%"},"gabarito":"A","comentario":"O aumento foi 368−320=48. Em relação ao valor inicial, 48÷320=0,15, isto é, 15%.","referencia":"Porcentagem; taxa de variação percentual."},{"id":"RLM093","disciplina":"Raciocínio Lógico-Matemático","assunto":"Porcentagem","dificuldade":"Intermediária","enunciado":"Em uma escola, 60% dos 500 alunos participaram de uma atividade. Dos participantes, 30% entregaram um relatório. Quantos alunos entregaram o relatório?","alternativas":{"A":"75","B":"100","C":"120","D":"90","E":"150"},"gabarito":"D","comentario":"Participaram 60% de 500: 0,60×500=300. Entregaram relatório 30% dos 300: 0,30×300=90.","referencia":"Porcentagens sucessivas aplicadas a subconjuntos."},{"id":"RLM094","disciplina":"Raciocínio Lógico-Matemático","assunto":"Porcentagem","dificuldade":"Difícil","enunciado":"Uma escola possui 600 estudantes. Em um levantamento, 40% estão no turno da manhã. Entre os estudantes da manhã, 25% usam transporte escolar. Entre os estudantes dos demais turnos, 10% usam transporte escolar. Quantos estudantes, ao todo, usam transporte escolar?","alternativas":{"A":"84","B":"90","C":"96","D":"102","E":"120"},"gabarito":"C","comentario":"Turno da manhã: 40% de 600=240; transporte entre eles: 25% de 240=60. Demais turnos: 600−240=360; transporte: 10% de 360=36. Total=60+36=96.","referencia":"Porcentagem em grupos distintos."},{"id":"RLM095","disciplina":"Raciocínio Lógico-Matemático","assunto":"Porcentagem","dificuldade":"Difícil","enunciado":"Um estoque sofreu uma redução de 20% e ficou com 480 unidades. Em seguida, foram acrescentadas unidades equivalentes a 25% da quantidade original, antes da redução. Qual passou a ser o estoque final?","alternativas":{"A":"580 unidades","B":"600 unidades","C":"630 unidades","D":"620 unidades","E":"650 unidades"},"gabarito":"C","comentario":"Se 80% do estoque original corresponde a 480, então o original era 480÷0,8=600. O acréscimo é 25% de 600=150. Estoque final=480+150=630.","referencia":"Porcentagem; valor original e percentuais sobre bases distintas."},{"id":"RLM096","disciplina":"Raciocínio Lógico-Matemático","assunto":"Médias","dificuldade":"Fácil","enunciado":"As notas de uma estudante em três atividades foram 7, 8 e 9. Qual é a média aritmética dessas notas?","alternativas":{"A":"7","B":"7,5","C":"8,5","D":"8","E":"9"},"gabarito":"D","comentario":"A média aritmética é a soma dos valores dividida pela quantidade de valores: (7+8+9)÷3=24÷3=8.","referencia":"Média aritmética simples."},{"id":"RLM097","disciplina":"Raciocínio Lógico-Matemático","assunto":"Médias","dificuldade":"Fácil","enunciado":"Em quatro dias, um setor concluiu 18, 22, 20 e 24 processos. Qual foi a média diária de processos concluídos?","alternativas":{"A":"20","B":"20,5","C":"21","D":"21,5","E":"22"},"gabarito":"C","comentario":"Somando: 18+22+20+24=84. Dividindo pelos 4 dias: 84÷4=21.","referencia":"Média aritmética simples."},{"id":"RLM098","disciplina":"Raciocínio Lógico-Matemático","assunto":"Médias","dificuldade":"Fácil","enunciado":"A média de três números é 12. Se dois deles são 10 e 14, o terceiro número é","alternativas":{"A":"8","B":"10","C":"14","D":"16","E":"12"},"gabarito":"E","comentario":"Se a média de 3 números é 12, a soma é 3×12=36. Os dois conhecidos somam 24. Logo, o terceiro é 36−24=12.","referencia":"Média aritmética; determinação de termo desconhecido."},{"id":"RLM099","disciplina":"Raciocínio Lógico-Matemático","assunto":"Médias","dificuldade":"Intermediária","enunciado":"A média de atendimentos diários de uma equipe durante 5 dias foi 32. Nos quatro primeiros dias, foram realizados 30, 28, 35 e 31 atendimentos. Quantos atendimentos ocorreram no quinto dia?","alternativas":{"A":"32","B":"36","C":"34","D":"38","E":"40"},"gabarito":"B","comentario":"A soma necessária para média 32 em 5 dias é 5×32=160. Os quatro primeiros somam 30+28+35+31=124. O quinto dia teve 160−124=36 atendimentos.","referencia":"Média aritmética; recuperação de valor desconhecido."},{"id":"RLM100","disciplina":"Raciocínio Lógico-Matemático","assunto":"Médias","dificuldade":"Intermediária","enunciado":"Uma turma de 20 alunos obteve média 7,0 em uma atividade, e outra turma de 30 alunos obteve média 8,0 na mesma atividade. Qual foi a média conjunta das 50 pessoas?","alternativas":{"A":"7,4","B":"7,6","C":"7,5","D":"7,8","E":"8,0"},"gabarito":"B","comentario":"A primeira turma somou 20×7=140 pontos; a segunda, 30×8=240. Soma total=380. Dividindo por 50: 380÷50=7,6.","referencia":"Média conjunta de grupos com tamanhos diferentes."},{"id":"RLM101","disciplina":"Raciocínio Lógico-Matemático","assunto":"Médias","dificuldade":"Intermediária","enunciado":"A média de 6 valores é 15. Ao acrescentar um sétimo valor, a média passa a 16. Qual foi o valor acrescentado?","alternativas":{"A":"16","B":"18","C":"22","D":"20","E":"24"},"gabarito":"C","comentario":"A soma inicial é 6×15=90. A nova soma é 7×16=112. O valor acrescentado é 112−90=22.","referencia":"Média aritmética; efeito da inclusão de um valor."},{"id":"RLM102","disciplina":"Raciocínio Lógico-Matemático","assunto":"Médias","dificuldade":"Difícil","enunciado":"A média de 8 valores é 24. Se o maior deles, igual a 38, for retirado, qual será a média dos 7 valores restantes?","alternativas":{"A":"20","B":"21","C":"22","D":"23","E":"24"},"gabarito":"C","comentario":"A soma dos 8 valores é 8×24=192. Retirando 38, restam 154. A nova média é 154÷7=22.","referencia":"Média aritmética; retirada de um valor."},{"id":"RLM103","disciplina":"Raciocínio Lógico-Matemático","assunto":"Médias","dificuldade":"Difícil","enunciado":"A média de 10 registros foi calculada como 42. Depois verificou-se que um valor registrado como 35 deveria ser 53. Qual é a média correta?","alternativas":{"A":"42,8","B":"43,8","C":"43,2","D":"44,0","E":"44,8"},"gabarito":"B","comentario":"A soma usada inicialmente foi 10×42=420. Corrigir 35 para 53 aumenta a soma em 18, passando-a para 438. A média correta é 438÷10=43,8.","referencia":"Média aritmética; correção de dado."},{"id":"RLM104","disciplina":"Raciocínio Lógico-Matemático","assunto":"Interpretação de tabelas","dificuldade":"Fácil","enunciado":"Uma tabela apresenta o número de atendimentos em quatro meses: janeiro = 120; fevereiro = 135; março = 128; abril = 142. Em qual mês ocorreu o maior número de atendimentos?","alternativas":{"A":"Janeiro","B":"Fevereiro","C":"Março","D":"Abril","E":"Janeiro e março"},"gabarito":"D","comentario":"Comparando os quatro valores, 142 é o maior. Esse valor corresponde ao mês de abril.","referencia":"Interpretação e análise de tabelas."},{"id":"RLM105","disciplina":"Raciocínio Lógico-Matemático","assunto":"Interpretação de gráficos","dificuldade":"Fácil","enunciado":"Um gráfico de barras registra livros emprestados por quatro turmas: A = 40; B = 55; C = 35; D = 50. Qual é a diferença entre a turma com maior e a com menor número de empréstimos?","alternativas":{"A":"10","B":"15","C":"25","D":"30","E":"20"},"gabarito":"E","comentario":"O maior valor é 55, da turma B, e o menor é 35, da turma C. A diferença é 55−35=20.","referencia":"Interpretação de gráficos; comparação de valores."},{"id":"RLM106","disciplina":"Raciocínio Lógico-Matemático","assunto":"Interpretação de indicadores","dificuldade":"Fácil","enunciado":"Um indicador de frequência escolar varia de 0% a 100%. Em uma escola, ele foi de 92% em maio e 95% em junho. A variação, em pontos percentuais, foi de","alternativas":{"A":"3 pontos percentuais.","B":"2 pontos percentuais.","C":"aumento de 3%.","D":"5 pontos percentuais.","E":"7 pontos percentuais."},"gabarito":"A","comentario":"A variação em pontos percentuais é obtida pela diferença direta entre as duas taxas: 95%−92%=3 pontos percentuais. Isso é diferente de calcular a variação percentual relativa.","referencia":"Interpretação de indicadores percentuais."},{"id":"RLM107","disciplina":"Raciocínio Lógico-Matemático","assunto":"Interpretação de tabelas","dificuldade":"Fácil","enunciado":"Uma tabela informa a quantidade de materiais entregues: cadernos = 80; lápis = 120; borrachas = 70; réguas = 30. Quantos itens foram entregues ao todo?","alternativas":{"A":"270","B":"280","C":"290","D":"310","E":"300"},"gabarito":"E","comentario":"Somando os valores da tabela: 80+120+70+30=300 itens.","referencia":"Interpretação de tabelas; totalização de dados."},{"id":"RLM108","disciplina":"Raciocínio Lógico-Matemático","assunto":"Interpretação de tabelas","dificuldade":"Intermediária","enunciado":"Uma tabela mostra matrículas em duas escolas. Escola A: 2025 = 400 e 2026 = 440. Escola B: 2025 = 500 e 2026 = 525. Qual escola apresentou maior crescimento percentual de matrículas entre 2025 e 2026?","alternativas":{"A":"Escola A, com crescimento de 10%.","B":"Escola B, com crescimento de 10%.","C":"Escola A, com crescimento de 5%.","D":"Escola B, com crescimento de 5%.","E":"As duas tiveram o mesmo crescimento percentual."},"gabarito":"A","comentario":"Escola A cresceu 40 sobre 400: 40/400=10%. Escola B cresceu 25 sobre 500: 25/500=5%. Portanto, A teve maior crescimento percentual.","referencia":"Interpretação de tabelas e variação percentual."},{"id":"RLM109","disciplina":"Raciocínio Lógico-Matemático","assunto":"Interpretação de gráficos","dificuldade":"Intermediária","enunciado":"Um gráfico de linhas registra o número de chamados resolvidos: segunda = 24; terça = 30; quarta = 27; quinta = 36; sexta = 33. Em quantos intervalos consecutivos houve aumento no número de chamados resolvidos?","alternativas":{"A":"1","B":"3","C":"4","D":"5","E":"2"},"gabarito":"E","comentario":"De segunda para terça há aumento (24→30); de terça para quarta, queda; de quarta para quinta, aumento (27→36); de quinta para sexta, queda. Portanto, houve 2 intervalos de aumento.","referencia":"Interpretação de gráficos de linhas e variação entre períodos."},{"id":"RLM110","disciplina":"Raciocínio Lógico-Matemático","assunto":"Interpretação de indicadores","dificuldade":"Intermediária","enunciado":"Um indicador é calculado por (número de tarefas concluídas ÷ número de tarefas previstas) × 100. Em um mês, estavam previstas 250 tarefas e 215 foram concluídas. O valor do indicador foi","alternativas":{"A":"80%","B":"86%","C":"84%","D":"88%","E":"90%"},"gabarito":"B","comentario":"Aplicando a fórmula: (215÷250)×100 = 0,86×100 = 86%.","referencia":"Interpretação e cálculo de indicadores."},{"id":"RLM111","disciplina":"Raciocínio Lógico-Matemático","assunto":"Interpretação de tabelas","dificuldade":"Intermediária","enunciado":"Uma tabela apresenta, para três setores, documentos recebidos e concluídos no mês: Setor A: 120 recebidos, 108 concluídos; Setor B: 150 recebidos, 135 concluídos; Setor C: 100 recebidos, 95 concluídos. Qual setor teve a maior taxa de conclusão em relação ao que recebeu?","alternativas":{"A":"Setor A","B":"Setor B","C":"Setores A e B, empatados","D":"Todos, empatados","E":"Setor C"},"gabarito":"E","comentario":"Taxas: A = 108/120 = 90%; B = 135/150 = 90%; C = 95/100 = 95%. Logo, o setor C teve a maior taxa.","referencia":"Interpretação de tabelas; comparação de indicadores relativos."},{"id":"RLM112","disciplina":"Raciocínio Lógico-Matemático","assunto":"Interpretação de gráficos e indicadores","dificuldade":"Difícil","enunciado":"Um indicador mensal foi 80 em janeiro, 92 em fevereiro e 87 em março. A meta é obter média de pelo menos 90 considerando os quatro primeiros meses do ano. Qual deve ser, no mínimo, o valor de abril para que essa meta seja alcançada?","alternativas":{"A":"96","B":"98","C":"100","D":"101","E":"103"},"gabarito":"D","comentario":"Para média 90 em quatro meses, a soma deve ser 4×90=360. Os três primeiros meses somam 80+92+87=259. Portanto, abril precisa ser, no mínimo, 360−259=101.","referencia":"Análise de indicadores; média necessária para atingir meta."},{"id":"RLM113","disciplina":"Raciocínio Lógico-Matemático","assunto":"Interpretação de tabelas e indicadores","dificuldade":"Difícil","enunciado":"Uma tabela mostra a taxa de conclusão de dois projetos. Projeto X: 200 tarefas previstas e 170 concluídas. Projeto Y: 120 tarefas previstas e 108 concluídas. Se os projetos forem analisados em conjunto, qual é a taxa global de conclusão?","alternativas":{"A":"85%","B":"87,5%","C":"88,75%","D":"90%","E":"86,875%"},"gabarito":"E","comentario":"Em conjunto, foram previstas 200+120=320 tarefas e concluídas 170+108=278. A taxa global é 278÷320×100 = 86,875%. Não se deve fazer a média simples entre 85% e 90% porque os projetos têm tamanhos diferentes.","referencia":"Interpretação de indicadores agregados."},{"id":"RLM114","disciplina":"Raciocínio Lógico-Matemático","assunto":"Pensamento computacional","dificuldade":"Fácil","enunciado":"Ao enfrentar um problema grande, uma equipe decide dividi-lo em partes menores, resolver cada parte separadamente e depois integrar as soluções. Esse procedimento exemplifica principalmente o princípio de","alternativas":{"A":"abstração.","B":"decomposição.","C":"aleatoriedade.","D":"negação lógica.","E":"ordenação alfabética."},"gabarito":"B","comentario":"Decomposição é o princípio de dividir um problema complexo em subproblemas menores e mais manejáveis, que podem ser tratados separadamente antes da integração.","referencia":"Pensamento computacional; decomposição de problemas."},{"id":"RLM115","disciplina":"Raciocínio Lógico-Matemático","assunto":"Pensamento computacional","dificuldade":"Fácil","enunciado":"Em pensamento computacional, um algoritmo pode ser entendido, em termos básicos, como","alternativas":{"A":"uma lista de dados sem ordem definida.","B":"uma sequência finita e ordenada de instruções para resolver um problema.","C":"qualquer conjunto de respostas possíveis, mesmo contraditórias.","D":"um desenho que dispensa regras de execução.","E":"uma operação que necessariamente exige um computador."},"gabarito":"B","comentario":"Um algoritmo é uma sequência definida de passos ou instruções destinada a produzir um resultado ou resolver um problema. Ele pode ser executado até mesmo manualmente, sem computador.","referencia":"Pensamento computacional; conceito de algoritmo."},{"id":"RLM116","disciplina":"Raciocínio Lógico-Matemático","assunto":"Pensamento computacional","dificuldade":"Fácil","enunciado":"Ao perceber que vários problemas diferentes apresentam a mesma estrutura de solução e podem ser resolvidos pela mesma regra geral, uma pessoa está empregando principalmente","alternativas":{"A":"negação de proposições.","B":"reconhecimento de padrões.","C":"regra de três inversa.","D":"cálculo de médias.","E":"classificação por ordem alfabética."},"gabarito":"B","comentario":"Reconhecimento de padrões consiste em identificar regularidades e semelhanças entre problemas, permitindo reaproveitar estratégias de solução.","referencia":"Pensamento computacional; reconhecimento de padrões."},{"id":"RLM117","disciplina":"Raciocínio Lógico-Matemático","assunto":"Pensamento computacional aplicado","dificuldade":"Intermediária","enunciado":"Considere o procedimento: 1. Defina x = 5. 2. Some 3 a x. 3. Multiplique o novo valor de x por 2. Qual é o valor final de x?","alternativas":{"A":"16","B":"10","C":"13","D":"15","E":"18"},"gabarito":"A","comentario":"Inicialmente x=5. Após somar 3, x=8. Multiplicando o novo valor por 2, obtém-se x=16.","referencia":"Pensamento computacional; execução sequencial de algoritmo."},{"id":"RLM118","disciplina":"Raciocínio Lógico-Matemático","assunto":"Pensamento computacional aplicado","dificuldade":"Intermediária","enunciado":"Um procedimento recebe um número n e executa: “se n for maior que 10, subtraia 4; caso contrário, some 4”. Se a entrada for n = 9, qual será a saída?","alternativas":{"A":"13","B":"5","C":"9","D":"10","E":"14"},"gabarito":"A","comentario":"Como 9 não é maior que 10, aplica-se o bloco “caso contrário”: 9+4=13.","referencia":"Pensamento computacional; estrutura condicional."},{"id":"RLM119","disciplina":"Raciocínio Lógico-Matemático","assunto":"Pensamento computacional aplicado","dificuldade":"Intermediária","enunciado":"Considere o procedimento: iniciar soma = 0; para cada número da lista [2, 4, 6, 8], adicionar o número à variável soma. Ao final, soma vale","alternativas":{"A":"12","B":"16","C":"18","D":"20","E":"24"},"gabarito":"D","comentario":"O procedimento acumula todos os elementos: 0+2+4+6+8=20.","referencia":"Pensamento computacional; repetição e acumulação."},{"id":"RLM120","disciplina":"Raciocínio Lógico-Matemático","assunto":"Pensamento computacional aplicado","dificuldade":"Intermediária","enunciado":"Um algoritmo deve escolher o maior entre dois números diferentes a e b. Qual sequência de decisão resolve corretamente o problema?","alternativas":{"A":"Se a > b, retorne b; caso contrário, retorne a.","B":"Some a e b e retorne o resultado.","C":"Retorne sempre a, independentemente dos valores.","D":"Se a < b, retorne a; caso contrário, retorne b.","E":"Se a > b, retorne a; caso contrário, retorne b."},"gabarito":"E","comentario":"Como os números são diferentes, há apenas dois casos: a>b ou b>a. No primeiro, o maior é a; no segundo, o maior é b. A estrutura condicional indicada cobre corretamente ambos.","referencia":"Pensamento computacional; condição e seleção."},{"id":"RLM121","disciplina":"Raciocínio Lógico-Matemático","assunto":"Pensamento computacional","dificuldade":"Intermediária","enunciado":"Para criar um procedimento que calcule o tempo médio de atendimento, uma equipe decide ignorar o nome dos usuários e a cor das fichas, mantendo apenas os tempos registrados. Esse ato representa principalmente","alternativas":{"A":"abstração, pois retém os dados relevantes e descarta detalhes irrelevantes.","B":"decomposição, pois divide os usuários em grupos.","C":"negação, pois transforma dados verdadeiros em falsos.","D":"ordenação, pois coloca todos os dados em ordem crescente.","E":"proporcionalidade, pois compara duas grandezas."},"gabarito":"A","comentario":"Abstração é selecionar as características essenciais para resolver um problema e desconsiderar detalhes que não influenciam a solução. Nomes e cores não são necessários para calcular a média dos tempos.","referencia":"Pensamento computacional; abstração."},{"id":"RLM122","disciplina":"Raciocínio Lógico-Matemático","assunto":"Pensamento computacional aplicado","dificuldade":"Intermediária","enunciado":"Considere o procedimento: iniciar contador = 0; examinar os números 3, 7, 10, 12 e 15; para cada número par, aumentar contador em 1. Qual é o valor final do contador?","alternativas":{"A":"1","B":"3","C":"2","D":"4","E":"5"},"gabarito":"C","comentario":"Entre os números apresentados, apenas 10 e 12 são pares. O contador é incrementado duas vezes e termina com valor 2.","referencia":"Pensamento computacional; repetição, condição e contagem."},{"id":"RLM123","disciplina":"Raciocínio Lógico-Matemático","assunto":"Pensamento computacional aplicado","dificuldade":"Intermediária","enunciado":"Um algoritmo recebe um número n. Primeiro calcula n+2. Em seguida, se o resultado for par, divide-o por 2; se for ímpar, soma 1. Para n = 7, a saída é","alternativas":{"A":"5","B":"8","C":"9","D":"18","E":"10"},"gabarito":"E","comentario":"Com n=7, o primeiro resultado é 7+2=9, que é ímpar. Portanto, soma-se 1, obtendo 10.","referencia":"Pensamento computacional; sequência de operações e condição."},{"id":"RLM124","disciplina":"Raciocínio Lógico-Matemático","assunto":"Pensamento computacional aplicado","dificuldade":"Difícil","enunciado":"Considere o procedimento: x = 1. Repita três vezes a operação “x = 2x + 1”. Qual é o valor final de x?","alternativas":{"A":"7","B":"15","C":"9","D":"13","E":"17"},"gabarito":"B","comentario":"Partindo de x=1: primeira repetição, x=2×1+1=3; segunda, x=2×3+1=7; terceira, x=2×7+1=15.","referencia":"Pensamento computacional; iteração de uma regra."},{"id":"RLM125","disciplina":"Raciocínio Lógico-Matemático","assunto":"Pensamento computacional aplicado","dificuldade":"Difícil","enunciado":"Um algoritmo percorre os números 1, 2, 3, 4, 5 e 6. Para cada número, soma 2 ao total se o número for par e subtrai 1 do total se o número for ímpar. O total começa em 0. Qual é o total final?","alternativas":{"A":"0","B":"1","C":"2","D":"3","E":"6"},"gabarito":"D","comentario":"Há três números pares (2, 4 e 6), contribuindo 3×2=6. Há três ímpares (1, 3 e 5), contribuindo 3×(−1)=−3. Total final=6−3=3.","referencia":"Pensamento computacional; repetição, condição e acumulação."}],"atualidades":[{"id":"ATU001","disciplina":"Atualidades","assunto":"Organização político-administrativa","dificuldade":"Fácil","enunciado":"O Pará é composto por 144 municípios. Em uma análise de políticas públicas, esse dado é especialmente útil para:","alternativas":{"A":"substituir indicadores municipais por uma única média estadual.","B":"determinar que políticas públicas devam ser idênticas em todo o território.","C":"organizar e comparar informações por unidades político-administrativas locais, sem presumir que os municípios tenham características idênticas.","D":"dispensar informações sobre população, área e infraestrutura.","E":"concluir que todos os municípios possuem a mesma densidade demográfica."},"gabarito":"C","comentario":"O número de municípios descreve a organização político-administrativa do estado, mas não elimina diferenças territoriais. Indicadores municipais continuam necessários para planejamento e comparação.","referencia":"IBGE — Cidades e Estados: Pará; FAPESPA — Pará em Números 2025."},{"id":"ATU002","disciplina":"Atualidades","assunto":"Dinâmica populacional","dificuldade":"Fácil","enunciado":"O Censo Demográfico 2022 registrou 8.120.131 habitantes no Pará. Ao utilizar esse dado em uma análise produzida em 2026, a forma metodologicamente correta de apresentá-lo é:","alternativas":{"A":"apresentá-lo sem ano de referência, já que a população não se altera entre censos.","B":"identificá-lo como população recenseada em 2022, distinguindo-o de estimativas populacionais posteriores.","C":"substituí-lo por qualquer número divulgado em rede social, desde que mais recente.","D":"tratá-lo como população estimada para 2026, pois resultados censitários permanecem automaticamente atuais.","E":"considerá-lo uma projeção populacional elaborada para o período posterior ao Censo."},"gabarito":"B","comentario":"O valor de 8.120.131 corresponde ao Censo 2022. Estimativas intercensitárias possuem outra data de referência e metodologia, portanto devem ser claramente diferenciadas.","referencia":"IBGE — Censo Demográfico 2022; Cidades e Estados: Pará."},{"id":"ATU003","disciplina":"Atualidades","assunto":"Território e densidade demográfica","dificuldade":"Intermediária","enunciado":"O Pará possui área superior a 1,2 milhão de km² e densidade demográfica relativamente baixa. A leitura conjunta desses indicadores permite concluir que:","alternativas":{"A":"a maior parte do território estadual é necessariamente desabitada.","B":"não existem grandes centros urbanos no estado.","C":"a baixa densidade elimina problemas de mobilidade urbana.","D":"a grande extensão territorial não implica distribuição homogênea da população.","E":"a população se distribui de modo uniforme entre os municípios."},"gabarito":"D","comentario":"Densidade demográfica é uma média entre população e área. Ela não mostra, sozinha, como os habitantes se distribuem dentro do território, no qual coexistem áreas muito pouco povoadas e centros urbanos importantes.","referencia":"IBGE — Censo Demográfico 2022; Cidades e Estados: Pará."},{"id":"ATU004","disciplina":"Atualidades","assunto":"Capital e rede urbana","dificuldade":"Fácil","enunciado":"A capital do Estado do Pará é:","alternativas":{"A":"Marabá.","B":"Altamira.","C":"Belém.","D":"Santarém.","E":"Ananindeua."},"gabarito":"C","comentario":"Belém é a capital do Pará e desempenha funções administrativas, econômicas, culturais e de serviços de alcance estadual e regional.","referencia":"IBGE — Cidades e Estados: Pará."},{"id":"ATU005","disciplina":"Atualidades","assunto":"Demografia e políticas públicas","dificuldade":"Intermediária","enunciado":"Uma secretaria estadual pretende dimensionar a necessidade de escolas, unidades de saúde e transporte em diferentes municípios paraenses. Nesse planejamento, os dados censitários são especialmente úteis porque permitem:","alternativas":{"A":"identificar características e distribuição da população para orientar a alocação territorial de serviços.","B":"substituir integralmente diagnósticos locais e consultas às comunidades.","C":"definir automaticamente quais políticas devem ser adotadas.","D":"eliminar a necessidade de atualização periódica dos indicadores.","E":"prever com exatidão o comportamento individual de cada morador."},"gabarito":"A","comentario":"Dados censitários ajudam a conhecer tamanho, composição e distribuição territorial da população. Eles apoiam decisões públicas, mas devem ser combinados com diagnósticos locais e outras fontes.","referencia":"IBGE — Censo Demográfico 2022."},{"id":"ATU006","disciplina":"Atualidades","assunto":"Território e mobilidade","dificuldade":"Difícil","enunciado":"A grande extensão territorial do Pará, somada à presença de extensa rede hidrográfica, faz com que o planejamento de transportes no estado deva:","alternativas":{"A":"dispensar o transporte fluvial em áreas ribeirinhas.","B":"adotar um único padrão logístico para todos os municípios.","C":"priorizar exclusivamente o modal rodoviário em todo o estado.","D":"desconsiderar a localização de portos e terminais de transbordo.","E":"considerar a integração entre diferentes modais, conforme as condições de cada corredor e território."},"gabarito":"E","comentario":"As características territoriais e hidrográficas do Pará tornam relevante a integração entre rodovias, hidrovias, portos e, quando disponível, outros modais. A solução depende da localização, do tipo de carga, do acesso das comunidades e dos impactos envolvidos.","referencia":"Ministério dos Transportes; ANTAQ — corredores logísticos e transporte aquaviário na Amazônia."},{"id":"ATU007","disciplina":"Atualidades","assunto":"Urbanização","dificuldade":"Intermediária","enunciado":"O crescimento de centros urbanos paraenses pode produzir, simultaneamente:","alternativas":{"A":"desaparecimento das diferenças entre áreas urbanas e rurais.","B":"uniformização das condições de vida entre bairros.","C":"eliminação da necessidade de planejamento metropolitano.","D":"redução automática das desigualdades intraurbanas.","E":"maior oferta de serviços e aumento de pressões sobre habitação, mobilidade, saneamento e infraestrutura."},"gabarito":"E","comentario":"A urbanização concentra oportunidades e serviços, mas também amplia demandas por moradia, mobilidade, saneamento e equipamentos públicos, sobretudo quando o crescimento ocorre de forma desigual.","referencia":"IBGE — Censo Demográfico 2022; características dos domicílios e urbanização."},{"id":"ATU008","disciplina":"Atualidades","assunto":"Densidade demográfica","dificuldade":"Fácil","enunciado":"A densidade demográfica média de um estado deve ser interpretada com cautela porque:","alternativas":{"A":"pode esconder fortes diferenças de concentração populacional entre áreas e municípios.","B":"é calculada somente com a população economicamente ativa.","C":"mede apenas a população urbana da capital.","D":"corresponde ao número de municípios por quilômetro quadrado.","E":"não utiliza a área territorial em seu cálculo."},"gabarito":"A","comentario":"A densidade resulta da divisão da população pela área. Como é uma média, não revela por si só as diferenças internas de concentração populacional.","referencia":"IBGE — Censo Demográfico 2022."},{"id":"ATU009","disciplina":"Atualidades","assunto":"Rede urbana","dificuldade":"Difícil","enunciado":"Para compreender a rede urbana do Pará, é mais adequado analisar:","alternativas":{"A":"os fluxos de pessoas, mercadorias e serviços entre cidades, além do tamanho populacional de cada centro.","B":"exclusivamente o número de bairros de cada cidade.","C":"a ideia de que todos os municípios exercem funções urbanas equivalentes.","D":"somente a distância em linha reta entre as sedes municipais.","E":"apenas a posição geográfica da capital."},"gabarito":"A","comentario":"Rede urbana envolve relações funcionais entre centros, como deslocamentos, oferta de serviços, comércio e conexões logísticas. O tamanho populacional é apenas um dos elementos da análise.","referencia":"IBGE — Regiões de Influência das Cidades (REGIC)."},{"id":"ATU010","disciplina":"Atualidades","assunto":"Censo e estimativas populacionais","dificuldade":"Intermediária","enunciado":"Ao comparar a população do Pará registrada no Censo 2022 com uma estimativa populacional de 2026, é correto afirmar que:","alternativas":{"A":"a estimativa anual corresponde a uma nova contagem completa de todos os domicílios.","B":"a estimativa de 2026 substitui retroativamente o resultado do Censo 2022.","C":"somente o Censo pode ser utilizado em políticas públicas posteriores.","D":"Censo e estimativa são produtos estatísticos distintos e devem ser identificados pelo respectivo ano e método.","E":"os dois números devem ser idênticos, pois medem a mesma data de referência."},"gabarito":"D","comentario":"O Censo é uma operação de recenseamento com data de referência específica. Estimativas intercensitárias são produzidas por métodos estatísticos e se referem a anos distintos.","referencia":"IBGE — Censo Demográfico 2022; Estimativas da População 2026."},{"id":"ATU011","disciplina":"Atualidades","assunto":"Cabanagem e história do Pará","dificuldade":"Fácil","enunciado":"A Cabanagem, episódio marcante da história paraense, ocorreu principalmente entre:","alternativas":{"A":"1922 e 1927.","B":"1763 e 1768.","C":"1808 e 1812.","D":"1889 e 1894.","E":"1835 e 1840."},"gabarito":"E","comentario":"A Cabanagem foi uma revolta ocorrida na então Província do Grão-Pará entre 1835 e 1840, durante o Período Regencial brasileiro.","referencia":"Fundação Cultural do Pará — acervo sobre a Cabanagem; ALEPA — Memorial Legislativo."},{"id":"ATU012","disciplina":"Atualidades","assunto":"Cabanagem e participação social","dificuldade":"Intermediária","enunciado":"Uma característica que torna a Cabanagem especialmente relevante para a história política e social do Pará é o fato de que:","alternativas":{"A":"foi uma guerra internacional entre Brasil e Portugal.","B":"ocorreu no século XX, após a Proclamação da República.","C":"o movimento ocorreu exclusivamente fora da Amazônia.","D":"grupos revoltosos chegaram a assumir o governo provincial em Belém durante o conflito.","E":"não envolveu setores populares da sociedade paraense."},"gabarito":"D","comentario":"A Cabanagem envolveu diferentes grupos sociais e, em 1835, os revoltosos tomaram Belém e chegaram ao governo da província, o que lhe confere destaque entre os conflitos do período regencial.","referencia":"ALEPA — 190 anos da Cabanagem; Fundação Cultural do Pará — acervo histórico."},{"id":"ATU013","disciplina":"Atualidades","assunto":"Patrimônio material e imaterial","dificuldade":"Intermediária","enunciado":"A distinção correta entre patrimônio cultural material e imaterial é:","alternativas":{"A":"o material se relaciona a bens físicos e conjuntos protegidos, enquanto o imaterial abrange práticas, saberes, celebrações e formas de expressão.","B":"o patrimônio material não pode incluir paisagens culturais.","C":"o patrimônio material é apenas natural e o imaterial é apenas arquitetônico.","D":"o patrimônio imaterial pode ser protegido somente por tombamento.","E":"o patrimônio imaterial deve permanecer inalterado ao longo do tempo."},"gabarito":"A","comentario":"O Iphan utiliza instrumentos distintos conforme a natureza do bem. O tombamento é central na proteção de bens materiais, enquanto o registro é utilizado para bens culturais imateriais.","referencia":"IPHAN — Patrimônio Material; Patrimônio Imaterial."},{"id":"ATU014","disciplina":"Atualidades","assunto":"Ver-o-Peso e patrimônio material","dificuldade":"Fácil","enunciado":"O conjunto arquitetônico e paisagístico do Ver-o-Peso, em Belém, possui proteção federal do Iphan desde:","alternativas":{"A":"1999.","B":"1958.","C":"2012.","D":"1940.","E":"1977."},"gabarito":"E","comentario":"O Iphan informa que o conjunto arquitetônico e paisagístico do Ver-o-Peso e áreas adjacentes foi tombado em 1977.","referencia":"IPHAN — Patrimônio Material no Pará."},{"id":"ATU015","disciplina":"Atualidades","assunto":"Centro histórico de Belém","dificuldade":"Intermediária","enunciado":"O tombamento federal, em 2012, do conjunto arquitetônico, urbanístico e paisagístico dos bairros Cidade Velha e Campina, em Belém, tem como finalidade principal:","alternativas":{"A":"proteger valores históricos, urbanísticos, arquitetônicos e paisagísticos do núcleo histórico.","B":"substituir a gestão municipal pelo Iphan em todas as matérias urbanas.","C":"impedir toda intervenção de conservação ou restauração.","D":"proibir qualquer uso residencial ou comercial nos bairros.","E":"transformar todas as edificações em museus estatais."},"gabarito":"A","comentario":"O tombamento protege os valores culturais do conjunto e sujeita intervenções relevantes às regras de preservação, sem transformar automaticamente todos os imóveis em museus nem extinguir outras competências públicas.","referencia":"IPHAN — Belém (PA): conjuntos urbanos tombados."},{"id":"ATU016","disciplina":"Atualidades","assunto":"Círio de Nazaré","dificuldade":"Fácil","enunciado":"O Círio de Nossa Senhora de Nazaré foi registrado pelo Iphan como Patrimônio Cultural do Brasil em:","alternativas":{"A":"1988.","B":"2004.","C":"1996.","D":"2013.","E":"2010."},"gabarito":"B","comentario":"O Círio foi inscrito no Livro de Registro das Celebrações em 2004.","referencia":"IPHAN — Círio de Nossa Senhora de Nazaré."},{"id":"ATU017","disciplina":"Atualidades","assunto":"Círio de Nazaré e UNESCO","dificuldade":"Fácil","enunciado":"Em 2013, o Círio de Nazaré recebeu da UNESCO o reconhecimento de:","alternativas":{"A":"Patrimônio Natural da Humanidade.","B":"Patrimônio Cultural Imaterial da Humanidade.","C":"Reserva Mundial da Biosfera.","D":"Geoparque Mundial.","E":"Patrimônio Documental do Programa Memória do Mundo."},"gabarito":"B","comentario":"A UNESCO inscreveu o Círio de Nazaré, realizado em Belém, na Lista Representativa do Patrimônio Cultural Imaterial da Humanidade em 2013.","referencia":"UNESCO — Decision 8.COM 8.7; IPHAN — Círio de Nazaré."},{"id":"ATU018","disciplina":"Atualidades","assunto":"Carimbó","dificuldade":"Fácil","enunciado":"O Carimbó foi reconhecido pelo Iphan como Patrimônio Cultural do Brasil em 2014 e inscrito no Livro de Registro das:","alternativas":{"A":"Celebrações.","B":"Saberes.","C":"Formas de Expressão.","D":"Lugares.","E":"Belas Artes."},"gabarito":"C","comentario":"O registro do Carimbó foi aprovado em 2014 e o bem foi inscrito no Livro de Registro das Formas de Expressão.","referencia":"IPHAN — Registro do Carimbó como Patrimônio Cultural do Brasil."},{"id":"ATU019","disciplina":"Atualidades","assunto":"Modos de Fazer Cuias do Baixo Amazonas","dificuldade":"Intermediária","enunciado":"O registro dos Modos de Fazer Cuias do Baixo Amazonas pelo Iphan, em 2015, evidencia a valorização de:","alternativas":{"A":"uma unidade de conservação de proteção integral.","B":"uma técnica de mineração tradicional do sudeste paraense.","C":"saberes e técnicas artesanais transmitidos em comunidades do Baixo Amazonas.","D":"uma obra arquitetônica tombada no centro de Belém.","E":"um processo industrial de produção em série sem vínculo comunitário."},"gabarito":"C","comentario":"O bem foi inscrito no Livro de Registro dos Saberes e envolve conhecimentos artesanais associados, entre outros territórios, a comunidades de Santarém e Monte Alegre.","referencia":"IPHAN — Modos de Fazer Cuias do Baixo Amazonas."},{"id":"ATU020","disciplina":"Atualidades","assunto":"Festividades de São Sebastião no Marajó","dificuldade":"Fácil","enunciado":"As Festividades do Glorioso São Sebastião registradas pelo Iphan como Patrimônio Cultural do Brasil estão associadas especialmente:","alternativas":{"A":"à fronteira entre Pará e Tocantins.","B":"ao sudeste paraense exclusivamente.","C":"ao distrito industrial de Barcarena.","D":"à região do Marajó.","E":"à Região Metropolitana de Belém exclusivamente."},"gabarito":"D","comentario":"O registro refere-se às Festividades do Glorioso São Sebastião na região do Marajó, reconhecidas como patrimônio cultural em 2013.","referencia":"IPHAN — Festividades do Glorioso São Sebastião na região do Marajó."},{"id":"ATU021","disciplina":"Atualidades","assunto":"Censo e população quilombola","dificuldade":"Intermediária","enunciado":"O Censo Demográfico 2022 representou um marco para a produção de informações sobre a população quilombola porque:","alternativas":{"A":"foi o primeiro Censo brasileiro a incluir identificação censitária específica dessa população em escala nacional.","B":"deixou de coletar informações em áreas rurais.","C":"eliminou a autodeclaração como critério de identificação.","D":"substituiu os processos jurídicos de reconhecimento territorial.","E":"restringiu a coleta somente a territórios já titulados."},"gabarito":"A","comentario":"O Censo 2022 foi o primeiro recenseamento nacional a produzir dados específicos sobre pessoas quilombolas, ampliando a base de informações para políticas públicas.","referencia":"IBGE — Censo Demográfico 2022: Quilombolas."},{"id":"ATU022","disciplina":"Atualidades","assunto":"População quilombola no Pará","dificuldade":"Difícil","enunciado":"A produção de dados censitários específicos sobre a população quilombola do Pará amplia a capacidade do poder público de:","alternativas":{"A":"transformar automaticamente todo domicílio quilombola recenseado em território titulado.","B":"presumir que todas as comunidades quilombolas apresentam as mesmas condições sociais e territoriais.","C":"substituir a autodeclaração censitária por critérios definidos exclusivamente pela administração pública.","D":"dispensar consultas às comunidades quando uma política pública as afetar diretamente.","E":"identificar distribuição territorial e características sociodemográficas para qualificar diagnósticos e políticas públicas, sem substituir processos jurídicos de reconhecimento territorial."},"gabarito":"E","comentario":"Os dados censitários qualificam diagnósticos e planejamento, mas não substituem procedimentos jurídicos de reconhecimento territorial nem mecanismos de participação social.","referencia":"IBGE — Censo Demográfico 2022: Quilombolas, primeiros resultados do universo."},{"id":"ATU023","disciplina":"Atualidades","assunto":"Povos indígenas e Constituição","dificuldade":"Fácil","enunciado":"A Constituição Federal de 1988 reconhece aos povos indígenas:","alternativas":{"A":"apenas direitos individuais, sem proteção à organização social.","B":"a obrigação de abandonar suas línguas em documentos e escolas.","C":"a propriedade privada individual das terras indígenas.","D":"a demarcação de terras exclusivamente por decisão municipal.","E":"sua organização social, costumes, línguas, crenças e tradições, além dos direitos originários sobre as terras que tradicionalmente ocupam."},"gabarito":"E","comentario":"O art. 231 reconhece a organização social, os costumes, as línguas, crenças e tradições dos povos indígenas e seus direitos originários sobre as terras tradicionalmente ocupadas.","referencia":"Constituição Federal de 1988, art. 231."},{"id":"ATU024","disciplina":"Atualidades","assunto":"Terras indígenas","dificuldade":"Difícil","enunciado":"No regime constitucional brasileiro, as terras tradicionalmente ocupadas pelos povos indígenas:","alternativas":{"A":"podem ser alienadas livremente pelas comunidades.","B":"deixam de ser protegidas quando há interesse econômico externo.","C":"pertencem aos municípios após a demarcação.","D":"são bens da União, assegurada aos povos indígenas a posse permanente e o usufruto exclusivo das riquezas do solo, rios e lagos, nos termos constitucionais.","E":"são propriedades privadas individuais livremente negociáveis."},"gabarito":"D","comentario":"A Constituição inclui essas terras entre os bens da União e garante direitos de posse permanente e usufruto nos termos do art. 231.","referencia":"Constituição Federal de 1988, arts. 20, XI, e 231."},{"id":"ATU025","disciplina":"Atualidades","assunto":"Comunidades quilombolas e território","dificuldade":"Intermediária","enunciado":"O art. 68 do Ato das Disposições Constitucionais Transitórias reconhece aos remanescentes das comunidades dos quilombos que estejam ocupando suas terras:","alternativas":{"A":"somente indenização financeira, sem direito territorial.","B":"propriedade condicionada à transformação da área em unidade de conservação.","C":"apenas direito temporário de uso por cinco anos.","D":"a obrigação de deixar a área após o reconhecimento cultural.","E":"a propriedade definitiva, devendo o Estado emitir os títulos respectivos."},"gabarito":"E","comentario":"O art. 68 do ADCT reconhece a propriedade definitiva das terras ocupadas pelos remanescentes das comunidades dos quilombos, com dever estatal de titulação.","referencia":"Constituição Federal de 1988 — ADCT, art. 68."},{"id":"ATU026","disciplina":"Atualidades","assunto":"Povos e comunidades tradicionais","dificuldade":"Intermediária","enunciado":"Uma política de desenvolvimento voltada a povos e comunidades tradicionais da Amazônia é mais coerente com a sustentabilidade quando:","alternativas":{"A":"desconsidera o uso comunitário de recursos naturais.","B":"substitui conhecimentos tradicionais por modelos produtivos uniformes.","C":"retira comunidades de seus territórios como regra de conservação.","D":"proíbe indistintamente toda atividade produtiva tradicional.","E":"combina conservação ambiental, reconhecimento dos modos de vida, participação social e geração sustentável de renda."},"gabarito":"E","comentario":"A política nacional para povos e comunidades tradicionais articula desenvolvimento sustentável, respeito aos modos de vida, territórios e participação social.","referencia":"Decreto Federal nº 6.040/2007 — Política Nacional de Desenvolvimento Sustentável dos Povos e Comunidades Tradicionais."},{"id":"ATU027","disciplina":"Atualidades","assunto":"Diversidade cultural","dificuldade":"Difícil","enunciado":"Uma abordagem educacional adequada à diversidade cultural paraense deve:","alternativas":{"A":"tratar povos indígenas e quilombolas apenas como referências históricas do passado.","B":"considerar legítimas somente manifestações já registradas pelo poder público.","C":"eliminar diferenças regionais para uniformizar o currículo.","D":"reconhecer a pluralidade de povos, identidades, práticas e saberes, evitando tratar a cultura do estado como homogênea.","E":"escolher uma única manifestação como representante de todo o Pará."},"gabarito":"D","comentario":"O Pará reúne grande diversidade cultural e territorial. A educação pode tratar essa pluralidade de modo contextualizado, sem reduzir grupos contemporâneos a estereótipos ou a uma cultura única.","referencia":"Edital nº 001/2026 SEPLAD/SEDUC — Conteúdo de Atualidades; Constituição Federal de 1988, arts. 215 e 216."},{"id":"ATU028","disciplina":"Atualidades","assunto":"Salvaguarda do patrimônio imaterial","dificuldade":"Intermediária","enunciado":"Nas políticas de salvaguarda do patrimônio imaterial, a participação dos grupos detentores é importante porque:","alternativas":{"A":"o registro transforma as manifestações em propriedade exclusiva do Estado.","B":"os bens imateriais dependem das comunidades que os praticam, recriam e transmitem ao longo do tempo.","C":"a proteção exige que a prática permaneça exatamente igual para sempre.","D":"os detentores devem ser substituídos por especialistas externos após o registro.","E":"a salvaguarda se limita à conservação física de edifícios."},"gabarito":"B","comentario":"Patrimônio imaterial é vivo e dinâmico. A salvaguarda busca favorecer sua continuidade e transmissão, com participação dos grupos que lhe atribuem sentido.","referencia":"IPHAN — Patrimônio Imaterial e ações de salvaguarda."},{"id":"ATU029","disciplina":"Atualidades","assunto":"Capoeira e patrimônio cultural","dificuldade":"Fácil","enunciado":"A Roda de Capoeira e o Ofício dos Mestres de Capoeira aparecem nas referências de patrimônio imaterial do Pará porque:","alternativas":{"A":"são bens culturais de abrangência nacional que também possuem detentores e práticas no estado.","B":"foram criados por decreto estadual paraense.","C":"são bens exclusivos do Pará e inexistem em outros estados.","D":"são patrimônios restritos ao município de Belém.","E":"são classificados como patrimônio natural."},"gabarito":"A","comentario":"A Roda de Capoeira e o Ofício dos Mestres de Capoeira têm registro nacional, e ações de salvaguarda ocorrem também no Pará.","referencia":"IPHAN — Patrimônio Imaterial no Pará; bens registrados de abrangência nacional."},{"id":"ATU030","disciplina":"Atualidades","assunto":"Patrimônio, cultura e laicidade","dificuldade":"Difícil","enunciado":"O reconhecimento do Círio de Nazaré como patrimônio cultural não equivale à adoção de uma religião oficial pelo Estado porque:","alternativas":{"A":"o reconhecimento exclui pessoas de outras crenças do espaço público.","B":"o patrimônio cultural só pode ser reconhecido quando é secular e não religioso.","C":"o registro transforma a doutrina religiosa em norma estatal.","D":"a proteção patrimonial considera os valores históricos, culturais, sociais e identitários da manifestação, sem impor adesão religiosa.","E":"a proteção obriga todos os cidadãos a participar da celebração."},"gabarito":"D","comentario":"O valor patrimonial de uma celebração pode ser reconhecido por sua relevância cultural e histórica. Isso é distinto de estabelecer religião oficial, vedação decorrente do caráter laico do Estado.","referencia":"IPHAN — Círio de Nazaré; Constituição Federal de 1988, arts. 5º e 19."},{"id":"ATU031","disciplina":"Atualidades","assunto":"Exportações do Pará","dificuldade":"Fácil","enunciado":"Na pauta de exportações do Pará em 2025, segundo a FAPESPA com base em dados de comércio exterior, o produto de maior valor entre os principais itens foi:","alternativas":{"A":"automóveis de passeio.","B":"açúcar de cana refinado.","C":"trigo em grão.","D":"café não torrado.","E":"minério de ferro e seus concentrados não aglomerados."},"gabarito":"E","comentario":"O minério de ferro não aglomerado permaneceu como o principal item da pauta paraense de exportação em 2025, com valor superior aos demais produtos listados.","referencia":"FAPESPA — Pará em Números 2025, pauta de exportações."},{"id":"ATU032","disciplina":"Atualidades","assunto":"Commodities e economia","dificuldade":"Intermediária","enunciado":"Uma economia com forte participação de commodities minerais e agropecuárias tende a ficar mais exposta a:","alternativas":{"A":"oscilações de preços internacionais, demanda externa e condições cambiais.","B":"estabilidade garantida das receitas em qualquer cenário internacional.","C":"independência completa da infraestrutura de transporte.","D":"desaparecimento do setor de serviços.","E":"eliminação da necessidade de diversificação produtiva."},"gabarito":"A","comentario":"Commodities são negociadas em mercados amplos e seus preços variam conforme oferta, demanda, câmbio e conjuntura global, o que pode afetar exportações, renda e arrecadação.","referencia":"FAPESPA — Pará em Números 2025; MDIC — estatísticas de comércio exterior."},{"id":"ATU033","disciplina":"Atualidades","assunto":"Mineração e inserção econômica","dificuldade":"Intermediária","enunciado":"A relevância da mineração para o Pará pode ser observada, entre outros aspectos, pela:","alternativas":{"A":"ausência de minérios na pauta de exportações.","B":"forte presença de produtos minerais entre os principais itens exportados pelo estado.","C":"substituição integral da mineração pela agricultura familiar.","D":"inexistência de municípios com atividade mineral relevante.","E":"proibição de exportação de minérios produzidos no estado."},"gabarito":"B","comentario":"Minério de ferro, minério de cobre e alumina aparecem entre os principais produtos exportados do Pará, mostrando a importância das cadeias minerais na inserção econômica estadual.","referencia":"FAPESPA — Pará em Números 2025; MDIC — Comex Stat."},{"id":"ATU034","disciplina":"Atualidades","assunto":"Encadeamentos produtivos","dificuldade":"Difícil","enunciado":"Para ampliar os efeitos econômicos locais de grandes cadeias minerais, uma política de desenvolvimento pode priorizar:","alternativas":{"A":"eliminação do licenciamento ambiental para acelerar projetos.","B":"concentração de todo investimento em um único município, independentemente dos impactos.","C":"proibição de empresas locais fornecerem para grandes empreendimentos.","D":"qualificação profissional, fornecedores locais, inovação e etapas de beneficiamento, sem dispensar as exigências socioambientais.","E":"exportação exclusiva de matéria-prima e redução da qualificação profissional."},"gabarito":"D","comentario":"Encadeamentos produtivos e agregação de valor podem ampliar emprego e renda locais. Isso não elimina a necessidade de licenciamento, prevenção de impactos e proteção de direitos.","referencia":"FAPESPA — estudos socioeconômicos; legislação ambiental brasileira."},{"id":"ATU035","disciplina":"Atualidades","assunto":"Açaí e economia regional","dificuldade":"Fácil","enunciado":"O açaí exemplifica uma característica importante da economia paraense porque:","alternativas":{"A":"combina forte valor alimentar e cultural regional com cadeias produtivas que alcançam mercados nacionais e internacionais.","B":"é um produto mineral beneficiado em Barcarena.","C":"não possui relação com comunidades ribeirinhas ou extrativistas.","D":"é produzido exclusivamente para exportação e não integra a alimentação local.","E":"sua produção ocorre apenas em áreas urbanas."},"gabarito":"A","comentario":"O açaí é parte marcante da alimentação e cultura paraenses e também integra cadeias comerciais amplas, com produção extrativa e cultivada em diferentes áreas do estado.","referencia":"IBGE — Produção da Extração Vegetal e da Silvicultura; Produção Agrícola Municipal; FAPESPA — estudos sobre a economia do açaí."},{"id":"ATU036","disciplina":"Atualidades","assunto":"Bioeconomia","dificuldade":"Intermediária","enunciado":"No contexto amazônico, bioeconomia pode ser entendida como:","alternativas":{"A":"substituição de todos os produtos florestais por produtos sintéticos.","B":"extração ilimitada de recursos naturais sem considerar regeneração.","C":"atividade exclusivamente digital e sem relação com recursos biológicos.","D":"proibição de qualquer atividade econômica baseada na floresta.","E":"geração de valor a partir de recursos biológicos, conhecimentos e inovação, com uso sustentável da biodiversidade."},"gabarito":"E","comentario":"A bioeconomia amazônica busca associar biodiversidade, conhecimento, inovação e cadeias produtivas a práticas de conservação e desenvolvimento local.","referencia":"FAPESPA — Análise Preliminar da Bioeconomia da Sociobiodiversidade no Estado do Pará; Governo do Pará — estratégias de bioeconomia."},{"id":"ATU037","disciplina":"Atualidades","assunto":"Bioeconomia e repartição de benefícios","dificuldade":"Difícil","enunciado":"Uma cadeia de bioeconomia que utiliza patrimônio genético e conhecimento tradicional associado deve observar, quando aplicável:","alternativas":{"A":"proibição absoluta de pesquisa científica com biodiversidade.","B":"exclusão dos grupos detentores do conhecimento das cadeias de valor.","C":"regras de acesso, rastreabilidade e repartição de benefícios com os detentores do conhecimento.","D":"dispensa de regras quando o recurso biológico existe na Amazônia.","E":"apropriação comercial irrestrita de qualquer conhecimento tradicional."},"gabarito":"C","comentario":"A legislação brasileira prevê regras para acesso ao patrimônio genético e ao conhecimento tradicional associado e mecanismos de repartição de benefícios.","referencia":"Lei Federal nº 13.123/2015; Convenção sobre Diversidade Biológica."},{"id":"ATU038","disciplina":"Atualidades","assunto":"Agropecuária e logística","dificuldade":"Intermediária","enunciado":"A expansão de cadeias agropecuárias no Pará aumenta a importância do planejamento logístico porque:","alternativas":{"A":"rodovias e portos têm função apenas urbana.","B":"a logística não interfere em custos de comercialização.","C":"produção em grande escala depende de corredores eficientes para insumos, abastecimento e escoamento.","D":"a agropecuária é desconectada do mercado nacional.","E":"produtos agropecuários não precisam de transporte de longa distância."},"gabarito":"C","comentario":"Infraestrutura de transporte influencia custos, tempos de viagem e competitividade de cadeias agropecuárias, sobretudo em territórios extensos.","referencia":"FAPESPA — Pará em Números 2025; Ministério dos Transportes."},{"id":"ATU039","disciplina":"Atualidades","assunto":"Atividades produtivas","dificuldade":"Intermediária","enunciado":"A presença, na pauta de exportações paraense de 2025, de minério de ferro, cobre, alumina, soja e carne bovina indica:","alternativas":{"A":"inexistência de integração com mercados internacionais.","B":"predomínio absoluto de automóveis e eletrônicos.","C":"dependência exclusiva do setor de turismo.","D":"uma estrutura produtiva com participação relevante de cadeias minerais e agropecuárias.","E":"ausência de produtos primários e semiprocessados nas exportações."},"gabarito":"D","comentario":"A composição da pauta mostra a relevância simultânea de cadeias minerais e agropecuárias na economia exportadora paraense.","referencia":"FAPESPA — Pará em Números 2025, pauta de exportações."},{"id":"ATU040","disciplina":"Atualidades","assunto":"Diversificação econômica","dificuldade":"Difícil","enunciado":"Uma política voltada a reduzir vulnerabilidades associadas à dependência de poucos produtos de exportação deve favorecer:","alternativas":{"A":"redução dos investimentos em ciência e tecnologia.","B":"diversificação produtiva, inovação, agregação de valor e abertura de novos mercados.","C":"proibição do desenvolvimento do setor de serviços.","D":"especialização crescente em um único produto exportável.","E":"desarticulação entre formação profissional e cadeias produtivas."},"gabarito":"B","comentario":"Diversificação pode reduzir exposição a choques específicos e ampliar oportunidades de emprego, renda e inovação.","referencia":"FAPESPA — estudos de desenvolvimento econômico; MDIC — estatísticas de comércio exterior."},{"id":"ATU041","disciplina":"Atualidades","assunto":"Economia urbana e serviços","dificuldade":"Intermediária","enunciado":"O crescimento de centros regionais como Belém, Santarém e Marabá tende a fortalecer o setor de serviços porque essas cidades:","alternativas":{"A":"concentram atividades de comércio, educação, saúde, administração e serviços especializados para áreas de influência mais amplas.","B":"dependem exclusivamente de mineração para qualquer atividade econômica.","C":"não mantêm fluxos com municípios vizinhos.","D":"exercem apenas funções rurais e extrativas.","E":"não participam da rede urbana regional."},"gabarito":"A","comentario":"Centros urbanos de diferentes níveis articulam comércio, serviços e deslocamentos regionais, exercendo influência sobre municípios próximos e redes mais amplas.","referencia":"IBGE — REGIC; FAPESPA — estudos socioeconômicos."},{"id":"ATU042","disciplina":"Atualidades","assunto":"Alumina e cadeia mineral","dificuldade":"Difícil","enunciado":"A presença de alumina calcinada entre os principais produtos exportados pelo Pará é um exemplo de:","alternativas":{"A":"combustível fóssil extraído exclusivamente do litoral paraense.","B":"beneficiamento industrial de matéria-prima mineral antes da exportação.","C":"produto artesanal registrado como patrimônio imaterial.","D":"produto agrícola sem transformação industrial.","E":"serviço digital exportado pelo estado."},"gabarito":"B","comentario":"A alumina é obtida a partir do processamento da bauxita e representa uma etapa industrial da cadeia do alumínio.","referencia":"FAPESPA — Pará em Números 2025; dados de comércio exterior."},{"id":"ATU043","disciplina":"Atualidades","assunto":"Arco Norte e inserção nacional","dificuldade":"Intermediária","enunciado":"A participação do Pará nos corredores do Arco Norte reforça sua inserção no cenário nacional porque:","alternativas":{"A":"seus corredores rodoviários, fluviais e portuários participam do escoamento de cargas de diferentes regiões do país.","B":"o Arco Norte é uma rede exclusiva de transporte urbano de Belém.","C":"o sistema opera sem qualquer conexão com hidrovias.","D":"os portos paraenses movimentam somente cargas produzidas na capital.","E":"a logística estadual não se conecta ao Centro-Oeste."},"gabarito":"A","comentario":"O Arco Norte reúne corredores multimodais que conectam áreas produtoras a terminais e portos da Região Norte, incluindo instalações no Pará.","referencia":"DNIT — Arco Norte; Ministério dos Transportes; ANTAQ."},{"id":"ATU044","disciplina":"Atualidades","assunto":"Comércio exterior","dificuldade":"Fácil","enunciado":"Entre os produtos listados pela FAPESPA como destaques da pauta exportadora paraense em 2025 estão:","alternativas":{"A":"carvão mineral, trigo, vinho, automóveis e café.","B":"minério de ferro, minério de cobre, alumina, soja e carne bovina.","C":"petróleo bruto, gás natural, café, automóveis e trigo.","D":"máquinas agrícolas, vinho, frutas temperadas, carvão e trigo.","E":"aviões, semicondutores, azeite, trigo e algodão."},"gabarito":"B","comentario":"A pauta de 2025 apresenta forte presença de produtos minerais e agropecuários, entre eles minério de ferro, cobre, alumina, soja e carne bovina.","referencia":"FAPESPA — Pará em Números 2025, principais produtos da pauta de exportação."},{"id":"ATU045","disciplina":"Atualidades","assunto":"Desenvolvimento regional","dificuldade":"Difícil","enunciado":"Uma estratégia de desenvolvimento regional que pretenda reter mais renda no Pará tende a combinar:","alternativas":{"A":"isolamento entre universidades, empresas e setor público.","B":"infraestrutura, qualificação, inovação, agregação de valor e fortalecimento de fornecedores locais.","C":"redução da formação profissional para diminuir custos.","D":"concentração deliberada de todos os investimentos em uma única atividade.","E":"dependência exclusiva de exportação de matéria-prima."},"gabarito":"B","comentario":"O desenvolvimento regional pode ampliar seus efeitos quando articula infraestrutura, capital humano, inovação e encadeamentos produtivos.","referencia":"FAPESPA — estudos de desenvolvimento regional e socioeconômico."},{"id":"ATU046","disciplina":"Atualidades","assunto":"BR-163 no Pará","dificuldade":"Fácil","enunciado":"A BR-163, importante corredor logístico, chega no Pará ao município de:","alternativas":{"A":"Belém.","B":"Marabá.","C":"Santarém.","D":"Tucuruí.","E":"Salinópolis."},"gabarito":"C","comentario":"O DNIT informa que a BR-163 conecta o Sul, Centro-Oeste e Norte e chega ao município paraense de Santarém.","referencia":"DNIT — BR-163/PA."},{"id":"ATU047","disciplina":"Atualidades","assunto":"BR-163 e Miritituba","dificuldade":"Intermediária","enunciado":"A importância logística de Miritituba, distrito de Itaituba, está relacionada principalmente à:","alternativas":{"A":"presença de terminais de transbordo que recebem cargas rodoviárias e as transferem para o transporte fluvial.","B":"função exclusivamente turística, sem movimentação de cargas.","C":"produção de minério de ferro no próprio terminal portuário.","D":"ausência de conexão com a BR-163.","E":"concentração exclusiva de aeroportos internacionais de carga."},"gabarito":"A","comentario":"Miritituba funciona como ponto de transbordo de cargas que chegam pela BR-163 e seguem por vias fluviais em direção a outros terminais e portos.","referencia":"DNIT — BR-163/PA e Miritituba; ANTAQ."},{"id":"ATU048","disciplina":"Atualidades","assunto":"Transporte multimodal","dificuldade":"Intermediária","enunciado":"Quando uma carga percorre rodovia até um terminal fluvial e depois segue por hidrovia até um porto marítimo, ocorre:","alternativas":{"A":"substituição da logística por transporte urbano.","B":"integração multimodal de transportes.","C":"uso exclusivo de transporte rodoviário.","D":"desconexão entre redes de transporte.","E":"municipalização automática da infraestrutura."},"gabarito":"B","comentario":"A combinação coordenada de diferentes modais em um mesmo fluxo logístico caracteriza integração multimodal.","referencia":"Ministério dos Transportes; ANTAQ — planejamento logístico."},{"id":"ATU049","disciplina":"Atualidades","assunto":"Porto de Vila do Conde","dificuldade":"Fácil","enunciado":"O Porto Organizado de Vila do Conde localiza-se no município paraense de:","alternativas":{"A":"Marabá.","B":"Altamira.","C":"Barcarena.","D":"Santarém.","E":"Óbidos."},"gabarito":"C","comentario":"O Porto Organizado de Vila do Conde situa-se em Barcarena e integra cadeias logísticas relevantes para o estado.","referencia":"ANTAQ — Porto Organizado de Vila do Conde."},{"id":"ATU050","disciplina":"Atualidades","assunto":"Arco Norte","dificuldade":"Intermediária","enunciado":"Entre instalações e corredores do Arco Norte com participação do Pará, destacam-se:","alternativas":{"A":"apenas aeroportos da Região Metropolitana de Belém.","B":"somente ferrovias sem conexão portuária.","C":"Santarém, Barcarena/Vila do Conde e Miritituba como pontos relevantes de corredores de escoamento.","D":"apenas rodovias urbanas sem terminais de transbordo.","E":"exclusivamente portos localizados no Sul do Brasil."},"gabarito":"C","comentario":"O Arco Norte reúne corredores multimodais e utiliza portos e terminais na Região Norte, incluindo estruturas no Pará.","referencia":"DNIT — Arco Norte; ANTAQ."},{"id":"ATU051","disciplina":"Atualidades","assunto":"Energia — UHE Tucuruí","dificuldade":"Fácil","enunciado":"A Usina Hidrelétrica de Tucuruí foi construída no rio:","alternativas":{"A":"Xingu.","B":"Jari.","C":"Guamá.","D":"Tocantins.","E":"Tapajós."},"gabarito":"D","comentario":"A UHE Tucuruí utiliza o potencial hidrelétrico do rio Tocantins e é uma das grandes infraestruturas energéticas da Amazônia.","referencia":"Eletrobras Eletronorte — Usina Hidrelétrica de Tucuruí."},{"id":"ATU052","disciplina":"Atualidades","assunto":"Hidrelétricas e impactos","dificuldade":"Intermediária","enunciado":"A avaliação de grandes projetos hidrelétricos deve considerar, além da geração de energia:","alternativas":{"A":"a dispensa de licenciamento por se tratar de energia renovável.","B":"apenas a potência instalada em megawatts.","C":"impactos socioambientais, alterações hidrológicas, efeitos territoriais e medidas de prevenção, mitigação e compensação.","D":"a ideia de que usinas hidrelétricas não provocam mudanças territoriais.","E":"somente o custo de construção da barragem."},"gabarito":"C","comentario":"A geração hidrelétrica é renovável, mas barragens podem produzir impactos ambientais e sociais relevantes, que exigem avaliação e licenciamento.","referencia":"Constituição Federal de 1988, art. 225; legislação de licenciamento ambiental."},{"id":"ATU053","disciplina":"Atualidades","assunto":"Transporte fluvial","dificuldade":"Fácil","enunciado":"Em várias áreas do Pará, o transporte aquaviário possui papel estratégico porque:","alternativas":{"A":"todos os municípios são acessíveis somente por barco.","B":"hidrovias não necessitam de sinalização, gestão ou infraestrutura.","C":"o transporte rodoviário é inexistente no estado.","D":"rios funcionam como eixos de mobilidade de pessoas e mercadorias e conectam comunidades e centros urbanos.","E":"as condições de navegabilidade são idênticas durante todo o ano."},"gabarito":"D","comentario":"A rede hidrográfica é central em muitos territórios paraenses, embora condições de navegação e infraestrutura variem no tempo e no espaço.","referencia":"ANTAQ — transporte aquaviário e hidrovias da Região Norte."},{"id":"ATU054","disciplina":"Atualidades","assunto":"Portos e cadeias produtivas","dificuldade":"Intermediária","enunciado":"A expansão da capacidade portuária pode aumentar a competitividade de cadeias produtivas quando:","alternativas":{"A":"elimina a necessid
