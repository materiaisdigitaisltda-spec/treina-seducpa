<!doctype html>
<!-- TREINA SEDUC-PA | arquivo único: HTML + CSS + JavaScript + logo + 500 questões incorporadas -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#B7192E" />
  <meta name="description" content="TREINA SEDUC-PA — plataforma de 500 questões comentadas para treino do Bloco Geral." />
  <title>TREINA SEDUC-PA — 500 Questões</title>
  <style>
:root {
  --primary: #B7192E;
  --primary-deep: #7F1020;
  --primary-soft: #F8E7EA;
  --secondary: #123B67;
  --secondary-soft: #DCE8F2;
  --background: #FFFDF8;
  --surface: #FFFFFF;
  --surface-alt: #F2F4F6;
  --text: #202A33;
  --text-strong: #141B22;
  --muted: #66717C;
  --border: #DCE2E7;
  --accent: #9BB6CF;
  --favorite: #A66D14;
  --success: #2F7D5A;
  --success-bg: #EAF5EF;
  --danger: #B7192E;
  --danger-bg: #F9E7EA;
  --warning: #946512;
  --warning-bg: #FFF4D8;
  --info-bg: #EAF1F8;
  --white: #FFFFFF;
  --shadow: 0 10px 30px rgba(18, 59, 103, .07);
  --shadow-lg: 0 18px 50px rgba(18, 59, 103, .12);
  --radius: 18px;
  --radius-sm: 12px;
  --sidebar: 250px;
  --content-max: 1220px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --primary: #F05D70;
    --primary-deep: #FF8593;
    --primary-soft: #3A1D24;
    --secondary: #8DB6E0;
    --secondary-soft: #20354A;
    --background: #0F1318;
    --surface: #171D24;
    --surface-alt: #1E2630;
    --text: #DDE4EA;
    --text-strong: #F7F9FB;
    --muted: #9CA8B4;
    --border: #2C3742;
    --accent: #6E8CAE;
    --favorite: #E3B34D;
    --success: #68C295;
    --success-bg: #173127;
    --danger: #F27986;
    --danger-bg: #3A2026;
    --warning: #E9C46A;
    --warning-bg: #342D1C;
    --info-bg: #1B2C3D;
    --white: #FFFFFF;
    --shadow: 0 10px 30px rgba(0, 0, 0, .18);
    --shadow-lg: 0 18px 50px rgba(0, 0, 0, .30);
  }
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  overflow-x: hidden;
  min-height: 100vh;
  background: var(--background);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; }
button { color: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--secondary) 70%, transparent); outline-offset: 2px; }

.app-shell { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar);
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  z-index: 30;
}
.brand {
  border: 0;
  background: transparent;
  display: flex;
  gap: 10px;
  align-items: center;
  text-align: left;
  padding: 4px 6px 18px;
  cursor: pointer;
}
.brand img { width: 74px; height: 54px; object-fit: contain; border-radius: 14px; }
.brand-copy { min-width: 0; display: flex; flex-direction: column; }
.brand-copy strong { color: var(--text-strong); font-size: .92rem; letter-spacing: -.01em; }
.brand-copy small { color: var(--muted); }
.side-nav { display: grid; gap: 5px; }
.nav-item {
  border: 0;
  background: transparent;
  padding: 11px 12px;
  border-radius: 12px;
  text-align: left;
  display: flex;
  gap: 10px;
  align-items: center;
  cursor: pointer;
  color: var(--text);
  transition: .16s ease;
}
.nav-item span { width: 20px; text-align: center; font-weight: 700; }
.nav-item:hover { background: var(--surface-alt); color: var(--primary); }
.nav-item.is-active { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
.sidebar-footer { margin-top: auto; padding: 12px 6px 4px; }
.bank-status { font-size: .78rem; color: var(--muted); line-height: 1.35; }

.main-column { grid-column: 2; min-width: 0; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  min-height: 82px;
  background: color-mix(in srgb, var(--background) 88%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid color-mix(in srgb, var(--border) 75%, transparent);
  padding: 14px clamp(18px, 3vw, 38px);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.eyebrow { margin: 0 0 2px; font-size: .72rem; color: var(--primary); text-transform: uppercase; letter-spacing: .12em; font-weight: 800; }
.topbar h1 { margin: 0; color: var(--text-strong); font-size: clamp(1.25rem, 2vw, 1.65rem); letter-spacing: -.03em; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.today-goal { font-size: .82rem; color: var(--muted); white-space: nowrap; }
.icon-btn { display: none; border: 1px solid var(--border); background: var(--surface); border-radius: 11px; width: 42px; height: 42px; cursor: pointer; }

.content { width: min(100%, var(--content-max)); margin: 0 auto; padding: 28px clamp(18px, 3vw, 38px) 80px; }
.section { margin-bottom: 28px; }
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.section-head h2, .section h2 { margin: 0; color: var(--text-strong); font-size: 1.15rem; letter-spacing: -.02em; }
.section-head p, .section-subtitle { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }

.hero {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, color-mix(in srgb, var(--primary) 12%, var(--surface)), var(--surface));
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: clamp(22px, 4vw, 38px);
  box-shadow: var(--shadow);
  display: grid;
  grid-template-columns: 1.35fr .65fr;
  align-items: center;
  gap: 26px;
}
.hero::after {
  content: "";
  position: absolute;
  width: 270px; height: 270px;
  border-radius: 50%;
  right: -95px; top: -125px;
  background: color-mix(in srgb, var(--secondary-soft) 22%, transparent);
}
.hero-copy { position: relative; z-index: 1; }
.hero-kicker { display: inline-flex; align-items: center; gap: 7px; background: var(--primary-soft); color: var(--primary); padding: 6px 10px; border-radius: 999px; font-size: .78rem; font-weight: 800; }
.hero h2 { margin: 12px 0 8px; font-size: clamp(1.6rem, 3vw, 2.35rem); color: var(--text-strong); line-height: 1.12; letter-spacing: -.04em; }
.hero p { margin: 0; max-width: 680px; color: var(--muted); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.hero-art { position: relative; z-index: 1; display: flex; justify-content: center; }
.hero-art img { width: min(100%, 320px); filter: drop-shadow(0 14px 22px rgba(0, 0, 0, .10)); }

.btn {
  border: 1px solid transparent;
  border-radius: 12px;
  min-height: 44px;
  padding: 10px 16px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 750;
  transition: transform .13s ease, box-shadow .13s ease, background .13s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--primary); color: var(--white); box-shadow: 0 7px 18px color-mix(in srgb, var(--primary) 20%, transparent); }
.btn-primary:hover { background: color-mix(in srgb, var(--primary) 88%, #000); }
.btn-secondary { background: var(--surface); color: var(--primary); border-color: var(--border); }
.btn-secondary:hover { border-color: color-mix(in srgb, var(--primary) 45%, var(--border)); }
.btn-soft { background: var(--primary-soft); color: var(--primary); }
.btn-danger { background: var(--danger); color: var(--white); }
.btn-ghost { background: transparent; border-color: var(--border); }
.btn-sm { min-height: 36px; padding: 7px 11px; border-radius: 10px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.stat-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.stat-card, .card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.stat-card { padding: 18px; min-width: 0; }
.stat-label { color: var(--muted); font-size: .78rem; }
.stat-value { margin-top: 5px; color: var(--text-strong); font-weight: 850; font-size: clamp(1.35rem, 2.4vw, 1.75rem); letter-spacing: -.03em; }
.stat-note { margin-top: 2px; font-size: .76rem; color: var(--muted); }

.progress-wrap { margin-top: 16px; }
.progress-track { height: 10px; border-radius: 999px; background: color-mix(in srgb, var(--border) 75%, transparent); overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 999px; transition: width .35s ease; }
.progress-labels { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: .78rem; margin-top: 7px; }

.subject-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
.subject-card { padding: 18px; display: flex; flex-direction: column; min-height: 178px; }
.subject-badge { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-weight: 900; }
.subject-card h3 { margin: 13px 0 5px; color: var(--text-strong); font-size: .98rem; line-height: 1.3; }
.subject-card p { margin: 0 0 14px; color: var(--muted); font-size: .82rem; }
.subject-card .btn { margin-top: auto; width: 100%; }

.two-col { display: grid; grid-template-columns: 1.25fr .75fr; gap: 16px; }
.three-col { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.card { padding: 20px; }
.card h3 { margin: 0 0 8px; color: var(--text-strong); font-size: 1rem; }
.card p { color: var(--muted); }
.card-flat { box-shadow: none; }

.action-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.action-card {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 16px;
  padding: 16px;
  text-align: left;
  cursor: pointer;
  transition: .16s ease;
}
.action-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--primary) 35%, var(--border)); }
.action-card strong { display: block; color: var(--text-strong); margin-bottom: 4px; }
.action-card span { color: var(--muted); font-size: .82rem; }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.form-field { display: grid; gap: 6px; }
.form-field.full { grid-column: 1 / -1; }
.form-field label { font-size: .8rem; font-weight: 750; color: var(--text-strong); }
.input, .select, .textarea {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-strong);
  border-radius: 11px;
  min-height: 44px;
  padding: 9px 11px;
}
.input::placeholder { color: var(--muted); }
.input:focus, .select:focus, .textarea:focus { border-color: var(--secondary); outline: 3px solid color-mix(in srgb, var(--secondary) 15%, transparent); }
.field-hint { font-size: .75rem; color: var(--muted); }
.inline-check { display: flex; gap: 9px; align-items: center; min-height: 44px; }
.inline-check input { width: 18px; height: 18px; accent-color: var(--primary); }

.filter-summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 13px; padding: 12px 14px; margin-top: 16px; }
.filter-summary strong { color: var(--primary); }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 5px 9px; font-size: .74rem; font-weight: 700; background: var(--surface-alt); border: 1px solid var(--border); color: var(--muted); }
.chip.easy { background: var(--success-bg); color: var(--success); border-color: transparent; }
.chip.medium { background: var(--info-bg); color: var(--secondary); border-color: transparent; }
.chip.hard { background: var(--warning-bg); color: var(--warning); border-color: transparent; }

.list { display: grid; gap: 10px; }
.list-item { border: 1px solid var(--border); border-radius: 13px; background: var(--surface); padding: 13px 14px; display: flex; justify-content: space-between; gap: 14px; align-items: center; }
.list-item-main { min-width: 0; }
.list-item-title { color: var(--text-strong); font-weight: 750; overflow-wrap: anywhere; }
.list-item-sub { color: var(--muted); font-size: .8rem; margin-top: 3px; }
.list-item-actions { flex: none; display: flex; gap: 8px; }

.empty-state { text-align: center; padding: 36px 20px; border: 1px dashed var(--border); border-radius: 16px; background: color-mix(in srgb, var(--surface) 70%, transparent); }
.empty-state .empty-icon { font-size: 2rem; }
.empty-state h3 { margin: 8px 0 4px; color: var(--text-strong); }
.empty-state p { margin: 0 auto 15px; max-width: 520px; color: var(--muted); }

.alert { border-radius: 13px; padding: 12px 14px; border: 1px solid var(--border); font-size: .86rem; }
.alert-info { background: var(--info-bg); }
.alert-warning { background: var(--warning-bg); color: var(--warning); border-color: transparent; }
.alert-danger { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
.alert-success { background: var(--success-bg); color: var(--success); border-color: transparent; }

/* Question experience */
.session-shell { max-width: 920px; margin: 0 auto; }
.session-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 14px; }
.session-progress { flex: 1; }
.session-meta { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: .82rem; white-space: nowrap; }
.question-card { padding: clamp(18px, 3.5vw, 30px); }
.question-head { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; margin-bottom: 18px; }
.question-index { color: var(--primary); font-weight: 850; font-size: .84rem; }
.favorite-btn { border: 1px solid var(--border); background: var(--surface-alt); width: 42px; height: 42px; border-radius: 12px; cursor: pointer; font-size: 1.2rem; }
.favorite-btn.is-favorite { color: var(--favorite); background: var(--warning-bg); border-color: transparent; }
.question-text { white-space: pre-wrap; color: var(--text-strong); font-size: clamp(1rem, 1.7vw, 1.12rem); line-height: 1.68; margin: 18px 0 22px; }
.alternatives { display: grid; gap: 10px; }
.alternative { position: relative; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 13px 13px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); transition: .14s ease; }
.alternative.can-select { cursor: pointer; }
.alternative.can-select:hover { border-color: color-mix(in srgb, var(--primary) 40%, var(--border)); background: color-mix(in srgb, var(--primary-soft) 45%, var(--surface)); }
.alt-letter { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--border); color: var(--text-strong); font-weight: 850; background: var(--surface-alt); }
.alt-text { color: var(--text-strong); line-height: 1.5; white-space: pre-wrap; }
.alt-cut { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 7px 8px; border-radius: 8px; font-size: .76rem; }
.alt-cut:hover { background: var(--surface-alt); color: var(--danger); }
.alternative.selected { border-color: var(--primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 13%, transparent); }
.alternative.selected .alt-letter { background: var(--primary); color: var(--white); border-color: var(--primary); }
.alternative.cut .alt-text { text-decoration: line-through; opacity: .45; }
.alternative.cut { opacity: .68; }
.alternative.correct { background: var(--success-bg); border-color: color-mix(in srgb, var(--success) 45%, transparent); }
.alternative.correct .alt-letter { background: var(--success); color: var(--white); border-color: var(--success); }
.alternative.incorrect { background: var(--danger-bg); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
.alternative.incorrect .alt-letter { background: var(--danger); color: var(--white); border-color: var(--danger); }
.question-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.feedback-panel { margin-top: 18px; border-radius: 15px; overflow: hidden; border: 1px solid var(--border); }
.feedback-head { padding: 12px 15px; font-weight: 850; }
.feedback-head.correct { background: var(--success-bg); color: var(--success); }
.feedback-head.incorrect { background: var(--danger-bg); color: var(--danger); }
.feedback-body { padding: 16px; background: var(--surface-alt); }
.feedback-body h4 { margin: 0 0 5px; color: var(--text-strong); }
.feedback-body p { margin: 0 0 14px; white-space: pre-wrap; color: var(--text); }
.reference { padding-top: 11px; border-top: 1px solid var(--border); color: var(--muted); font-size: .84rem; white-space: pre-wrap; }

/* Exam */
.exam-layout { display: grid; grid-template-columns: minmax(0,1fr) 230px; gap: 16px; align-items: start; }
.exam-sidebar { position: sticky; top: 100px; }
.exam-timer { font-size: 1.25rem; font-weight: 900; color: var(--text-strong); text-align: center; margin-bottom: 12px; }
.exam-timer.low { color: var(--danger); }
.exam-nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.exam-nav-btn { aspect-ratio: 1; border-radius: 9px; border: 1px solid var(--border); background: var(--surface-alt); color: var(--muted); cursor: pointer; font-size: .8rem; }
.exam-nav-btn.answered { background: var(--primary-soft); color: var(--primary); border-color: transparent; font-weight: 800; }
.exam-nav-btn.current { background: var(--primary); color: var(--white); border-color: var(--primary); }
.exam-side-actions { display: grid; gap: 8px; margin-top: 13px; }

.result-hero { padding: 26px; text-align: center; }
.result-score { font-size: clamp(2.4rem, 8vw, 4.6rem); line-height: 1; color: var(--primary); font-weight: 950; letter-spacing: -.06em; }
.result-title { color: var(--text-strong); font-size: 1.15rem; font-weight: 800; margin-top: 8px; }
.result-sub { color: var(--muted); margin-top: 4px; }
.result-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 10px; margin-top: 18px; }
.result-grid > div { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 13px; padding: 13px; }
.result-grid strong { display: block; color: var(--text-strong); font-size: 1.15rem; }
.result-grid span { font-size: .75rem; color: var(--muted); }

.performance-row { display: grid; grid-template-columns: minmax(140px, 1fr) minmax(160px, 2fr) 70px; gap: 12px; align-items: center; padding: 9px 0; }
.performance-row + .performance-row { border-top: 1px solid var(--border); }
.performance-name { color: var(--text-strong); font-size: .84rem; }
.performance-value { text-align: right; font-size: .82rem; font-weight: 800; color: var(--text-strong); }
.mini-track { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; }
.mini-fill { height: 100%; border-radius: 999px; background: var(--primary); }
.mini-fill.review { background: var(--accent); }

.search-results { max-height: 310px; overflow: auto; display: grid; gap: 7px; margin-top: 10px; }
.search-result { border: 1px solid var(--border); background: var(--surface); border-radius: 11px; padding: 10px 11px; }
.search-result strong { color: var(--text-strong); font-size: .8rem; }
.search-result p { margin: 4px 0 0; color: var(--muted); font-size: .78rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; min-width: 680px; background: var(--surface); }
th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: .82rem; vertical-align: top; }
th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; background: var(--surface-alt); }
td { color: var(--text); }
tr:last-child td { border-bottom: 0; }

.toast-region { position: fixed; right: 18px; bottom: 18px; z-index: 100; display: grid; gap: 8px; max-width: min(380px, calc(100vw - 36px)); }
.toast { background: var(--text-strong); color: var(--surface); padding: 11px 14px; border-radius: 12px; box-shadow: var(--shadow-lg); font-size: .84rem; animation: toastIn .2s ease; }
.toast.success { background: var(--success); color: var(--white); }
.toast.error { background: var(--danger); color: var(--white); }
@keyframes toastIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }

.modal-root:empty { display: none; }
.modal-root { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 18px; background: rgba(5, 10, 18, .56); backdrop-filter: blur(4px); }
.modal { width: min(100%, 520px); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow-lg); padding: 22px; }
.modal h3 { margin: 0 0 8px; color: var(--text-strong); }
.modal p { margin: 0; color: var(--muted); white-space: pre-wrap; }
.modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; flex-wrap: wrap; }

.mobile-nav { display: none; }
.noscript { padding: 18px; background: var(--danger-bg); color: var(--danger); }

.skeleton { border-radius: 10px; min-height: 20px; background: linear-gradient(90deg, var(--surface-alt), var(--border), var(--surface-alt)); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

@media (max-width: 1100px) {
  .stat-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .subject-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .exam-layout { grid-template-columns: minmax(0,1fr) 200px; }
}

@media (max-width: 900px) {
  :root { --sidebar: 220px; }
  .hero { grid-template-columns: 1fr; }
  .hero-art { display: none; }
  .two-col { grid-template-columns: 1fr; }
  .three-col, .action-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .exam-layout { grid-template-columns: 1fr; }
  .exam-sidebar { position: static; order: -1; }
  .exam-nav-grid { grid-template-columns: repeat(10, 1fr); }
}

@media (max-width: 760px) {
  body { padding-bottom: 68px; }
  .app-shell { display: block; }
  .main-column { width: 100%; }
  .sidebar {
    transform: translateX(-105%);
    transition: transform .2s ease;
    box-shadow: var(--shadow-lg);
  }
  body.menu-open .sidebar { transform: translateX(0); }
  .icon-btn { display: inline-grid; place-items: center; }
  .mobile-nav {
    position: fixed;
    left: 10px; right: 10px; bottom: 9px;
    z-index: 50;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    padding: 5px;
  }
  .mobile-nav button { border: 0; background: transparent; color: var(--muted); padding: 6px 3px; border-radius: 10px; display: grid; gap: 1px; place-items: center; cursor: pointer; font-size: 1rem; }
  .mobile-nav button span { font-size: .62rem; }
  .mobile-nav button.is-active { background: var(--primary-soft); color: var(--primary); }
  .topbar { min-height: 70px; padding: 10px 16px; }
  .today-goal { display: none; }
  .content { padding: 18px 14px 40px; }
  .stat-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .stat-card:last-child { grid-column: 1 / -1; }
  .form-grid { grid-template-columns: 1fr; }
  .form-field.full { grid-column: auto; }
  .question-card { border-radius: 16px; }
  .alternative { grid-template-columns: 31px 1fr; }
  .alt-cut { grid-column: 2; justify-self: start; padding-left: 0; }
  .question-actions { position: sticky; bottom: 74px; background: color-mix(in srgb, var(--background) 92%, transparent); backdrop-filter: blur(10px); padding: 8px 0; z-index: 5; }
  .question-actions .btn { flex: 1; }
  .performance-row { grid-template-columns: 1fr 60px; }
  .performance-row .mini-track { grid-column: 1 / -1; grid-row: 2; }
  .result-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
}

@media (max-width: 520px) {
  .hero { padding: 20px; border-radius: 18px; }
  .hero-actions .btn { width: 100%; }
  .subject-grid, .three-col, .action-grid { grid-template-columns: 1fr; }
  .stat-grid { gap: 9px; }
  .stat-card { padding: 14px; }
  .filter-summary { align-items: flex-start; flex-direction: column; }
  .session-top { align-items: flex-start; flex-direction: column; }
  .session-meta { width: 100%; justify-content: space-between; }
  .exam-nav-grid { grid-template-columns: repeat(6, 1fr); }
  .modal-actions .btn { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* SEDUC-PA specific refinements */
.integrity-banner { border-left: 4px solid var(--warning); }
.integrity-banner.ok { border-left-color: var(--success); }
.brand-copy strong { color: var(--primary-deep); }
.subject-card:nth-child(even) .subject-badge { background: var(--secondary-soft); color: var(--secondary); }
.subject-card:nth-child(3) .subject-badge { background: var(--primary-soft); color: var(--primary); }
.subject-card:nth-child(4) .subject-badge { background: color-mix(in srgb, var(--secondary-soft) 65%, var(--surface)); color: var(--secondary); }
.sort-row { display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin: 12px 0; }
.sort-row .form-field { min-width: 230px; }
.storage-note { margin-top: 10px; font-size: .78rem; color: var(--muted); }
.review-nav { display:grid; grid-template-columns: repeat(10, minmax(0,1fr)); gap:7px; margin:14px 0 18px; }
.review-nav button { min-height:36px; border:1px solid var(--border); background:var(--surface-alt); color:var(--muted); border-radius:9px; cursor:pointer; }
.review-nav button.current { background:var(--primary); color:var(--white); border-color:var(--primary); }
.review-nav button.correct { border-color: color-mix(in srgb, var(--success) 55%, var(--border)); color:var(--success); }
.review-nav button.wrong { border-color: color-mix(in srgb, var(--danger) 55%, var(--border)); color:var(--danger); }
.review-nav button.blank { border-style:dashed; }
.discipline-summary { display:grid; gap:8px; margin-top:14px; }
.section-tools { display:flex; gap:10px; align-items:end; justify-content:space-between; flex-wrap:wrap; }
.bank-details { margin-top:10px; display:grid; gap:6px; font-size:.8rem; color:var(--muted); }
@media (max-width: 520px) { .review-nav { grid-template-columns: repeat(6, minmax(0,1fr)); } }

  </style>
</head>

const EMBEDDED_BANKS = {"portugues":[{"id":"POR001","disciplina":"Língua Portuguesa","assunto":"Interpretação e compreensão de texto","dificuldade":"Intermediária","enunciado":"Leia: “Uma escola pode acumular relatórios, gráficos e planilhas e, ainda assim, conhecer pouco seus alunos. O dado só se transforma em informação quando é selecionado, comparado e interpretado à luz de uma pergunta relevante.” A ideia central do texto é:","alternativas":{"A":"a quantidade de relatórios produzidos é suficiente para revelar a realidade escolar.","B":"o valor dos dados depende do tratamento interpretativo orientado por uma questão pertinente.","C":"gráficos e planilhas impedem uma compreensão qualitativa dos estudantes.","D":"perguntas relevantes devem ser formuladas somente depois da análise dos dados.","E":"o conhecimento dos alunos dispensa qualquer forma de registro sistemático."},"gabarito":"B","comentario":"O texto contrapõe o simples acúmulo de dados à produção de informação: esta exige seleção, comparação e interpretação orientadas por uma pergunta relevante.","referencia":"Interpretação de texto: identificação de ideia central e relações argumentativas."},{"id":"POR002","disciplina":"Língua Portuguesa","assunto":"Interpretação e inferência","dificuldade":"Difícil","enunciado":"Leia: “Quando a biblioteca passou a abrir meia hora antes das aulas, o número de empréstimos quase não mudou. Já a permanência dos estudantes no espaço aumentou bastante.” É possível inferir, sem extrapolar o texto, que:","alternativas":{"A":"os estudantes deixaram de ler livros impressos depois da mudança de horário.","B":"a biblioteca se tornou o principal local de estudo da escola.","C":"a abertura antecipada reduziu o interesse dos alunos pelos empréstimos.","D":"os alunos permaneceram mais tempo na biblioteca exclusivamente para usar computadores.","E":"a ampliação do horário favoreceu outro uso da biblioteca além do empréstimo de livros."},"gabarito":"E","comentario":"O aumento da permanência, sem aumento expressivo dos empréstimos, autoriza inferir que o espaço passou a ser utilizado também para outras finalidades. As demais alternativas acrescentam informações que o texto não fornece.","referencia":"Interpretação de texto: inferência autorizada pelo contexto."},{"id":"POR003","disciplina":"Língua Portuguesa","assunto":"Interpretação de efeito de sentido","dificuldade":"Difícil","enunciado":"Leia: “A cidade corre para economizar tempo e, no fim do dia, descobre que não teve tempo para nada.” O efeito de sentido predominante decorre:","alternativas":{"A":"da enumeração objetiva das tarefas realizadas durante o dia.","B":"da defesa de que a vida urbana deve ser inteiramente desacelerada.","C":"da comparação explícita entre a cidade e uma máquina industrial.","D":"da afirmação literal de que o tempo cronológico diminui nas cidades.","E":"do contraste paradoxal entre a busca por ganhar tempo e a sensação final de tê-lo perdido."},"gabarito":"E","comentario":"O enunciado constrói um paradoxo: a tentativa de economizar tempo culmina na percepção de que faltou tempo.","referencia":"Interpretação e semântica textual: paradoxo e contraste."},{"id":"POR004","disciplina":"Língua Portuguesa","assunto":"Interpretação de texto","dificuldade":"Intermediária","enunciado":"Leia: “Nem toda mudança visível é transformação. Trocar o cartaz da parede é rápido; alterar uma prática exige tempo, acompanhamento e revisão.” No texto, a oposição entre “mudança visível” e “transformação” serve para:","alternativas":{"A":"mostrar que mudanças materiais são sempre inúteis.","B":"distinguir alteração superficial de mudança efetiva de prática.","C":"defender que toda transformação precisa ser lenta.","D":"afirmar que cartazes impedem a revisão de práticas.","E":"provar que apenas mudanças invisíveis produzem resultados."},"gabarito":"B","comentario":"A oposição organiza o argumento entre aparência de mudança e mudança efetiva. O texto não condena toda alteração material nem estabelece regra absoluta sobre a duração de qualquer transformação.","referencia":"Interpretação: relações de oposição e construção da tese."},{"id":"POR005","disciplina":"Língua Portuguesa","assunto":"Interpretação e relações lógicas","dificuldade":"Intermediária","enunciado":"Leia: “O projeto começou pequeno, mas cresceu porque os professores registraram os resultados e ajustaram as etapas seguintes.” A relação estabelecida por “porque” é de:","alternativas":{"A":"concessão.","B":"condição.","C":"causa.","D":"finalidade.","E":"comparação."},"gabarito":"C","comentario":"A conjunção “porque” introduz a causa apresentada para o crescimento do projeto: o registro dos resultados e os ajustes realizados.","referencia":"Relações lógico-semânticas entre orações."},{"id":"POR006","disciplina":"Língua Portuguesa","assunto":"Compreensão de informação explícita","dificuldade":"Fácil","enunciado":"Leia: “A reunião prevista para terça-feira foi transferida para quinta, no mesmo horário, porque o auditório estará em manutenção.” Segundo o texto, permaneceu inalterado:","alternativas":{"A":"o dia da reunião.","B":"o local da reunião.","C":"o motivo da reunião.","D":"a disponibilidade do auditório.","E":"o horário da reunião."},"gabarito":"E","comentario":"O texto afirma explicitamente que a reunião foi transferida de dia “no mesmo horário”.","referencia":"Compreensão de texto: localização de informação explícita."},{"id":"POR007","disciplina":"Língua Portuguesa","assunto":"Interpretação de pressuposto","dificuldade":"Difícil","enunciado":"Leia: “Até os alunos que raramente participavam passaram a apresentar perguntas durante as rodas de conversa.” O emprego de “até” sugere que:","alternativas":{"A":"todos os alunos deixaram de participar das rodas de conversa.","B":"somente os alunos pouco participativos fizeram perguntas.","C":"a participação desses alunos era considerada menos esperada que a dos demais.","D":"a participação anterior desses alunos era frequente.","E":"as rodas de conversa foram criadas exclusivamente para esses alunos."},"gabarito":"C","comentario":"O operador “até” inclui um caso apresentado como limite ou menos esperado, produzindo a inferência de que a participação desse grupo é especialmente significativa no contexto.","referencia":"Interpretação: pressupostos e operadores argumentativos."},{"id":"POR008","disciplina":"Língua Portuguesa","assunto":"Coesão referencial","dificuldade":"Fácil","enunciado":"Leia: “A direção apresentou a proposta ao conselho, mas ele pediu mais dados antes de aprová-la.” No contexto, o pronome “ele” retoma:","alternativas":{"A":"o conselho.","B":"a direção.","C":"a proposta.","D":"os dados.","E":"o ato de aprovar."},"gabarito":"A","comentario":"O pronome masculino singular “ele” retoma “o conselho”, único antecedente nominal masculino singular compatível no período.","referencia":"Coesão referencial: referenciação pronominal."},{"id":"POR009","disciplina":"Língua Portuguesa","assunto":"Interpretação global","dificuldade":"Intermediária","enunciado":"Leia: “Revisar não é reler passivamente. É voltar ao conteúdo com uma tarefa: explicar, comparar, recuperar da memória ou resolver um problema.” O título mais adequado para o trecho seria:","alternativas":{"A":"A leitura passiva como método suficiente de estudo","B":"Por que memorizar dispensa a compreensão","C":"Revisão como atividade de recuperação e uso do conhecimento","D":"Os riscos de resolver problemas durante a revisão","E":"A superioridade absoluta da releitura sobre outras estratégias"},"gabarito":"C","comentario":"O trecho redefine a revisão como atividade ativa de recuperação e aplicação do conhecimento, e não como simples releitura.","referencia":"Interpretação global: síntese temática e seleção de título."},{"id":"POR010","disciplina":"Língua Portuguesa","assunto":"Interpretação do posicionamento do enunciador","dificuldade":"Difícil","enunciado":"Leia: “A tecnologia pode ampliar possibilidades de aprendizagem, desde que não seja tratada como solução automática para problemas pedagógicos.” O enunciador adota uma posição:","alternativas":{"A":"contrária a qualquer uso de tecnologia na escola.","B":"entusiástica e irrestrita quanto a soluções tecnológicas.","C":"favorável ao uso da tecnologia, mas condicionada a critérios pedagógicos.","D":"neutra, pois não apresenta qualquer avaliação.","E":"favorável apenas quando a tecnologia substitui o professor."},"gabarito":"C","comentario":"O enunciado reconhece potencial na tecnologia, mas condiciona sua contribuição ao uso pedagógico criterioso e rejeita a ideia de solução automática.","referencia":"Interpretação: ponto de vista e modalização argumentativa."},{"id":"POR011","disciplina":"Língua Portuguesa","assunto":"Interpretação argumentativa","dificuldade":"Difícil","enunciado":"Leia: “Se a avaliação serve apenas para produzir uma nota, perde-se uma parte de seu potencial. Quando também orienta intervenções, ela passa a integrar o processo de aprendizagem.” A segunda frase funciona, em relação à primeira, como:","alternativas":{"A":"explicitação de uma alternativa que amplia a função da avaliação.","B":"negação total da ideia apresentada anteriormente.","C":"exemplo de avaliação que dispensa qualquer nota.","D":"conclusão de que toda avaliação deve ser abolida.","E":"comparação entre dois sistemas escolares específicos."},"gabarito":"A","comentario":"A segunda frase apresenta uma função adicional da avaliação — orientar intervenções — e mostra como essa ampliação a integra ao processo de aprendizagem.","referencia":"Interpretação de texto: progressão argumentativa."},{"id":"POR012","disciplina":"Língua Portuguesa","assunto":"Fato e opinião em texto","dificuldade":"Fácil","enunciado":"Considere: “A escola recebeu 320 livros em agosto. Foi, sem dúvida, a iniciativa mais importante do semestre.” Nesse trecho, a primeira frase e a segunda exprimem, respectivamente:","alternativas":{"A":"duas avaliações subjetivas.","B":"duas informações objetivamente verificáveis.","C":"uma hipótese e uma conclusão científica.","D":"uma ordem e uma justificativa.","E":"um dado apresentado como factual e uma avaliação opinativa."},"gabarito":"E","comentario":"A quantidade e o mês são apresentados como informação verificável; “a iniciativa mais importante” é um juízo de valor, reforçado por “sem dúvida”.","referencia":"Interpretação: distinção entre informação factual e avaliação opinativa."},{"id":"POR013","disciplina":"Língua Portuguesa","assunto":"Coesão textual: conectores","dificuldade":"Fácil","enunciado":"No período “Embora o prazo fosse curto, a equipe concluiu a revisão com cuidado”, a conjunção “embora” introduz uma relação de:","alternativas":{"A":"causa.","B":"conclusão.","C":"explicação.","D":"concessão.","E":"condição."},"gabarito":"D","comentario":"“Embora” introduz um fato que poderia constituir obstáculo à conclusão da revisão, mas não a impede; trata-se de relação concessiva.","referencia":"Coesão textual: conectores concessivos."},{"id":"POR014","disciplina":"Língua Portuguesa","assunto":"Coesão referencial","dificuldade":"Difícil","enunciado":"Leia: “Os professores analisaram as produções dos alunos segundo critérios previamente registrados. Esse procedimento permitiu comparar as turmas com maior consistência.” A expressão “Esse procedimento”:","alternativas":{"A":"antecipa uma informação que só será apresentada no período seguinte.","B":"retoma anaforicamente a forma de análise descrita no período anterior.","C":"introduz um referente sem relação com o período anterior.","D":"retoma exclusivamente o substantivo “turmas”.","E":"substitui uma relação temporal por uma relação causal."},"gabarito":"B","comentario":"“Esse procedimento” retoma, de forma condensada, a ação anteriormente descrita — analisar as produções segundo critérios previamente registrados — e mantém a progressão do texto.","referencia":"Coesão referencial: retomada anafórica por expressão nominal."},{"id":"POR015","disciplina":"Língua Portuguesa","assunto":"Coesão lexical","dificuldade":"Difícil","enunciado":"Em “O projeto foi apresentado à comunidade. A iniciativa recebeu sugestões de pais e estudantes”, a substituição de “projeto” por “iniciativa” contribui para a coesão porque:","alternativas":{"A":"introduz obrigatoriamente um referente novo e distinto.","B":"elimina qualquer possibilidade de progressão temática.","C":"retoma o mesmo referente por meio de uma expressão lexical semanticamente relacionada.","D":"transforma a segunda frase em uma oração subordinada.","E":"substitui uma relação temporal por uma relação causal."},"gabarito":"C","comentario":"“A iniciativa” funciona como retomada lexical de “o projeto”, evitando repetição e mantendo o mesmo referente em foco.","referencia":"Coesão lexical: substituição e retomada de referentes."},{"id":"POR016","disciplina":"Língua Portuguesa","assunto":"Coerência textual","dificuldade":"Difícil","enunciado":"Assinale a sequência que apresenta quebra de coerência interna:","alternativas":{"A":"“A escola permanecerá fechada durante o feriado. Por isso, o atendimento presencial será suspenso.”","B":"“O número de inscrições aumentou. Ainda assim, a equipe manteve o prazo de análise.”","C":"“A escola permanecerá fechada durante todo o feriado. Por isso, haverá atendimento presencial normalmente nesses dias.”","D":"“Choveu durante a manhã. À tarde, o céu abriu e as atividades externas foram retomadas.”","E":"“O relatório identificou falhas. Em seguida, foram propostas medidas de correção.”"},"gabarito":"C","comentario":"A alternativa C contém incompatibilidade lógica: se a escola permanecerá fechada durante todo o feriado, não pode haver atendimento presencial normalmente nesses mesmos dias.","referencia":"Coerência textual: compatibilidade semântica entre enunciados."},{"id":"POR017","disciplina":"Língua Portuguesa","assunto":"Intertextualidade","dificuldade":"Difícil","enunciado":"Leia: “Minha escola tem mangueiras, onde canta o bem-te-vi.” A construção dialoga, por transformação, com um conhecido verso de Gonçalves Dias. Esse procedimento exemplifica:","alternativas":{"A":"intertextualidade.","B":"pleonasmo.","C":"regência nominal.","D":"derivação regressiva.","E":"elipse sintática sem relação entre textos."},"gabarito":"A","comentario":"Há retomada reconhecível de uma formulação de outro texto, modificada para um novo contexto; isso caracteriza intertextualidade.","referencia":"Marcas de textualidade: intertextualidade."},{"id":"POR018","disciplina":"Língua Portuguesa","assunto":"Coesão por elipse e coordenação","dificuldade":"Intermediária","enunciado":"Para evitar repetição sem alterar o sentido essencial de “A coordenadora apresentou o cronograma. A coordenadora explicou cada etapa”, a melhor reescrita é:","alternativas":{"A":"“A coordenadora apresentou o cronograma, portanto cada etapa.”","B":"“A coordenadora apresentou o cronograma e explicou cada etapa.”","C":"“A coordenadora, embora o cronograma, explicou cada etapa.”","D":"“Apresentado o cronograma, cada etapa explicou a coordenadora.”","E":"“A coordenadora apresentou, porque o cronograma explicou cada etapa.”"},"gabarito":"B","comentario":"A coordenação com elipse do segundo sujeito evita a repetição e preserva as duas ações atribuídas à coordenadora.","referencia":"Coesão e reescrita: elipse e coordenação."},{"id":"POR019","disciplina":"Língua Portuguesa","assunto":"Coesão: relação causal","dificuldade":"Fácil","enunciado":"Em “A equipe refez o levantamento, pois havia inconsistências nos dados”, o conector “pois” introduz:","alternativas":{"A":"uma explicação causal para a ação anterior.","B":"uma condição para a ocorrência futura.","C":"uma oposição à afirmação anterior.","D":"uma comparação de intensidade.","E":"uma conclusão independente de causa."},"gabarito":"A","comentario":"Nesse contexto, “pois” equivale a “porque” e apresenta a razão de a equipe ter refeito o levantamento.","referencia":"Coesão sequencial: conectores explicativos e causais."},{"id":"POR020","disciplina":"Língua Portuguesa","assunto":"Coesão: relação adversativa","dificuldade":"Fácil","enunciado":"Assinale a frase em que o conector estabelece oposição entre duas ideias:","alternativas":{"A":"“O material era extenso, porém estava bem organizado.”","B":"“O material era extenso, portanto exigia planejamento.”","C":"“O material era extenso, porque reunia vários anexos.”","D":"“O material era extenso, conforme informou a equipe.”","E":"“O material era extenso, de modo que foi dividido em partes.”"},"gabarito":"A","comentario":"“Porém” é conjunção adversativa e contrapõe a extensão do material à sua boa organização.","referencia":"Coesão sequencial: conjunções adversativas."},{"id":"POR021","disciplina":"Língua Portuguesa","assunto":"Progressão textual","dificuldade":"Fácil","enunciado":"Em um texto instrucional, qual sequência de marcadores favorece mais claramente a ordenação cronológica de etapas?","alternativas":{"A":"“talvez – contudo – portanto”","B":"“primeiro – em seguida – por fim”","C":"“porque – embora – se”","D":"“assim como – mais que – menos que”","E":"“certamente – provavelmente – infelizmente”"},"gabarito":"B","comentario":"Os marcadores “primeiro”, “em seguida” e “por fim” organizam etapas em uma sequência temporal explícita.","referencia":"Coesão e progressão textual: sequenciadores."},{"id":"POR022","disciplina":"Língua Portuguesa","assunto":"Coesão catafórica","dificuldade":"Difícil","enunciado":"Leia: “Só havia uma exigência: que todos entregassem o formulário assinado.” A expressão “uma exigência” é especificada pelo segmento posterior aos dois-pontos. Essa relação é predominantemente:","alternativas":{"A":"anafórica, pois o segmento posterior retoma algo já detalhado.","B":"intertextual, pois há citação de outro texto.","C":"ambígua, pois não há referente identificável.","D":"elíptica, pois o verbo principal foi omitido.","E":"catafórica, pois o termo genérico aponta para uma informação que será explicitada em seguida."},"gabarito":"E","comentario":"O sintagma “uma exigência” antecipa uma informação que será detalhada depois dos dois-pontos; essa projeção para frente caracteriza catáfora.","referencia":"Coesão referencial: catáfora."},{"id":"POR023","disciplina":"Língua Portuguesa","assunto":"Modos de organização discursiva: descrição","dificuldade":"Fácil","enunciado":"Leia: “A sala era ampla, de paredes claras, janelas altas e mesas dispostas em semicírculo.” Predomina nesse trecho o modo:","alternativas":{"A":"narrativo.","B":"descritivo.","C":"argumentativo.","D":"injuntivo.","E":"dialogal."},"gabarito":"B","comentario":"O trecho caracteriza um espaço por meio de atributos e da disposição de seus elementos, procedimento típico da descrição.","referencia":"Modos de organização discursiva: descrição."},{"id":"POR024","disciplina":"Língua Portuguesa","assunto":"Modos de organização discursiva: narração","dificuldade":"Fácil","enunciado":"Leia: “Às sete horas, Ana abriu a escola, conferiu as salas e, poucos minutos depois, recebeu os primeiros estudantes.” Predomina o modo:","alternativas":{"A":"descritivo.","B":"expositivo.","C":"argumentativo.","D":"injuntivo.","E":"narrativo."},"gabarito":"E","comentario":"Há uma sequência temporal de ações protagonizadas por uma personagem, característica típica da narração.","referencia":"Modos de organização discursiva: narração."},{"id":"POR025","disciplina":"Língua Portuguesa","assunto":"Modos de organização discursiva: exposição","dificuldade":"Fácil","enunciado":"Leia: “A fotossíntese é o processo pelo qual organismos autotróficos convertem energia luminosa em energia química.” O modo predominante é:","alternativas":{"A":"narrativo.","B":"injuntivo.","C":"expositivo.","D":"argumentativo polêmico.","E":"descritivo literário."},"gabarito":"C","comentario":"O enunciado apresenta e define um conceito de forma informativa, característica do modo expositivo.","referencia":"Modos de organização discursiva: exposição."},{"id":"POR026","disciplina":"Língua Portuguesa","assunto":"Modos de organização discursiva: argumentação","dificuldade":"Intermediária","enunciado":"Leia: “A escola deve ampliar os momentos de leitura orientada, pois a prática frequente favorece a compreensão e a autonomia do leitor.” Predomina o modo:","alternativas":{"A":"narrativo.","B":"argumentativo.","C":"descritivo.","D":"injuntivo puro.","E":"expositivo sem defesa de ponto de vista."},"gabarito":"B","comentario":"O trecho apresenta uma tese — “a escola deve ampliar” — e uma razão que a sustenta, introduzida por “pois”.","referencia":"Modos de organização discursiva: argumentação."},{"id":"POR027","disciplina":"Língua Portuguesa","assunto":"Modos de organização discursiva: injunção","dificuldade":"Fácil","enunciado":"Assinale o trecho predominantemente injuntivo:","alternativas":{"A":"“O formulário possui três seções e um campo opcional.”","B":"“Ontem, a equipe preencheu todos os formulários.”","C":"“O formulário deveria ser mais simples, pois contém campos repetidos.”","D":"“A palavra formulário deriva do latim.”","E":"“Preencha o formulário, confira os dados e clique em ‘Enviar’.”"},"gabarito":"E","comentario":"O uso de verbos no imperativo orientando ações caracteriza o modo injuntivo.","referencia":"Modos de organização discursiva: injunção."},{"id":"POR028","disciplina":"Língua Portuguesa","assunto":"Tipos textuais e organização discursiva","dificuldade":"Difícil","enunciado":"Sobre os tipos textuais e sua ocorrência em textos concretos, assinale a afirmativa correta:","alternativas":{"A":"Um texto concreto só pode apresentar uma sequência tipológica do início ao fim.","B":"Um mesmo texto pode combinar sequências narrativas, descritivas, expositivas, argumentativas ou injuntivas, ainda que uma delas predomine.","C":"A presença de uma descrição impede que o texto também apresente argumentação.","D":"Todo texto informativo é necessariamente formado apenas por frases declarativas simples.","E":"A combinação de diferentes sequências torna impossível identificar a finalidade global do texto."},"gabarito":"B","comentario":"Textos concretos podem combinar diferentes sequências tipológicas. A classificação decorre da organização e da finalidade predominantes, não da exclusividade absoluta de uma única sequência.","referencia":"Tipos textuais: características e combinação de sequências."},{"id":"POR029","disciplina":"Língua Portuguesa","assunto":"Texto literário e linguagem conotativa","dificuldade":"Intermediária","enunciado":"Leia: “A tarde derramava ouro sobre o rio.” A característica que mais aproxima o enunciado do uso literário da linguagem é:","alternativas":{"A":"a presença de uma definição técnica de fenômeno natural.","B":"a ausência completa de figuras de linguagem.","C":"o uso exclusivo de vocabulário denotativo.","D":"a obrigação de interpretar “ouro” como metal efetivamente lançado no rio.","E":"o emprego conotativo e imagético da expressão “derramava ouro”."},"gabarito":"E","comentario":"A expressão cria uma imagem figurada, associável ao brilho da luz sobre a água, explorando a conotação.","referencia":"Textos literários e não literários; linguagem conotativa."},{"id":"POR030","disciplina":"Língua Portuguesa","assunto":"Texto não literário","dificuldade":"Fácil","enunciado":"Em um aviso escolar, lê-se: “A secretaria atenderá ao público das 8h às 14h, de segunda a sexta-feira.” Nesse contexto, predomina:","alternativas":{"A":"a função informativa, com linguagem denotativa e objetivo prático.","B":"a criação de múltiplos sentidos por metáforas.","C":"a construção de um eu lírico ficcional.","D":"a exploração estética da sonoridade como finalidade central.","E":"a ambiguidade deliberada para produzir efeito poético."},"gabarito":"A","comentario":"O aviso busca transmitir horário de atendimento de modo direto e funcional, característica de texto não literário de finalidade informativa.","referencia":"Textos não literários: finalidade comunicativa e denotação."},{"id":"POR031","disciplina":"Língua Portuguesa","assunto":"Reescrita e deslocamento","dificuldade":"Difícil","enunciado":"A frase “Os estudantes entregaram, no fim da aula, os relatórios revisados” mantém o sentido essencial e a correção gramatical em:","alternativas":{"A":"“Os estudantes, no fim da aula os relatórios, entregaram revisados.”","B":"“No fim da aula os estudantes, entregaram os relatórios revisados.”","C":"“No fim da aula, os estudantes entregaram os relatórios revisados.”","D":"“Os estudantes entregaram os relatórios, no fim, da aula revisados.”","E":"“Os relatórios revisados, no fim da aula entregaram os estudantes.”"},"gabarito":"C","comentario":"O adjunto adverbial “no fim da aula” pode ser deslocado para o início da frase, com pontuação adequada, sem alteração do sentido essencial.","referencia":"Estrutura da frase: operações de deslocamento e pontuação."},{"id":"POR032","disciplina":"Língua Portuguesa","assunto":"Reescrita por substituição pronominal","dificuldade":"Difícil","enunciado":"Em “A professora entregou os livros aos alunos e pediu que os alunos devolvessem os livros na sexta-feira”, a reescrita mais adequada, sem repetição desnecessária e sem ambiguidade, é:","alternativas":{"A":"“A professora entregou-lhes os livros e pediu que os devolvessem ela na sexta-feira.”","B":"“A professora entregou os livros aos alunos e pediu que eles os devolvessem na sexta-feira.”","C":"“A professora entregou os livros aos alunos e pediu que lhes devolvessem na sexta-feira.”","D":"“A professora entregou-os aos alunos e pediu que ela os devolvesse na sexta-feira.”","E":"“A professora entregou os livros aos alunos, cujo pediu devolvê-los na sexta-feira.”"},"gabarito":"B","comentario":"“Eles” retoma “os alunos” e “os” retoma “os livros”, preservando com clareza as relações sintáticas e o sentido.","referencia":"Estrutura da frase: substituição pronominal e clareza referencial."},{"id":"POR033","disciplina":"Língua Portuguesa","assunto":"Reescrita e escopo semântico","dificuldade":"Difícil","enunciado":"Compare: I. “Apenas os professores revisaram o documento.” II. “Os professores revisaram apenas o documento.” A mudança de posição de “apenas” provoca:","alternativas":{"A":"alteração de foco: em I, restringe quem revisou; em II, restringe o que foi revisado.","B":"nenhuma alteração de sentido.","C":"mudança apenas de registro formal para informal.","D":"transformação de uma afirmação em pergunta.","E":"mudança de tempo verbal."},"gabarito":"A","comentario":"A posição do advérbio altera seu escopo: em I, a restrição recai sobre “os professores”; em II, sobre “o documento”.","referencia":"Estrutura da frase: modificação e escopo de advérbios."},{"id":"POR034","disciplina":"Língua Portuguesa","assunto":"Problemas estruturais da frase: paralelismo","dificuldade":"Difícil","enunciado":"Assinale a frase em que há problema de construção por falta de paralelismo:","alternativas":{"A":"“O projeto pretende ampliar a leitura, reduzir a evasão e aumentar a participação dos alunos.”","B":"“A equipe planejou, executou e avaliou as ações.”","C":"“O relatório é claro, objetivo e bem organizado.”","D":"“O projeto pretende ampliar a leitura, reduzir a evasão e que os alunos participem mais.”","E":"“A proposta exige estudo, planejamento e acompanhamento.”"},"gabarito":"D","comentario":"Na alternativa D, dois complementos estão estruturados com infinitivos (“ampliar”, “reduzir”) e o terceiro é uma oração desenvolvida (“que os alunos participem”), quebrando o paralelismo sintático.","referencia":"Problemas estruturais da frase: paralelismo sintático."},{"id":"POR035","disciplina":"Língua Portuguesa","assunto":"Problemas estruturais da frase: ambiguidade","dificuldade":"Difícil","enunciado":"Em “A direção informou aos professores dos alunos que estavam atrasados que a reunião começaria sem espera”, o principal problema de construção é:","alternativas":{"A":"erro de concordância verbal.","B":"emprego indevido de crase.","C":"ausência obrigatória de vírgula antes de “que”.","D":"ambiguidade na identificação de quem estava atrasado.","E":"uso incorreto do plural de “professor”."},"gabarito":"D","comentario":"A oração “que estavam atrasados” pode modificar “professores” ou “alunos”, ambos no plural, produzindo ambiguidade estrutural.","referencia":"Problemas estruturais da frase: ambiguidade sintática."},{"id":"POR036","disciplina":"Língua Portuguesa","assunto":"Reescrita com relação concessiva","dificuldade":"Intermediária","enunciado":"A frase “O prazo era curto, mas a equipe concluiu o trabalho” pode ser reescrita, preservando a relação de sentido, como:","alternativas":{"A":"“Como o prazo era curto, a equipe concluiu o trabalho.”","B":"“Embora o prazo fosse curto, a equipe concluiu o trabalho.”","C":"“Se o prazo fosse curto, a equipe concluiria o trabalho.”","D":"“Para que o prazo fosse curto, a equipe concluiu o trabalho.”","E":"“Logo que o prazo era curto, a equipe concluiu o trabalho.”"},"gabarito":"B","comentario":"“Mas” estabelece oposição, enquanto “embora” introduz concessão; nesta reescrita, a relação semântica fundamental entre as ideias é preservada.","referencia":"Reescrita: relações semânticas entre coordenação adversativa e subordinação concessiva."},{"id":"POR037","disciplina":"Língua Portuguesa","assunto":"Voz ativa e passiva","dificuldade":"Intermediária","enunciado":"A passagem de “A comissão analisará os recursos amanhã” para a voz passiva, mantendo tempo verbal e sentido básico, resulta em:","alternativas":{"A":"“Os recursos eram analisados pela comissão amanhã.”","B":"“A comissão será analisada pelos recursos amanhã.”","C":"“Os recursos foram analisados pela comissão amanhã.”","D":"“Os recursos serão analisados pela comissão amanhã.”","E":"“Analisariam-se os recursos pela comissão amanhã.”"},"gabarito":"D","comentario":"O futuro do presente “analisará” corresponde a “serão analisados” na passiva analítica; o objeto direto da ativa passa a sujeito paciente.","referencia":"Reescrita: transformação entre voz ativa e voz passiva."},{"id":"POR038","disciplina":"Língua Portuguesa","assunto":"Orações reduzidas","dificuldade":"Difícil","enunciado":"Em “Ao terminar a reunião, a coordenadora enviou a ata”, a expressão “Ao terminar a reunião” equivale, no contexto, a:","alternativas":{"A":"“Porque terminaria a reunião”.","B":"“Embora terminasse a reunião”.","C":"“Se terminasse a reunião”.","D":"“Quando terminou a reunião”.","E":"“Para terminar a reunião”."},"gabarito":"D","comentario":"A oração reduzida de infinitivo exprime circunstância temporal e pode ser desenvolvida como “quando terminou a reunião”.","referencia":"Estrutura da frase: orações reduzidas e valores circunstanciais."},{"id":"POR039","disciplina":"Língua Portuguesa","assunto":"Nominalização","dificuldade":"Difícil","enunciado":"A reescrita que nominaliza adequadamente a ação expressa em “A equipe avaliou cuidadosamente os resultados”, preservando os papéis semânticos, é:","alternativas":{"A":"“A avaliação cuidadosa dos resultados foi realizada pela equipe.”","B":"“Os resultados realizaram a avaliação cuidadosa da equipe.”","C":"“A equipe tornou-se resultado de uma avaliação cuidadosa.”","D":"“A avaliação cuidadosa foi resultado da equipe avaliada.”","E":"“Os resultados avaliaram cuidadosamente a equipe.”"},"gabarito":"A","comentario":"A forma nominal “avaliação” preserva o processo expresso por “avaliou”; “dos resultados” mantém o alvo da avaliação, e “pela equipe” mantém o agente.","referencia":"Reescrita e estrutura da frase: nominalização."},{"id":"POR040","disciplina":"Língua Portuguesa","assunto":"Norma culta: verbos impessoais","dificuldade":"Intermediária","enunciado":"Assinale a frase adequada à norma-padrão:","alternativas":{"A":"“Faz dois anos que a escola adotou o novo sistema.”","B":"“Fazem dois anos que a escola adotou o novo sistema.”","C":"“Houveram várias mudanças no calendário.”","D":"“Devem haver soluções para o problema.”","E":"“Existiu muitos pedidos de revisão.”"},"gabarito":"A","comentario":"“Fazer”, indicando tempo decorrido, é impessoal e fica no singular. “Haver”, com sentido de existir, também é impessoal; já “existir” concorda com seu sujeito.","referencia":"Norma culta: verbos impessoais e concordância."},{"id":"POR041","disciplina":"Língua Portuguesa","assunto":"Concordância nominal e verbal","dificuldade":"Intermediária","enunciado":"Assinale a frase redigida de acordo com a norma-padrão:","alternativas":{"A":"“Segue anexo as planilhas solicitadas.”","B":"“Seguem anexo as planilhas solicitadas.”","C":"“Segue anexas as planilhas solicitadas.”","D":"“Seguem anexos as planilhas solicitadas.”","E":"“Seguem anexas as planilhas solicitadas.”"},"gabarito":"E","comentario":"O verbo “seguir” concorda com o sujeito plural “as planilhas”, e “anexas”, empregado como adjetivo, também concorda com esse substantivo feminino plural.","referencia":"Norma culta: concordância verbal e nominal."},{"id":"POR042","disciplina":"Língua Portuguesa","assunto":"Regência verbal e crase","dificuldade":"Intermediária","enunciado":"Assinale a frase de acordo com a norma-padrão quanto à regência:","alternativas":{"A":"“Os estudantes assistiram a palestra sobre leitura.”","B":"“Os estudantes assistiram à palestra sobre leitura.”","C":"“Os estudantes assistiram na palestra sobre leitura.”","D":"“Os estudantes assistiram da palestra sobre leitura.”","E":"“Os estudantes assistiram pela palestra sobre leitura.”"},"gabarito":"B","comentario":"No sentido de ver ou presenciar, “assistir” rege a preposição “a”; diante do artigo feminino de “a palestra”, ocorre a crase: “à palestra”.","referencia":"Norma culta: regência verbal e crase."},{"id":"POR043","disciplina":"Língua Portuguesa","assunto":"Pontuação: vocativo","dificuldade":"Fácil","enunciado":"Assinale a frase em que a vírgula isola corretamente um vocativo:","alternativas":{"A":"“Professores confiram, o cronograma antes da reunião.”","B":"“Professores confiram o cronograma, antes da reunião.”","C":"“Professores, confiram o cronograma antes da reunião.”","D":"“Professores confiram o, cronograma antes da reunião.”","E":"“Professores confiram o cronograma antes, da reunião.”"},"gabarito":"C","comentario":"“Professores” é termo de chamamento e deve ser separado por vírgula do restante da oração.","referencia":"Pontuação: emprego da vírgula com vocativo."},{"id":"POR044","disciplina":"Língua Portuguesa","assunto":"Pontuação e oração adjetiva","dificuldade":"Difícil","enunciado":"Compare: I. “Os alunos que entregaram o trabalho receberam retorno.” II. “Os alunos, que entregaram o trabalho, receberam retorno.” A diferença de sentido decorre do fato de que:","alternativas":{"A":"em I, todos os alunos entregaram o trabalho; em II, apenas alguns entregaram.","B":"em I, a oração restringe o grupo; em II, apresenta a entrega como informação explicativa atribuída ao conjunto referido.","C":"as duas frases têm necessariamente o mesmo sentido.","D":"em II, as vírgulas transformam a oração em coordenada adversativa.","E":"em I, “que” deixa de ser pronome relativo."},"gabarito":"B","comentario":"Sem vírgulas, a oração adjetiva é restritiva e delimita quais alunos receberam retorno. Entre vírgulas, é explicativa e apresenta a entrega como informação atribuída ao conjunto referido.","referencia":"Pontuação e sintaxe: orações subordinadas adjetivas restritivas e explicativas."},{"id":"POR045","disciplina":"Língua Portuguesa","assunto":"Pontuação: ponto e vírgula","dificuldade":"Difícil","enunciado":"Em “Alguns defendiam a mudança imediata; outros preferiam testar o projeto por mais um mês”, o ponto e vírgula é adequado porque:","alternativas":{"A":"separa orações coordenadas relativamente autônomas e contrastivas, mantendo forte relação entre elas.","B":"introduz obrigatoriamente uma citação literal.","C":"marca a omissão de um verbo auxiliar.","D":"substitui qualquer vírgula diante de sujeito simples.","E":"indica que a segunda oração é subordinada substantiva."},"gabarito":"A","comentario":"O ponto e vírgula pode separar orações coordenadas com relativa autonomia, especialmente quando há contraste entre elas.","referencia":"Pontuação: usos do ponto e vírgula."},{"id":"POR046","disciplina":"Língua Portuguesa","assunto":"Pontuação: dois-pontos","dificuldade":"Fácil","enunciado":"Em “A equipe chegou a uma conclusão: seria necessário refazer o levantamento”, os dois-pontos introduzem:","alternativas":{"A":"uma oração sem relação semântica com a anterior.","B":"um vocativo deslocado.","C":"uma explicitação do conteúdo de “uma conclusão”.","D":"uma oposição concessiva.","E":"uma pergunta indireta."},"gabarito":"C","comentario":"O segmento posterior especifica qual foi a conclusão anunciada no segmento anterior.","referencia":"Pontuação: usos dos dois-pontos."},{"id":"POR047","disciplina":"Língua Portuguesa","assunto":"Pontuação: travessões","dificuldade":"Difícil","enunciado":"Em “A leitura — prática diária em muitas turmas — pode assumir funções diversas”, os travessões isolam:","alternativas":{"A":"o sujeito oculto da oração.","B":"um objeto direto obrigatório.","C":"uma oração coordenada conclusiva.","D":"um adjunto adverbial de lugar.","E":"um segmento explicativo intercalado."},"gabarito":"E","comentario":"O trecho entre travessões funciona como segmento explicativo, de valor apositivo, intercalado no período.","referencia":"Pontuação e sinais gráficos: travessões em segmentos intercalados."},{"id":"POR048","disciplina":"Língua Portuguesa","assunto":"Sintaxe: sujeito","dificuldade":"Fácil","enunciado":"Na frase “Chegaram cedo os representantes das escolas”, o sujeito é:","alternativas":{"A":"“cedo”.","B":"“os representantes das escolas”.","C":"“chegaram”.","D":"“das escolas”.","E":"indeterminado."},"gabarito":"B","comentario":"O verbo “chegaram” concorda com “os representantes das escolas”, sujeito posposto ao verbo.","referencia":"Organização sintática: identificação do sujeito em ordem inversa."},{"id":"POR049","disciplina":"Língua Portuguesa","assunto":"Sintaxe: objeto direto","dificuldade":"Fácil","enunciado":"Na frase “A comissão revisou o regulamento”, o termo “o regulamento” exerce a função de:","alternativas":{"A":"objeto direto.","B":"sujeito.","C":"predicativo do sujeito.","D":"complemento nominal.","E":"adjunto adverbial."},"gabarito":"A","comentario":"“Revisar” é verbo transitivo direto nesse contexto; “o regulamento” completa seu sentido sem preposição.","referencia":"Organização sintática: complementos verbais."},{"id":"POR050","disciplina":"Língua Portuguesa","assunto":"Sintaxe: complemento nominal","dificuldade":"Difícil","enunciado":"Em “A necessidade de revisão ficou evidente”, o termo “de revisão” é:","alternativas":{"A":"objeto direto de “ficou”.","B":"adjunto adverbial de causa.","C":"aposto de “necessidade”.","D":"sujeito da oração.","E":"complemento nominal de “necessidade”."},"gabarito":"E","comentario":"O sintagma preposicionado completa o sentido do nome abstrato “necessidade”, funcionando como complemento nominal.","referencia":"Organização sintática: complemento nominal."},{"id":"POR051","disciplina":"Língua Portuguesa","assunto":"Sintaxe: adjunto adverbial","dificuldade":"Fácil","enunciado":"Em “A equipe analisou os dados com cautela”, a expressão “com cautela” indica:","alternativas":{"A":"posse e exerce função de adjunto adnominal.","B":"agente e exerce função de sujeito.","C":"modo e exerce função de adjunto adverbial.","D":"objeto afetado e exerce função de objeto direto.","E":"qualidade permanente e exerce função de predicativo do sujeito."},"gabarito":"C","comentario":"A expressão caracteriza a maneira como a ação foi realizada, exercendo função adverbial de modo.","referencia":"Organização sintática: adjunto adverbial."},{"id":"POR052","disciplina":"Língua Portuguesa","assunto":"Sintaxe: predicativo","dificuldade":"Fácil","enunciado":"Na frase “Os resultados permaneceram estáveis”, o termo “estáveis” funciona como:","alternativas":{"A":"objeto direto.","B":"complemento nominal.","C":"adjunto adverbial.","D":"predicativo do sujeito.","E":"aposto."},"gabarito":"D","comentario":"Com o verbo de ligação “permaneceram”, “estáveis” atribui uma característica ao sujeito “os resultados”.","referencia":"Organização sintática: predicativo do sujeito."},{"id":"POR053","disciplina":"Língua Portuguesa","assunto":"Coordenação","dificuldade":"Fácil","enunciado":"Em “A equipe revisou o texto e enviou a versão final”, as duas formas verbais principais estão ligadas por:","alternativas":{"A":"subordinação causal.","B":"subordinação concessiva.","C":"coordenação aditiva.","D":"coordenação adversativa.","E":"subordinação condicional."},"gabarito":"C","comentario":"A conjunção “e” liga duas orações coordenadas de valor aditivo, com sujeito comum.","referencia":"Organização sintática: coordenação."},{"id":"POR054","disciplina":"Língua Portuguesa","assunto":"Subordinação adverbial","dificuldade":"Fácil","enunciado":"Em “Como o sistema ficou indisponível, o prazo foi prorrogado”, a oração inicial exprime:","alternativas":{"A":"finalidade.","B":"causa.","C":"concessão.","D":"comparação.","E":"consequência."},"gabarito":"B","comentario":"Nesse contexto, “como” introduz a causa que motivou a prorrogação do prazo.","referencia":"Organização sintática: oração subordinada adverbial causal."},{"id":"POR055","disciplina":"Língua Portuguesa","assunto":"Ordem direta e inversa","dificuldade":"Fácil","enunciado":"Assinale a frase em ordem direta mais típica do português, com sujeito antes do verbo e complementos depois:","alternativas":{"A":"“A equipe entregou o relatório ontem.”","B":"“Ontem, entregou o relatório a equipe.”","C":"“O relatório, ontem, a equipe entregou.”","D":"“Entregou ontem a equipe o relatório.”","E":"“Ontem o relatório entregou a equipe.”"},"gabarito":"A","comentario":"A sequência sujeito + verbo + objeto + adjunto corresponde à ordem direta mais típica do português.","referencia":"Ordem direta e inversa na frase portuguesa."},{"id":"POR056","disciplina":"Língua Portuguesa","assunto":"Concordância verbal","dificuldade":"Intermediária","enunciado":"Assinale a frase correta segundo a norma-padrão:","alternativas":{"A":"“Mais de um candidato apresentaram recurso.”","B":"“Mais de um candidato apresentou recurso.”","C":"“Haviam mais de um candidato na sala.”","D":"“Faziam três dias que o prazo terminara.”","E":"“Existe muitos recursos pendentes.”"},"gabarito":"B","comentario":"Com a expressão “mais de um”, a concordância é normalmente feita no singular. As demais alternativas apresentam desvios de concordância ou de impessoalidade verbal.","referencia":"Norma culta: concordância verbal."},{"id":"POR057","disciplina":"Língua Portuguesa","assunto":"Regência nominal","dificuldade":"Difícil","enunciado":"Assinale a frase adequada à norma-padrão:","alternativas":{"A":"“A equipe estava favorável com a revisão do procedimento.”","B":"“A equipe estava favorável à revisão do procedimento.”","C":"“A equipe estava favorável da revisão do procedimento.”","D":"“A equipe estava favorável pela revisão do procedimento.”","E":"“A equipe estava favorável em a revisão do procedimento.”"},"gabarito":"B","comentario":"O adjetivo “favorável” rege a preposição “a”; diante do artigo feminino de “a revisão”, ocorre a crase: “à revisão”.","referencia":"Norma culta: regência nominal."},{"id":"POR058","disciplina":"Língua Portuguesa","assunto":"Tipos de discurso: direto","dificuldade":"Fácil","enunciado":"Assinale o trecho em discurso direto:","alternativas":{"A":"“A coordenadora afirmou que entregaria o relatório no dia seguinte.”","B":"“A coordenadora afirmara ter entregue o relatório.”","C":"“A coordenadora afirmou: ‘Entregarei o relatório amanhã.’”","D":"“Segundo a coordenadora, o relatório seria entregue.”","E":"“A coordenadora, ao afirmar a entrega, encerrou a reunião.”"},"gabarito":"C","comentario":"No discurso direto, a fala é reproduzida como enunciado da personagem, marcada aqui por dois-pontos e aspas.","referencia":"Tipos de discurso: discurso direto."},{"id":"POR059","disciplina":"Língua Portuguesa","assunto":"Tipos de discurso: indireto","dificuldade":"Difícil","enunciado":"A transformação adequada de “João disse: ‘Estou cansado hoje’” para o discurso indireto, considerando que o narrador relata a fala posteriormente, é:","alternativas":{"A":"“João disse: que estou cansado hoje.”","B":"“João disse que estou cansado hoje.”","C":"“João disse estarás cansado naquele dia.”","D":"“João disse que estava cansado naquele dia.”","E":"“João disse que cansado estava amanhã.”"},"gabarito":"D","comentario":"No discurso indireto, ajustam-se a pessoa verbal, o tempo verbal e o marcador temporal ao novo ponto de enunciação: “estou” passa a “estava” e “hoje” a “naquele dia”.","referencia":"Tipos de discurso: transposição do direto para o indireto."},{"id":"POR060","disciplina":"Língua Portuguesa","assunto":"Tipos de discurso: indireto livre","dificuldade":"Difícil","enunciado":"Leia: “Marina fechou o caderno. De novo aquela dúvida. Será que havia entendido a explicação?” O trecho “De novo aquela dúvida. Será que havia entendido a explicação?” aproxima-se do:","alternativas":{"A":"discurso direto obrigatoriamente marcado por travessão.","B":"discurso científico, por apresentar hipótese testável.","C":"discurso indireto livre, por incorporar a perspectiva da personagem sem verbo dicendi explícito.","D":"discurso jurídico, por empregar forma interrogativa.","E":"discurso injuntivo, por ordenar uma ação."},"gabarito":"C","comentario":"A narração incorpora o pensamento da personagem sem introdução explícita por verbo como “pensar” e sem marcas formais de fala direta, característica do discurso indireto livre.","referencia":"Tipos de discurso: discurso indireto livre."},{"id":"POR061","disciplina":"Língua Portuguesa","assunto":"Registros de linguagem","dificuldade":"Fácil","enunciado":"Em um ofício dirigido a uma autoridade pública, a formulação mais adequada ao registro formal é:","alternativas":{"A":"“Manda aí os documentos até dia 15, beleza?”","B":"“A gente tá precisando desses papéis logo.”","C":"“Vê se consegue mandar isso pra nós.”","D":"“Solicitamos o encaminhamento dos documentos até 15 de outubro.”","E":"“Se rolar, envia os docs até quinze.”"},"gabarito":"D","comentario":"O contexto institucional exige escolhas lexicais e sintáticas compatíveis com o registro formal; a alternativa D atende a essa adequação.","referencia":"Registros de linguagem: adequação ao contexto comunicativo."},{"id":"POR062","disciplina":"Língua Portuguesa","assunto":"Registros de linguagem","dificuldade":"Intermediária","enunciado":"A frase “A gente vai ver isso depois” pode ser adequada a uma conversa informal. Em um relatório técnico, a alternativa mais apropriada é:","alternativas":{"A":"“A gente vê isso uma hora dessas.”","B":"“Depois nós dá uma olhada nisso.”","C":"“Isso aí a gente resolve.”","D":"“Vai vendo que depois sai.”","E":"“A questão será analisada posteriormente.”"},"gabarito":"E","comentario":"A alternativa E emprega construção impessoal e vocabulário compatível com um relatório técnico, sem marcas de coloquialidade.","referencia":"Registros de linguagem: variação situacional e adequação."},{"id":"POR063","disciplina":"Língua Portuguesa","assunto":"Funções da linguagem","dificuldade":"Fácil","enunciado":"Em “A água ferve, ao nível do mar, por volta de 100 °C”, predomina a função:","alternativas":{"A":"emotiva, pois o emissor expõe sentimentos.","B":"conativa, pois se dirige ao receptor com uma ordem.","C":"fática, pois testa o canal de comunicação.","D":"referencial, pois o foco recai sobre a informação transmitida.","E":"poética, pois privilegia a forma estética da mensagem."},"gabarito":"D","comentario":"O enunciado transmite uma informação sobre um fenômeno e concentra o foco no referente, característica da função referencial.","referencia":"Funções da linguagem: função referencial."},{"id":"POR064","disciplina":"Língua Portuguesa","assunto":"Funções da linguagem","dificuldade":"Fácil","enunciado":"Em um cartaz lê-se: “Participe da campanha de arrecadação e doe um livro.” Predomina a função:","alternativas":{"A":"metalinguística.","B":"referencial pura.","C":"poética.","D":"fática.","E":"conativa ou apelativa."},"gabarito":"E","comentario":"O imperativo dirige-se ao receptor e procura induzi-lo a uma ação, característica da função conativa ou apelativa.","referencia":"Funções da linguagem: função conativa/apelativa."},{"id":"POR065","disciplina":"Língua Portuguesa","assunto":"Elementos dos atos de comunicação","dificuldade":"Fácil","enunciado":"Em uma videoconferência, a plataforma e a conexão pela qual áudio e imagem são transmitidos correspondem, no modelo dos elementos da comunicação, principalmente ao:","alternativas":{"A":"referente.","B":"canal.","C":"código.","D":"emissor.","E":"receptor."},"gabarito":"B","comentario":"O canal é o meio físico ou técnico pelo qual a mensagem circula entre emissor e receptor. Na situação descrita, a plataforma e a conexão viabilizam essa transmissão.","referencia":"Elementos dos atos de comunicação: canal, emissor, receptor, mensagem, código e referente."},{"id":"POR066","disciplina":"Língua Portuguesa","assunto":"Formação de palavras: prefixação","dificuldade":"Fácil","enunciado":"Na frase “A equipe refez o levantamento após identificar falhas”, a palavra “refez” contém o prefixo “re-”, que acrescenta ao verbo a ideia de:","alternativas":{"A":"negação da ação.","B":"repetição da ação.","C":"movimento para dentro.","D":"excesso de intensidade.","E":"anterioridade espacial."},"gabarito":"B","comentario":"O prefixo “re-” em “refazer” indica a realização novamente da ação expressa por “fazer”.","referencia":"Estrutura e formação de palavras: derivação prefixal."},{"id":"POR067","disciplina":"Língua Portuguesa","assunto":"Formação de palavras: sufixação","dificuldade":"Intermediária","enunciado":"Na frase “Ela respondeu calmamente às perguntas”, a palavra “calmamente” resulta, no português contemporâneo, de:","alternativas":{"A":"derivação sufixal, com acréscimo de “-mente” à forma feminina do adjetivo “calma”.","B":"derivação prefixal, com acréscimo de “cal-”.","C":"composição por justaposição de dois substantivos.","D":"derivação regressiva a partir de um verbo.","E":"abreviação vocabular."},"gabarito":"A","comentario":"Advérbios em “-mente” são formados, em geral, pela associação desse sufixo à forma feminina do adjetivo, como “calma” + “-mente”.","referencia":"Formação de palavras: derivação sufixal."},{"id":"POR068","disciplina":"Língua Portuguesa","assunto":"Formação de palavras: composição","dificuldade":"Fácil","enunciado":"A palavra “passatempo” exemplifica processo de:","alternativas":{"A":"derivação prefixal.","B":"derivação sufixal.","C":"derivação parassintética.","D":"composição por justaposição.","E":"abreviação vocabular."},"gabarito":"D","comentario":"“Passatempo” resulta da união de duas bases lexicais, “passa” e “tempo”, sem fusão fonológica relevante entre elas.","referencia":"Formação de palavras: composição por justaposição."},{"id":"POR069","disciplina":"Língua Portuguesa","assunto":"Formação de palavras: parassíntese","dificuldade":"Difícil","enunciado":"Assinale a palavra tradicionalmente analisada como formada por derivação parassintética:","alternativas":{"A":"“infeliz”.","B":"“felizmente”.","C":"“refazer”.","D":"“anoitecer”.","E":"“livraria”."},"gabarito":"D","comentario":"“Anoitecer” é formado pela associação simultânea de prefixo e sufixo à base “noite” (a- + noite + -ecer). Não há, com o mesmo sentido e funcionamento, etapas intermediárias independentes *“anoite” ou *“noitecer”.","referencia":"Formação de palavras: derivação parassintética."},{"id":"POR070","disciplina":"Língua Portuguesa","assunto":"Formas de abreviação: sigla","dificuldade":"Fácil","enunciado":"Em um texto administrativo, “SEDUC”, forma reduzida de “Secretaria de Estado de Educação”, é exemplo de:","alternativas":{"A":"arcaísmo lexical.","B":"hiperônimo.","C":"interjeição.","D":"sufixo derivaciona
