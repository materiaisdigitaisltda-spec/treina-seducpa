matemáticos.","referencia":"PIAGET, Jean; construtivismo e interação em situações de aprendizagem."},{"id":"PED021","disciplina":"Conhecimentos Pedagógicos","assunto":"Competências e Saberes Docentes","dificuldade":"Intermediária","enunciado":"Uma competência profissional docente diferencia-se de uma simples posse de informações porque envolve","alternativas":{"A":"a memorização de teorias, ainda que não sejam mobilizadas em situações concretas.","B":"a execução automática de rotinas, sem julgamento profissional.","C":"o abandono de conhecimentos disciplinares em favor de habilidades socioemocionais.","D":"a utilização de um único método em qualquer turma.","E":"a mobilização articulada de conhecimentos, habilidades, atitudes e recursos para agir diante de situações profissionais."},"gabarito":"E","comentario":"A alternativa E está correta. Competência profissional implica mobilizar recursos diversos de forma pertinente em situações concretas. Ela não dispensa conhecimentos nem se reduz a automatismos ou a um método único.","referencia":"PERRENOUD, Philippe. Dez Novas Competências para Ensinar."},{"id":"PED022","disciplina":"Conhecimentos Pedagógicos","assunto":"Saberes Docentes — Maurice Tardif","dificuldade":"Fácil","enunciado":"Segundo Maurice Tardif, os saberes docentes são","alternativas":{"A":"exclusivamente científicos e produzidos fora da escola.","B":"apenas conhecimentos adquiridos na formação inicial.","C":"plurais, provenientes de diferentes fontes, como formação profissional, disciplinas, currículo e experiência.","D":"idênticos em todas as etapas da carreira.","E":"independentes das condições de trabalho."},"gabarito":"C","comentario":"A alternativa C está correta. Tardif destaca a pluralidade e a temporalidade dos saberes docentes, constituídos por diferentes fontes, entre elas formação profissional, saberes disciplinares, curriculares e experienciais.","referencia":"TARDIF, Maurice. Saberes Docentes e Formação Profissional."},{"id":"PED023","disciplina":"Conhecimentos Pedagógicos","assunto":"Competências para Ensinar","dificuldade":"Fácil","enunciado":"Um professor demonstra competência pedagógica quando","alternativas":{"A":"seleciona e adapta estratégias com base nos objetivos, no conteúdo, nos estudantes e nas evidências de aprendizagem.","B":"repete o mesmo plano em qualquer contexto para assegurar padronização.","C":"evita revisar decisões para não comprometer a autoridade.","D":"baseia o ensino apenas em preferências pessoais.","E":"separa planejamento, ensino e avaliação como processos sem relação."},"gabarito":"A","comentario":"A alternativa A está correta. A competência docente envolve julgamento profissional e capacidade de articular planejamento, intervenção e avaliação de acordo com objetivos, conteúdos, contexto e evidências de aprendizagem.","referencia":"Competências e saberes para ensinar."},{"id":"PED024","disciplina":"Conhecimentos Pedagógicos","assunto":"Saberes Docentes — reflexão sobre a prática","dificuldade":"Difícil","enunciado":"Após uma aula, uma professora compara os objetivos previstos com as evidências de aprendizagem, identifica um obstáculo não antecipado e modifica a próxima intervenção. Esse movimento caracteriza uma prática profissional reflexiva porque","alternativas":{"A":"substitui conhecimentos teóricos por impressões subjetivas.","B":"se limita a registrar o que ocorreu sem produzir decisões.","C":"considera que toda dificuldade é causada pelo estudante.","D":"evita alterar o planejamento para preservar a sequência original.","E":"articula análise da ação, conhecimentos profissionais e tomada de decisão para aperfeiçoar o ensino."},"gabarito":"E","comentario":"A alternativa E está correta. A prática reflexiva envolve interpretar a ação à luz de conhecimentos e evidências e, a partir disso, reconstruir decisões profissionais. Não se trata de mera opinião nem de abandono da teoria.","referencia":"SCHÖN, Donald. Educando o Profissional Reflexivo."},{"id":"PED025","disciplina":"Conhecimentos Pedagógicos","assunto":"Desenvolvimento integral — dimensões cognitivas, afetivas, sociais e culturais","dificuldade":"Intermediária","enunciado":"Uma escola deseja promover desenvolvimento integral. Qual ação é mais coerente com esse objetivo?","alternativas":{"A":"Priorizar apenas desempenho cognitivo em testes, pois as demais dimensões são externas à escola.","B":"Tratar aspectos afetivos como substitutos dos conhecimentos escolares.","C":"Planejar experiências que articulem aprendizagem conceitual, relações sociais, expressão emocional e valorização dos contextos culturais.","D":"Eliminar conflitos e diferenças culturais por meio de práticas uniformes.","E":"Transferir às famílias toda responsabilidade pelas dimensões socioafetivas."},"gabarito":"C","comentario":"A alternativa C está correta. O desenvolvimento integral articula dimensões cognitivas, afetivas, sociais e culturais, sem reduzir a escola a uma única delas. Os conhecimentos escolares permanecem essenciais, mas são trabalhados em relação com outras dimensões da formação humana.","referencia":"Edital nº 001/2026 SEPLAD/SEDUC-PA, Anexo V — Conhecimentos Pedagógicos."},{"id":"PED026","disciplina":"Conhecimentos Pedagógicos","assunto":"Desenvolvimento integral — dimensão afetiva","dificuldade":"Difícil","enunciado":"Um estudante domina os procedimentos de uma atividade, mas evita participar porque teme errar diante da turma. Uma intervenção coerente com a articulação entre dimensões cognitivas e afetivas seria","alternativas":{"A":"dispensá-lo permanentemente de tarefas desafiadoras.","B":"criar condições de segurança para tentativa e erro, oferecer devolutivas específicas e manter desafios ajustados às possibilidades de aprendizagem.","C":"ignorar o receio, pois emoções não interferem nos processos cognitivos.","D":"reduzir indefinidamente a complexidade das tarefas.","E":"substituir a aprendizagem do conteúdo por atividades de autoestima."},"gabarito":"B","comentario":"A alternativa B está correta. Aspectos afetivos influenciam engajamento, persistência e disposição para aprender. A resposta pedagógica adequada combina segurança psicológica, feedback e manutenção de expectativas de aprendizagem, sem excluir o estudante de desafios relevantes.","referencia":"Desenvolvimento integral; relação entre cognição, emoção e aprendizagem."},{"id":"PED027","disciplina":"Conhecimentos Pedagógicos","assunto":"Desenvolvimento integral — dimensão sociocultural","dificuldade":"Intermediária","enunciado":"Uma turma reúne estudantes com repertórios culturais diversos. Para integrar a dimensão sociocultural ao ensino sem cair em folclorização, o professor deve","alternativas":{"A":"incorporar diferentes repertórios como fontes de análise e diálogo, articulando-os aos conhecimentos curriculares e evitando estereótipos.","B":"tratar as diferenças apenas em datas comemorativas.","C":"evitar referências culturais locais para garantir neutralidade.","D":"atribuir a cada grupo características culturais fixas.","E":"substituir conteúdos escolares por relatos de experiência."},"gabarito":"A","comentario":"A alternativa A está correta. A diversidade cultural pode integrar o currículo de forma crítica e contínua, relacionando experiências e repertórios aos conhecimentos sistematizados. Folclorizar significa reduzir culturas a marcas superficiais, fixas ou estereotipadas.","referencia":"Dimensões sociais e culturais da educação; multiculturalidade."},{"id":"PED028","disciplina":"Conhecimentos Pedagógicos","assunto":"Escola inclusiva — participação e aprendizagem","dificuldade":"Intermediária","enunciado":"Uma escola afirma ser inclusiva porque matricula estudantes com diferentes necessidades, mas mantém alguns deles quase sempre em atividades paralelas, sem participação nas experiências curriculares da turma. Essa prática","alternativas":{"A":"é inclusiva, pois a matrícula é o único requisito essencial.","B":"é adequada quando reduz a carga de planejamento do professor.","C":"é incompatível com a inclusão, que exige acesso, participação, aprendizagem e pertencimento, com apoios quando necessários.","D":"é recomendável para qualquer estudante com dificuldade.","E":"é equivalente ao Atendimento Educacional Especializado."},"gabarito":"C","comentario":"A alternativa C está correta. Inclusão não se limita à matrícula ou à presença física. Pressupõe condições de acesso, permanência, participação e aprendizagem, com eliminação de barreiras e oferta de apoios quando necessários.","referencia":"Decreto nº 12.686/2025, texto consolidado pelo Decreto nº 12.773/2025, arts. 1º a 3º."},{"id":"PED029","disciplina":"Conhecimentos Pedagógicos","assunto":"Escola inclusiva — barreiras à participação","dificuldade":"Difícil","enunciado":"Durante uma atividade, a escola identifica que o principal obstáculo à participação de um estudante é a forma única de apresentação do conteúdo, baseada somente em texto extenso. A resposta pedagógica mais inclusiva é","alternativas":{"A":"retirar o estudante do conteúdo comum.","B":"manter o formato e ampliar apenas o tempo da prova.","C":"atribuir o obstáculo exclusivamente ao diagnóstico do estudante.","D":"replanejar a apresentação e as formas de participação, oferecendo recursos acessíveis sem reduzir os objetivos essenciais.","E":"dispensar o estudante da avaliação."},"gabarito":"D","comentario":"A alternativa D está correta. Uma perspectiva inclusiva analisa a interação entre estudante, tarefa e ambiente e procura remover barreiras. Diversificar formas de apresentação e participação pode ampliar o acesso sem reduzir os objetivos essenciais de aprendizagem.","referencia":"Lei nº 13.146/2015, arts. 27 e 28; Decreto nº 12.686/2025."},{"id":"PED030","disciplina":"Conhecimentos Pedagógicos","assunto":"Escola inclusiva — pertencimento e socialização","dificuldade":"Intermediária","enunciado":"Em relação à socialização em uma escola inclusiva, assinale a afirmativa correta.","alternativas":{"A":"A socialização ocorre espontaneamente sempre que os estudantes compartilham o mesmo espaço.","B":"A escola deve planejar condições de participação e interação, prevenindo isolamento, estigma e relações excludentes.","C":"A socialização é responsabilidade exclusiva da família.","D":"Atividades cooperativas devem ser evitadas porque ocultam diferenças individuais.","E":"O pertencimento é secundário quando o desempenho acadêmico é satisfatório."},"gabarito":"B","comentario":"A alternativa B está correta. A presença física, por si só, não assegura pertencimento. A escola precisa organizar práticas e relações que promovam participação, vínculos, respeito às diferenças e aprendizagem em conjunto.","referencia":"Escola inclusiva como espaço de acolhimento, aprendizagem e socialização."},{"id":"PED031","disciplina":"Conhecimentos Pedagógicos","assunto":"Proposta pedagógica da escola — construção coletiva","dificuldade":"Intermediária","enunciado":"Na revisão da proposta pedagógica, a direção apresenta um documento pronto e solicita apenas assinaturas dos professores e representantes das famílias. À luz da construção coletiva, o principal problema desse procedimento é","alternativas":{"A":"o excesso de consulta a diferentes segmentos.","B":"a ausência de linguagem técnica.","C":"a participação meramente formal, sem debate e deliberação sobre diagnóstico, prioridades e ações da escola.","D":"a necessidade de registrar o documento.","E":"a presença das famílias no processo."},"gabarito":"C","comentario":"A alternativa C está correta. A construção coletiva exige participação substantiva na análise da realidade, na definição de objetivos, prioridades e ações. Assinar um texto previamente fechado não equivale a participação efetiva.","referencia":"Proposta pedagógica da escola; gestão participativa."},{"id":"PED032","disciplina":"Conhecimentos Pedagógicos","assunto":"Proposta pedagógica — demandas sociais e multiculturalidade","dificuldade":"Difícil","enunciado":"Uma escola situada em território culturalmente diverso elabora sua proposta pedagógica ignorando características da comunidade sob o argumento de que “o currículo deve ser igual para todos”. Essa posição é inadequada porque","alternativas":{"A":"a escola deve abandonar conhecimentos comuns e ensinar apenas conteúdos locais.","B":"a igualdade educacional exige reconhecer contextos e diferenças, articulando referências comuns às demandas sociais e culturais do território.","C":"todo conteúdo curricular deve ser decidido exclusivamente pelas famílias.","D":"a proposta pedagógica deve reproduzir integralmente costumes locais, sem análise crítica.","E":"a diversidade cultural impede a existência de objetivos educacionais compartilhados."},"gabarito":"B","comentario":"A alternativa B está correta. Uma proposta pedagógica contextualizada pode articular direitos comuns de aprendizagem e conhecimentos de referência às características socioculturais da comunidade. Equidade não significa uniformidade indiferente às diferenças.","referencia":"Edital nº 001/2026 SEPLAD/SEDUC-PA, Anexo V — construção coletiva da proposta pedagógica."},{"id":"PED033","disciplina":"Conhecimentos Pedagógicos","assunto":"Proposta pedagógica — participação de estudantes e famílias","dificuldade":"Intermediária","enunciado":"Ao incorporar expectativas de estudantes e famílias à proposta pedagógica, a escola deve","alternativas":{"A":"aceitar automaticamente todas as demandas apresentadas.","B":"substituir critérios pedagógicos por preferências majoritárias.","C":"consultar apenas os responsáveis com maior participação em reuniões.","D":"preservar as decisões exclusivamente entre profissionais da educação.","E":"criar canais de escuta e participação, analisar as demandas à luz dos direitos educacionais e explicitar os critérios das decisões."},"gabarito":"E","comentario":"A alternativa E está correta. Participação democrática envolve escuta real, diálogo e transparência, mas não significa incorporação automática de toda demanda. As decisões devem considerar direitos educacionais, finalidades formativas e condições institucionais.","referencia":"Proposta pedagógica; participação da comunidade escolar."},{"id":"PED034","disciplina":"Conhecimentos Pedagógicos","assunto":"Formação continuada de professores","dificuldade":"Fácil","enunciado":"Uma ação de formação continuada tende a produzir maior relação com a prática quando","alternativas":{"A":"é desvinculada dos problemas reais da escola.","B":"parte de evidências e desafios do cotidiano, promove estudo, experimentação, colaboração e acompanhamento das mudanças.","C":"se resume ao envio de textos sem espaço de discussão.","D":"ocorre apenas quando há mudança de legislação.","E":"trata todos os docentes como se tivessem as mesmas necessidades formativas."},"gabarito":"B","comentario":"A alternativa B está correta. Formação continuada situada articula estudo teórico, análise da prática, experimentação, colaboração e acompanhamento. Isso favorece desenvolvimento profissional vinculado aos desafios concretos da escola.","referencia":"Formação continuada de professores; desenvolvimento profissional docente."},{"id":"PED035","disciplina":"Conhecimentos Pedagógicos","assunto":"Formação continuada — colaboração profissional","dificuldade":"Intermediária","enunciado":"Em uma comunidade de aprendizagem docente, professores observam aulas, analisam produções de estudantes e discutem estratégias com base em referenciais teóricos. O ganho formativo mais diretamente associado a essa dinâmica é","alternativas":{"A":"eliminar a necessidade de formação individual.","B":"transformar a prática em objeto coletivo de investigação e reflexão profissional.","C":"padronizar obrigatoriamente todas as aulas.","D":"substituir o conhecimento científico pela experiência.","E":"transferir à equipe a responsabilidade individual por qualquer decisão."},"gabarito":"B","comentario":"A alternativa B está correta. A colaboração profissional qualificada permite tornar a prática objeto de investigação, relacionar teoria e experiência e construir conhecimento pedagógico compartilhado. Isso não implica uniformização absoluta das aulas.","referencia":"Formação continuada e trabalho colaborativo."},{"id":"PED036","disciplina":"Conhecimentos Pedagógicos","assunto":"Formação continuada — diagnóstico de necessidades","dificuldade":"Fácil","enunciado":"Para planejar uma formação continuada sobre avaliação, a coordenação pedagógica deve começar, preferencialmente, por","alternativas":{"A":"escolher o tema mais popular nas redes sociais.","B":"repetir a formação do ano anterior sem diagnóstico.","C":"adotar um curso pronto sem analisar o contexto.","D":"priorizar apenas professores iniciantes.","E":"identificar necessidades por meio de evidências da prática, resultados de aprendizagem, autoavaliação docente e objetivos da escola."},"gabarito":"E","comentario":"A alternativa E está correta. Diagnosticar necessidades ajuda a alinhar a formação ao contexto e aos objetivos pedagógicos. A formação pode combinar demandas individuais, coletivas e institucionais.","referencia":"Formação continuada de professores."},{"id":"PED037","disciplina":"Conhecimentos Pedagógicos","assunto":"Integração escola-família","dificuldade":"Intermediária","enunciado":"Uma escola procura ampliar a participação das famílias. Qual iniciativa está mais alinhada a uma relação de parceria?","alternativas":{"A":"convocar responsáveis apenas quando há problemas disciplinares.","B":"criar canais regulares de comunicação e participação, compartilhar objetivos de aprendizagem e escutar conhecimentos e necessidades das famílias.","C":"transferir às famílias a responsabilidade pelo ensino dos conteúdos.","D":"usar linguagem técnica sem explicações para preservar autoridade profissional.","E":"limitar a participação familiar a eventos festivos."},"gabarito":"B","comentario":"A alternativa B está correta. A parceria escola-família exige comunicação bidirecional, respeito, clareza de papéis e oportunidades contínuas de participação. A escola, entretanto, mantém a responsabilidade pela ação pedagógica.","referencia":"Papel do professor na integração escola/família."},{"id":"PED038","disciplina":"Conhecimentos Pedagógicos","assunto":"Integração escola-família — limites de responsabilidades","dificuldade":"Difícil","enunciado":"Uma professora percebe dificuldades persistentes de um estudante e decide encaminhar à família uma lista diária de conteúdos para que sejam ensinados em casa, afirmando que a escola só poderá avançar quando os responsáveis “corrigirem as lacunas”. A decisão é problemática porque","alternativas":{"A":"a família nunca deve acompanhar a vida escolar.","B":"o professor não pode comunicar dificuldades de aprendizagem.","C":"todo apoio familiar prejudica a autonomia.","D":"a escola deveria aplicar apenas avaliações somativas.","E":"a parceria com a família não autoriza transferir a ela a responsabilidade pedagógica institucional pelo ensino e pelas intervenções necessárias."},"gabarito":"E","comentario":"A alternativa E está correta. A família pode acompanhar, apoiar e dialogar com a escola, mas não deve receber a responsabilidade institucional de planejar, ensinar e recuperar conteúdos. Essas funções permanecem sob responsabilidade pedagógica da escola.","referencia":"Integração escola/família; responsabilidades pedagógicas."},{"id":"PED039","disciplina":"Conhecimentos Pedagógicos","assunto":"Integração escola-família — comunicação equitativa","dificuldade":"Intermediária","enunciado":"Em uma comunidade com diferentes condições de acesso digital e horários de trabalho, a comunicação escola-família é mais equitativa quando","alternativas":{"A":"utiliza múltiplos canais e horários, linguagem acessível e mecanismos de retorno, considerando as condições das famílias.","B":"adota exclusivamente um aplicativo obrigatório.","C":"mantém apenas comunicados escritos em linguagem administrativa.","D":"exige presença física em horário comercial para qualquer contato.","E":"prioriza famílias que respondem mais rapidamente."},"gabarito":"A","comentario":"A alternativa A está correta. Comunicação equitativa considera barreiras de acesso, linguagem e disponibilidade, criando alternativas para que diferentes famílias possam receber informações, responder e participar.","referencia":"Integração escola/família e comunicação inclusiva."},{"id":"PED040","disciplina":"Conhecimentos Pedagógicos","assunto":"Relação professor-aluno — valores éticos","dificuldade":"Fácil","enunciado":"Durante um debate, um estudante faz uma afirmação equivocada e recebe risadas dos colegas. A intervenção que melhor articula aprendizagem e construção de valores éticos é","alternativas":{"A":"encerrar o debate e aplicar punição coletiva.","B":"ignorar a situação para preservar a espontaneidade.","C":"expor publicamente quem riu para produzir constrangimento equivalente.","D":"interromper a ridicularização, reafirmar normas de respeito e transformar o erro em oportunidade de análise e argumentação.","E":"proibir novas participações do estudante."},"gabarito":"D","comentario":"A alternativa D está correta. A relação pedagógica ética protege a dignidade dos estudantes e mantém exigência intelectual. O erro pode ser analisado sem humilhação, favorecendo respeito, argumentação, cooperação e responsabilidade.","referencia":"Relação professor/aluno; ética e atitudes cooperativas."},{"id":"PED041","disciplina":"Conhecimentos Pedagógicos","assunto":"Relação professor-aluno — autoridade pedagógica","dificuldade":"Fácil","enunciado":"A autoridade docente é exercida de forma pedagogicamente legítima quando o professor","alternativas":{"A":"estabelece limites e critérios claros, explica suas razões, age com coerência e respeita a dignidade dos estudantes.","B":"obtém obediência pelo medo.","C":"evita qualquer regra para manter uma relação horizontal.","D":"negocia todos os objetivos curriculares individualmente.","E":"usa notas como instrumento de controle disciplinar."},"gabarito":"A","comentario":"A alternativa A está correta. Autoridade pedagógica não se confunde com autoritarismo nem com ausência de limites. Ela se sustenta em responsabilidade, conhecimento, coerência, justiça e respeito.","referencia":"Relação professor/aluno e ética profissional."},{"id":"PED042","disciplina":"Conhecimentos Pedagógicos","assunto":"Relação professor-aluno — cooperação","dificuldade":"Difícil","enunciado":"Em uma atividade cooperativa, alguns estudantes realizam todo o trabalho enquanto outros apenas assinam a produção final. Para promover cooperação genuína, o professor deve","alternativas":{"A":"abolir qualquer trabalho em grupo.","B":"atribuir a mesma função a todos sem considerar a tarefa.","C":"estruturar interdependência entre os membros, responsabilidades individuais e momentos de avaliação do processo coletivo.","D":"avaliar apenas o produto final do grupo.","E":"deixar a divisão de tarefas sem qualquer acompanhamento."},"gabarito":"C","comentario":"A alternativa C está correta. Cooperação efetiva requer interdependência, participação e responsabilidade individual e coletiva. O desenho da atividade precisa evitar tanto a competição interna quanto a dependência de poucos participantes.","referencia":"Atitudes cooperativas, solidárias e responsáveis."},{"id":"PED043","disciplina":"Conhecimentos Pedagógicos","assunto":"Diferenças individuais na aprendizagem","dificuldade":"Intermediária","enunciado":"Diante de ritmos diferentes de aprendizagem na turma, uma resposta pedagógica adequada é","alternativas":{"A":"fixar expectativas mais baixas para os estudantes que avançam lentamente.","B":"separar permanentemente os estudantes por nível.","C":"atribuir as diferenças exclusivamente à inteligência inata.","D":"manter objetivos comuns essenciais e diversificar apoios, tempos, recursos e desafios conforme as necessidades.","E":"usar a mesma intervenção para todos, pois diferenciação viola a igualdade."},"gabarito":"D","comentario":"A alternativa D está correta. A diferenciação pedagógica procura garantir acesso a objetivos relevantes por meio de apoios e percursos ajustados às necessidades, sem cristalizar rótulos nem reduzir expectativas de forma automática.","referencia":"Diferenças individuais e fatores da aprendizagem."},{"id":"PED044","disciplina":"Conhecimentos Pedagógicos","assunto":"Diferenças individuais — fatores determinantes","dificuldade":"Intermediária","enunciado":"Sobre as diferenças individuais no desenvolvimento e na aprendizagem, assinale a afirmativa correta.","alternativas":{"A":"Resultam da interação de fatores biológicos, psicológicos, sociais, culturais e educacionais, não podendo ser reduzidas a uma única causa.","B":"São determinadas integralmente pela hereditariedade.","C":"São explicadas apenas pela qualidade do ensino.","D":"Desaparecem quando os estudantes recebem o mesmo material.","E":"Impedem a definição de objetivos curriculares comuns."},"gabarito":"A","comentario":"A alternativa A está correta. O desenvolvimento humano é multideterminado. Características individuais resultam de interações complexas entre condições pessoais e contextuais; explicações monocausais são insuficientes.","referencia":"Psicologia do desenvolvimento e diferenças individuais."},{"id":"PED045","disciplina":"Conhecimentos Pedagógicos","assunto":"Diferenças individuais — expectativas docentes","dificuldade":"Intermediária","enunciado":"Um professor conclui, após poucas atividades, que determinado estudante “não tem capacidade” para tarefas complexas e passa a oferecer somente exercícios simples. O risco pedagógico dessa conduta é","alternativas":{"A":"aumentar excessivamente a autonomia do estudante.","B":"gerar um conflito cognitivo produtivo.","C":"promover diferenciação curricular adequada.","D":"ampliar oportunidades de aprendizagem.","E":"cristalizar expectativas baixas e reduzir oportunidades de desenvolvimento, confundindo desempenho atual com capacidade fixa."},"gabarito":"E","comentario":"A alternativa E está correta. Desempenho atual não permite concluir que a capacidade seja imutável. Expectativas baixas podem reduzir desafios, feedback e oportunidades de aprendizagem, reforçando desigualdades.","referencia":"Diferenças individuais; expectativas e oportunidades de aprendizagem."},{"id":"PED046","disciplina":"Conhecimentos Pedagógicos","assunto":"Desenvolvimento da Inteligência — Piaget","dificuldade":"Fácil","enunciado":"Para Piaget, o desenvolvimento da inteligência envolve um processo contínuo de adaptação cognitiva que articula","alternativas":{"A":"reforço e punição.","B":"mediação e internalização.","C":"assimilação e acomodação.","D":"imitação e condicionamento.","E":"memorização e repetição."},"gabarito":"C","comentario":"A alternativa C está correta. Assimilação corresponde à incorporação de elementos às estruturas cognitivas existentes; acomodação envolve modificação dessas estruturas diante das exigências da situação. A equilibração articula esses processos.","referencia":"PIAGET, Jean. Psicologia da Inteligência."},{"id":"PED047","disciplina":"Conhecimentos Pedagógicos","assunto":"Desenvolvimento da Inteligência — avaliação das capacidades cognitivas","dificuldade":"Difícil","enunciado":"Uma escola adota a ideia de que a inteligência não deve ser reduzida a uma única pontuação e passa a observar diferentes formas de resolução de problemas e produção dos estudantes. Pedagogicamente, essa decisão é defensável porque","alternativas":{"A":"todo desempenho é equivalente e não pode ser avaliado.","B":"qualquer teoria de inteligência dispensa critérios de aprendizagem.","C":"a inteligência é totalmente independente do conhecimento.","D":"testes padronizados são sempre inválidos.","E":"o desempenho cognitivo é complexo e pode se manifestar de modos diversos, de modo que uma medida isolada não esgota a compreensão das capacidades do estudante."},"gabarito":"E","comentario":"A alternativa E está correta. Capacidades cognitivas são complexas e o desempenho varia conforme tarefa, conhecimento prévio e contexto. Uma medida isolada pode oferecer informação útil, mas não autoriza inferências totalizantes sobre todo o potencial do estudante.","referencia":"Psicologia da inteligência e avaliação educacional."},{"id":"PED048","disciplina":"Conhecimentos Pedagógicos","assunto":"Desenvolvimento da Inteligência — mediação e potencial de aprendizagem","dificuldade":"Difícil","enunciado":"Uma professora oferece pistas graduadas a um estudante e observa que ele consegue resolver problemas que ainda não soluciona sozinho. Na perspectiva histórico-cultural, esse dado indica que","alternativas":{"A":"o desempenho independente é a única medida válida do desenvolvimento.","B":"o potencial de aprendizagem também pode ser observado em situações de mediação, considerando funções em processo de desenvolvimento.","C":"a ajuda invalida qualquer avaliação pedagógica.","D":"a inteligência é fixa e a intervenção apenas mascara o resultado.","E":"a aprendizagem deve aguardar a maturação completa."},"gabarito":"B","comentario":"A alternativa B está correta. Na abordagem de Vygotsky, a análise do desenvolvimento pode considerar tanto funções já consolidadas quanto aquelas que emergem com mediação, isto é, na zona de desenvolvimento proximal.","referencia":"VYGOTSKY, Lev S. A Formação Social da Mente."},{"id":"PED049","disciplina":"Conhecimentos Pedagógicos","assunto":"Estágios do desenvolvimento — Piaget","dificuldade":"Difícil","enunciado":"Uma criança consegue conservar quantidade e realizar operações lógicas quando trabalha com situações concretas, mas encontra dificuldade em hipóteses puramente abstratas. Segundo a descrição clássica de Piaget, esse funcionamento é mais compatível com o estágio","alternativas":{"A":"sensório-motor.","B":"pré-operatório.","C":"operatório formal.","D":"pós-formal.","E":"operatório concreto."},"gabarito":"E","comentario":"A alternativa E está correta. No estágio operatório concreto, a criança realiza operações lógicas reversíveis aplicadas a objetos e situações concretas. O raciocínio hipotético-dedutivo é associado ao operatório formal.","referencia":"PIAGET, Jean. Seis Estudos de Psicologia."},{"id":"PED050","disciplina":"Conhecimentos Pedagógicos","assunto":"Estágios do desenvolvimento — uso pedagógico","dificuldade":"Fácil","enunciado":"A respeito do uso dos estágios do desenvolvimento em contexto escolar, é correto afirmar que","alternativas":{"A":"definem idades rígidas que permitem prever exatamente o desempenho de qualquer estudante.","B":"servem para rotular estudantes e limitar conteúdos disponíveis.","C":"eliminam a influência da experiência e do ensino.","D":"devem ser interpretados como referências teóricas sobre formas de pensamento, evitando aplicação mecânica e determinista a indivíduos.","E":"provam que todos os estudantes aprendem no mesmo ritmo."},"gabarito":"D","comentario":"A alternativa D está correta. Os estágios são modelos teóricos de organização do desenvolvimento e não tabelas rígidas para classificar indivíduos. O desempenho também varia conforme experiência, tarefa, conhecimento prévio e contexto.","referencia":"PIAGET, Jean; aplicações educacionais da psicologia do desenvolvimento."},{"id":"PED051","disciplina":"Conhecimentos Pedagógicos","assunto":"Desenvolvimento e aprendizagem","dificuldade":"Difícil","enunciado":"Uma equipe afirma que “é inútil ensinar algo antes que o estudante alcance espontaneamente determinado estágio”. Essa formulação é excessivamente determinista porque","alternativas":{"A":"todo ensino produz imediatamente qualquer aprendizagem, independentemente do desenvolvimento.","B":"estágios não existem em nenhuma teoria do desenvolvimento.","C":"desenvolvimento e aprendizagem interagem, e a qualidade das experiências e mediações pode favorecer avanços sem ignorar as possibilidades atuais do estudante.","D":"o desenvolvimento depende apenas da escola.","E":"o ensino deve sempre antecipar conteúdos muito além das possibilidades do estudante."},"gabarito":"C","comentario":"A alternativa C está correta. O planejamento deve considerar formas atuais de pensamento e, simultaneamente, propor experiências e mediações que favoreçam avanços. Nem o maturacionismo rígido nem o voluntarismo pedagógico explicam adequadamente a relação entre ensino e desenvolvimento.","referencia":"Psicologia do desenvolvimento e da aprendizagem."},{"id":"PED052","disciplina":"Conhecimentos Pedagógicos","assunto":"Processo de socialização","dificuldade":"Intermediária","enunciado":"No ambiente escolar, socialização deve ser compreendida como","alternativas":{"A":"processo pelo qual sujeitos participam de práticas sociais, aprendem normas e valores e também interpretam e transformam relações culturais.","B":"mera adaptação passiva do estudante a regras já existentes.","C":"substituição da identidade familiar pela identidade escolar.","D":"atividade restrita aos intervalos e momentos recreativos.","E":"resultado automático da convivência entre pessoas da mesma idade."},"gabarito":"A","comentario":"A alternativa A está correta. Socialização é um processo relacional e cultural no qual sujeitos aprendem modos de participação, normas e valores e também atuam sobre seus contextos. A escola é um importante espaço desse processo.","referencia":"Sociologia da Educação; processo de socialização."},{"id":"PED053","disciplina":"Conhecimentos Pedagógicos","assunto":"Processo de socialização — convivência democrática","dificuldade":"Difícil","enunciado":"Uma escola deseja fortalecer a socialização democrática. Entre as ações abaixo, a mais coerente é","alternativas":{"A":"evitar debates sobre regras para impedir conflitos.","B":"premiar apenas comportamentos conformes sem discutir seus fundamentos.","C":"separar estudantes que discordam entre si.","D":"deixar as relações de convivência fora do planejamento pedagógico.","E":"construir normas de convivência com participação, trabalhar conflitos por diálogo e criar oportunidades de cooperação e responsabilidade coletiva."},"gabarito":"E","comentario":"A alternativa E está correta. A socialização democrática exige experiências de participação, negociação de regras, respeito às diferenças e responsabilidade coletiva. Conflitos podem ser trabalhados pedagogicamente, em vez de apenas suprimidos.","referencia":"Processo de socialização; convivência democrática."},{"id":"PED054","disciplina":"Conhecimentos Pedagógicos","assunto":"Referenciais curriculares — princípios e fundamentos","dificuldade":"Fácil","enunciado":"Um referencial curricular cumpre adequadamente sua função quando","alternativas":{"A":"prescreve cada aula de modo uniforme, eliminando a autonomia docente.","B":"define orientações, princípios e aprendizagens de referência para subsidiar currículos e práticas, admitindo contextualização pedagógica.","C":"substitui o projeto político-pedagógico de cada escola.","D":"serve apenas como instrumento de avaliação externa.","E":"organiza exclusivamente listas de conteúdos sem explicitar finalidades formativas."},"gabarito":"B","comentario":"A alternativa B está correta. Referenciais curriculares orientam o trabalho educacional, explicitando princípios, direitos, objetivos ou aprendizagens esperadas. Eles não precisam transformar-se em roteiro rígido de cada aula e admitem contextualização pedagógica.","referencia":"Princípios e fundamentos dos referenciais curriculares."},{"id":"PED055","disciplina":"Conhecimentos Pedagógicos","assunto":"Referenciais curriculares — currículo prescrito e prática","dificuldade":"Intermediária","enunciado":"Uma professora observa que o referencial curricular estabelece uma habilidade, mas sua turma precisa de conhecimentos prévios ainda não consolidados. A decisão mais adequada é","alternativas":{"A":"ignorar a habilidade prevista.","B":"aplicar imediatamente uma avaliação somativa.","C":"reduzir permanentemente as expectativas da turma.","D":"planejar progressões e apoios que recuperem pré-requisitos e conduzam à aprendizagem prevista no referencial.","E":"substituir o referencial por preferências individuais."},"gabarito":"D","comentario":"A alternativa D está correta. O referencial orienta objetivos, mas o planejamento deve considerar a situação real da turma e construir percursos para alcançar as aprendizagens previstas. Diagnóstico e progressão são compatíveis com o currículo de referência.","referencia":"Referenciais curriculares e planejamento pedagógico."},{"id":"PED056","disciplina":"Conhecimentos Pedagógicos","assunto":"Referenciais curriculares — contextualização","dificuldade":"Fácil","enunciado":"Contextualizar um referencial curricular significa","alternativas":{"A":"abandonar conhecimentos comuns e trabalhar somente temas locais.","B":"adaptar objetivos ao ponto de torná-los irreconhecíveis.","C":"eliminar conteúdos abstratos.","D":"usar apenas exemplos do cotidiano imediato dos estudantes.","E":"articular aprendizagens de referência às características, problemas e repertórios do contexto, preservando a intencionalidade curricular."},"gabarito":"E","comentario":"A alternativa E está correta. Contextualização relaciona o currículo a situações e repertórios significativos sem reduzir o conhecimento ao cotidiano nem eliminar objetivos comuns. O contexto funciona como mediação para ampliar a compreensão.","referencia":"Referenciais curriculares; contextualização pedagógica."},{"id":"PED057","disciplina":"Conhecimentos Pedagógicos","assunto":"Função social da escola","dificuldade":"Intermediária","enunciado":"Entre as funções sociais da escola pública, destaca-se","alternativas":{"A":"selecionar apenas estudantes que demonstram facilidade inicial.","B":"garantir acesso ao conhecimento sistematizado e contribuir para formação cidadã, participação social e ampliação das possibilidades de desenvolvimento.","C":"reproduzir sem crítica valores já presentes na sociedade.","D":"limitar-se à preparação imediata para o mercado de trabalho.","E":"transferir integralmente à família a formação ética."},"gabarito":"B","comentario":"A alternativa B está correta. A escola tem compromisso com democratização do conhecimento, formação humana e participação social. Sua função não se reduz a seleção, reprodução acrítica ou preparação imediata para o trabalho.","referencia":"Função social da escola e compromisso social do educador."},{"id":"PED058","disciplina":"Conhecimentos Pedagógicos","assunto":"Compromisso social do educador","dificuldade":"Intermediária","enunciado":"Uma professora percebe que certos estudantes participam menos porque os exemplos e materiais usados em aula nunca dialogam com seus repertórios. Em consonância com o compromisso social do educador, ela deve","alternativas":{"A":"manter o material, pois reconhecer diferenças produz desigualdade.","B":"excluir os exemplos culturais do currículo.","C":"revisar materiais e estratégias para ampliar representação e participação, sem reduzir o rigor conceitual.","D":"substituir o currículo por atividades de socialização.","E":"atribuir a baixa participação exclusivamente à família."},"gabarito":"C","comentario":"A alternativa C está correta. O compromisso social do educador envolve analisar barreiras e desigualdades produzidas também pelas práticas escolares, buscando ampliar acesso ao conhecimento e participação sem reduzir a exigência acadêmica.","referencia":"Função social da escola; equidade e prática pedagógica."},{"id":"PED059","disciplina":"Conhecimentos Pedagógicos","assunto":"Função social da escola — conhecimento e formação crítica","dificuldade":"Intermediária","enunciado":"A defesa do acesso de todos ao conhecimento escolar é compatível com uma perspectiva crítica quando se entende que","alternativas":{"A":"o conhecimento sistematizado pode ampliar instrumentos de leitura e intervenção na realidade, desde que ensinado de forma reflexiva e contextualizada.","B":"todo conhecimento escolar é necessariamente opressivo.","C":"a escola deve substituir saber científico por opinião cotidiana.","D":"a criticidade independe do domínio de conceitos e linguagens.","E":"o currículo deve evitar conteúdos historicamente acumulados."},"gabarito":"A","comentario":"A alternativa A está correta. Perspectivas críticas podem defender a democratização do conhecimento sistematizado como condição para ampliar a compreensão da realidade e a participação social. Isso não implica tratar o currículo como neutro.","referencia":"Função social da escola; pedagogias críticas."},{"id":"PED060","disciplina":"Conhecimentos Pedagógicos","assunto":"Currículo e projeto político-pedagógico","dificuldade":"Difícil","enunciado":"O currículo e o projeto político-pedagógico se relacionam porque","alternativas":{"A":"o currículo é apenas uma lista de disciplinas, enquanto o PPP cuida somente de administração.","B":"o PPP substitui os referenciais curriculares oficiais.","C":"o currículo independe das finalidades definidas pela escola.","D":"o PPP expressa identidade, objetivos e organização da escola, orientando escolhas curriculares e pedagógicas em articulação com normas e referenciais.","E":"o currículo deve ser elaborado sem participação da comunidade escolar."},"gabarito":"D","comentario":"A alternativa D está correta. O PPP explicita princípios, diagnóstico, objetivos e formas de ação da escola. O currículo concretiza escolhas sobre conhecimentos e experiências formativas e deve dialogar com o PPP e com os referenciais do sistema de ensino.","referencia":"Currículo e Projeto Político-Pedagógico."},{"id":"PED061","disciplina":"Conhecimentos Pedagógicos","assunto":"Projeto político-pedagógico — diagnóstico institucional","dificuldade":"Fácil","enunciado":"Na elaboração do projeto político-pedagógico, o diagnóstico institucional tem como finalidade principal","alternativas":{"A":"compreender características, necessidades, potencialidades e desafios da escola para fundamentar prioridades e ações.","B":"atribuir responsabilidades individuais por todos os problemas.","C":"produzir apenas dados estatísticos para arquivo.","D":"definir previamente as metas antes de conhecer a realidade.","E":"substituir a participação da comunidade por indicadores quantitativos."},"gabarito":"A","comentario":"A alternativa A está correta. O diagnóstico institucional fornece base para decisões do PPP ao reunir evidências sobre contexto, aprendizagem, participação, recursos e desafios. Ele deve subsidiar prioridades e ações, e não funcionar como instrumento de culpabilização.","referencia":"Projeto Político-Pedagógico; planejamento institucional."},{"id":"PED062","disciplina":"Conhecimentos Pedagógicos","assunto":"Currículo — dimensões explícita e implícita","dificuldade":"Difícil","enunciado":"Uma escola declara valorizar cooperação, mas organiza permanentemente atividades e premiações que estimulam competição individual e hierarquização. A situação evidencia que","alternativas":{"A":"somente o currículo formal educa.","B":"práticas, relações e rotinas também comunicam valores e constituem dimensões do currículo vivido ou oculto.","C":"valores não fazem parte do currículo.","D":"o PPP é irrelevante diante das rotinas.","E":"competição e cooperação são pedagogicamente idênticas."},"gabarito":"B","comentario":"A alternativa B está correta. Além do currículo formal, relações, rotinas, expectativas e formas de organização também produzem aprendizagens e comunicam valores. A situação evidencia uma dimensão do chamado currículo oculto ou vivido.","referencia":"Teorias do currículo; currículo oculto e currículo vivido."},{"id":"PED063","disciplina":"Conhecimentos Pedagógicos","assunto":"Currículo e PPP — espaço físico na Pedagogia","dificuldade":"Difícil","enunciado":"Uma escola reorganiza a sala para permitir trabalho individual, rodas de discussão, pequenos grupos e acesso autônomo a materiais. Pedagogicamente, essa decisão parte da compreensão de que","alternativas":{"A":"o espaço físico é neutro e não interfere nas interações.","B":"a disposição espacial pode favorecer ou restringir formas de participação, comunicação e aprendizagem.","C":"qualquer organização flexível elimina a necessidade de planejamento.","D":"o mobiliário determina sozinho a qualidade do ensino.","E":"salas tradicionais impedem qualquer aprendizagem."},"gabarito":"B","comentario":"A alternativa B está correta. O espaço integra a organização pedagógica e pode criar ou restringir possibilidades de interação, circulação, autonomia e acesso a recursos. Ele influencia a prática, mas não determina sozinho a qualidade do ensino.","referencia":"Currículo e projeto político-pedagógico — espaço físico na Pedagogia."},{"id":"PED064","disciplina":"Conhecimentos Pedagógicos","assunto":"Currículo e PPP — linguagem, conhecimento e lúdico","dificuldade":"Intermediária","enunciado":"Em uma sequência didática, o professor utiliza um jogo com regras para explorar conceitos matemáticos e, depois, promove registro e discussão das estratégias utilizadas. O uso do lúdico é pedagogicamente consistente porque","alternativas":{"A":"o jogo substitui qualquer sistematização conceitual.","B":"o principal objetivo do lúdico é apenas tornar a aula divertida.","C":"brincar elimina a necessidade de objetivos de aprendizagem.","D":"jogos são adequados apenas à educação infantil.","E":"a atividade lúdica pode ser meio de investigação, interação e construção de conceitos quando articulada a objetivos e reflexão."},"gabarito":"E","comentario":"A alternativa E está correta. O lúdico pode criar situações de desafio, simbolização, interação e resolução de problemas. Seu valor pedagógico depende da intencionalidade, da mediação e da articulação com objetivos e momentos de sistematização.","referencia":"Currículo e projeto político-pedagógico — o lúdico na Pedagogia."},{"id":"PED065","disciplina":"Conhecimentos Pedagógicos","assunto":"Planejamento pedagógico","dificuldade":"Difícil","enunciado":"Um planejamento didático coerente deve partir da articulação entre","alternativas":{"A":"objetivos de aprendizagem, diagnóstico da turma, conteúdos, estratégias, recursos e formas de avaliação.","B":"apenas o livro didático e o calendário.","C":"preferências pessoais do professor e quantidade de exercícios.","D":"resultados finais e punições por baixo desempenho.","E":"atividades isoladas escolhidas antes dos objetivos."},"gabarito":"A","comentario":"A alternativa A está correta. Planejar envolve articular intencionalmente o que se pretende desenvolver, o ponto de partida dos estudantes, os conteúdos, as experiências de aprendizagem e as evidências que permitirão acompanhar o progresso.","referencia":"Planejamento pedagógico e avaliação."},{"id":"PED066","disciplina":"Conhecimentos Pedagógicos","assunto":"Planejamento pedagógico — flexibilidade","dificuldade":"Fácil","enunciado":"Durante uma sequência, a avaliação formativa mostra que a maioria da turma não compreendeu um conceito essencial. Um planejamento flexível exige que o professor","alternativas":{"A":"mantenha o cronograma original para não atrasar o conteúdo.","B":"cancele o objetivo de aprendizagem.","C":"replaneje estratégias e tempos, retomando o conceito com novas mediações antes de avançar.","D":"atribua nota baixa e prossiga.","E":"transfira o conteúdo não aprendido para estudo domiciliar."},"gabarito":"C","comentario":"A alternativa C está correta. O planejamento deve ser revisto à luz das evidências produzidas durante o ensino. Flexibilidade significa ajustar meios, tempos e intervenções sem abandonar, de forma automática, objetivos essenciais de aprendizagem.","referencia":"Planejamento pedagógico; avaliação formativa."},{"id":"PED067","disciplina":"Conhecimentos Pedagógicos","assunto":"Planejamento — objetivos de aprendizagem","dificuldade":"Intermediária","enunciado":"Um objetivo como “compreender criticamente as relações entre desmatamento e atividades econômicas na Amazônia” é mais útil ao planejamento do que “dar o capítulo 4” porque","alternativas":{"A":"elimina a necessidade de conteúdo.","B":"explicita uma aprendizagem esperada que pode orientar seleção de experiências e avaliação.","C":"dispensa critérios para verificar resultados.","D":"define automaticamente a metodologia.","E":"garante aprendizagem independentemente do ensino."},"gabarito":"B","comentario":"A alternativa B está correta. Um objetivo formulado em termos de aprendizagem orienta escolhas didáticas e evidências de avaliação. “Dar o capítulo” descreve uma ação do professor, mas não explicita o que o estudante deverá compreender ou ser capaz de fazer.","referencia":"Planejamento por objetivos de aprendizagem."},{"id":"PED068","disciplina":"Conhecimentos Pedagógicos","assunto":"Planejamento e avaliação","dificuldade":"Fácil","enunciado":"Quando a avaliação é integrada ao planejamento, seus resultados devem","alternativas":{"A":"servir somente à atribuição de notas.","B":"ser arquivados para prestação de contas.","C":"substituir a observação cotidiana.","D":"informar decisões sobre continuidade, retomadas, agrupamentos, apoios e estratégias de ensino.","E":"ser usados apenas ao final do período letivo."},"gabarito":"D","comentario":"A alternativa D está correta. A avaliação integrada ao planejamento produz informações para tomada de decisão pedagógica e permite ajustar intervenções durante o processo, em vez de funcionar apenas como registro final.","referencia":"Planejamento e avaliação da aprendizagem."},{"id":"PED069","disciplina":"Conhecimentos Pedagógicos","assunto":"Planejamento — coerência entre objetivos, ensino e avaliação","dificuldade":"Difícil","enunciado":"Um plano prevê como objetivo desenvolver argumentação, mas todas as aulas consistem em cópia de definições e a avaliação solicita apenas memorização literal. O principal problema do plano é a","alternativas":{"A":"ausência de recursos digitais.","B":"quantidade insuficiente de conteúdos.","C":"incoerência entre objetivo, experiências de aprendizagem e avaliação.","D":"falta de uma prova objetiva.","E":"presença de um objetivo complexo."},"gabarito":"C","comentario":"A alternativa C está correta. A coerência didática exige que as atividades e os instrumentos de avaliação criem oportunidades e produzam evidências correspondentes ao objetivo. Argumentação não é adequadamente desenvolvida nem avaliada por tarefas exclusivamente reprodutivas.","referencia":"Planejamento e alinhamento entre objetivos, ensino e avaliação."},{"id":"PED070","disciplina":"Conhecimentos Pedagógicos","assunto":"Interdisciplinaridade","dificuldade":"Intermediária","enunciado":"Um projeto reúne professores de Ciências e Geografia, mas cada disciplina trabalha separadamente conteúdos sem diálogo, produzindo ao final duas notas independentes. Para que haja efetiva interdisciplinaridade, é necessário","alternativas":{"A":"eliminar as especificidades de cada disciplina.","B":"articular conceitos e métodos de diferentes áreas em torno de um problema ou objeto comum, preservando contribuições disciplinares.","C":"usar o mesmo texto em todas as disciplinas.","D":"substituir conteúdos por atividades livres.","E":"trabalhar apenas temas de interesse dos estudantes."},"gabarito":"B","comentario":"A alternativa B está correta. Interdisciplinaridade pressupõe integração intencional de diferentes perspectivas disciplinares em torno de um objeto, questão ou problema, sem exigir a dissolução das especificidades de cada campo.","referencia":"Visão interdisciplinar do conhecimento."},{"id":"PED071","disciplina":"Conhecimentos Pedagógicos","assunto":"Transversalidade","dificuldade":"Fácil","enunciado":"Trabalhar um tema de forma transversal significa","alternativas":{"A":"criá-lo obrigatoriamente como nova disciplina.","B":"reservá-lo a uma semana temática anual.","C":"abordá-lo apenas em projetos extracurriculares.","D":"integrá-lo a diferentes componentes e situações formativas quando houver pertinência, articulando conhecimentos e práticas.","E":"retirar conteúdos disciplinares para abrir espaço no horário."},"gabarito":"D","comentario":"A alternativa D está correta. A transversalidade permite que temas relevantes atravessem diferentes áreas e experiências curriculares, em articulação com os conhecimentos específicos e com problemas da realidade.","referencia":"Visão transversal do conhecimento."},{"id":"PED072","disciplina":"Conhecimentos Pedagógicos","assunto":"Interdisciplinaridade — planejamento integrado","dificuldade":"Difícil","enunciado":"Uma equipe planeja estudar a qualidade da água de um rio local. Ciências analisa parâmetros ambientais, Matemática trabalha dados e Geografia examina o uso do território, culminando em uma interpretação conjunta. O elemento que caracteriza a interdisciplinaridade é","alternativas":{"A":"a presença de três professores na mesma atividade.","B":"o uso de um tema ambiental.","C":"a construção de compreensão integrada do problema a partir de contribuições articuladas de diferentes áreas.","D":"a produção de um único trabalho final.","E":"a eliminação das fronteiras conceituais entre as disciplinas."},"gabarito":"C","comentario":"A alternativa C está correta. O que caracteriza a interdisciplinaridade é a articulação entre saberes e métodos de diferentes áreas para compreender um objeto comum de forma mais ampla, e não apenas a presença simultânea de disciplinas.","referencia":"Interdisciplinaridade e planejamento integrado."},{"id":"PED073","disciplina":"Conhecimentos Pedagógicos","assunto":"Tecnologias da informação e comunicação na educação","dificuldade":"Fácil","enunciado":"O uso pedagógico de tecnologia digital é mais consistente quando","alternativas":{"A":"substitui atividades analógicas independentemente do objetivo.","B":"é escolhido por sua novidade.","C":"está alinhado aos objetivos de aprendizagem e amplia possibilidades de acesso, produção, colaboração ou feedback.","D":"é obrigatório em todas as aulas.","E":"reduz o papel do professor à resolução de problemas técnicos."},"gabarito":"C","comentario":"A alternativa C está correta. A tecnologia tem valor pedagógico quando responde a finalidades de aprendizagem e acrescenta possibilidades relevantes de acesso, produção, colaboração, comunicação ou devolutiva. A simples digitalização de uma prática não garante qualidade.","referencia":"Novas tecnologias da informação e comunicação e prática pedagógica."},{"id":"PED074","disciplina":"Conhecimentos Pedagógicos","assunto":"Tecnologias educacionais — letramento digital crítico","dificuldade":"Fácil","enunciado":"Ao trabalhar com conteúdos produzidos em redes sociais, uma professora pede que os estudantes comparem autoria, evidências, data, intenção comunicativa e fontes. Essa atividade desenvolve principalmente","alternativas":{"A":"uso instrumental de aplicativos.","B":"memorização de conceitos tecnológicos.","C":"programação computacional.","D":"letramento digital crítico e avaliação da confiabilidade da informação.","E":"apenas habilidade de leitura superficial."},"gabarito":"D","comentario":"A alternativa D está correta. Letramento digital crítico envolve analisar autoria, fontes, evidências, contexto, circulação e intenção dos conteúdos, e não apenas saber operar ferramentas tecnológicas.","referencia":"Tecnologias da informação e comunicação; letramento digital crítico."},{"id":"PED075","disciplina":"Conhecimentos Pedagógicos","assunto":"Tecnologias educacionais — inclusão e acesso","dificuldade":"Intermediária","enunciado":"Em uma atividade digital, alguns estudantes não conseguem acessar a plataforma fora da escola. A decisão pedagogicamente mais adequada é","alternativas":{"A":"manter a exigência, pois acesso tecnológico é responsabilidade individual.","B":"excluir esses estudantes da atividade.","C":"oferecer alternativas equivalentes de acesso e realização, garantindo que a tecnologia não se transforme em barreira à aprendizagem.","D":"abolir definitivamente qualquer tecnologia.","E":"reduzir os objetivos de aprendizagem para os estudantes sem acesso."},"gabarito":"C","comentario":"A alternativa C está correta. A escolha de recursos deve considerar condições reais de acesso. Equidade exige alternativas que preservem os objetivos de aprendizagem e evitem que desigualdades tecnológicas se convertam em exclusão educacional.","referencia":"Tecnologias educacionais, acessibilidade e equidade."},{"id":"PED076","disciplina":"Conhecimentos Pedagógicos","assunto":"Base curricular comum — Documento Curricular do Estado do Pará","dificuldade":"Difícil","enunciado":"Uma escola da rede pública paraense revisa seu currículo. Para manter coerência com a base curricular da rede, a equipe deve compreender que o Documento Curricular do Estado do Pará","alternativas":{"A":"orienta a organização curricular em articulação com a BNCC e com as especificidades territoriais, culturais e educacionais do Estado.","B":"substitui integralmente o projeto político-pedagógico de cada escola.","C":"dispensa contextualização local, pois já contém planos de aula obrigatórios.","D":"é aplicável somente às escolas privadas.","E":"trata exclusivamente de avaliação externa."},"gabarito":"A","comentario":"A alternativa A está correta. O Documento Curricular do Estado do Pará constitui referência para a organização curricular e dialoga com a BNCC, ao mesmo tempo em que incorpora características e especificidades do território paraense. Ele não substitui o PPP nem funciona como roteiro rígido de aula.","referencia":"PARÁ. Documento Curricular do Estado do Pará — Educação Infantil e Ensino Fundamental; Documento Curricular do Estado do Pará — Etapa Ensino Médio."},{"id":"PED077","disciplina":"Conhecimentos Pedagógicos","assunto":"BNCC — conceito de competência","dificuldade":"Intermediária","enunciado":"Sobre a relação entre competências e conteúdos na BNCC, assinale a afirmativa correta.","alternativas":{"A":"As competências dispensam conhecimentos conceituais.","B":"Conteúdos devem ser ensinados sem relação com práticas e contextos.","C":"Competências correspondem apenas a atitudes socioemocionais.","D":"A BNCC proíbe abordagens interdisciplinares.","E":"O desenvolvimento de competências envolve mobilizar conhecimentos, habilidades, atitudes e valores para enfrentar demandas complexas da vida cotidiana, da cidadania e do mundo do trabalho."},"gabarito":"E","comentario":"A alternativa E está correta. Na BNCC, competência é definida como mobilização de conhecimentos, habilidades, atitudes e valores para responder a demandas complexas. Portanto, competência não substitui o conhecimento; pressupõe sua mobilização em situações significativas.","referencia":"BRASIL. Base Nacional Comum Curricular — definição de competência."},{"id":"PED078","disciplina":"Conhecimentos Pedagógicos","assunto":"Documento Curricular do Estado do Pará — contextualização amazônica e paraense","dificuldade":"Intermediária","enunciado":"Uma prática alinhada a um currículo estadual contextualizado para o Pará seria","alternativas":{"A":"restringir o currículo a conhecimentos locais e abandonar referências nacionais.","B":"articular conhecimentos comuns a questões e repertórios amazônicos e paraenses, ampliando a compreensão do estudante do local ao global.","C":"tratar o território apenas como cenário ilustrativo.","D":"evitar temas regionais para impedir regionalismo.","E":"substituir conceitos científicos por explicações do senso comum."},"gabarito":"B","comentario":"A alternativa B está correta. Contextualizar implica relacionar conhecimentos de referência às características do território e aos repertórios dos estudantes, sem reduzir o currículo ao local nem abandonar conceitos científicos e conhecimentos mais amplos.","referencia":"Documento Curricular do Estado do Pará; contextualização curricular."},{"id":"PED079","disciplina":"Conhecimentos Pedagógicos","assunto":"Ética no trabalho docente — confidencialidade","dificuldade":"Difícil","enunciado":"Um professor recebe informação confidencial sobre uma situação familiar que afeta um estudante. Durante uma reunião informal, colegas curiosos pedem detalhes. A conduta eticamente mais adequada é","alternativas":{"A":"preservar a confidencialidade, compartilhando apenas informações necessárias com profissionais responsáveis pelo atendimento educacional e pelos encaminhamentos cabíveis.","B":"relatar todos os detalhes para aumentar a sensibilização da equipe.","C":"comentar a situação sem mencionar o nome, ainda que seja facilmente identificável.","D":"publicar um relato genérico em rede social para pedir opiniões.","E":"recusar qualquer comunicação, inclusive com a equipe responsável."},"gabarito":"A","comentario":"A alternativa A está correta. A ética profissional exige respeito à privacidade, à dignidade e à finalidade do uso das informações. Dados pessoais devem circular somente quando necessários ao atendimento e à proteção do estudante e entre pessoas legitimamente envolvidas.","referencia":"Ética no trabalho docente; Lei nº 13.709/2018 — LGPD, quando aplicável ao tratamento de dados pessoais."},{"id":"PED080","disciplina":"Conhecimentos Pedagógicos","assunto":"Ética no trabalho docente — justiça avaliativa","dificuldade":"Fácil","enunciado":"Do ponto de vista ético, é inadequado usar a nota de uma prova para punir indisciplina porque","alternativas":{"A":"toda avaliação quantitativa é antiética.","B":"disciplina jamais pode ser discutida na escola.","C":"o professor não pode estabelecer regras.","D":"a avaliação da aprendizagem deve produzir evidências sobre conhecimentos e habilidades definidos, não funcionar como sanção comportamental alheia ao objeto avaliado.","E":"notas só podem ser atribuídas pela gestão."},"gabarito":"D","comentario":"A alternativa D está correta. Critérios avaliativos precisam ser transparentes e vinculados aos objetivos de aprendizagem. Problemas de convivência devem ser tratados por procedimentos educativos próprios, sem distorcer a função da avaliação.","referencia":"Ética docente e avaliação da aprendizagem."},{"id":"PED081","disciplina":"Conhecimentos Pedagógicos","assunto":"Neurociência aplicada à Educação — fundamentos e limites","dificuldade":"Intermediária","enunciado":"Sobre contribuições da neurociência para a educação, é correto afirmar que","alternativas":{"A":"imagens cerebrais permitem escolher, sozinhas, o melhor método de ensino.","B":"cada estudante aprende melhor quando o ensino corresponde ao seu estilo cerebral fixo.","C":"conhecimentos sobre cérebro podem dialogar com psicologia e pedagogia, mas não substituem evidências educacionais nem decisões didáticas contextualizadas.","D":"a neurociência prova que emoção e cognição funcionam de forma independente.","E":"qualquer descoberta laboratorial pode ser aplicada diretamente à sala de aula."},"gabarito":"C","comentario":"A alternativa C está correta. A neurociência pode contribuir para compreender processos como memória, atenção, emoção e plasticidade, mas achados neurais não prescrevem diretamente métodos de ensino. A aplicação educacional exige integração com evidências psicológicas, pedagógicas e contextuais.","referencia":"HOWARD-JONES, Paul A. Neuroscience and Education: Myths and Messages; literatura de neuroeducação."},{"id":"PED082","disciplina":"Conhecimentos Pedagógicos","assunto":"Neurociência aplicada à Educação — neuromitos","dificuldade":"Fácil","enunciado":"A afirmação de que uma pessoa seria “predominantemente de hemisfério esquerdo” ou “de hemisfério direito” e deveria receber ensino específico conforme esse perfil é","alternativas":{"A":"consenso científico usado para individualizar currículos.","B":"um princípio da plasticidade sináptica.","C":"uma regra derivada da teoria de Piaget.","D":"um neuromito, pois tarefas cognitivas complexas envolvem redes distribuídas e cooperação entre os hemisférios.","E":"um critério válido para diagnóstico escolar."},"gabarito":"D","comentario":"A alternativa D está correta. Existem especializações e assimetrias funcionais, mas isso não sustenta a classificação de pessoas em tipos fixos de “cérebro esquerdo” ou “cérebro direito” para fins pedagógicos. A extrapolação constitui neuromito.","referencia":"DEKKER et al. Neuromyths in Education; CORBALLIS, Michael C. Left Brain, Right Brain: Facts and Fantasies."},{"id":"PED083","disciplina":"Conhecimentos Pedagógicos","assunto":"Neurociência aplicada à Educação — plasticidade cerebral","dificuldade":"Fácil","enunciado":"Do ponto de vista neuroeducacional, aprender implica","alternativas":{"A":"alterações funcionais e estruturais em redes neurais associadas à experiência, sem que isso signifique que todo aprendizado seja simples ou instantâneo.","B":"criação de novas áreas cerebrais específicas para cada conteúdo.","C":"uso de apenas uma região do cérebro por vez.","D":"fixação irreversível de conexões depois da infância.","E":"processo exclusivamente biológico, independente do ambiente."},"gabarito":"A","comentario":"A alternativa A está correta. A aprendizagem relaciona-se à plasticidade neural, isto é, a mudanças na organização e no funcionamento de redes em interação com a experiência. Isso não implica determinismo biológico nem a existência de uma área exclusiva para cada conteúdo.","referencia":"Neuroplasticidade e aprendizagem; literatura de neurociência cognitiva."},{"id":"PED084","disciplina":"Conhecimentos Pedagógicos","assunto":"Neurociência aplicada à Educação — interpretação de evidências","dificuldade":"Intermediária","enunciado":"Uma pesquisa encontra ativação cerebral distinta entre dois grupos durante uma tarefa. Para transformar esse achado em recomendação pedagógica, é necessário cautela porque","alternativas":{"A":"resultados de neurociência nunca têm relevância educacional.","B":"diferenças de ativação provam necessariamente diferenças de capacidade.","C":"a aprendizagem não envolve processos neurais.","D":"apenas estudos com adultos podem orientar educação.","E":"achados neurais precisam ser interpretados junto com desenho do estudo, comportamento, contexto e evidências pedagógicas, evitando inferências causais indevidas."},"gabarito":"E","comentario":"A alternativa E está correta. Dados de neuroimagem não falam por si e diferenças de ativação não equivalem automaticamente a diferenças de capacidade. Recomendações pedagógicas exigem evidência convergente e interpretação cuidadosa do método, do comportamento e do contexto.","referencia":"Neurociência aplicada à Educação — interpretação crítica de evidências."},{"id":"PED085","disciplina":"Conhecimentos Pedagógicos","assunto":"Memória e aprendizagem","dificuldade":"Intermediária","enunciado":"Uma estratégia coerente com conhecimentos consolidados sobre memória de longo prazo é","alternativas":{"A":"concentrar todo o estudo em uma única sessão extensa.","B":"reler repetidamente o conteúdo sem tentar recuperá-lo.","C":"combinar prática de recuperação, espaçamento e retomadas ao longo do tempo.","D":"evitar alternar exemplos para reduzir esforço cognitivo.","E":"estudar apenas na véspera, quando a lembrança está mais recente."},"gabarito":"C","comentario":"A alternativa C está correta. A prática de recuperação e a distribuição do estudo ao longo do tempo favorecem retenção duradoura. Releitura passiva e estudo concentrado podem produzir familiaridade imediata sem a mesma estabilidade da aprendizagem.","referencia":"DUNLOSKY et al. Improving Students’ Learning With Effective Learning Techniques; ciência da aprendizagem."},{"id":"PED086","disciplina":"Conhecimentos Pedagógicos","assunto":"Atenção e aprendizagem","dificuldade":"Difícil","enunciado":"Durante uma explicação longa, muitos estudantes alternam entre a aula e notificações do celular. Considerando limites atencionais, a melhor intervenção é","alternativas":{"A":"presumir que atenção dividida não afeta a aprendizagem.","B":"reduzir distrações relevantes, segmentar a atividade e alternar exposição com participação e recuperação de informações.","C":"aumentar apenas o volume da voz.","D":"exigir que estudantes realizem simultaneamente mais tarefas.","E":"substituir todo o ensino por vídeos curtos."},"gabarito":"B","comentario":"A alternativa B está correta. A atenção é limitada e sofre quando estímulos competem pelos mesmos recursos. Reduzir distrações, segmentar a tarefa e inserir momentos de participação e recuperação pode favorecer foco e aprendizagem sem pressupor uma técnica universal.","referencia":"Atenção, memória de trabalho e aprendizagem."},{"id":"PED087","disciplina":"Conhecimentos Pedagógicos","assunto":"Emoções e aprendizagem","dificuldade":"Intermediária","enunciado":"Em relação às emoções e à aprendizagem, assinale a afirmativa correta.","alternativas":{"A":"Emoções sempre prejudicam a memória.","B":"A aprendizagem eficaz exige ausência de emoção.","C":"O medo intenso melhora necessariamente a atenção.","D":"Aspectos emocionais só importam na educação infantil.","E":"Emoções podem modular atenção, motivação e memória; por isso, segurança psicológica e desafio adequado podem favorecer o engajamento."},"gabarito":"E","comentario":"A alternativa E está correta. Emoções interagem com processos cognitivos. Segurança psicológica, interesse e desafio adequado podem favorecer engajamento, enquanto estresse excessivo pode prejudicar desempenho. Não há uma relação simples em que toda emoção ajude ou atrapalhe.","referencia":"Neurociência das emoções e aprendizagem."},{"id":"PED088","disciplina":"Conhecimentos Pedagógicos","assunto":"Funções executivas","dificuldade":"Fácil","enunciado":"Planejar uma tarefa, inibir uma resposta impulsiva, manter uma meta ativa e alternar estratégias quando necessário mobiliza principalmente","alternativas":{"A":"memória semântica.","B":"condicionamento clássico.","C":"percepção visual elementar.","D":"funções executivas, como controle inibitório, memória de trabalho e flexibilidade cognitiva.","E":"apenas memória episódica."},"gabarito":"D","comentario":"A alternativa D está correta. Entre os componentes centrais das funções executivas estão controle inibitório, memória de trabalho e flexibilidade cognitiva, processos que sustentam comportamentos orientados a metas.","referencia":"DIAMOND, Adele. Executive Functions. Annual Review of Psychology."},{"id":"PED089","disciplina":"Conhecimentos Pedagógicos","assunto":"Desenvolvimento cognitivo ao longo da vida","dificuldade":"Intermediária","enunciado":"Sobre desenvolvimento cognitivo na infância, adolescência e vida adulta, é correto afirmar que","alternativas":{"A":"há mudanças ao longo de todo o ciclo de vida, com trajetórias influenciadas por maturação, experiência, educação e contexto.","B":"o desenvolvimento cognitivo termina na adolescência.","C":"adultos não apresentam plasticidade cerebral.","D":"todas as funções cognitivas atingem pico e declinam na mesma idade.","E":"a escolarização não exerce influência sobre estratégias cognitivas."},"gabarito":"A","comentario":"A alternativa A está correta. O desenvolvimento cognitivo é contínuo e multidimensional. Diferentes funções apresentam trajetórias distintas, e experiência, educação, saúde e contexto influenciam capacidades ao longo da vida.","referencia":"Psicologia do desenvolvimento ao longo do ciclo vital; neuroplasticidade."},{"id":"PED090","disciplina":"Conhecimentos Pedagógicos","assunto":"Desenvolvimento cognitivo — adolescência e autorregulação","dificuldade":"Fácil","enunciado":"Na adolescência, o professor deve evitar interpretar comportamentos impulsivos como prova de incapacidade intelectual porque","alternativas":{"A":"adolescentes não apresentam qualquer mudança cognitiva.","B":"funções executivas já estão completamente maduras no início da puberdade.","C":"impulsividade decorre sempre de desinteresse escolar.","D":"processos de autorregulação e funções executivas continuam se desenvolvendo durante a adolescência e são influenciados também por experiências e contextos.","E":"a escola não pode contribuir para autorregulação."},"gabarito":"D","comentario":"A alternativa D está correta. Evidências do desenvolvimento mostram que funções executivas e autorregulação continuam se fortalecendo ao longo da infância e adolescência. Isso não significa incapacidade geral, e a escola pode apoiar planejamento, reflexão e autorregulação.","referencia":"BEST, John R.; MILLER, Patricia H. A Developmental Perspective on Executive Function; literatura sobre desenvolvimento adolescente."},{"id":"PED091","disciplina":"Conhecimentos Pedagógicos","assunto":"Aprendizagem significativa","dificuldade":"Intermediária","enunciado":"Para favorecer aprendizagem significativa de um conceito novo, o professor deve","alternativas":{"A":"apresentá-lo sem conexão com conhecimentos anteriores.","B":"identificar conhecimentos prévios relevantes e criar relações explícitas entre eles e as novas ideias.","C":"evitar exemplos, pois podem simplificar o conceito.","D":"priorizar memorização literal antes de qualquer compreensão.","E":"usar apenas atividades livres sem sistematização."},"gabarito":"B","comentario":"A alternativa B está correta. A aprendizagem significativa depende de relações substantivas entre novas informações e conhecimentos prévios relevantes. O professor pode ativar e organizar esses conhecimentos por meio de perguntas, exemplos, analogias e organizadores prévios.","referencia":"AUSUBEL, David P. Aquisição e Retenção de Conhecimentos."},{"id":"PED092","disciplina":"Conhecimentos Pedagógicos","assunto":"Motivação para aprender","dificuldade":"Intermediária","enunciado":"Uma prática que tende a favorecer motivação autônoma é","alternativas":{"A":"usar ameaças constantes para garantir desempenho.","B":"comparar publicamente estudantes.","C":"oferecer apenas tarefas muito fáceis.","D":"dar prêmios para qualquer ação, independentemente do sentido.","E":"explicitar propósitos, oferecer escolhas possíveis, desafios adequados e feedback que fortaleça percepção de competência."},"gabarito":"E","comentario":"A alternativa E está correta. A motivação tende a ser favorecida quando o estudante percebe sentido, possibilidade de participação nas escolhas e progresso em desafios adequados. Controle excessivo, humilhação e tarefas sem desafio podem reduzir a qualidade do engajamento.","referencia":"DECI, Edward L.; RYAN, Richard M. Teoria da Autodeterminação aplicada à educação."},{"id":"PED093","disciplina":"Conhecimentos Pedagógicos","assunto":"Autorregulação da aprendizagem","dificuldade":"Fácil","enunciado":"Um estudante autorregulado tende a","alternativas":{"A":"planejar metas e estratégias, monitorar a própria compreensão e ajustar ações com base nos resultados.","B":"depender sempre do professor para decidir o que fazer.","C":"evitar avaliar o próprio desempenho.","D":"manter a mesma estratégia mesmo quando ela não funciona.","E":"estudar apenas quando recebe recompensa externa."},"gabarito":"A","comentario":"A alternativa A está correta. Autorregulação envolve planejamento, monitoramento, controle e avaliação do próprio processo de aprendizagem. Essas capacidades podem ser ensinadas e apoiadas por estratégias metacognitivas.","referencia":"ZIMMERMAN, Barry J. Autorregulação da aprendizagem; metacognição."},{"id":"PED094","disciplina":"Conhecimentos Pedagógicos","assunto":"Autorregulação — intervenção docente","dificuldade":"Intermediária","enunciado":"Para ensinar autorregulação, uma professora pode","alternativas":{"A":"ocultar critérios de qualidade para estimular autonomia.","B":"resolver todas as tarefas difíceis pelo estudante.","C":"eliminar qualquer orientação externa.","D":"modelar estratégias de planejamento e monitoramento, usar checklists ou perguntas metacognitivas e reduzir gradualmente os apoios.","E":"avaliar apenas o resultado final."},"gabarito":"D","comentario":"A alternativa D está correta. A autorregulação pode ser desenvolvida por meio de modelagem, critérios claros, autoavaliação, perguntas metacognitivas e retirada gradual dos apoios à medida que o estudante ganha autonomia.","referencia":"Autorregulação da aprendizagem; metacognição e apoio gradual."},{"id":"PED095","disciplina":"Conhecimentos Pedagógicos","assunto":"Neurociência e planejamento didático","dificuldade":"Intermediária","enunciado":"Uma implicação prudente da neurociência e da ciência da aprendizagem para o planejamento didático é","alternativas":{"A":"organizar experiências que considerem limites de atenção, necessidade de prática distribuída e importância de recuperação ativa, articulando essas evidências a objetivos pedagógicos.","B":"classificar estudantes por estilos cerebrais.","C":"usar estímulos multissensoriais em qualquer conteúdo, independentemente do objetivo.","D":"eliminar aulas expositivas por serem incompatíveis com o cérebro.","E":"substituir avaliação pedagógica por exames neurológicos."},"gabarito":"A","comentario":"A alternativa A está correta. Evidências sobre atenção e memória podem apoiar decisões como segmentação, espaçamento e prática de recuperação. Elas não justificam neuromitos nem prescrevem um método único para todos os conteúdos e contextos.","referencia":"Ciência da aprendizagem; DUNLOSKY et al.; literatura de neuroeducação."},{"id":"PED096","disciplina":"Conhecimentos Pedagógicos","assunto":"Neurociência e metodologias ativas","dificuldade":"Intermediária","enunciado":"Sobre metodologias ativas e neurociência, assinale a afirmativa correta.","alternativas":{"A":"Qualquer atividade em grupo é superior porque ativa mais áreas cerebrais.","B":"Metodologias ativas funcionam porque eliminam esforço mental.","C":"O uso de tecnologia é requisito para uma metodologia ser ativa.","D":"Participação ativa pode favorecer elaboração, explicação e recuperação, mas sua eficácia depende do desenho da tarefa, dos conhecimentos prévios, da mediação e dos objetivos.","E":"A neurociência demonstra que exposição docente nunca produz aprendizagem."},"gabarito":"D","comentario":"A alternativa D está correta. Participação ativa pode mobilizar processos favoráveis à aprendizagem, como explicação, prática, feedback e recuperação, mas o simples rótulo de metodologia ativa não garante eficácia. O desenho pedagógico continua sendo decisivo.","referencia":"Ciência da aprendizagem; metodologias ativas e neuroeducação."},{"id":"PED097","disciplina":"Conhecimentos Pedagógicos","assunto":"Neurociência, avaliação e inclusão","dificuldade":"Fácil","enunciado":"Um uso inadequado da neurociência na avaliação inclusiva seria","alternativas":{"A":"considerar que fadiga e atenção podem afetar desempenho.","B":"diversificar formas de expressão quando o objetivo permite.","C":"usar evidências pedagógicas de diferentes momentos.","D":"planejar pausas e condições de acesso quando necessárias.","E":"inferir diagnóstico ou capacidade fixa do estudante a partir de um suposto “perfil cerebral” sem avaliação especializada e sem evidências educacionais."},"gabarito":"E","comentario":"A alternativa E está correta. A neurociência não autoriza diagnósticos escolares improvisados nem classificações deterministas de capacidade. A avaliação inclusiva deve apoiar-se em evidências de desempenho, contexto, barreiras e necessidades educacionais.","referencia":"Neurociência aplicada à educação; avaliação inclusiva; crítica a neuromitos."},{"id":"PED098","disciplina":"Conhecimentos Pedagógicos","assunto":"Educação Inclusiva — princípios","dificuldade":"Intermediária","enunciado":"De acordo com a Política Nacional de Educação Especial Inclusiva instituída pelo Decreto nº 12.686/2025, a garantia de sistema educacional inclusivo pressupõe","alternativas":{"A":"matrícula prioritária em instituições segregadas.","B":"o direito de estudantes público da educação especial à inclusão em classes e escolas comuns, com os apoios necessários à participação, permanência e aprendizagem.","C":"substituição do currículo comum pelo Atendimento Educacional Especializado.","D":"atendimento especializado apenas no ensino fundamental.","E":"separação entre escolarização e serviços de apoio."},"gabarito":"B","comentario":"A alternativa B está correta. O Decreto nº 12.6
