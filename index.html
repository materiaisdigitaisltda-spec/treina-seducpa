l.","E":"sigla."},"gabarito":"E","comentario":"“SEDUC” é uma sigla formada a partir de elementos da denominação institucional, usada para representá-la de forma abreviada.","referencia":"Formas de abreviação: siglas."},{"id":"POR071","disciplina":"Língua Portuguesa","assunto":"Formas de abreviação: abreviatura","dificuldade":"Intermediária","enunciado":"Assinale a alternativa em que a redução apresentada é uma abreviatura convencional, e não uma sigla:","alternativas":{"A":"“ONU” por “Organização das Nações Unidas”.","B":"“IBGE” por “Instituto Brasileiro de Geografia e Estatística”.","C":"“pág.” por “página”.","D":"“MEC” por “Ministério da Educação”.","E":"“CPF” por “Cadastro de Pessoas Físicas”."},"gabarito":"C","comentario":"“pág.” é abreviatura gráfica de uma palavra; as demais formas são siglas construídas a partir de denominações compostas.","referencia":"Formas de abreviação: abreviaturas e siglas."},{"id":"POR072","disciplina":"Língua Portuguesa","assunto":"Redução vocabular","dificuldade":"Fácil","enunciado":"Em contexto informal, “foto” em lugar de “fotografia” exemplifica:","alternativas":{"A":"redução ou abreviação vocabular.","B":"composição por aglutinação.","C":"derivação parassintética.","D":"arcaísmo obrigatório.","E":"flexão de gênero."},"gabarito":"A","comentario":"“Foto” resulta de redução de “fotografia”, mantendo o núcleo do significado lexical.","referencia":"Formas de abreviação e redução vocabular."},{"id":"POR073","disciplina":"Língua Portuguesa","assunto":"Classes de palavras: substantivo","dificuldade":"Fácil","enunciado":"Na frase “A leitura transforma perspectivas”, a palavra “leitura” é classificada morfologicamente como:","alternativas":{"A":"substantivo.","B":"adjetivo.","C":"advérbio.","D":"preposição.","E":"interjeição."},"gabarito":"A","comentario":"“Leitura” nomeia um processo e funciona como núcleo do sujeito, sendo classificada como substantivo.","referencia":"Classes de palavras: substantivos e seus aspectos morfossintáticos."},{"id":"POR074","disciplina":"Língua Portuguesa","assunto":"Classes de palavras: adjetivo","dificuldade":"Fácil","enunciado":"Em “A equipe apresentou uma solução simples”, o termo “simples”:","alternativas":{"A":"é advérbio e modifica o verbo “apresentou”.","B":"é pronome e retoma “equipe”.","C":"é conjunção e liga duas orações.","D":"é adjetivo e caracteriza o substantivo “solução”.","E":"é substantivo e nomeia uma ação."},"gabarito":"D","comentario":"“Simples” atribui uma característica a “solução”, substantivo com que se relaciona sintaticamente.","referencia":"Classes de palavras: adjetivos em contexto."},{"id":"POR075","disciplina":"Língua Portuguesa","assunto":"Classes de palavras: artigo","dificuldade":"Intermediária","enunciado":"Em “A proposta foi aprovada”, o emprego do artigo definido “A” sugere, em contexto normal de uso, que:","alternativas":{"A":"qualquer proposta, ainda desconhecida, está sendo introduzida necessariamente pela primeira vez.","B":"“proposta” passou a funcionar como verbo.","C":"o substantivo perdeu sua determinação.","D":"o referente “proposta” é apresentado como identificável ou recuperável pelos interlocutores.","E":"o enunciado expressa obrigatoriamente quantidade indeterminada."},"gabarito":"D","comentario":"O artigo definido costuma apresentar o referente como determinado ou recuperável no contexto discursivo ou situacional.","referencia":"Classes de palavras: artigo e valor textual de determinação."},{"id":"POR076","disciplina":"Língua Portuguesa","assunto":"Classes de palavras: numeral","dificuldade":"Fácil","enunciado":"Em “Dois estudantes apresentaram três propostas”, as palavras “dois” e “três” são:","alternativas":{"A":"numerais ordinais.","B":"pronomes indefinidos.","C":"advérbios de intensidade.","D":"substantivos coletivos.","E":"numerais cardinais."},"gabarito":"E","comentario":"Ambos exprimem quantidade exata, característica dos numerais cardinais.","referencia":"Classes de palavras: numerais."},{"id":"POR077","disciplina":"Língua Portuguesa","assunto":"Classes de palavras: pronome","dificuldade":"Intermediária","enunciado":"Em “Este relatório está completo; aquele ainda precisa de revisão”, “este” e “aquele” são pronomes:","alternativas":{"A":"demonstrativos.","B":"relativos.","C":"interrogativos.","D":"pessoais oblíquos.","E":"indefinidos."},"gabarito":"A","comentario":"Os termos demonstram e contrastam referentes segundo relações de localização discursiva ou situacional.","referencia":"Classes de palavras: pronomes demonstrativos."},{"id":"POR078","disciplina":"Língua Portuguesa","assunto":"Classes de palavras: verbo e tempo","dificuldade":"Intermediária","enunciado":"Na frase “Quando a equipe chegar, iniciaremos a reunião”, a forma “chegar” está no:","alternativas":{"A":"presente do indicativo.","B":"pretérito perfeito do indicativo.","C":"imperativo afirmativo.","D":"pretérito imperfeito do subjuntivo.","E":"futuro do subjuntivo."},"gabarito":"E","comentario":"Após “quando”, com referência a um fato futuro, a forma “chegar” corresponde ao futuro do subjuntivo.","referencia":"Classes de palavras: verbos, tempos e modos."},{"id":"POR079","disciplina":"Língua Portuguesa","assunto":"Classes de palavras: modo verbal","dificuldade":"Intermediária","enunciado":"Em “É importante que todos participem”, a forma verbal “participem” está no subjuntivo porque expressa:","alternativas":{"A":"uma ordem direta no imperativo.","B":"um fato passado e concluído.","C":"uma ação habitual no presente.","D":"uma certeza objetiva formulada no indicativo.","E":"um fato apresentado no campo da necessidade ou expectativa, e não como constatação independente."},"gabarito":"E","comentario":"O subjuntivo aparece em oração subordinada dependente de expressão avaliativa e de necessidade, como “é importante que”.","referencia":"Classes de palavras: modo subjuntivo e valores semânticos."},{"id":"POR080","disciplina":"Língua Portuguesa","assunto":"Classes de palavras: advérbio","dificuldade":"Fácil","enunciado":"Em “A equipe respondeu rapidamente”, “rapidamente” modifica:","alternativas":{"A":"o substantivo “equipe”, indicando posse.","B":"um artigo, indicando gênero.","C":"o verbo “respondeu”, indicando modo.","D":"uma conjunção, indicando causa.","E":"um pronome, indicando pessoa."},"gabarito":"C","comentario":"O advérbio modifica o verbo “respondeu” e indica a circunstância de modo em que a ação ocorreu.","referencia":"Classes de palavras: advérbios."},{"id":"POR081","disciplina":"Língua Portuguesa","assunto":"Classes de palavras: conjunção","dificuldade":"Fácil","enunciado":"Em “O relatório estava completo, mas precisava de revisão formal”, “mas” é:","alternativas":{"A":"preposição essencial.","B":"pronome relativo.","C":"advérbio de lugar.","D":"interjeição.","E":"conjunção coordenativa adversativa."},"gabarito":"E","comentario":"“Mas” liga orações e estabelece contraste entre as ideias, sendo conjunção coordenativa adversativa.","referencia":"Classes de palavras: conjunções e valores semânticos."},{"id":"POR082","disciplina":"Língua Portuguesa","assunto":"Classes de palavras: interjeição","dificuldade":"Fácil","enunciado":"Em “Ah! Agora compreendi o problema”, “Ah!” funciona como:","alternativas":{"A":"artigo definido.","B":"pronome relativo.","C":"interjeição que exprime reação do falante.","D":"preposição acidental.","E":"numeral cardinal."},"gabarito":"C","comentario":"Interjeições expressam estados, emoções ou reações de forma sintaticamente independente.","referencia":"Classes de palavras: interjeições."},{"id":"POR083","disciplina":"Língua Portuguesa","assunto":"Modalizadores","dificuldade":"Intermediária","enunciado":"Em “Provavelmente, a equipe concluirá o trabalho hoje”, o termo “provavelmente” atua como:","alternativas":{"A":"marcador de lugar físico.","B":"vocativo dirigido ao leitor.","C":"substantivo que nomeia a conclusão.","D":"modalizador que indica o grau de certeza do enunciador.","E":"conjunção causal."},"gabarito":"D","comentario":"O advérbio modaliza a proposição, apresentando o fato como provável, e não como certo.","referencia":"Modalizadores: marcas de atitude do enunciador."},{"id":"POR084","disciplina":"Língua Portuguesa","assunto":"Substantivação","dificuldade":"Intermediária","enunciado":"Em “O aprender exige constância”, a palavra “aprender”, originalmente verbo, funciona no contexto como:","alternativas":{"A":"adjetivo qualificativo.","B":"substantivo, em processo de substantivação favorecido pelo artigo.","C":"advérbio de modo.","D":"pronome pessoal.","E":"conjunção integrante."},"gabarito":"B","comentario":"O artigo “o” faz o infinitivo “aprender” funcionar nominalmente, como núcleo do sujeito.","referencia":"Classes de palavras: mudança de classe por substantivação."},{"id":"POR085","disciplina":"Língua Portuguesa","assunto":"Adjetivo com valor adverbial","dificuldade":"Intermediária","enunciado":"Em “Os candidatos falaram baixo durante a atividade”, a palavra “baixo” apresenta, no contexto, valor:","alternativas":{"A":"substantivo, pois nomeia um objeto.","B":"pronominal, pois retoma “candidatos”.","C":"conjuntivo, pois liga orações.","D":"adverbial, pois caracteriza o modo de falar.","E":"articular, pois determina um nome."},"gabarito":"D","comentario":"Embora “baixo” possa funcionar como adjetivo em outros contextos, aqui modifica o verbo “falaram” e equivale a “em voz baixa”.","referencia":"Classes de palavras: valor contextual e mudança funcional."},{"id":"POR086","disciplina":"Língua Portuguesa","assunto":"Pronome relativo","dificuldade":"Intermediária","enunciado":"Em “O livro que recebemos será usado na oficina”, o pronome “que”:","alternativas":{"A":"substitui “oficina” e introduz oração causal.","B":"é conjunção adversativa.","C":"é pronome interrogativo em pergunta direta.","D":"retoma “o livro” e introduz uma oração adjetiva.","E":"funciona como artigo definido."},"gabarito":"D","comentario":"“Que” tem antecedente nominal expresso — “o livro” — e inicia uma oração que caracteriza esse referente.","referencia":"Classes de palavras: pronomes relativos."},{"id":"POR087","disciplina":"Língua Portuguesa","assunto":"Pronome demonstrativo e coesão","dificuldade":"Difícil","enunciado":"Leia: “Há duas prioridades: ampliar o acervo e formar mediadores. Esta exige planejamento contínuo; aquela depende também de orçamento.” Pela norma de referência textual tradicional, “esta” e “aquela” retomam, respectivamente:","alternativas":{"A":"“ampliar o acervo” e “formar mediadores”.","B":"“formar mediadores” e “ampliar o acervo”.","C":"as duas prioridades ao mesmo tempo.","D":"“orçamento” e “planejamento contínuo”.","E":"nenhum termo anterior, pois ambos são dêiticos apenas espaciais."},"gabarito":"B","comentario":"Na retomada de dois elementos já mencionados, “esta” tende a apontar para o mais próximo; “aquela”, para o mais distante.","referencia":"Pronomes demonstrativos: referenciação textual."},{"id":"POR088","disciplina":"Língua Portuguesa","assunto":"Verbos: aspecto e sentido","dificuldade":"Difícil","enunciado":"Em “A professora vinha observando a turma havia semanas”, a locução “vinha observando” apresenta a ação como:","alternativas":{"A":"processo continuado ou progressivo no passado.","B":"evento pontual e instantâneo concluído num único momento.","C":"ordem dirigida à professora.","D":"ação futura condicionada.","E":"fato atemporal sem duração."},"gabarito":"A","comentario":"A construção “vir + gerúndio” ressalta continuidade ou progressão de uma ação ao longo de determinado período.","referencia":"Classes de palavras: verbos e valores aspectuais."},{"id":"POR089","disciplina":"Língua Portuguesa","assunto":"Infinitivo e valor sintático","dificuldade":"Difícil","enunciado":"Em “Estudar com regularidade ajuda a consolidar conhecimentos”, o segmento “Estudar com regularidade” exerce, na oração principal, função de:","alternativas":{"A":"conjunção coordenativa.","B":"adjunto adnominal de “regularidade”.","C":"predicativo de “conhecimentos”.","D":"interjeição.","E":"oração substantiva subjetiva reduzida de infinitivo."},"gabarito":"E","comentario":"A oração reduzida “Estudar com regularidade” funciona como sujeito da forma verbal “ajuda”.","referencia":"Classes de palavras e sintaxe: infinitivo em oração reduzida."},{"id":"POR090","disciplina":"Língua Portuguesa","assunto":"Conjunções: valor semântico","dificuldade":"Intermediária","enunciado":"Em “Caso chova, a atividade será realizada no auditório”, “caso” introduz ideia de:","alternativas":{"A":"causa.","B":"conclusão.","C":"proporção.","D":"condição.","E":"concessão."},"gabarito":"D","comentario":"“Caso” equivale a “se” nesse contexto e introduz uma condição para a realização da atividade no auditório.","referencia":"Conjunções subordinativas: valor condicional."},{"id":"POR091","disciplina":"Língua Portuguesa","assunto":"Organização estrutural dos textos","dificuldade":"Difícil","enunciado":"Leia: “A escola identificou queda na frequência dos estudantes. Em seguida, analisou os registros de transporte e ouviu as famílias. A partir dessas informações, reorganizou os horários de algumas atividades.” Considerando a organização do trecho, a progressão das ideias ocorre principalmente por:","alternativas":{"A":"apresentação de uma tese, seguida de argumentos sem relação com ela.","B":"enumeração de características físicas de um mesmo objeto.","C":"alternância entre narradores com pontos de vista incompatíveis.","D":"encadeamento entre identificação de um problema, investigação de suas circunstâncias e adoção de uma medida.","E":"repetição da mesma informação sem avanço temático."},"gabarito":"D","comentario":"O trecho apresenta uma sequência funcional: primeiro surge o problema, depois vêm ações de análise e coleta de informações e, por fim, uma medida decorrente desse processo.","referencia":"Organização estrutural dos textos: progressão e articulação entre partes."},{"id":"POR092","disciplina":"Língua Portuguesa","assunto":"Modalização epistêmica","dificuldade":"Intermediária","enunciado":"Em “Sem dúvida, os dados exigem nova verificação”, a expressão “sem dúvida”:","alternativas":{"A":"introduz uma condição hipotética.","B":"expressa dúvida intensa.","C":"marca elevado grau de certeza assumido pelo enunciador.","D":"indica apenas localização espacial.","E":"substitui o sujeito da oração."},"gabarito":"C","comentario":"A expressão modaliza o enunciado ao apresentar o conteúdo como certo do ponto de vista do falante.","referencia":"Modalizadores: certeza e posicionamento enunciativo."},{"id":"POR093","disciplina":"Língua Portuguesa","assunto":"Semântica: sentido próprio e figurado","dificuldade":"Intermediária","enunciado":"Em “Depois da crítica, ele engoliu a resposta que daria”, o verbo “engoliu” foi empregado em sentido:","alternativas":{"A":"próprio, indicando ingestão física de palavras.","B":"figurado, significando conter ou deixar de proferir a resposta.","C":"técnico, relativo ao aparelho digestivo.","D":"jurídico, indicando aceitação de sentença.","E":"matemático, indicando supressão numérica."},"gabarito":"B","comentario":"O contexto impede a leitura literal: “engolir a resposta” significa conter ou deixar de dizer aquilo que se pretendia responder.","referencia":"Semântica: sentido próprio e figurado."},{"id":"POR094","disciplina":"Língua Portuguesa","assunto":"Semântica: sinonímia contextual","dificuldade":"Fácil","enunciado":"Na frase “A medida foi adotada para mitigar os impactos”, a substituição que preserva melhor o sentido de “mitigar” é:","alternativas":{"A":"“agravar”.","B":"“ocultar”.","C":"“reduzir”.","D":"“produzir”.","E":"“eliminar necessariamente”."},"gabarito":"C","comentario":"“Mitigar” significa atenuar ou reduzir a intensidade; não implica, necessariamente, eliminar completamente.","referencia":"Semântica: sinonímia contextual."},{"id":"POR095","disciplina":"Língua Portuguesa","assunto":"Semântica: antonímia","dificuldade":"Intermediária","enunciado":"No contexto “O texto é conciso, não prolixo”, a oposição entre “conciso” e “prolixo” exemplifica:","alternativas":{"A":"sinonímia.","B":"hiperonímia.","C":"antonímia contextual.","D":"homonímia perfeita.","E":"paronímia."},"gabarito":"C","comentario":"“Conciso” e “prolixo” exprimem sentidos opostos quanto à extensão e à economia verbal.","referencia":"Semântica: antônimos."},{"id":"POR096","disciplina":"Língua Portuguesa","assunto":"Semântica: parônimos","dificuldade":"Intermediária","enunciado":"Assinale a frase em que a palavra destacada foi empregada adequadamente:","alternativas":{"A":"“O diretor decidiu ratificar a informação incorreta para corrigi-la.”","B":"“A equipe infligiu o regulamento ao deixar de cumpri-lo.”","C":"“O fiscal deferiu uma multa ao servidor, no sentido de adiá-la.”","D":"“O diretor decidiu retificar a informação incorreta do comunicado.”","E":"“O professor descreveu uma atitude iminente ocorrida ontem.”"},"gabarito":"D","comentario":"“Retificar” significa corrigir. “Ratificar” é confirmar; “infringir” é violar, enquanto “infligir” é aplicar uma pena ou castigo; “iminente” é aquilo que está prestes a ocorrer.","referencia":"Semântica: parônimos e precisão vocabular."},{"id":"POR097","disciplina":"Língua Portuguesa","assunto":"Semântica: hiperônimos","dificuldade":"Fácil","enunciado":"Na relação lexical entre “árvore” e “mangueira”, “árvore” funciona como:","alternativas":{"A":"sinônimo perfeito.","B":"antônimo.","C":"parônimo.","D":"hiperônimo, por designar uma classe mais ampla que inclui mangueira.","E":"homônimo."},"gabarito":"D","comentario":"Hiperônimo é o termo de sentido mais geral que abrange termos específicos, chamados hipônimos.","referencia":"Semântica: hiperonímia e hiponímia."},{"id":"POR098","disciplina":"Língua Portuguesa","assunto":"Polissemia","dificuldade":"Intermediária","enunciado":"A palavra “rede” pode designar objeto para descanso, sistema de computadores ou conjunto articulado de instituições. Esse fenômeno é chamado:","alternativas":{"A":"polissemia.","B":"antonímia.","C":"paronímia.","D":"flexão.","E":"concordância."},"gabarito":"A","comentario":"Polissemia ocorre quando uma mesma forma lexical apresenta diferentes sentidos relacionados, selecionados pelo contexto.","referencia":"Semântica: polissemia."},{"id":"POR099","disciplina":"Língua Portuguesa","assunto":"Ambiguidade lexical","dificuldade":"Intermediária","enunciado":"Na frase “O banco fechou cedo”, sem contexto adicional, a palavra “banco” pode produzir ambiguidade porque:","alternativas":{"A":"tem apenas um sentido possível na língua.","B":"é obrigatoriamente verbo.","C":"possui erro de ortografia.","D":"pode designar instituição financeira ou assento, entre outros sentidos.","E":"é um pronome sem referente."},"gabarito":"D","comentario":"A mesma forma lexical “banco” admite diferentes interpretações; sem contexto suficiente, mais de um sentido pode ser ativado.","referencia":"Semântica: polissemia e ambiguidade lexical."},{"id":"POR100","disciplina":"Língua Portuguesa","assunto":"Ambiguidade sintática","dificuldade":"Difícil","enunciado":"Em “O professor viu o aluno com o binóculo”, a ambiguidade decorre de:","alternativas":{"A":"a expressão “com o binóculo” poder indicar o instrumento usado pelo professor ou caracterizar o aluno.","B":"o verbo “ver” não admitir objeto direto.","C":"a falta obrigatória de artigo antes de “professor”.","D":"um erro de concordância entre sujeito e verbo.","E":"o uso de palavra sem significado dicionarizado."},"gabarito":"A","comentario":"A estrutura permite duas ligações para o sintagma preposicionado “com o binóculo”: ele pode indicar o instrumento da ação de ver ou integrar o sintagma referente ao aluno.","referencia":"Semântica e sintaxe: ambiguidade estrutural."},{"id":"POR101","disciplina":"Língua Portuguesa","assunto":"Colocação pronominal: próclise","dificuldade":"Intermediária","enunciado":"Assinale a frase redigida de acordo com a norma-padrão quanto à colocação do pronome oblíquo:","alternativas":{"A":"“Nunca disseram-me por que o prazo mudou.”","B":"“Nunca me disseram por que o prazo mudou.”","C":"“Nunca disseram me por que o prazo mudou.”","D":"“Nunca me disseram-me por que o prazo mudou.”","E":"“Nunca disseram por que o prazo mudou-me.”"},"gabarito":"B","comentario":"A palavra negativa “nunca” atrai o pronome oblíquo átono, exigindo próclise: “Nunca me disseram”.","referencia":"Colocação pronominal: próclise após palavra de sentido negativo."},{"id":"POR102","disciplina":"Língua Portuguesa","assunto":"Sentido denotativo e conotativo","dificuldade":"Intermediária","enunciado":"Assinale a frase em que “raiz” foi empregada em sentido conotativo:","alternativas":{"A":"“A raiz da árvore rompeu parte da calçada.”","B":"“O jardineiro examinou a raiz da muda.”","C":"“A raiz absorve água e sais minerais.”","D":"“A comunidade preserva as raízes de sua tradição.”","E":"“A raiz principal estava danificada.”"},"gabarito":"D","comentario":"Em “raízes de sua tradição”, o termo representa origem ou fundamento cultural, e não a parte literal de uma planta.","referencia":"Semântica: denotação e conotação."},{"id":"POR103","disciplina":"Língua Portuguesa","assunto":"Semântica e conectores","dificuldade":"Intermediária","enunciado":"Em “Ele estudou muito; portanto, estava preparado”, a retirada de “portanto” enfraquece principalmente a explicitação de uma relação de:","alternativas":{"A":"concessão.","B":"condição.","C":"comparação.","D":"conclusão.","E":"alternância."},"gabarito":"D","comentario":"“Portanto” sinaliza que a segunda proposição é apresentada como conclusão decorrente da primeira.","referencia":"Semântica textual: relações de sentido marcadas por conectores."},{"id":"POR104","disciplina":"Língua Portuguesa","assunto":"Tipologia da frase portuguesa","dificuldade":"Intermediária","enunciado":"Em “Quem poderia imaginar resultado tão rápido?”, a frase é formalmente interrogativa, mas, no contexto de surpresa, pode funcionar como:","alternativas":{"A":"ordem direta destinada a obrigar o interlocutor a agir.","B":"interrogação retórica, usada mais para expressar avaliação do que para solicitar uma resposta efetiva.","C":"declaração neutra sem qualquer efeito expressivo.","D":"frase nominal sem predicação verbal.","E":"injunção técnica típica de manuais."},"gabarito":"B","comentario":"A forma interrogativa não necessariamente busca informação; em uso retórico, pode expressar surpresa, avaliação ou reforço argumentativo.","referencia":"Tipologia da frase portuguesa: frases interrogativas e efeitos pragmáticos."},{"id":"POR105","disciplina":"Língua Portuguesa","assunto":"Dicionários: organização de verbetes","dificuldade":"Intermediária","enunciado":"Em um verbete de dicionário, a indicação “s.m.” após a entrada lexical costuma informar:","alternativas":{"A":"o número de sílabas da palavra.","B":"a origem obrigatoriamente estrangeira do termo.","C":"que a palavra só pode ser usada no plural.","D":"a classe gramatical e o gênero do vocábulo: substantivo masculino.","E":"que se trata de sinônimo marcado como metafórico."},"gabarito":"D","comentario":"Abreviações como “s.m.” fornecem informações gramaticais no verbete, indicando “substantivo masculino”.","referencia":"Dicionários: tipos e organização de verbetes."},{"id":"POR106","disciplina":"Língua Portuguesa","assunto":"Dicionários: tipos","dificuldade":"Intermediária","enunciado":"Um pesquisador deseja conhecer a origem histórica de uma palavra e as formas linguísticas das quais ela se desenvolveu. O tipo de dicionário mais diretamente adequado a essa finalidade é o:","alternativas":{"A":"etimológico.","B":"de sinônimos, exclusivamente.","C":"de rimas.","D":"ortográfico, exclusivamente.","E":"de frequências, exclusivamente."},"gabarito":"A","comentario":"O dicionário etimológico registra a origem e a história das palavras; os demais tipos atendem a finalidades diferentes.","referencia":"Dicionários: tipos e finalidades."},{"id":"POR107","disciplina":"Língua Portuguesa","assunto":"Vocabulário: neologismo","dificuldade":"Intermediária","enunciado":"A criação recente de uma palavra ou de um novo sentido para palavra já existente, motivada por novas práticas sociais ou tecnológicas, é denominada:","alternativas":{"A":"arcaísmo.","B":"latinismo.","C":"antônimo.","D":"hiperônimo.","E":"neologismo."},"gabarito":"E","comentario":"Neologismo é uma unidade lexical nova ou uma acepção nova incorporada ao uso linguístico.","referencia":"Vocabulário: neologismos."},{"id":"POR108","disciplina":"Língua Portuguesa","assunto":"Vocabulário: arcaísmo","dificuldade":"Intermediária","enunciado":"Em um texto contemporâneo, o uso deliberado de uma palavra antiga, hoje pouco corrente, caracteriza:","alternativas":{"A":"arcaísmo.","B":"estrangeirismo.","C":"neologismo.","D":"sigla.","E":"paronímia."},"gabarito":"A","comentario":"Arcaísmo é uma forma ou um emprego linguístico associado a fases anteriores da língua e pouco corrente no uso contemporâneo.","referencia":"Vocabulário: arcaísmos."},{"id":"POR109","disciplina":"Língua Portuguesa","assunto":"Vocabulário: estrangeirismo","dificuldade":"Intermediária","enunciado":"Na frase “A equipe marcou uma reunião de feedback”, o termo “feedback”, incorporado do inglês, exemplifica:","alternativas":{"A":"estrangeirismo.","B":"arcaísmo.","C":"derivação regressiva.","D":"hiperonímia.","E":"flexão nominal."},"gabarito":"A","comentario":"Trata-se de palavra de origem estrangeira empregada em português, característica do estrangeirismo.","referencia":"Vocabulário: estrangeirismos."},{"id":"POR110","disciplina":"Língua Portuguesa","assunto":"Vocabulário: latinismo","dificuldade":"Intermediária","enunciado":"A expressão latina “a priori”, empregada em português sem tradução, é exemplo de:","alternativas":{"A":"neologismo formado por prefixação portuguesa.","B":"arcaísmo exclusivamente medieval.","C":"sigla institucional.","D":"pronome demonstrativo.","E":"latinismo."},"gabarito":"E","comentario":"Latinismos são palavras ou expressões provenientes do latim mantidas ou incorporadas no uso da língua.","referencia":"Vocabulário: latinismos."},{"id":"POR111","disciplina":"Língua Portuguesa","assunto":"Ortografia: emprego do hífen","dificuldade":"Intermediária","enunciado":"Assinale a alternativa grafada de acordo com a ortografia oficial:","alternativas":{"A":"“microondas”.","B":"“auto-escola”.","C":"“anti social”.","D":"“contra-regra”.","E":"“micro-ondas”."},"gabarito":"E","comentario":"Emprega-se hífen quando o prefixo termina com a mesma vogal que inicia o segundo elemento, como em “micro-ondas”. As formas-padrão correspondentes às demais opções são “autoescola”, “antissocial” e “contrarregra”.","referencia":"Ortografia oficial: emprego do hífen."},{"id":"POR112","disciplina":"Língua Portuguesa","assunto":"Acentuação gráfica","dificuldade":"Intermediária","enunciado":"Assinale a palavra corretamente acentuada:","alternativas":{"A":"“tambem”.","B":"“lapis”.","C":"“também”.","D":"“voce”.","E":"“virus”."},"gabarito":"C","comentario":"“Também” é oxítona terminada em “em” e recebe acento. As formas-padrão das outras palavras apresentadas são “lápis”, “você” e “vírus”.","referencia":"Acentuação gráfica: regras gerais."},{"id":"POR113","disciplina":"Língua Portuguesa","assunto":"Ortografia: por que, porque, por quê e porquê","dificuldade":"Intermediária","enunciado":"Assinale a frase em que a forma destacada está correta:","alternativas":{"A":"“Ninguém explicou porque a reunião foi adiada?”","B":"“A reunião foi adiada por quê motivo?”","C":"“Gostaria de saber o por que do atraso.”","D":"“Ninguém explicou por que a reunião foi adiada.”","E":"“Não fomos avisados, por que?”"},"gabarito":"D","comentario":"Em pergunta indireta, usa-se “por que”. Antes de substantivo, usa-se “o porquê”; no fim de frase, “por quê”; como conjunção causal ou explicativa, “porque”.","referencia":"Ortografia: usos de por que, porque, por quê e porquê."},{"id":"POR114","disciplina":"Língua Portuguesa","assunto":"Ortografia: há e a","dificuldade":"Intermediária","enunciado":"Assinale a frase correta:","alternativas":{"A":"“A escola mudou de endereço a três anos.”","B":"“Daqui há três anos, haverá nova avaliação.”","C":"“O evento ocorreu há duas semanas atrás.”","D":"“Estamos há dois quilômetros da escola.”","E":"“A escola mudou de endereço há três anos.”"},"gabarito":"E","comentario":"“Há” indica tempo decorrido. Para tempo futuro ou distância, usa-se “a”. Na norma formal, evita-se a redundância de “há ... atrás”.","referencia":"Ortografia e uso de formas homófonas: há/a."},{"id":"POR115","disciplina":"Língua Portuguesa","assunto":"Ortografia: mal e mau","dificuldade":"Intermediária","enunciado":"Assinale a frase correta:","alternativas":{"A":"“O equipamento funcionou mal durante o teste.”","B":"“O equipamento funcionou mau durante o teste.”","C":"“O mal funcionamento atrasou a atividade.”","D":"“Ele é um mal profissional, segundo o relatório.”","E":"“A equipe considerou o resultado maumente produzido.”"},"gabarito":"A","comentario":"“Mal” é advérbio e modifica “funcionou”. Como adjetivo oposto de “bom”, usa-se “mau”, como em “mau funcionamento” ou “mau profissional”.","referencia":"Ortografia e distinções vocabulares: mal/mau."},{"id":"POR116","disciplina":"Língua Portuguesa","assunto":"Acentuação gráfica: hiato","dificuldade":"Intermediária","enunciado":"Assinale a palavra cuja acentuação se explica pela regra do “i” tônico em hiato:","alternativas":{"A":"“lâmpada”.","B":"“saída”.","C":"“também”.","D":"“fácil”.","E":"“história”."},"gabarito":"B","comentario":"Em “saída”, o “i” tônico forma hiato com a vogal anterior e recebe acento conforme a regra específica.","referencia":"Acentuação gráfica: hiatos."},{"id":"POR117","disciplina":"Língua Portuguesa","assunto":"Acentuação gráfica: tem e têm","dificuldade":"Intermediária","enunciado":"Assinale a frase correta quanto ao emprego das formas “tem” e “têm”:","alternativas":{"A":"“Eles tem acesso ao sistema, mas ele não têm.”","B":"“Eles têm acesso ao sistema, mas ele não tem.”","C":"“Eles têem acesso ao sistema, mas ele tem.”","D":"“Eles têm acesso ao sistema, mas ele têm.”","E":"“Eles tem acesso ao sistema, mas ele tem.”"},"gabarito":"B","comentario":"No presente do indicativo, “tem” é forma da terceira pessoa do singular e “têm” é a da terceira pessoa do plural.","referencia":"Acentuação gráfica: distinção entre tem e têm."},{"id":"POR118","disciplina":"Língua Portuguesa","assunto":"Crase: regência e artigo","dificuldade":"Intermediária","enunciado":"Assinale a frase em que o uso da crase está correto:","alternativas":{"A":"“A equipe se referiu a proposta apresentada ontem.”","B":"“A equipe se referiu à uma proposta apresentada ontem.”","C":"“A equipe se referiu à proposta apresentada ontem.”","D":"“A equipe se referiu à esta proposta apresentada ontem.”","E":"“A equipe se referiu há proposta apresentada ontem.”"},"gabarito":"C","comentario":"O verbo pronominal “referir-se” rege a preposição “a”, e “proposta” admite o artigo feminino “a”; a fusão resulta em “à”.","referencia":"Crase: fusão da preposição a com artigo definido feminino."},{"id":"POR119","disciplina":"Língua Portuguesa","assunto":"Crase: locução adverbial","dificuldade":"Intermediária","enunciado":"Assinale a frase correta:","alternativas":{"A":"“A equipe chegou à tarde para a reunião.”","B":"“A equipe chegou a tarde para a reunião.”","C":"“A equipe chegou à partir das duas horas.”","D":"“A equipe chegou à pé para a reunião.”","E":"“A equipe chegou à prazo para a reunião.”"},"gabarito":"A","comentario":"Em locuções adverbiais femininas como “à tarde”, emprega-se crase. Não há crase em “a partir”, “a pé” e “a prazo”.","referencia":"Crase: locuções adverbiais femininas."},{"id":"POR120","disciplina":"Língua Portuguesa","assunto":"Crase: casos de não ocorrência","dificuldade":"Intermediária","enunciado":"Assinale a frase em que NÃO deve ocorrer crase:","alternativas":{"A":"“A reunião ocorrerá à tarde.”","B":"“A equipe dirigiu-se à escola.”","C":"“O relatório foi entregue a prazo.”","D":"“O documento foi entregue à coordenadora.”","E":"“A análise se refere à etapa final.”"},"gabarito":"C","comentario":"Na expressão “a prazo”, “prazo” é substantivo masculino, portanto não ocorre fusão de preposição com artigo feminino.","referencia":"Crase: casos de não ocorrência."},{"id":"POR121","disciplina":"Língua Portuguesa","assunto":"Crase: pronome demonstrativo","dificuldade":"Intermediária","enunciado":"Assinale a frase correta quanto à crase:","alternativas":{"A":"“A coordenadora fez referência aquela norma.”","B":"“A coordenadora fez referência à essa norma.”","C":"“A coordenadora fez referência à esta norma.”","D":"“A coordenadora fez referência háquela norma.”","E":"“A coordenadora fez referência àquela norma.”"},"gabarito":"E","comentario":"A preposição “a”, exigida por “referência”, funde-se com o “a” inicial de “aquela”: “àquela”. Com “esta” e “essa”, não ocorre crase.","referencia":"Crase: pronomes demonstrativos aquele, aquela e aquilo."},{"id":"POR122","disciplina":"Língua Portuguesa","assunto":"Crase: nomes de lugar","dificuldade":"Intermediária","enunciado":"Assinale a frase em que a crase está corretamente empregada:","alternativas":{"A":"“A equipe voltou à Bahia após o evento.”","B":"“A equipe voltou à Belém após o evento.”","C":"“A equipe voltou à Manaus após o evento.”","D":"“A equipe voltou à Brasília após o evento.”","E":"“A equipe voltou à Santarém após o evento.”"},"gabarito":"A","comentario":"O nome “Bahia” admite artigo feminino nesse uso: “voltar da Bahia” e, portanto, “voltar à Bahia”. Belém, Manaus, Brasília e Santarém, em uso não especificado, normalmente não recebem artigo: “voltar a Belém”.","referencia":"Crase: nomes próprios de lugar e presença de artigo."},{"id":"POR123","disciplina":"Língua Portuguesa","assunto":"Crase: indicação de horas","dificuldade":"Intermediária","enunciado":"Assinale a frase correta:","alternativas":{"A":"“A reunião começará as 14h e terminará as 16h.”","B":"“A reunião começará às 14h e terminará às 16h.”","C":"“A reunião começará à 14h e terminará à 16h.”","D":"“A reunião começará há 14h e terminará há 16h.”","E":"“A reunião começará às 14h e terminará as 16h.”"},"gabarito":"B","comentario":"Na indicação de horas determinadas, ocorre crase em construções como “às 14h” e “às 16h”.","referencia":"Crase: indicação de horas."},{"id":"POR124","disciplina":"Língua Portuguesa","assunto":"Colocação pronominal: ênclise","dificuldade":"Intermediária","enunciado":"Assinale a frase adequada à norma-padrão quanto à colocação do pronome oblíquo em início de oração:","alternativas":{"A":"“Me entregaram os documentos ontem.”","B":"“Se entregaram os documentos ontem.”","C":"“Entregaram-me os documentos ontem.”","D":"“Me os entregaram ontem.”","E":"“Entregaram os me documentos ontem.”"},"gabarito":"C","comentario":"Na norma-padrão tradicional, evita-se iniciar oração com pronome oblíquo átono. Sem elemento atrativo antes do verbo, a ênclise em “Entregaram-me” é a construção esperada.","referencia":"Colocação pronominal: ênclise e início de oração."},{"id":"POR125","disciplina":"Língua Portuguesa","assunto":"Crase e paralelismo","dificuldade":"Intermediária","enunciado":"Assinale a frase correta quanto ao emprego da crase e à construção paralela:","alternativas":{"A":"“O atendimento ocorre de segunda à sexta, das 8h as 17h.”","B":"“O atendimento ocorre da segunda a sexta, de 8h às 17h.”","C":"“O atendimento ocorre de segunda à sexta, de 8h à 17h.”","D":"“O atendimento ocorre à segunda a sexta, das 8h às 17h.”","E":"“O atendimento ocorre de segunda a sexta, das 8h às 17h.”"},"gabarito":"E","comentario":"Na correlação “de... a...”, não se usa artigo no primeiro termo e, por paralelismo, não se emprega crase no segundo: “de segunda a sexta”. Já “das 8h às 17h” apresenta artigo nos dois termos e exige crase em “às”.","referencia":"Crase e paralelismo em expressões correlativas."}],"rlm":[{"id":"RLM001","disciplina":"Raciocínio Lógico-Matemático","assunto":"Proposições e valor lógico","dificuldade":"Fácil","enunciado":"Considere as frases a seguir: I. Belém é a capital do Pará. II. Feche a porta da sala. III. Qual é o horário da reunião? IV. 7 + 5 = 12. Para a lógica proposicional, quantas dessas frases são proposições?","alternativas":{"A":"1","B":"2","C":"3","D":"4","E":"Nenhuma"},"gabarito":"B","comentario":"Uma proposição é uma sentença declarativa à qual se pode atribuir valor verdadeiro ou falso. I e IV são declarativas e possuem valor lógico; II é uma ordem e III é uma pergunta. Logo, há 2 proposições.","referencia":"Proposições: conceito e valor lógico."},{"id":"RLM002","disciplina":"Raciocínio Lógico-Matemático","assunto":"Proposições simples e compostas","dificuldade":"Fácil","enunciado":"A frase “A escola recebeu novos computadores e a biblioteca ampliou o horário de atendimento” é, do ponto de vista lógico, uma proposição","alternativas":{"A":"simples, pois expressa uma única ideia geral.","B":"composta, formada por uma disjunção exclusiva.","C":"composta, formada pela conjunção de duas proposições simples.","D":"composta, formada por uma implicação.","E":"não proposicional, por mencionar duas ações."},"gabarito":"C","comentario":"Há duas proposições simples: p = “A escola recebeu novos computadores” e q = “a biblioteca ampliou o horário de atendimento”. O conectivo “e” forma a conjunção p ∧ q. Portanto, a proposição é composta.","referencia":"Proposições simples e compostas; conectivo de conjunção."},{"id":"RLM003","disciplina":"Raciocínio Lógico-Matemático","assunto":"Estruturas lógicas","dificuldade":"Fácil","enunciado":"Sejam p: “A turma realizou a atividade” e q: “A turma entregou o relatório”. A sentença “A turma não realizou a atividade, mas entregou o relatório” pode ser representada logicamente por","alternativas":{"A":"¬p ∧ q","B":"p ∧ q","C":"¬p ∨ q","D":"p → q","E":"¬(p ∧ q)"},"gabarito":"A","comentario":"O termo “não” nega p, produzindo ¬p. A palavra “mas”, para fins lógicos, funciona como conjunção. Assim, a estrutura é ¬p ∧ q.","referencia":"Estruturas lógicas; negação e conjunção."},{"id":"RLM004","disciplina":"Raciocínio Lógico-Matemático","assunto":"Proposições e valor lógico","dificuldade":"Intermediária","enunciado":"Considere p verdadeira, q falsa e r verdadeira. O valor lógico da proposição (p ∧ q) ∨ r é","alternativas":{"A":"falso.","B":"indeterminado, pois depende de q.","C":"verdadeiro apenas se p for falsa.","D":"verdadeiro.","E":"falso apenas se r for verdadeira."},"gabarito":"D","comentario":"Primeiro, p ∧ q é falso porque uma conjunção só é verdadeira quando ambas as parcelas são verdadeiras. Em seguida, falso ∨ r, com r verdadeira, resulta em verdadeiro.","referencia":"Avaliação de proposições compostas."},{"id":"RLM005","disciplina":"Raciocínio Lógico-Matemático","assunto":"Proposições e valor lógico","dificuldade":"Intermediária","enunciado":"Considere p falsa e q falsa. Qual é o valor lógico de ¬p ∧ (p ∨ q)?","alternativas":{"A":"Falso","B":"Verdadeiro","C":"Indeterminado","D":"Não pode ser avaliado sem conhecer uma terceira proposição.","E":"Verdadeiro, porque ¬p é verdadeiro."},"gabarito":"A","comentario":"Como p é falsa, ¬p é verdadeira. Já p ∨ q é falsa, pois ambas são falsas. Assim, verdadeira ∧ falsa resulta em falso.","referencia":"Avaliação de proposições compostas; negação, disjunção e conjunção."},{"id":"RLM006","disciplina":"Raciocínio Lógico-Matemático","assunto":"Estruturas lógicas","dificuldade":"Intermediária","enunciado":"Uma coordenação afirma: “Se o laboratório estiver disponível, então a turma fará a prática”. Sabendo apenas que a turma não fez a prática, qual conclusão decorre logicamente da afirmação?","alternativas":{"A":"O laboratório estava disponível.","B":"O laboratório não estava disponível.","C":"A turma faltou à aula.","D":"A prática foi cancelada pela direção.","E":"Não é possível concluir nada sobre a disponibilidade do laboratório."},"gabarito":"B","comentario":"A afirmação tem a forma p → q. Se q é falsa (“a turma não fez a prática”), pela contraposição conclui-se ¬p. Portanto, o laboratório não estava disponível.","referencia":"Implicação e contraposição."},{"id":"RLM007","disciplina":"Raciocínio Lógico-Matemático","assunto":"Proposições e valor lógico","dificuldade":"Intermediária","enunciado":"Considere a proposição: “Se Ana participa da reunião, então Bruno registra a ata”. Em qual situação essa proposição é falsa?","alternativas":{"A":"Ana não participa da reunião e Bruno registra a ata.","B":"Ana não participa da reunião e Bruno não registra a ata.","C":"Ana participa da reunião e Bruno não registra a ata.","D":"Ana participa da reunião e Bruno registra a ata.","E":"Bruno registra a ata, independentemente da participação de Ana."},"gabarito":"C","comentario":"Uma implicação p → q é falsa somente quando o antecedente p é verdadeiro e o consequente q é falso. Isso corresponde a Ana participar e Bruno não registrar a ata.","referencia":"Valor lógico da implicação."},{"id":"RLM008","disciplina":"Raciocínio Lógico-Matemático","assunto":"Estruturas lógicas","dificuldade":"Intermediária","enunciado":"Se p, q e r são proposições, a expressão “(p ou q) e não r” é representada logicamente por","alternativas":{"A":"p ∨ (q ∧ ¬r)","B":"(p ∧ q) ∨ ¬r","C":"(p ∨ q) ∧ ¬r","D":"¬(p ∨ q) ∧ r","E":"p ∧ (q ∨ ¬r)"},"gabarito":"C","comentario":"A expressão entre parênteses corresponde a p ∨ q. A negação de r é ¬r. Como as duas partes estão ligadas por “e”, a representação é (p ∨ q) ∧ ¬r.","referencia":"Formalização de proposições compostas."},{"id":"RLM009","disciplina":"Raciocínio Lógico-Matemático","assunto":"Proposições e valor lógico","dificuldade":"Difícil","enunciado":"Considere p, q e r proposições. Sabe-se que p → q é falsa e que q ∨ r é verdadeira. Nessas condições, os valores lógicos de p, q e r são, respectivamente,","alternativas":{"A":"verdadeiro, verdadeiro e falso.","B":"verdadeiro, falso e verdadeiro.","C":"falso, falso e verdadeiro.","D":"falso, verdadeiro e verdadeiro.","E":"verdadeiro, falso e falso."},"gabarito":"B","comentario":"Para p → q ser falsa, necessariamente p é verdadeira e q é falsa. Como q ∨ r é verdadeira e q é falsa, r deve ser verdadeira. Logo, (p,q,r) = (V,F,V).","referencia":"Implicação e determinação de valores lógicos."},{"id":"RLM010","disciplina":"Raciocínio Lógico-Matemático","assunto":"Estruturas lógicas","dificuldade":"Difícil","enunciado":"Três proposições p, q e r satisfazem simultaneamente: p ∨ q é verdadeira; q → r é falsa; e ¬p ∨ r é falsa. Qual alternativa apresenta os valores de p, q e r?","alternativas":{"A":"p verdadeira, q falsa e r verdadeira.","B":"p falsa, q verdadeira e r falsa.","C":"p falsa, q falsa e r verdadeira.","D":"p verdadeira, q verdadeira e r falsa.","E":"p verdadeira, q verdadeira e r verdadeira."},"gabarito":"D","comentario":"De q → r falsa, obtém-se q verdadeira e r falsa. De ¬p ∨ r falsa, ambas as parcelas devem ser falsas: ¬p é falsa, logo p é verdadeira; e r é falsa, já consistente. Assim, p e q são verdadeiras e r é falsa.","referencia":"Estruturas lógicas; implicação e disjunção."},{"id":"RLM011","disciplina":"Raciocínio Lógico-Matemático","assunto":"Negação de proposições","dificuldade":"Fácil","enunciado":"A negação lógica da proposição “A biblioteca está aberta” é","alternativas":{"A":"A biblioteca está fechada e vazia.","B":"A biblioteca não está aberta.","C":"A biblioteca talvez esteja aberta.","D":"A biblioteca nunca abre.","E":"A biblioteca está aberta somente pela manhã."},"gabarito":"B","comentario":"A negação de uma proposição simples p é ¬p. Portanto, basta negar a afirmação sem acrescentar informação: “A biblioteca não está aberta”.","referencia":"Negação de proposições simples."},{"id":"RLM012","disciplina":"Raciocínio Lógico-Matemático","assunto":"Conectivos lógicos","dificuldade":"Fácil","enunciado":"Considere p: “João estuda” e q: “Maria trabalha”. Qual condição caracteriza exatamente todos os casos em que a proposição p ∨ q é verdadeira?","alternativas":{"A":"somente p é verdadeira.","B":"somente q é verdadeira.","C":"p e q são necessariamente verdadeiras.","D":"p e q são necessariamente falsas.","E":"pelo menos uma entre p e q é verdadeira."},"gabarito":"E","comentario":"Na disjunção inclusiva p ∨ q, o resultado é verdadeiro se pelo menos uma das proposições for verdadeira, inclusive quando ambas são verdadeiras.","referencia":"Conectivo de disjunção inclusiva."},{"id":"RLM013","disciplina":"Raciocínio Lógico-Matemático","assunto":"Negação de conjunção","dificuldade":"Fácil","enunciado":"A negação de “Carlos revisou o conteúdo e resolveu os exercícios” é logicamente equivalente a","alternativas":{"A":"Carlos não revisou o conteúdo e não resolveu os exercícios.","B":"Carlos revisou o conteúdo ou resolveu os exercícios.","C":"Se Carlos revisou o conteúdo, então resolveu os exercícios.","D":"Carlos revisou o conteúdo e não resolveu os exercícios.","E":"Carlos não revisou o conteúdo ou não resolveu os exercícios."},"gabarito":"E","comentario":"Pela lei de De Morgan, ¬(p ∧ q) ≡ ¬p ∨ ¬q. Assim, negar que as duas ações ocorreram é afirmar que ao menos uma delas não ocorreu.","referencia":"Leis de De Morgan; negação da conjunção."},{"id":"RLM014","disciplina":"Raciocínio Lógico-Matemático","assunto":"Implicação lógica","dificuldade":"Fácil","enunciado":"A proposição “Se o sistema está online, então o relatório pode ser enviado” é logicamente equivalente a","alternativas":{"A":"O sistema não está online ou o relatório pode ser enviado.","B":"O sistema está online e o relatório pode ser enviado.","C":"O sistema está online ou o relatório não pode ser enviado.","D":"O sistema não está online e o relatório não pode ser enviado.","E":"O relatório pode ser enviado somente se o sistema estiver offline."},"gabarito":"A","comentario":"A equivalência fundamental da implicação é p → q ≡ ¬p ∨ q. Aplicando-a, obtém-se “o sistema não está online ou o relatório pode ser enviado”.","referencia":"Equivalência da implicação."},{"id":"RLM015","disciplina":"Raciocínio Lógico-Matemático","assunto":"Negação de disjunção","dificuldade":"Intermediária","enunciado":"A negação de “A reunião será presencial ou será transmitida pela internet”, considerando o “ou” inclusivo, é","alternativas":{"A":"A reunião não será presencial e não será transmitida pela internet.","B":"A reunião não será presencial ou não será transmitida pela internet.","C":"A reunião será presencial e será transmitida pela internet.","D":"Se a reunião não for presencial, então será transmitida pela internet.","E":"A reunião será presencial, mas não será transmitida pela internet."},"gabarito":"A","comentario":"Pela lei de De Morgan, ¬(p ∨ q) ≡ ¬p ∧ ¬q. Logo, para negar a disjunção, ambas as alternativas devem ser negadas e ligadas por “e”.","referencia":"Leis de De Morgan; negação da disjunção."},{"id":"RLM016","disciplina":"Raciocínio Lógico-Matemático","assunto":"Negação de implicação","dificuldade":"Intermediária","enunciado":"A negação lógica de “Se Paulo conclui o cadastro, então recebe a confirmação” é","alternativas":{"A":"Paulo não conclui o cadastro e não recebe a confirmação.","B":"Paulo não conclui o cadastro ou recebe a confirmação.","C":"Se Paulo não conclui o cadastro, então não recebe a confirmação.","D":"Paulo recebe a confirmação e não conclui o cadastro.","E":"Paulo conclui o cadastro e não recebe a confirmação."},"gabarito":"E","comentario":"A negação de p → q é p ∧ ¬q. Isso representa exatamente o único caso em que uma implicação é falsa: antecedente verdadeiro e consequente falso.","referencia":"Negação da implicação."},{"id":"RLM017","disciplina":"Raciocínio Lógico-Matemático","assunto":"Equivalências lógicas","dificuldade":"Intermediária","enunciado":"A proposição “Se a equipe entregou o relatório, então cumpriu o prazo” é logicamente equivalente a","alternativas":{"A":"Se a equipe cumpriu o prazo, então entregou o relatório.","B":"Se a equipe não entregou o relatório, então não cumpriu o prazo.","C":"A equipe entregou o relatório se, e somente se, cumpriu o prazo.","D":"Se a equipe não cumpriu o prazo, então não entregou o relatório.","E":"A equipe não entregou o relatório ou não cumpriu o prazo."},"gabarito":"D","comentario":"Uma implicação p → q é equivalente à sua contrapositiva ¬q → ¬p. Assim, “se não cumpriu o prazo, então não entregou o relatório” preserva exatamente o mesmo valor lógico.","referencia":"Contraposição; equivalência de implicações."},{"id":"RLM018","disciplina":"Raciocínio Lógico-Matemático","assunto":"Equivalências lógicas","dificuldade":"Intermediária","enunciado":"Qual das expressões a seguir é equivalente a ¬(p ∧ ¬q)?","alternativas":{"A":"¬p ∧ q","B":"p ∨ ¬q","C":"¬p ∨ q","D":"p → ¬q","E":"¬p → q"},"gabarito":"C","comentario":"Aplicando De Morgan: ¬(p ∧ ¬q) ≡ ¬p ∨ ¬(¬q). Como ¬(¬q) = q, resulta ¬p ∨ q.","referencia":"Leis de De Morgan e dupla negação."},{"id":"RLM019","disciplina":"Raciocínio Lógico-Matemático","assunto":"Conectivos lógicos","dificuldade":"Intermediária","enunciado":"Considere p verdadeira e q falsa. O valor lógico de (p → q) ∨ (q → p) é","alternativas":{"A":"Falso","B":"Indeterminado","C":"Verdadeiro","D":"Verdadeiro apenas se p e q tiverem o mesmo valor lógico","E":"Falso apenas quando p for verdadeira"},"gabarito":"C","comentario":"Com p = V e q = F, p → q é falsa. Já q → p é verdadeira porque uma implicação com antecedente falso é verdadeira. Assim, F ∨ V = V.","referencia":"Valor lógico de implicações e disjunção."},{"id":"RLM020","disciplina":"Raciocínio Lógico-Matemático","assunto":"Equivalências lógicas","dificuldade":"Intermediária","enunciado":"A expressão ¬p → q é logicamente equivalente a","alternativas":{"A":"p ∨ q","B":"¬p ∨ q","C":"p ∧ q","D":"¬p ∧ q","E":"p → ¬q"},"gabarito":"A","comentario":"Usando a equivalência a → b ≡ ¬a ∨ b, com a = ¬p, temos ¬(¬p) ∨ q, isto é, p ∨ q.","referencia":"Equivalência da implicação e dupla negação."},{"id":"RLM021","disciplina":"Raciocínio Lógico-Matemático","assunto":"Negação de proposições compostas","dificuldade":"Intermediária","enunciado":"A negação de “Se o aluno comparece e apresenta o documento, então realiza a matrícula” é","alternativas":{"A":"O aluno não comparece e não apresenta o documento.","B":"O aluno comparece e apresenta o documento, mas não realiza a matrícula.","C":"O aluno não comparece ou não apresenta o documento, e não realiza a matrícula.","D":"Se o aluno não realiza a matrícula, então não comparece.","E":"O aluno realiza a matrícula, mas não apresenta o documento."},"gabarito":"B","comentario":"Defina p = “comparece”, q = “apresenta o documento” e r = “realiza a matrícula”. A frase é (p ∧ q) → r. Sua negação é (p ∧ q) ∧ ¬r.","referencia":"Negação de implicação com antecedente composto."},{"id":"RLM022","disciplina":"Raciocínio Lógico-Matemático","assunto":"Equivalências lógicas","dificuldade":"Difícil","enunciado":"Considere a expressão (p → q) ∧ (p → r). Uma forma logicamente equivalente a ela é","alternativas":{"A":"p → (q ∧ r)","B":"(q ∧ r) → p","C":"p → (q ∨ r)","D":"(p ∧ q) → r","E":"(q ∨ r) → p"},"gabarito":"A","comentario":"Temos (p → q) ∧ (p → r) ≡ (¬p ∨ q) ∧ (¬p ∨ r). Pela distributividade, isso equivale a ¬p ∨ (q ∧ r), que é exatamente p → (q ∧ r).","referencia":"Equivalências lógicas; distributividade e implicação."},{"id":"RLM023","disciplina":"Raciocínio Lógico-Matemático","assunto":"Equivalências lógicas","dificuldade":"Difícil","enunciado":"Qual expressão é logicamente equivalente a ¬[(p ∨ q) → r]?","alternativas":{"A":"(¬p ∧ ¬q) ∨ r","B":"(p ∧ q) ∧ ¬r","C":"(p ∨ q) ∧ ¬r","D":"¬(p ∨ q) ∧ r","E":"(¬p ∨ ¬q) ∧ r"},"gabarito":"C","comentario":"A negação de uma implicação A → r é A ∧ ¬r. Aqui A = p ∨ q. Portanto, ¬[(p ∨ q) → r] ≡ (p ∨ q) ∧ ¬r.","referencia":"Negação de implicação com antecedente composto."},{"id":"RLM024","disciplina":"Raciocínio Lógico-Matemático","assunto":"Equivalências lógicas","dificuldade":"Difícil","enunciado":"A proposição (p ∨ q) → r é logicamente equivalente a","alternativas":{"A":"(p → r) ∧ (q → r)","B":"(p → r) ∨ (q → r)","C":"r → (p ∧ q)","D":"(p ∧ q) → r","E":"(p → q) ∧ (q → r)"},"gabarito":"A","comentario":"Temos (p ∨ q) → r ≡ ¬(p ∨ q) ∨ r ≡ (¬p ∧ ¬q) ∨ r. Pela distributividade, isso equivale a (¬p ∨ r) ∧ (¬q ∨ r), isto é, (p → r) ∧ (q → r).","referencia":"Equivalências lógicas; De Morgan e distributividade."},{"id":"RLM025","disciplina":"Raciocínio Lógico-Matemático","assunto":"Equivalências lógicas","dificuldade":"Difícil","enunciado":"Considere a proposição P = (p → q) ∨ (q → p). Sobre P, é correto afirmar que","alternativas":{"A":"P é sempre falsa.","B":"P é sempre verdadeira, quaisquer que sejam os valores lógicos de p e q.","C":"P é verdadeira somente quando p e q são verdadeiras.","D":"P é falsa somente quando p e q têm valores diferentes.","E":"P tem sempre o mesmo valor lógico de p ∧ q."},"gabarito":"B","comentario":"Se p e q têm o mesmo valor, as duas implicações são verdadeiras. Se têm valores diferentes, uma das implicações é verdadeira e a outra é falsa. Em todos os casos, a disjunção entre elas é verdadeira. Logo, P é uma tautologia.","referencia":"Equivalências e análise de proposições compostas."},{"id":"RLM026","disciplina":"Raciocínio Lógico-Matemático","assunto":"Argumentos e inferências","dificuldade":"Fácil","enunciado":"Considere o argumento: “Se a escola recebe o material, então inicia a distribuição. A escola recebeu o material. Logo, iniciou a distribuição.” Esse argumento utiliza a forma válida conhecida como","alternativas":{"A":"modus ponens.","B":"modus tollens.","C":"negação do antecedente.","D":"afirmação do consequente.","E":"dilema inválido."},"gabarito":"A","comentario":"A estrutura é p → q; p; logo q. Essa é a regra de inferência chamada modus ponens, que permite afirmar o consequente quando a implicação e o antecedente são verdadeiros.","referencia":"Argumentos e inferências; modus ponens."},{"id":"RLM027","disciplina":"Raciocínio Lógico-Matemático","assunto":"Argumentos e inferências","dificuldade":"Fácil","enunciado":"Considere: “Se o servidor enviou o formulário, então recebeu protocolo. O servidor não recebeu protocolo.” Uma conclusão logicamente válida é","alternativas":{"A":"O servidor enviou o formulário.","B":"O protocolo foi perdido.","C":"O servidor enviará novamente o formulário.","D":"O sistema estava fora do ar.","E":"O servidor não enviou o formulário."},"gabarito":"E","comentario":"A forma é p → q e ¬q. Pelo modus tollens, conclui-se ¬p. Não é necessário supor causa adicional para a ausência de protocolo.","referencia":"Argumentos e inferências; modus tollens."},{"id":"RLM028","disciplina":"Raciocínio Lógico-Matemático","assunto":"Argumentos e inferências","dificuldade":"Fácil","enunciado":"Todos os coordenadores da equipe participaram da reunião. Lúcia é coordenadora da equipe. Portanto,","alternativas":{"A":"Lúcia presidiu a reunião.","B":"somente os coordenadores participaram da reunião.","C":"todos os participantes são coordenadores.","D":"Lúcia participou da reunião.","E":"Lúcia participou de todas as reuniões do ano."},"gabarito":"D","comentario":"A primeira premissa inclui todos os coordenadores no conjunto dos participantes. Como Lúcia pertence ao conjunto dos coordenadores, conclui-se que ela pertence ao conjunto dos participantes.","referencia":"Inferência a partir de relações de inclusão."},{"id":"RLM029","disciplina":"Raciocínio Lógico-Matemático","assunto":"Argumentos e inferências","dificuldade":"Intermediária","enunciado":"Considere as premissas: I. Se a sala A está ocupada, então a sala B está livre. II. Se a sala B está livre, então a reunião começa no horário. III. A sala A está ocupada. Qual conclusão é necessariamente verdadeira?","alternativas":{"A":"A sala B está ocupada.","B":"A sala A ficará livre antes da reunião.","C":"A reunião começa no horário.","D":"A reunião ocorrerá na sala B.","E":"A sala B está livre apenas durante a reunião."},"gabarito":"C","comentario":"De III e I, por modus ponens, conclui-se que a sala B está livre. Aplicando II a essa conclusão, obtém-se que a reunião começa no horário.","referencia":"Encadeamento de implicações; argumentos e inferências."},{"id":"RLM030","disciplina":"Raciocínio Lógico-Matemático","assunto":"Argumentos e inferências","dificuldade":"Intermediária","enunciado":"Considere: “Se o projeto é aprovado, então recebe recursos. Se recebe recursos, então inicia em outubro. O projeto não iniciou em outubro.” O que se conclui necessariamente?","alternativas":{"A":"O projeto foi aprovado, mas os recursos atrasaram.","B":"O projeto recebeu recursos.","C":"O projeto iniciará em novembro.","D":"Nada pode ser concluído sobre a aprovação.","E":"O projeto não foi aprovado."},"gabarito":"E","comentario":"Das duas primeiras premissas, obtém-se “se o projeto é aprovado, então inicia em outubro”. Como não iniciou em outubro, pelo modus tollens conclui-se que não foi aprovado.","referencia":"Inferência por encadeamento e contraposição."},{"id":"RLM031","disciplina":"Raciocínio Lógico-Matemático","assunto":"Argumentos e inferências","dificuldade":"Intermediária","enunciado":"Em um setor, todo documento sigiloso é arquivado em pasta restrita. Nenhum documento arquivado em pasta restrita pode ser enviado por e-mail comum. O relatório X é sigiloso. Logo, é correto concluir que o relatório X","alternativas":{"A":"não está arquivado em pasta restrita.","B":"pode ser enviado por e-mail comum se tiver poucas páginas.","C":"não pode ser enviado por e-mail comum.","D":"é o único documento sigiloso do setor.","E":"foi enviado por outro meio."},"gabarito":"C","comentario":"Relatório X é sigiloso, então pertence ao conjunto dos documentos arquivados em pasta restrita. Como nenhum elemento desse conjunto pode ser enviado por e-mail comum, X também não pode.","referencia":"Argumentos categóricos; inclusão e exclusão de conjuntos."},{"id":"RLM032","disciplina":"Raciocínio Lógico-Matemático","assunto":"Argumentos e inferências","dificuldade":"Intermediária","enunciado":"Analise o argumento: “Se Marina é supervisora, então participa do conselho. Marina participa do conselho. Logo, Marina é supervisora.” Esse argumento é","alternativas":{"A":"válido, por modus ponens.","B":"inválido, pois afirma o consequente para concluir o antecedente.","C":"válido, por modus tollens.","D":"válido, por contraposição.","E":"inválido, porque uma implicação nunca permite conclusões."},"gabarito":"B","comentario":"Da implicação p → q e da informação q, não se pode concluir p. Outras pessoas podem participar do conselho sem serem supervisoras. Trata-se da falácia de afirmação do consequente.","referencia":"Validade de argumentos; afirmação do consequente."},{"id":"RLM033","disciplina":"Raciocínio Lógico-Matemático","assunto":"Argumentos e inferências","dificuldade":"Difícil","enunciado":"Considere as premissas: I. Se A ocorre, então B ocorre. II. Se B não ocorre, então C ocorre. III. C não ocorre. Qual conclusão é necessariamente verdadeira?","alternativas":{"A":"B ocorre.","B":"A ocorre.","C":"A não ocorre.","D":"B não ocorre.","E":"A e B não ocorrem."},"gabarito":"A","comentario":"De II, ¬B → C. Como C não ocorre, pela contraposição de II conclui-se ¬(¬B), isto é, B ocorre. A premissa I não permite determinar A a partir de B.","referencia":"Argumentos e inferências; contraposição."},{"id":"RLM034","disciplina":"Raciocínio Lógico-Matemático","assunto":"Argumentos e inferências","dificuldade":"Difícil","enunciado":"Considere as premissas: I. Se Pedro participa, então Quésia participa. II. Se Quésia participa, então Renato participa. III. Se Renato participa, então Sara não participa. IV. Sara participa. Qual afirmação decorre necessariamente?","alternativas":{"A":"Pedro participa.","B":"Quésia participa.","C":"Renato participa.","D":"Quésia e Renato participam.","E":"Pedro não participa."},"gabarito":"E","comentario":"De III e IV, como Sara participa, por contraposição conclui-se que Renato não participa. De II, por contraposição, Renato não participar implica Quésia não participar. De I, novamente por contraposição, Quésia não participar implica Pedro não participar.","referencia":"Encadeamento de contraposições."},{"id":"RLM035","disciplina":"Raciocínio Lógico-Matemático","assunto":"Argumentos e inferências","dificuldade":"Difícil","enunciado":"Em um argumento, as premissas são: “Todo servidor que domina o sistema conclui o cadastro sem ajuda”; “Alguns servidores do setor não concluem o cadastro sem ajuda”. Qual conclusão é logicamente garantida?","alternativas":{"A":"Nenhum servidor do setor domina o sistema.","B":"Todos os servidores do setor dominam o sistema.","C":"Alguns servidores que dominam o sistema não concluem o cadastro sem ajuda.","D":"Alguns servidores do setor não dominam o sistema.","E":"Todos os servidores que não dominam o sistema deixam de concluir o cadastro."},"gabarito":"D","comentario":"Se dominar o sistema implica concluir sem ajuda, então não concluir sem ajuda implica, pela contraposição, não dominar o sistema. Como existem servidores do setor que não concluem sem ajuda, ao menos esses não dominam o sistema.","referencia":"Argumentação e inferência por contraposição."},{"id":"RLM036","disciplina":"Raciocínio Lógico-Matemático","assunto":"Sequências lógicas e reconhecimento de padrões","dificuldade":"Fácil","enunciado":"Observe a sequência: 4, 7, 10, 13, 16, ... Mantido o padrão, o próximo termo é","alternativas":{"A":"18","B":"20","C":"21","D":"22","E":"19"},"gabarito":"E","comentario":"A diferença entre termos consecutivos é constante e igual a 3: 4+3=7, 7+3=10 e assim por diante. Logo, 16+3=19.","referencia":"Sequências lógicas; progressão por diferença constante."},{"id":"RLM037","disciplina":"Raciocínio Lógico-Matemático","assunto":"Sequências lógicas e reconhecimento de padrões","dificuldade":"Fácil","enunciado":"Na sequência 1, 2, 4, 8, 16, ..., cada termo, a partir do segundo, é obtido a partir do anterior por uma mesma regra. O próximo termo é","alternativas":{"A":"20","B":"24","C":"30","D":"32","E":"34"},"gabarito":"D","comentario":"Cada termo é o dobro do anterior. Assim, depois de 16 vem 16×2=32.","referencia":"Reconhecimento de padrões multiplicativos."},{"id":"RLM038","disciplina":"Raciocínio Lógico-Matemático","assunto":"Sequências lógicas e reconhecimento de padrões","dificuldade":"Fácil","enunciado":"Considere a sequência de letras A, C, E, G, I, ... seguindo a ordem do alfabeto e avançando sempre a mesma quantidade de posições. A próxima letra é","alternativas":{"A":"J","B":"K","C":"L","D":"M","E":"N"},"gabarito":"B","comentario":"A sequência utiliza as posições 1, 3, 5, 7 e 9 do alfabeto, avançando duas posições a cada termo. A próxima posição é 11, correspondente à letra K.","referencia":"Raciocínio sequencial; reconhecimento de padrão."},{"id":"RLM039","disciplina":"Raciocínio Lógico-Matemático","assunto":"Sequências lógicas e reconhecimento de padrões","dificuldade":"Intermediária","enunciado":"Observe a sequência: 3, 6, 12, 24, 48, ... Qual é o sétimo termo?","alternativas":{"A":"96","B":"144","C":"168","D":"216","E":"192"},"gabarito":"E","comentario":"Cada termo é o dobro do anterior. O sexto termo é 96 e o sétimo é 192.","referencia":"Sequências multiplicativas."},{"id":"RLM040","disciplina":"Raciocínio Lógico-Matemático","assunto":"Sequências lógicas e reconhecimento de padrões","dificuldade":"Intermediária","enunciado":"Considere a sequência: 2, 6, 12, 20, 30, ... O próximo termo é","alternativas":{"A":"42","B":"36","C":"40","D":"44","E":"48"},"gabarito":"A","comentario":"Os termos seguem n(n+1): 1×2=2, 2×3=6, 3×4=12, 4×5=20, 5×6=30. O próximo é 6×7=42. Também se pode observar diferenças 4, 6, 8, 10 e, depois, 12.","referencia":"Reconhecimento de padrões por diferenças sucessivas."},{"id":"RLM041","disciplina":"Raciocínio Lógico-Matemático","assunto":"Sequências lógicas e reconhecimento de padrões","dificuldade":"Intermediária","enunciado":"A sequência 5, 8, 14, 23, 35, ... é construída somando-se valores que crescem segundo um padrão. O próximo termo é","alternativas":{"A":"47","B":"48","C":"49","D":"51","E":"50"},"gabarito":"E","comentario":"As diferenças são 3, 6, 9 e 12, aumentando de 3 em 3. A próxima diferença é 15. Logo, 35+15=50.","referencia":"Sequências; análise de diferenças."},{"id":"RLM042","disciplina":"Raciocínio Lógico-Matemático","assunto":"Sequências lógicas e reconhecimento de padrões","dificuldade":"Intermediária","enunciado":"Em uma sequência, os termos são 2, 3, 5, 8, 12, 17, ... As diferenças entre termos consecutivos aumentam de uma unidade a cada passo. O próximo termo é","alternativas":{"A":"21","B":"22","C":"23","D":"24","E":"25"},"gabarito":"C","comentario":"As diferenças são 1, 2, 3, 4 e 5. A próxima diferença deve ser 6. Portanto, 17+6=23.","referencia":"Sequências lógicas; diferenças crescentes."},{"id":"RLM043","disciplina":"Raciocínio Lógico-Matemático","assunto":"Sequências lógicas e reconhecimento de padrões","dificuldade":"Difícil","enunciado":"Observe a sequência: 1, 2, 6, 15, 31, 56, ... As diferenças sucessivas são quadrados perfeitos. O próximo termo é","alternativas":{"A":"81","B":"87","C":"90","D":"92","E":"96"},"gabarito":"D","comentario":"As diferenças são 1, 4, 9, 16 e 25, isto é, 1², 2², 3², 4² e 5². A próxima diferença é 6²=36. Logo, 56+36=92.","referencia":"Sequências lógicas; padrões em diferenças sucessivas."},{"id":"RLM044","disciplina":"Raciocínio Lógico-Matemático","assunto":"Sequências lógicas e reconhecimento de padrões","dificuldade":"Difícil","enunciado":"Considere a sequência 3, 4, 8, 9, 18, 19, 38, ... O padrão alterna duas operações. Mantendo-o, o próximo termo é","alternativas":{"A":"40","B":"57","C":"76","D":"77","E":"39"},"gabarito":"E","comentario":"O padrão é alternar +1 e ×2: 3+1=4; 4×2=8; 8+1=9; 9×2=18; 18+1=19; 19×2=38. Portanto, o próximo passo é +1, resultando em 39.","referencia":"Sequências lógicas com operações alternadas."},{"id":"RLM045","disciplina":"Raciocínio Lógico-Matemático","assunto":"Sequências lógicas e reconhecimento de padrões","dificuldade":"Difícil","enunciado":"Uma sequência é definida por a1 = 2 e, para cada termo seguinte, soma-se ao termo anterior o dobro da posição que está sendo formada. Assim, a2 = a1 + 2×2, a3 = a2 + 2×3, e assim por diante. O valor de a6 é","alternativas":{"A":"30","B":"42","C":"34","D":"38","E":"40"},"gabarito":"B","comentario":"Calculando: a1=2; a2=2+4=6; a3=6+6=12; a4=12+8=20; a5=20+10=30; a6=30+12=42.","referencia":"Sequências definidas por recorrência."},{"id":"RLM046","disciplina":"Raciocínio Lógico-Matemático","assunto":"Diagramas lógicos e de Venn","dificuldade":"Fácil","enunciado":"Em uma turma de 30 estudantes, 18 participam do clube de leitura, 12 participam do clube de ciências e 5 participam de ambos. Quantos participam de pelo menos um dos dois clubes?","alternativas":{"A":"20","B":"23","C":"30","D":"35","E":"25"},"gabarito":"E","comentario":"Pelo princípio da inclusão-exclusão para dois conjuntos: |L∪C| = 18 + 12 − 5 = 25. A interseção é subtraída uma vez porque foi contada duas vezes na soma inicial.","referencia":"Diagramas de Venn; união e interseção de dois conjuntos."},{"id":"RLM047","disciplina":"Raciocínio Lógico-Matemático","assunto":"Diagramas lógicos e de Venn","dificuldade":"Fácil","enunciado":"Sabe-se que todo coordenador é servidor e que nenhum estagiário é servidor. Qual relação é necessariamente verdadeira?","alternativas":{"A":"Nenhum estagiário é coordenador.","B":"Todo estagiário é coordenador.","C":"Algum coordenador é estagiário.","D":"Nenhum servidor é coordenador.","E":"Todo servidor é coordenador."},"gabarito":"A","comentario":"O conjunto dos coordenadores está contido no conjunto dos servidores. O conjunto dos estagiários é disjunto do conjunto dos servidores. Portanto, estagiários também não podem pertencer ao conjunto dos coordenadores.","referencia":"Diagramas lógicos; inclusão e exclusão de conjuntos."},{"id":"RLM048","disciplina":"Raciocínio Lógico-Matemático","assunto":"Diagramas lógicos e de Venn","dificuldade":"Fácil","enunciado":"Em um grupo, todos os professores são graduados, e alguns graduados são pesquisadores. A única conclusão obrigatória é que","alternativas":{"A":"todo pesquisador é professor.","B":"algum professor é pesquisador.","C":"nenhum professor é pesquisador.","D":"todo professor pertence ao conjunto dos graduados.","E":"todos os graduados são professores."},"gabarito":"D","comentario":"A única relação dada como universal é Professores ⊆ Graduados. O fato de alguns graduados serem pesquisadores não informa se há ou não professores entre esses pesquisadores.","referencia":"Diagramas lógicos; relações de inclusão."},{"id":"RLM049","disciplina":"Raciocínio Lógico-Matemático","assunto":"Diagramas lógicos e de Venn","dificuldade":"Intermediária","enunciado":"Em uma pesquisa com 40 servidores, 25 utilizam o sistema A, 20 utilizam o sistema B e 12 utilizam ambos. Quantos utilizam somente o sistema A?","alternativas":{"A":"5","B":"8","C":"17","D":"25","E":"13"},"gabarito":"E","comentario":"Dos 25 usuários do sistema A, 12 também usam B. Logo, somente A = 25 − 12 = 13.","referencia":"Diagramas de Venn; diferença entre conjuntos."},{"id":"RLM050","disciplina":"Raciocínio Lógico-Matemático","assunto":"Diagramas lógicos e de Venn","dificuldade":"Intermediária","enunciado":"Entre 60 participantes de uma formação, 35 concluíram o módulo X, 28 concluíram o módulo Y e 15 concluíram ambos. Quantos não concluíram nenhum dos dois módulos?","alternativas":{"A":"8","B":"10","C":"18","D":"12","E":"22"},"gabarito":"D","comentario":"Concluíram pelo menos um: 35 + 28 − 15 = 48. Como o total é 60, não concluíram nenhum: 60 − 48 = 12.","referencia":"Diagramas de Venn; união, interseção e complemento."},{"id":"RLM051","disciplina":"Raciocínio Lógico-Matemático","assunto":"Diagramas lógicos e de Venn","dificuldade":"Intermediária","enunciado":"Em um setor com 70 pessoas, 42 dominam planilhas, 36 dominam apresentações e 20 dominam ambas as ferramentas. Quantas dominam exatamente uma das duas ferramentas?","alternativas":{"A":"22","B":"28","C":"42","D":"38","E":"58"},"gabarito":"D","comentario":"Somente planilhas = 42−20=22. Somente apresentações = 36−20=16. Exatamente uma = 22+16=38.","referencia":"Diagramas de Venn; elementos pertencentes a exatamente um conjunto."},{"id":"RLM052","disciplina":"Raciocínio Lógico-Matemático","assunto":"Diagramas lógicos e de Venn","dificuldade":"Intermediária","enunciado":"Considere os conjuntos T, G e E, formados, respectivamente, por técnicos, gestores e estagiários. Sabe-se que alguns técnicos também são gestores e que nenhum gestor é estagiário. Qual afirmação pode ser concluída necessariamente?","alternativas":{"A":"Nenhum técnico é estagiário.","B":"Nenhuma pessoa que seja simultaneamente técnica e gestora pode ser estagiária.","C":"Todo técnico é gestor.","D":"Todo gestor é técnico.","E":"Algum estagiário é técnico."},"gabarito":"B","comentario":"A informação “nenhum gestor é estagiário” estabelece G ∩ E = ∅. Portanto, qualquer pessoa que seja simultaneamente técnica e gestora pertence a G e, por isso, não pode ser estagiária. Não há informação suficiente para excluir a possibilidade de existir técnico que não seja gestor e seja estagiário.","referencia":"Diagramas lógicos; interseções e conjuntos disjuntos."},{"id":"RLM053","disciplina":"Raciocínio Lógico-Matemático","assunto":"Diagramas lógicos e de Venn","dificuldade":"Difícil","enunciado":"Em um grupo de 100 pessoas, 55 usam o recurso A, 48 usam o recurso B e 30 usam o recurso C. Sabe-se que 25 usam A e B, 18 usam A e C, 15 usam B e C, e 8 usam os três recursos. Quantas usam pelo menos um dos três?","alternativas":{"A":"75","B":"79","C":"87","D":"83","E":"91"},"gabarito":"D","comentario":"Pela inclusão-exclusão: |A∪B∪C| = 55+48+30−25−18−15+8 = 83. As interseções de dois conjuntos são subtraídas e a interseção tripla é somada de volta.","referencia":"Diagramas de Venn; princípio da inclusão-exclusão com três conjuntos."},{"id":"RLM054","disciplina":"Raciocínio Lógico-Matemático","assunto":"Diagramas lógicos e de Venn","dificuldade":"Difícil","enunciado":"Em uma pesquisa com 120 pessoas, 70 leem o boletim A, 65 leem o boletim B e 50 leem ambos. Entre as pessoas que não leem A, quantas leem B?","alternativas":{"A":"5","B":"20","C":"35","D":"50","E":"15"},"gabarito":"E","comentario":"Quem lê B mas não A é o conjunto B\\A. Seu tamanho é 65−50=15. Essas 15 pessoas estão necessariamente entre as que não leem A.","referencia":"Diagramas de Venn; diferença de conjuntos."},{"id":"RLM055","disciplina":"Raciocínio Lógico-Matemático","assunto":"Diagramas lógicos e de Venn","dificuldade":"Difícil","enunciado":"Em uma turma, 32 estudantes estudam inglês, 28 estudam espanhol e 20 estudam francês. Há 12 que estudam inglês e espanhol, 9 que estudam inglês e francês, 8 que estudam espanhol e francês e 5 que estudam os três idiomas. Quantos estudam exatamente dois idiomas?","alternativas":{"A":"9","B":"19","C":"14","D":"24","E":"29"},"gabarito":"C","comentario":"As interseções de pares incluem os 5 que estudam os três idiomas. Assim: exatamente inglês e espanhol = 12−5=7; inglês e francês = 9−5=4; espanhol e francês = 8−5=3. Total = 7+4+3=14.","referencia":"Diagramas de Venn; interseções de três conjuntos."},{"id":"RLM056","disciplina":"Raciocínio Lógico-Matemático","assunto":"Classificação e ordenação de informações","dificuldade":"Fácil","enunciado":"Três tarefas — revisar, imprimir e protocolar — serão executadas uma após a outra. A revisão deve ocorrer antes da impressão, e a impressão antes do protocolo. Qual é a ordem possível?","alternativas":{"A":"Imprimir, revisar, protocolar.","B":"Revisar, imprimir, protocolar.","C":"Protocolar, imprimir, revisar.","D":"Revisar, protocolar, imprimir.","E":"Imprimir, protocolar, revisar."},"gabarito":"B","comentario":"As condições formam a cadeia Revisão < Impressão < Protocolo. A única ordem compatível com ambas é revisar primeiro, imprimir depois e protocolar por último.","referencia":"Ordenação de informações sob restrições."},{"id":"RLM057","disciplina":"Raciocínio Lógico-Matemático","assunto":"Classificação e associação de informações","dificuldade":"Fácil","enunciado":"Quatro documentos foram classificados como urgentes ou não urgentes. Sabe-se que D1 e D3 são urgentes, enquanto D2 e D4 não são urgentes. Qual dos pares listados a seguir contém dois documentos da mesma classificação?","alternativas":{"A":"D1 e D3","B":"D1 e D2","C":"D1 e D4","D":"D2 e D3","E":"D3 e D4"},"gabarito":"A","comentario":"D1 e D3 pertencem à categoria “urgente”. Os demais pares listados misturam um documento urgente com um não urgente. Embora D2 e D4 também tenham a mesma classificação, esse par não aparece entre as alternativas.","referencia":"Classificação de elementos segundo categorias."},{"id":"RLM058","disciplina":"Raciocínio Lógico-Matemático","assunto":"Ordenação de informações","dificuldade":"Intermediária","enunciado":"Cinco pessoas — Ana, Beto, Caio, Duda e Eva — estão em uma fila. Ana está antes de Beto; Caio está depois de Beto; Duda está antes de Ana; e Eva está depois de Caio. Quem necessariamente ocupa a primeira posição?","alternativas":{"A":"Ana","B":"Duda","C":"Beto","D":"Caio","E":"Eva"},"gabarito":"B","comentario":"As relações formam a cadeia Duda < Ana < Beto < Caio < Eva. Logo, Duda necessariamente está em primeiro lugar.","referencia":"Ordenação linear por relações de precedência."},{"id":"RLM059","disciplina":"Raciocínio Lógico-Matemático","assunto":"Associação de informações","dificuldade":"Intermediária","enunciado":"Três servidores — Lara, Mauro e Nilo — utilizam, cada um, um sistema diferente: X, Y ou Z. Lara não usa X; Mauro usa Y; Nilo não usa Z. Qual sistema Lara usa?","alternativas":{"A":"Z","B":"X","C":"Y","D":"Não é possível determinar","E":"X ou Y"},"gabarito":"A","comentario":"Mauro já ocupa Y. Restam X e Z para Lara e Nilo. Como Lara não usa X, ela usa Z. Consequentemente, Nilo usa X.","referencia":"Associação exclusiva de pessoas e categorias."},{"id":"RLM060","disciplina":"Raciocínio Lógico-Matemático","assunto":"Ordenação de informações","dificuldade":"Intermediária","enunciado":"Quatro apresentações — P, Q, R e S — ocorrerão em horários consecutivos. P ocorre antes de Q; R ocorre imediatamente depois de P; e S ocorre depois de Q. Qual é a ordem das apresentações?","alternativas":{"A":"P, Q, R, S","B":"P, R, Q, S","C":"R, P, Q, S","D":"P, R, S, Q","E":"Q, P, R, S"},"gabarito":"B","comentario":"Como R vem imediatamente após P, o bloco PR deve permanecer junto. P também deve ocorrer antes de Q, e S depois de Q. A única ordem que atende tudo é P, R, Q, S.","referencia":"Ordenação com restrição de adjacência."},{"id":"RLM061","disciplina":"Raciocínio Lógico-Matemático","assunto":"Associação de informações","dificuldade":"Intermediária","enunciado":"Três escolas — A, B e C — receberam, cada uma, um equipamento distinto: projetor, notebook ou impressora. A não recebeu projetor nem notebook. B não recebeu notebook nem impressora. Qual equipamento a escola C recebeu?","alternativas":{"A":"Notebook","B":"Projetor","C":"Impressora","D":"Projetor ou notebook","E":"Não é possível determinar"},"gabarito":"A","comentario":"B não recebeu notebook nem impressora, então recebeu projetor. A não recebeu projetor nem notebook, então recebeu impressora. Resta o notebook para a escola C.","referencia":"Associação de informações com exclusividade."},{"id":"RLM062","disciplina":"Raciocínio Lógico-Matemático","assunto":"Classificação e ordenação de informações","dificuldade":"Intermediária","enunciado":"Cinco processos — A, B, C, D e E — serão analisados, um por vez. Sabe-se que A vem antes de C; B vem imediatamente antes de D; e E vem depois de C. Qual das ordens abaixo é compatível com todas as condições?","alternativas":{"A":"B, D, E, A, C","B":"A, B, C, D, E","C":"C, A, B, D, E","D":"A, C, B, D, E","E":"A, D, B, C, E"},"gabarito":"D","comentario":"Verificando a ordem A, C, B, D, E: A está antes de C; B está imediatamente antes de D; e E está depois de C. Nas demais alternativas, pelo menos uma restrição é violada.","referencia":"Ordenação de informações com precedência e adjacência."},{"id":"RLM063","disciplina":"Raciocínio Lógico-Matemático","assunto":"Ordenação de informações","dificuldade":"Difícil","enunciado":"Seis pessoas — A, B, C, D, E e F — sentam-se em uma fila. A está à esquerda de B; C está imediatamente à direita de A; D está à direita de B; E está à esquerda de A; e F está à direita de D. Qual é a ordem obrigatória da esquerda para a direita?","alternativas":{"A":"A, C, E, B, D, F","B":"E, A, B, C, D, F","C":"E, A, C, B, D, F","D":"E, C, A, B, D, F","E":"E, A, C, D, B, F"},"gabarito":"C","comentario":"Como C está imediatamente à direita de A, temos o bloco AC. E fica à esquerda de A. B fica à direita de A; D à direita de B; e F à direita de D. Para acomodar todos mantendo AC adjacente, a cadeia fica E, A, C, B, D, F.","referencia":"Ordenação linear com relações de posição e adjacência."},{"id":"RLM064","disciplina":"Raciocínio Lógico-Matemático","assunto":"Associação de informações","dificuldade":"Difícil","enunciado":"Quatro pessoas — Iara, João, Kátia e Luís — apresentam, cada uma, um tema distinto: Gestão, Tecnologia, Inclusão ou Avaliação. Iara não apresenta Gestão nem Tecnologia. João apresenta Tecnologia. Kátia não apresenta Avaliação. Luís não apresenta Gestão. Sabendo que Iara apresenta Avaliação, qual tema cabe a Kátia?","alternativas":{"A":"Tecnologia","B":"Inclusão","C":"Avaliação","D":"Gestão","E":"Não é possível determinar"},"gabarito":"D","comentario":"João já ocupa Tecnologia e Iara ocupa Avaliação. Restam Gestão e Inclusão para Kátia e Luís. Como Luís não apresenta Gestão, ele apresenta Inclusão; portanto, Kátia apresenta Gestão.","referencia":"Associação lógica por exclusão."},{"id":"RLM065","disciplina":"Raciocínio Lógico-Matemático","assunto":"Classificação, ordenação e associação de informações","dificuldade":"Difícil",
